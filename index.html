<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude 認定資格 模擬試験（CCAO-F / CCDV-F / CCAR-F / CCAR-P）</title>
<style>
:root{
  --bg:#f4f3f0; --surface:#fcfcfb; --line:#dddcd6; --line-strong:#c3c2b7;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#7a7972;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e3eefb; --track:#d6e5f8;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#e6f5e6;
  --bad:#d03b3b; --bad-ink:#a52626; --bad-soft:#fbeaea;
  --warn-soft:#fdf3d9; --warn-ink:#7a5200;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111110; --surface:#1a1a19; --line:#32322f; --line-strong:#4a4a45;
    --ink:#f0efec; --ink2:#c3c2b7; --ink3:#95948b;
    --accent:#3987e5; --accent-ink:#8dbbf3; --accent-soft:#1b2a3f; --track:#22344d;
    --good:#0ca30c; --good-ink:#5fd35f; --good-soft:#16301a;
    --bad:#d03b3b; --bad-ink:#f08a8a; --bad-soft:#3a1c1c;
    --warn-soft:#3a2f12; --warn-ink:#f2cf7a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.75;}
button{font:inherit;color:inherit;cursor:pointer}
button,label,summary,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.opt:active,.navcell:active,.chip:active{transform:scale(.985)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
  background:var(--accent-soft);color:var(--ink);padding:.08em .38em;border-radius:4px;word-break:break-word}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:1.6rem;line-height:1.35;margin:0 0 6px;letter-spacing:.01em}
h2{font-size:1.15rem;margin:0 0 10px;line-height:1.4}
h3{font-size:1rem;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--ink2)} .small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;min-height:42px}
@media (hover:hover){.btn:hover{border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.07)}.opt:hover{border-color:var(--accent)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.navcell:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.tag.neutral{background:transparent;border:1px solid var(--line-strong);color:var(--ink2)}
.tag.dom{white-space:normal;border-radius:8px;line-height:1.5;padding:3px 9px;font-weight:600}
.tag.good{background:var(--good-soft);color:var(--good-ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}

/* home */
.hero{padding:8px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.examgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.examgrid{grid-template-columns:1fr}}
.examcard .code{font-size:1.5rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px}
.facts div{line-height:1.3}
.facts b{display:block;font-size:1.25rem}
.facts span{font-size:.8rem;color:var(--ink2)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
th{font-size:.78rem;color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.codebox{display:block;width:100%;box-sizing:border-box;font:500 .78rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;resize:vertical;word-break:break-all;overflow-wrap:anywhere}
.codebox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.resume{border-color:var(--accent)}
details summary{cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:.9rem;padding:6px 0}
.note{border-left:3px solid var(--line-strong);padding:2px 0 2px 14px;color:var(--ink2);font-size:.88rem}

/* exam */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.topbar .title{font-weight:800;font-size:1.05rem}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;padding:4px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad-ink);border-color:var(--bad)}
.progress{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font-weight:800;font-size:1.05rem}
.qtext{font-size:1.05rem;line-height:1.85;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line-strong);border-radius:12px;
  background:var(--surface);padding:12px 14px;line-height:1.7}
.opt .mark{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;
  font-weight:800;font-size:.85rem;margin-top:1px;color:var(--ink2)}
.opt.multi .mark{border-radius:7px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.locked{cursor:default}
.opt>span:nth-child(2){flex:1 1 0;min-width:0}
.opt.is-correct{border-color:var(--good);background:var(--good-soft)}
.opt.is-correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .why{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-strong);font-size:.86em;line-height:1.6;color:var(--ink2)}
.reflist{margin:4px 0 10px;padding-left:1.2em;font-size:.88rem;line-height:1.7;color:var(--ink2)}
.reflist li{margin:6px 0;overflow-wrap:anywhere}
.reflist .tag{vertical-align:1px;margin-right:2px}
.refsec+.refsec{border-top:1px solid var(--line)}
.expl .gnote{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--line-strong);font-size:.86em;line-height:1.65;color:var(--ink2)}
.expl .gnote b{display:block;margin-bottom:2px;font-size:.82em;letter-spacing:.02em}
.opt .why b{display:inline-block;margin-right:.6em;font-size:.82em;font-weight:700;letter-spacing:.02em;color:var(--bad)}
.opt .side{margin-left:auto;flex:none;padding-left:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;background:var(--bg);border:1px solid var(--line)}
.expl h3{font-size:.85rem;color:var(--ink2);margin-bottom:4px}
.expl p{margin:0;font-size:.95rem}
.navpanel{margin-bottom:16px}
.scen{padding:0;margin-bottom:12px;border-left:4px solid var(--accent);overflow:hidden}
.scenhead{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 18px;min-height:48px}
.scentitle{font-weight:700;flex:1 1 0;min-width:0;line-height:1.4}
.chev{font-size:.8rem;color:var(--accent-ink);font-weight:600;white-space:nowrap}
.scentext{margin:0;padding:0 18px 14px;font-size:.93rem;line-height:1.75;color:var(--ink2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.navcell{position:relative;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:8px;height:40px;font-weight:700;font-size:.9rem;
  font-variant-numeric:tabular-nums}
.navcell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.navcell.current{outline:3px solid var(--accent);outline-offset:1px}
.navcell.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#fab219;border:2px solid var(--surface)}
.navcell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.navcell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-strong);vertical-align:-2px;margin-right:5px}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)}
.legend i.f{background:#fab219;border-color:#fab219;border-radius:50%}
.foot{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}

/* inline confirm */
.confirm{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;width:100%;border:1.5px solid var(--accent);background:var(--accent-soft);
  border-radius:12px;padding:12px 14px;outline:none}
.confirm .msg{flex:1 1 220px;line-height:1.5}
.confirm .acts{display:flex;gap:8px;flex:0 0 auto}
.topbar .confirm{margin-top:10px}
.flagbtn{border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px 5px 10px;min-height:36px;background:var(--surface)}

/* result */
.scorebox{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:620px){.scorebox{grid-template-columns:1fr;gap:12px}}
.bignum{font-size:4rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bignum small{font-size:1.6rem;font-weight:700;margin-left:2px}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;padding:5px 14px;border-radius:999px}
.verdict.good{background:var(--good-soft);color:var(--good-ink)}
.verdict.bad{background:var(--bad-soft);color:var(--bad-ink)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.stats div{line-height:1.3}
.stats b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--ink2)}
.meter{position:relative;height:10px;border-radius:999px;background:var(--track);min-width:120px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
td.bar{width:38%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rev{padding:20px 22px}
.rev .qtext{font-size:1rem;margin-bottom:12px}
.rev .opt{padding:9px 12px;font-size:.95rem}
.rev .opts{gap:7px}
.empty{text-align:center;color:var(--ink2);padding:28px}
.nw{white-space:nowrap}
.topbar .row{flex-wrap:nowrap}
.topbar .title,.topbar .btn,.timer{white-space:nowrap;flex:none}
.topbar .tag{min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}
.topbar .spacer{min-width:0}
body{overflow-wrap:anywhere}
@media (max-width:640px){
  html{scroll-padding:128px 0 84px}
  body{line-height:1.7}
  .wrap{padding:12px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
  h1{font-size:1.32rem} h2{font-size:1.05rem}
  .card{padding:16px;border-radius:12px}
  .stack>*+*{margin-top:12px}
  .hide-sm{display:none}
  .btn{padding:8px 14px;min-height:44px}
  /* home */
  .seg{display:flex;width:100%} .seg button{flex:1 1 auto;min-height:44px;padding:8px 10px}
  .check{min-height:40px}
  .examcard .btn{width:100%}
  .facts{gap:22px}
  /* exam: compact sticky header */
  .topbar{padding:8px 0 8px;margin-bottom:12px}
  .topbar .row{gap:8px}
  .topbar .row+.row{margin-top:8px !important}
  .topbar .btn{min-height:40px;padding:6px 12px;font-size:.92rem}
  .topbar .btn.ghost{padding:6px 8px}
  .topbar .title{font-size:1rem}
  .timer{font-size:1.02rem;padding:3px 10px}
  .progress{margin-top:8px;height:5px}
  .qhead{gap:8px;margin-bottom:10px}
  .qhead .tag.dom{flex-basis:100%;order:9}
  .qtext{font-size:1rem;line-height:1.8;margin-bottom:14px}
  .opts{gap:8px}
  .opt{padding:12px 12px;gap:10px;line-height:1.65;min-height:52px}
  .opt .mark{width:26px;height:26px}
  .expl{padding:12px 14px}
  /* thumb-reachable navigation: sticks to the bottom edge while the question is on screen */
  .foot{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);
    margin:16px -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-radius:0 0 12px 12px;flex-wrap:nowrap}
  .foot .spacer{display:none}
  .foot .btn{flex:1 1 0;padding:8px 6px;min-height:48px;white-space:nowrap}
  .foot .confirm{flex-direction:column;align-items:stretch}
  .confirm .msg{flex:1 1 auto}
  .confirm .acts{width:100%} .confirm .acts .btn{flex:1}
  .navpanel{margin-bottom:12px}
  .scenhead{padding:10px 14px;flex-wrap:wrap}
  .scentext{padding:0 14px 12px;font-size:.9rem}
  .navgrid{grid-template-columns:repeat(6,1fr);max-height:300px;overflow-y:auto;padding:4px}
  .navcell{height:44px}
  /* result */
  .bignum{font-size:3.4rem}
  .stats{gap:20px}
  .actions .btn{width:100%}
  .actions .spacer{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;padding-bottom:2px}
  .chip{white-space:nowrap;flex:none;min-height:40px}
  .domtable thead{display:none}
  .domtable tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .domtable td{border:0;padding:0}
  .domtable td:first-child{grid-column:1/-1;line-height:1.5}
  .domtable td.bar{grid-column:1;grid-row:2;width:auto}
  .domtable td.bar .meter{min-width:0}
  .domtable td.num:nth-child(2){grid-column:2;grid-row:2;color:var(--ink2)}
  .domtable td.num:nth-child(3){grid-column:3;grid-row:2;min-width:3.2em}
  /* review */
  .rev{padding:16px}
  .rev .domain{flex-basis:100%;order:9}
  .rev .qhead .spacer{display:none}
  .rev .opt{min-height:0}
  .opt.locked{flex-wrap:wrap}
  .opt.locked .side{flex-basis:100%;justify-content:flex-start;padding-left:36px;margin:0}
}
@media (max-width:360px){
  .hide-xs{display:none}
  .topbar .btn{padding:6px 10px}
  .topbar .tag{display:none}
  .navgrid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"CCAO-F":{"code":"CCAO-F","name":"Claude Certified Associate – Foundations","audience":"ビジネスユーザー向け","minutes":120,"domains":[{"name":"プロンプトとタスク実行","w":14},{"name":"出力の評価と検証","w":21},{"name":"製品とモデルの選択","w":12},{"name":"ワークフロー統合とソリューション設計","w":16},{"name":"設定とナレッジ管理","w":12},{"name":"ガバナンス、リスク、責任ある利用","w":15},{"name":"トラブルシューティングと最適化","w":10}],"quota":{"1":8,"2":13,"3":7,"4":10,"5":7,"6":9,"7":6},"questions":[{"d":1,"q":"マーケティング担当者が Claude に「新製品の紹介文を書いて」とだけ依頼したところ、どの製品にも当てはまりそうな一般的な文章が返ってきました。出力を改善するために最も効果的な対応はどれですか。","o":["文章の表現力が高い最上位のモデルに切り替えたうえで、同じプロンプトをそのままもう一度送信する","プロンプトの末尾に「もっと魅力的に、プロらしく書いてください」と追記する","同じプロンプトのまま、納得できる文章が出るまで再生成を繰り返す","製品の特徴、想定読者、掲載媒体、トーン、文字数といった文脈と条件をプロンプトに明記する"],"a":[3],"e":"出力が一般的になる主な原因は、Claude に判断材料となる文脈が与えられていないことです。目的・読者・制約・出力形式を具体的に示すと、依頼内容が検証可能になり品質が上がります。再生成の繰り返しやモデルの変更では不足している情報は補われず、「もっと魅力的に」という指示は基準が曖昧なままです。","w":["原因は情報の不足であり、モデルの能力ではありません。","何を伝えたいのかが、依然として分かりません。","不足している情報を補わない限り、一般的な文章が返り続けます。",null],"lv":1},{"d":1,"q":"経営企画の担当者が、50ページの市場調査レポートから経営層向けの提言書を作ろうとしています。1回のプロンプトで依頼したところ、表面的で根拠の薄い内容になりました。次に取るべきアプローチとして最も適切なものはどれですか。","o":["出力の文字数の上限を2倍に引き上げて、もう一度同じ依頼を送る","「深く考えて、質の高い提言を書いてください」という一文を冒頭に加える","章ごとの発見の抽出、テーマの整理、提言の起草の段階に分け、各段階の出力を確認しながら進める","レポートを要約版に差し替え、Claude が処理する情報量を減らしたうえで、同じ依頼を1回のプロンプトでやり直す"],"a":[2],"e":"複雑な依頼は、タスク分解によって段階ごとに取り組ませると品質が安定します。各段階の出力を確認できるため、誤りや抜けを早い時点で修正できる利点もあります。元資料を削ると根拠が失われ、「深く考えて」の追記や文字数の拡大は作業の構造を変えないため、根本的な改善になりません。","w":["長さの問題ではなく、工程の分け方の問題です。","複数の工程を1回で求めている構造は、変わりません。",null,"分析に必要な詳細が失われ、1回で依頼する構造も変わりません。"],"lv":1},{"d":1,"q":"Claude が作成した役員向け報告の下書きは、内容は正確ですが長すぎ、専門用語も多すぎました。出力品質を高めるための次の一手として最も適切なものはどれですか。","o":["同じ会話で「300字以内」「専門用語を避ける」「結論を先頭に」と具体的に伝える","「もっと良くしてください」と伝えて再度出力させる","新しいチャットを開き、これまでの文脈は引き継がずに、最初と同じプロンプトをそのまま送り直す","下書きを自分で全面的に書き直し、以後この用途には Claude を使わない"],"a":[0],"e":"プロンプトの反復改善では、出力のどこをどう変えてほしいかを具体的にフィードバックすることが重要です。同じ会話内であれば既存の下書きと文脈を生かして修正できます。同じプロンプトの再送や「もっと良く」では改善の方向が伝わらず、利用をやめる判断は内容が正確である状況に見合いません。","w":[null,"何を直すのかが、伝わりません。","正確だった内容と、改善の手がかりを捨てることになります。","具体的なフィードバックで改善できる場面です。"],"lv":1},{"d":1,"q":"イベント企画チームが、秋のキャンペーン案を Claude とブレインストーミングしたいと考えています。この種類のタスクに最も適したプロンプトの方針はどれですか。","o":["切り口の異なる案を20個ほど幅広く挙げさせ、その後に評価基準を示して絞り込む","すべての案に出典と統計的な裏付けを付けることを必須条件にする","出力を3行の表形式に固定し、表に収まらない案は除外させる","最初から「最も成功する案を1つだけ」提示するよう求める"],"a":[0],"e":"ブレインストーミングでは、まず発散させて量と多様性を確保し、その後で基準に沿って収束させる進め方が有効です。最初から1案に絞らせたり、形式で強く縛ったりすると発想の幅が狭まります。出典や統計の厳密な裏付けは調査・分析型のタスクで重視すべき要件であり、アイデア出しの段階には適しません。","w":[null,"発想の段階には過剰で、根拠の捏造も誘発します。","形式が、発想を制限します。","発想の幅が、最初から狭まります。"],"lv":1},{"d":1,"q":"カスタマーサクセス担当者が、自社らしい文体で顧客への返信メールを Claude に下書きさせたいと考えています。「丁寧で親しみやすく」と指示しても、文体が毎回ばらつきます。最も効果的な改善策はどれですか。","o":["「丁寧で親しみやすく」という指示を、プロンプト内で3回繰り返して強調する","過去に送った良い返信メールを2〜3通、手本として示し、真似てほしい点を添える","返信メールの作成には向かないと判断し、挨拶文だけを Claude に任せる","文体が安定するまで、返信の下書きを毎回5回ずつ生成して選ぶ"],"a":[1],"e":"文体やトーンのように言葉で定義しにくい要件は、具体例を示す（few-shot）と安定します。手本のどの要素を踏襲してほしいかを添えると、さらに意図が伝わります。抽象的な指示の繰り返しや複数回生成は基準の曖昧さを解消せず、用途を狭める前にプロンプトの改善を試みるべきです。","w":["抽象的な言葉は、繰り返しても具体的になりません。",null,"例を示せば対応できる場面で、活用を諦めています。","手本がないまま、手間だけが増えます。"],"lv":1},{"d":1,"q":"営業企画の担当者が四半期の売上データを貼り付けて「分析して」と依頼したところ、数字をなぞるだけの説明が返ってきました。分析タスクとして適切にプロンプトを改善する方法はどれですか。","o":["データの行数を半分に減らして、処理の負荷を下げる","グラフを含めるよう指定し、見た目の情報量を増やす","意思決定の目的、比較したい軸、出力の構成を示し、事実と推測を分けて書くよう依頼する","「経験豊富なプロのアナリストとして振る舞ってください」という役割の指定だけを、冒頭に追加する"],"a":[2],"e":"分析型のタスクでは、分析の目的（どの意思決定を支えるのか）と比較の観点、出力の構成を明示することで、的を絞った考察が得られます。事実と推測を区別させることは、後の検証もしやすくします。役割指定だけでは観点が定まらず、データの削減や見た目の指定は分析の深さに寄与しません。","w":["分析の材料を減らすだけです。","見た目が変わるだけで、分析は深まりません。",null,"目的と比較の軸が、伝わりません。"],"lv":1},{"d":1,"q":"法務部門の担当者が、長い契約書を添付して特定の条項について質問しようとしています。精度の高い回答を得るためのプロンプトの工夫として適切なものを2つ選んでください。","o":["重要な指示は、すべて感嘆符を付けて強い口調で書く","念のため、今回の質問と関係のない別の契約書も多数添付しておく","先入観を与えないよう、質問の目的や背景は伏せておく","回答の根拠となる該当箇所を引用したうえで答えるよう依頼する","契約書の本文と指示文を、見出しやタグなどで明確に区切って示す"],"a":[3,4],"e":"長い資料を扱うときは、資料と指示を明確に区切ることで Claude が両者を混同しにくくなります。また、根拠箇所の引用を求めると、回答が資料に基づくようになり、利用者による検証も容易になります。目的を伏せたり無関係な資料を加えたりすると精度は下がり、強い口調は内容の明確さの代わりになりません。","w":["強い口調は、明確さの代わりになりません。","無関係な情報が、精度を下げます。","文脈がないと、的確な回答になりません。",null,null],"lv":1},{"d":1,"q":"プロジェクトマネージャーが新規プロジェクトの計画書の下書きを Claude に依頼したいものの、どの情報を渡せば十分なのか自分でも整理できていません。最も適切な進め方はどれですか。","o":["情報がすべて整理できるまで、Claude の利用を見送る","情報が足りない部分は Claude に自由に仮定させて計画書を作らせ、それをそのまま完成版として扱う","社内にある関連しそうな資料を、選別せずにすべて貼り付ける","計画書を作成する前に、必要な情報について Claude から質問してもらうよう依頼する"],"a":[3],"e":"要件が固まっていないときは、起草の前に Claude に不足情報を質問させると、必要な文脈を効率よく洗い出せます。仮定をそのまま完成版にすると誤った前提が紛れ込み、資料を無選別に貼り付けると重要な情報が埋もれます。整理できるまで利用を見送る必要もありません。","w":["何が不足しているかの洗い出しにこそ、Claude を使えます。","検証していない仮定が、計画に入り込みます。","無関係な情報が、品質を下げます。",null],"lv":1},{"d":2,"q":"広報担当者が Claude に業界動向の記事を下書きさせたところ、具体的な統計値と、その出典とされる調査レポート名が含まれていました。社外に公開する前に行うべきこととして最も適切なものはどれですか。","o":["文章をより専門的な言い回しに整えてから公開する","出典が明記されているので、そのまま公開する","Claude に確信度を100点満点で採点させ、高得点なら公開する","統計値と出典を、元の調査レポートに当たって確認する"],"a":[3],"e":"モデルは、実在しそうに見える数値や出典を生成してしまうことがあります。重要な事実は権威ある一次情報で確認することが、公開前に必要な検証です。出典の記載があること自体は正確さの保証にならず、モデルの自己申告による確信度は独立した検証ではありません。言い回しの変更は正確性に影響しません。","w":["表現を整えても、事実の確認にはなりません。","出典の名称そのものが、誤っている可能性があります。","自己採点は、事実であることの裏付けになりません。",null],"lv":1},{"d":2,"q":"総務担当者が、40ページの業務委託契約書の要約を Claude に依頼しました。要約は読みやすくまとまっていますが、重要な条項が漏れていないか不安があります。完全性を評価する方法として最も適切なものはどれですか。","o":["要約の文章が自然で読みやすいことを確認する","要約の文字数が、原文に対して十分な割合になっているかを確認する","契約期間、解約、損害賠償などの確認項目を用意し、要約に含まれているかを原文と照合する","Claude に「漏れはありませんか」と尋ね、「ありません」という回答が返ってきたら、確認を完了とする"],"a":[2],"e":"完全性は、あらかじめ定めた必須項目に対して出力を照合することで評価できます。原文との突き合わせにより、漏れた条項を具体的に特定できます。文章の読みやすさや文字数は網羅性を示さず、モデル自身への確認だけでは漏れを見落とす可能性が残ります。","w":["読みやすさは、網羅性を示しません。","長さは、重要な条項が含まれていることを保証しません。",null,"自己申告では、漏れを検出できません。"],"lv":1},{"d":2,"q":"Claude が作成した月次レポートで、冒頭の要旨には「売上は前年比15%増」とあり、本文の表では「12%増」となっていました。最も適切な対応はどれですか。","o":["2つの数字の中間を取り、13.5%として統一する","誤差の範囲と判断し、そのまま配布する","元データに立ち返って正しい値を確認し、レポート全体を修正する","要旨の数字のほうが目立つので、表を15%に合わせて修正する"],"a":[2],"e":"出力内の不整合は、どちらか、あるいは両方が誤っている兆候です。正しい値は元データでしか確定できないため、原典に戻って確認し、関連箇所をすべて修正します。見た目や平均で数字を決めるのは根拠のない修正であり、不整合を放置して配布することも適切ではありません。","w":["根拠のない数字を作ることになります。","矛盾を放置することになります。",null,"どちらが正しいのかを、確認していません。"],"lv":1},{"d":2,"q":"人事担当者が Claude に求人票の下書きを依頼したところ、「若くて体力のある方」「男性が活躍中」といった表現が含まれていました。最も適切な対応はどれですか。","o":["偏りのある表現を特定して職務要件に基づく記述に改め、全体を人が確認してから掲載する","応募が増えそうな表現なので、そのまま掲載する","該当する文だけを削除し、残りの部分は確認せずに掲載する","Claude の出力は中立的に調整されているはずなので、問題のある表現ではないと判断して、そのまま掲載する"],"a":[0],"e":"AI の出力には、年齢や性別などに関する偏った表現が含まれることがあります。偏りを特定し、職務に関連する客観的な要件に書き換えたうえで、全体を人が確認する必要があります。出力が常に中立であると前提することはできず、一部だけを削除して残りを確認しない対応では、他の偏りを見落とすおそれがあります。","w":[null,"差別的な表現であり、法令や方針に反するおそれがあります。","ほかの箇所の偏りを、見落とします。","モデルの出力にも、偏りは含まれ得ます。"],"lv":1},{"d":2,"q":"次の Claude の出力のうち、利用前に専門家による確認が最も必要なものはどれですか。","o":["社内イベントの名称を考えるためのアイデア一覧","同僚に送る日程調整メールを丁寧な言い回しに直したもの","自分用の会議メモを箇条書きに整えたもの","契約条件の変更について顧客に通知する文書の下書き"],"a":[3],"e":"人による確認の必要度は、誤りがあった場合の影響の大きさで判断します。契約条件に関する顧客向け通知は法的・対外的な影響が大きいため、法務などの専門家による確認が欠かせません。アイデア出しや自分用メモ、社内の簡単な連絡は影響が限定的で、通常の自己確認で足ります。","w":["誤りの影響が小さい用途です。","影響が小さく、自分で確認できます。","自分用であり、影響が限られます。",null],"lv":1},{"d":2,"q":"経理担当者が、チャットに貼り付けた経費データの部門別合計を Claude に計算させました。結果を報告書に使う前の検証として最も適切なものはどれですか。","o":["元データを表計算ソフトの関数などで再計算し、Claude の結果と突き合わせる","桁数や金額の規模がそれらしく見えるかを目視で確認する","合計値を別の言い回しで説明させ、説明に矛盾がなければ採用する","Claude に「本当に合っていますか」と尋ね、同じ答えがもう一度返ってくれば、正しいものとして採用する"],"a":[0],"e":"数値の検証は、モデルの外にある独立した手段で行う必要があります。表計算ソフトでの再計算との突き合わせは、確実で再現性のある方法です。モデルへの再確認や言い換えによる説明は同じ誤りを繰り返す可能性があり、目視での「それらしさ」の確認では計算誤りを検出できません。","w":[null,"もっともらしい誤りを、見抜けません。","説明に一貫性があっても、計算が正しいとは限りません。","同じ答えが返っても、正しさの証明になりません。"],"lv":1},{"d":2,"q":"システム障害に関する技術的な社内報告書を、Claude を使って顧客向けのお知らせに書き直しました。送付前に行う確認として最も重要なものはどれですか。","o":["顧客に必要な情報が平易に書かれ、事実関係が元の報告書と一致しているかを確認する","技術用語が、元の報告書と同じ数だけ残っているかを確認する","顧客に不安を与えないよう、影響範囲や原因に関する記述が、すべて削除されているかを確認する","社内報告書よりも文章が長くなっているかを確認する"],"a":[0],"e":"読み手に合わせた書き換えでは、読者に必要な情報が伝わる表現になっていること、そして書き換えの過程で事実が変わっていないことの両方を確認します。用語の数や文章の長さは品質の基準にならず、影響範囲を削除することは顧客に必要な情報を欠落させます。","w":[null,"顧客向けでは、用語を減らすべきです。","顧客に必要な情報を、隠すことになります。","長さは、品質の指標になりません。"],"lv":1},{"d":2,"q":"企画担当者が、同じ依頼に対する Claude の提案書の下書きを2案得ました。どちらを採用するか決める方法として最も適切なものはどれですか。","o":["情報量が多いほうが丁寧なので、文字数の多い案を採用する","目的、読み手、正確性、トーンなどの評価基準をあらかじめ定め、基準に沿って2案を比較する","後から生成した案のほうが改善されているはずなので、2番目の案を採用する","Claude にどちらの案が優れているかを尋ね、理由は確認せずに、その回答どおりに採用する案を決める"],"a":[1],"e":"複数の出力を比較するときは、用途に即した評価基準を先に定めると、一貫した根拠のある判断ができます。文字数や生成の順序は品質と関係がありません。Claude に比較の観点を挙げさせるのは有用ですが、最終的な判断は目的を理解している利用者が基準に基づいて行うべきです。","w":["分量は、品質を示しません。",null,"後から生成した案が、優れているとは限りません。","判断の根拠を、自分で検証していません。"],"lv":1},{"d":2,"q":"教育担当者が、新入社員向けのオンボーディングガイドを Claude と作成しています。ガイドは複数回の修正を経て仕上げ、完成後はチームで共有する予定です。出力形式として最も適切なものはどれですか。","o":["会話の中に、その都度インラインの文章として出力させる","修正のたびに新しいチャットを開始し、ガイドの全文を最初から書き直させる方法で仕上げていく","各章を1行の箇条書きに圧縮し、短い回答として出力させる","独立したコンテンツとして編集・再利用しやすい Artifact として作成する"],"a":[3],"e":"繰り返し修正し、完成後に共有・再利用する、まとまった分量の独立したコンテンツには Artifact が適しています。会話とは別に内容を表示し、更新を重ねられるためです。インラインの出力は短い回答や一度きりのやり取りに向いており、修正のたびに新しいチャットを始めると、それまでの文脈が失われます。","w":["修正と再利用がしにくくなります。","文脈が失われ、手間も増えます。","ガイドとして必要な内容が、失われます。",null],"lv":1},{"d":2,"q":"業務改善の担当者が、Claude にアンケートの自由回答を分類させ、その結果を表計算ソフトに取り込んで集計したいと考えています。出力形式の指定として最も適切なものはどれですか。","o":["列の構成（回答ID、分類、根拠）を指定し、表やCSVなどの構造化形式で出力させる","分類の考え方と判断の経緯を丁寧に説明する長文のレポートとして出力させ、集計の際に人が読み取る","回答ごとに、自由な書式で感想を添えて出力させる","分類結果を、読みやすい文章の段落で説明させる"],"a":[0],"e":"後続の工程で機械的に取り込む場合は、列の構成を明示した構造化データとして出力させると、手作業による整形が不要になり、取り込み時の誤りも減ります。文章の段落や自由な書式は人が読むには適していますが、集計には向きません。出力形式は、その出力の使われ方から逆算して選びます。","w":[null,"人が読み取る手間と、転記の誤りが生じます。","形式がそろわず、集計できません。","表計算ソフトに、そのまま取り込めません。"],"lv":1},{"d":2,"q":"次の Claude の出力のうち、ハルシネーションの可能性に特に注意して検証すべきものを2つ選んでください。","o":["提供した資料には存在しない、具体的な判例番号や統計値を含む説明","提供した文章を、常体から敬体へ変換したもの","提供した議事録を、内容を変えずに箇条書きへ整形したもの","出典が確認できない、実在の人物の発言とされる引用","提供した表の列の順序を、指示どおりに入れ替えたもの"],"a":[0,3],"e":"ハルシネーションは、与えた資料に根拠がない具体的な情報、たとえば番号、数値、固有名詞、引用などに現れやすくなります。判例番号や統計値、人物の発言の引用は、もっともらしく見えても実在しない場合があるため、必ず原典で確認します。提供した内容の整形や文体の変換、並べ替えは、新しい事実を生成しないため相対的にリスクが低い作業です。","w":[null,"文体の変換であり、新しい事実を加えていません。","提供した内容の整形であり、新しい事実を加えていません。",null,"機械的な操作であり、新しい事実を加えていません。"],"lv":1},{"d":2,"q":"調達担当者が、ある補助金制度の最新の申請要件について Claude に質問し、詳しい回答を得ました。この回答は Web 検索を使わずに生成されたものです。最も適切な対応はどれですか。","o":["回答の末尾に「最新情報です」と書かせてから利用する","公式サイトなど最新の一次情報で要件を確認する。必要なら出典付きの Web 検索やリサーチ機能を使う","回答が詳細かつ具体的であることから、最新の制度に基づいていると判断して、そのまま申請書類の準備を進める","同じ質問を3回行い、回答が一致すれば正しいと判断する"],"a":[1],"e":"モデルの知識には学習時点までという制約があり、制度や価格のように変化する情報は古くなっている可能性があります。最新の一次情報で確認するか、出典を示せる Web 検索やリサーチ機能を使い、その出典も確認します。回答の詳しさや複数回の一致は、情報が最新であることを示しません。","w":["書かせても、事実は変わりません。",null,"詳しさは、最新であることを示しません。","古い知識が、一貫して返るだけの可能性があります。"],"lv":1},{"d":2,"q":"調査担当者が、複数の社内資料をもとに Claude が作成した報告書の事実確認を行います。有効な検証方法を2つ選んでください。","o":["主張の根拠となる資料の該当箇所を Claude に引用させ、その引用を自分で資料と照合する","報告書を再生成し、前回と同じ内容が出力されれば正しいと判断する","Claude に確信度をパーセントで答えさせ、80%以上の記述は確認を省略する","重要な主張について、独立した信頼できる情報源でも裏付けを取る","文章が流暢で論理的に読めるかどうかで、正確さを判断する"],"a":[0,3],"e":"根拠箇所を引用させて原資料と照合する方法と、独立した信頼できる情報源で重要な主張を裏付ける方法は、どちらもモデルの外側に検証の根拠を置く有効な手段です。モデルの自己申告による確信度、文章の流暢さ、再生成結果の一致は、いずれも正確性を保証しません。誤った内容でも、流暢に、繰り返し出力されることがあります。","w":[null,"同じ誤りが、再現される可能性があります。","自己申告の確信度は、正確さを保証しません。",null,"流暢さと正確さは、別のものです。"],"lv":1},{"d":3,"q":"営業部門の担当者が、毎週、同じ執筆ガイドラインと製品資料を参照しながら提案書を作成しています。毎回これらの資料を貼り付け直す手間をなくしたいと考えています。最も適した Claude の機能はどれですか。","o":["指示とナレッジを保持できる Project を作成し、その中で作業する","リサーチ機能を使って、毎回 Web から資料を探させる","すべての提案書を1つの長いチャットの中で作り続ける","毎回、新しい通常のチャットを開いて資料を添付する"],"a":[0],"e":"Project は、カスタム指示とナレッジ（参照資料）を保持し、その中の複数のチャットで共通して利用できるため、繰り返し発生する業務に適しています。通常のチャットでは毎回資料の添付が必要になり、1つの長いチャットを使い続けるとコンテキストが肥大化して品質が下がります。リサーチ機能は、社内資料の再利用を目的とした機能ではありません。","w":[null,"社内の資料は、Web にはありません。","コンテキストが肥大化して、品質が下がります。","毎回の貼り付けが、解消されません。"],"lv":1},{"d":3,"q":"事業開発の担当者が、新規参入を検討している市場について、多数の Web 情報源を横断した包括的な調査と、出典付きのレポートを必要としています。最も適した機能はどれですか。","o":["通常のチャットで、Web 検索を使わずに質問する","複数の検索を重ねて情報を統合し、出典付きで報告するリサーチ機能を使う","Artifact を作成し、その中に知っていることを書かせる","Project のカスタム指示に「市場に詳しい専門家として回答する」と書く"],"a":[1],"e":"リサーチ機能は、複数回の検索と情報の統合を自律的に行い、出典付きのレポートを作成します。そのため、広範で多面的な調査に適しています。Web 検索を伴わない回答は情報の鮮度と出典の面で不十分であり、Artifact は出力の形式、カスタム指示は振る舞いの設定であって、いずれも調査能力を補うものではありません。得られた出典は、利用者自身も確認します。","w":["最新の情報と出典が得られません。",null,"出力の形式であり、調査の手段ではありません。","役割を指定しても、情報源は増えません。"],"lv":1},{"d":3,"q":"経営企画の担当者が、複数の前提条件が絡み合う事業戦略のシナリオ分析を Claude に依頼します。応答速度やコストよりも、推論の深さと品質を重視しています。モデル選択の考え方として最も適切なものはどれですか。","o":["モデルは変えず、同じ質問を複数回送って多数決を取る","どのモデルでも結果は同じなので、既定の設定のままにする","複雑な推論に最も強い最上位のモデル（Opus）を選ぶ","最も高速で低コストなモデル（Haiku）を選ぶ"],"a":[2],"e":"モデルは、タスクの要件（品質、速度、コスト）に合わせて選びます。複雑で多段階の推論を要し、品質を最優先する場面では、最も高性能な Opus が適しています。Haiku は速度とコストを重視する単純な大量処理に向いており、モデルによって推論能力には差があります。複数回の実行は、モデル選択の代わりにはなりません。","w":["推論の深さは、補えません。","モデルによって、推論の能力は異なります。",null,"複雑な推論では、品質が不足しやすくなります。"],"lv":1},{"d":3,"q":"サポート部門が、1日に数千件届く短い問い合わせを「請求」「技術」「その他」に分類する作業に Claude を使います。判断は単純で、速度とコストが最も重要です。最も適切なモデル選択はどれですか。","o":["高速かつ低コストで、単純な大量処理に適したモデル（Haiku）を使う","分類の誤りをゼロにするため、すべての問い合わせに最上位のモデル（Opus）を使う","問い合わせごとにリサーチ機能を実行して、背景を調べたうえで分類する","モデルの選択は結果に影響しないため、特に検討しない"],"a":[0],"e":"単純で大量の処理では、高速・低コストなモデルが要件に合致します。最上位モデルを一律に使うとコストと応答時間が不必要に増え、誤りがなくなることも保証されません。リサーチ機能は深い調査のための機能で、短文の分類には過剰です。精度の確認は、抜き取り検証などで別途行います。","w":[null,"単純な分類には過剰で、コストと時間がかかります。","不要な処理であり、遅くて高コストです。","速度とコストに、大きく影響します。"],"lv":1},{"d":3,"q":"担当者が1つのチャットで数時間にわたり作業を続けたところ、Claude が会話の序盤に決めた表記ルールを守らなくなってきました。最も適切な対応はどれですか。","o":["モデルの不具合と判断し、その日の作業を中断する","これまでの決定事項と現在の状況を要約し、その要約を引き継いで新しいチャットで再開する","表記ルールが守られるまで、同じ指示を強い口調で繰り返す","同じチャットを使い続け、表記ルールの全文を毎回のメッセージに貼り付けながら、最後まで作業を進める"],"a":[1],"e":"会話が長くなると、扱える文脈の量の制約から、序盤の内容が反映されにくくなります。重要な決定事項を要約して新しいチャットに引き継ぐと、必要な文脈を保ったまま再開できます。長いチャットを続けるほど状況は悪化しやすく、強い口調で繰り返しても文脈の制約は解消されません。これは不具合ではなく、想定される特性です。","w":["長い会話で起こる、既知の挙動です。",null,"原因は長さであり、口調ではありません。","コンテキストの肥大化が、さらに進みます。"],"lv":1},{"d":3,"q":"ある担当者が、Project 内のチャットAで決めた報告書の構成が、同じ Project の別のチャットBでは反映されていないことに気づきました。今後、この構成を Project 内のどのチャットでも確実に使えるようにする方法として最も適切なものはどれですか。","o":["チャットBで「チャットAの内容を思い出して」と依頼する","決定した構成を、Project のカスタム指示またはナレッジに追加する","モデルをより上位のものに切り替える","チャットAを削除して、チャットBにすべての作業をまとめる"],"a":[1],"e":"Project の指示とナレッジは、その Project 内のすべてのチャットに適用されます。一方、個々のチャットの内容が、別のチャットへ確実に共有されるとは限りません。継続して使いたい決定事項は、Project の指示またはナレッジとして保存するのが確実です。モデルの変更やチャットの削除は、情報の共有手段になりません。","w":["チャット間で、会話の内容は共有されません。",null,"モデルの能力の問題ではありません。","決定事項が、失われます。"],"lv":1},{"d":3,"q":"次のうち、Artifact として作成するのが適している場面を2つ選んでください。","o":["何度も修正を重ねながら仕上げる、数ページの提案書の下書き","「はい」か「いいえ」で答えられる事実の確認","チームに共有する、入力値に応じて結果が変わる簡易な見積もり計算ツール","会話の流れの中での、ちょっとした言い回しの相談","一言で答えられる、用語の意味の確認"],"a":[0,2],"e":"Artifact は、まとまった分量があり、独立して編集・再利用・共有される成果物に適しています。繰り返し修正する文書や、操作できる簡易ツールがその典型です。短い回答や会話の流れの中の軽い相談は、インラインで返すほうが適切です。出力形式は、内容の性質と使われ方に合わせて選びます。","w":[null,"短い回答で足ります。",null,"会話の中で完結します。","短い回答で足ります。"],"lv":1},{"d":4,"q":"カスタマーサポート部門が、初めて Claude を業務に導入しようとしています。最初のユースケースとして最も適しているものはどれですか。","o":["返金の可否を Claude が判断し、担当者を介さずに、顧客の口座への返金処理までを自動で実行する","品質管理部門を廃止し、応対品質の評価をすべて Claude に任せる","よくある問い合わせへの回答の下書きを社内FAQに基づいて作成し、担当者が確認して送信する","契約上の紛争について、顧客への法的見解を Claude が回答する"],"a":[2],"e":"導入初期のユースケースには、定型的で文章中心であり、参照できる情報源があり、人が確認する工程を組み込めるものが適しています。返金の最終判断や法的見解のように影響の大きい判断を人の関与なしに任せることや、確認の体制そのものをなくすことは、リスクが高く適切ではありません。","w":["金銭に関わる判断を、人の確認なしで行うことになります。","人による監督を、なくすことになります。",null,"専門家の判断が必要な領域です。"],"lv":1},{"d":4,"q":"経営管理部門が、月次の業績報告を作成するワークフローに Claude を組み込みます。工程は「データ抽出」「コメントの下書き」「数値と内容の最終確認」「経営会議への提出」です。人が必ず担うべき工程はどれですか。","o":["下書きの文体の統一","下書きの見出しの整形","コメントの下書き","数値と内容の最終確認"],"a":[3],"e":"ワークフローの設計では、判断と説明責任を伴う工程を人が担います。経営会議に提出する数値と内容の最終確認は、誤りの影響が大きいため、人による検証と承認が必要です。下書きの作成、文体の統一、整形は Claude が効率化しやすい工程であり、その成果を人が確認する構成が適切です。","w":["Claude に任せやすい作業です。","Claude に任せやすい作業です。","Claude が得意とする工程です。",null],"lv":1},{"d":4,"q":"業務アナリストが、関係者10名へのヒアリングメモをもとに、新システムの要件を整理しようとしています。Claude の活用方法として最も適切なものはどれですか。","o":["メモから要件を分類・整理させ、矛盾点、不足情報、関係者に確認すべき質問を洗い出させる","要件の数が多いほど良いので、できるだけ多くの要件を創作するよう依頼する","メモは使わず、一般的なシステムの要件を Claude に挙げさせて代用する","メモを渡して要件定義書を作成させ、関係者への確認は省略して、その内容をそのまま確定版として扱う"],"a":[0],"e":"要件の分析では、Claude に情報の整理や、矛盾と不足の発見を支援させると効果的です。洗い出した確認事項を関係者に戻すことで、要件の質が上がります。Claude の出力をそのまま確定版にすることや、一般論での代用、要件の創作は、実際の業務上の要求から乖離する原因になります。","w":[null,"実在しない要件が、紛れ込みます。","自社の実際の要望が、反映されません。","誤りや不足が、そのまま確定します。"],"lv":1},{"d":4,"q":"人事部門のリーダーが「入社手続きのプロセス全体に Claude を使いたい」と考えています。最初のステップとして最も適切なものはどれですか。","o":["全工程を一度に Claude へ置き換え、問題が発生した時点で対処する","まず最上位のモデルを契約し、その後で使い道を検討する","各担当者にそれぞれ自由に使ってもらい、利用方法やルールを統一しないまま、全社へ一斉に展開する","現行のプロセスを工程に分解し、Claude が支援できる工程を特定して、小さな範囲から試行する"],"a":[3],"e":"プロセスの改善は、現状を分解して把握することから始めます。繰り返しが多く文章中心の工程を見つけ、人の判断が必要な工程を残したうえで小さく試すと、効果とリスクを確認しながら進められます。全工程の一括置き換えや、目的が定まらないままの導入、方法を統一しない展開は、品質と統制の面で問題が生じやすくなります。","w":["リスクが大きく、問題の原因も特定しにくくなります。","手段が、目的よりも先になっています。","品質とガバナンスが、ばらつきます。",null],"lv":1},{"d":4,"q":"役員から「Claude を導入すれば、アナリストの作業は100%正確に自動化できるのか」と質問されました。価値と限界を伝える説明として最も適切なものはどれですか。","o":["「はい。Claude の出力は常に正確なので、確認の工程は不要になります」","「いいえ。AI は誤るため、業務で利用できる場面はほとんどありません」","「下書きや要約の時間は大きく短縮できますが、誤りもあるため、検証と最終判断は人が担います」","「正確さはモデルの価格に比例するので、最上位のモデルを契約すれば、人による確認は不要になります」"],"a":[2],"e":"関係者には、期待できる価値（速度や効率の向上）と限界（誤りの可能性、検証の必要性）の両方を、バランスよく伝える必要があります。過度な期待は不適切な利用を招き、過度な否定は有用な活用の機会を失わせます。モデルの性能が高くても、確認が不要になるわけではありません。","w":["誤りの可能性を、無視しています。","価値を、過小に評価しています。",null,"どのモデルを使っても、検証は必要です。"],"lv":1},{"d":4,"q":"マーケティング部門が、記事制作に Claude を使う試行を3か月間実施します。試行の効果を適切に評価するために、開始前に行うべきことはどれですか。","o":["効果を示しやすくするため、試行の対象を成功しそうな記事だけに後から絞り込む","参加者に「便利だったか」を尋ねるアンケートを、試行の終了後に1回実施することだけを決めておく","作業時間、修正回数、品質評価などの基準値を測定し、試行後に同じ指標で比較できるようにする","試行期間中は品質の確認を停止し、作業時間の短縮効果を最大化する"],"a":[2],"e":"効果を客観的に評価するには、試行前に基準値（ベースライン）を測定し、同じ指標で前後を比較できるようにしておく必要があります。事後の感想だけでは効果を定量的に示せず、品質の確認を止めたり、対象を後から選別したりすると、評価結果が歪みます。","w":["結果を、恣意的に歪めます。","比較の基準がなく、主観だけになります。",null,"品質の低下を、見逃します。"],"lv":1},{"d":4,"q":"業務改善の担当者が、社内の顧客管理システムと Claude を API で連携させ、数万件の顧客データを自動処理する仕組みを求められました。担当者にプログラミングの経験はありません。最も適切な対応はどれですか。","o":["チャット画面に顧客データを数万件貼り付けて、手作業で処理を進める","要件と期待する成果を整理したうえで、開発者やアーキテクトなど技術担当者に引き継ぐ","技術的に難しいため、要望そのものを断る","Claude にコードを書かせ、その内容を理解しないまま、自分の判断で本番環境に配置して実行する"],"a":[1],"e":"API 連携や大規模な自動化は、業務利用者の範囲を超える技術的な実装です。自分の役割の限界を認識し、要件を整理して適切な技術担当者に引き継ぐことが求められます。手作業での大量処理は非効率で誤りを招きやすく、理解していないコードの本番実行はリスクが高く、要望を単に断ることは価値の実現につながりません。","w":["チャットは、大量の自動処理に向きません。",null,"適切な担当に引き継げば、実現できます。","検証していないコードを本番で動かすのは、危険です。"],"lv":1},{"d":4,"q":"プロジェクトマネージャーが、Claude を使って新サービスの導入計画を立てています。Claude の出力を計画に生かす方法として最も適切なものはどれですか。","o":["制約と目標を伝えて計画案を作らせ、前提とリスクを明示させたうえで、チームで検証する","制約条件を伏せたまま計画を作らせ、現実との差は実行段階で調整する","計画の妥当性は Claude に評価させ、チームでの確認は省略する","Claude が示したスケジュールと体制を、内容を変更せずに、そのまま関係者へ確定版として通知する"],"a":[0],"e":"計画の立案に Claude を使う場合は、制約と目標を与え、計画が依拠する前提とリスクを明示させると、検証すべき点が明確になります。その前提を、実情を知るチームで確認してから計画を確定します。出力をそのまま確定することや、制約を伏せること、チームでの確認を省くことは、実現性の低い計画につながります。","w":[null,"非現実的な計画になります。","人による検証が、欠けています。","前提と実現性を、検証していません。"],"lv":1},{"d":4,"q":"業務部門が、既存の見積書作成ワークフローを Claude を組み込んだ形に再設計しています。設計書に明記すべき事項を2つ選んでください。","o":["各工程で Claude に与える入力情報と、期待する出力の形式","出力を誰がどのような基準で確認し、誰が最終的な責任を持つか","コストに関係なく、すべての工程で最上位のモデルを使用するという方針","担当者ごとに自由にプロンプトを変更してよいという運用ルール","確認の手間を省くために、出力を確認なしで顧客へ自動送信する経路"],"a":[0,1],"e":"ワークフローの設計では、Claude に何を入力し何を出力させるのか、そしてその出力を誰がどのような基準で検証し、誰が責任を持つのかを明確にすることが重要です。確認なしでの自動送信はリスクが高く、モデルを一律に最上位とする方針は費用対効果を無視しています。プロンプトを自由に変更できる運用では、品質が安定しません。","w":[null,null,"工程に応じた選択をせず、コストを無視しています。","品質が、ばらつきます。","誤った見積もりが、顧客に届きます。"],"lv":1},{"d":4,"q":"営業部門で提案書作成用の Project を試作し、数名に使ってもらったところ、利用者によって成果物の品質に大きな差が出ました。次に行う改善として最も適切なものはどれですか。","o":["フィードバックを集めて原因を特定し、指示とテンプレートを見直して、再度効果を確認する","品質の低い利用者の利用を禁止する","品質の差の原因を分析することは後回しにして、まず利用者全員に、最上位のモデルを使うよう指示する","試作は失敗だったと判断し、Project を削除する"],"a":[0],"e":"ソリューションは、試作、フィードバック、改善という反復によって成熟させます。品質の差の原因（指示の曖昧さ、入力のばらつきなど）を特定し、指示やテンプレートを標準化して再検証するのが適切です。利用の禁止や Project の削除は改善の機会を失わせ、原因を分析しないままモデルを変更しても、ばらつきの解消は期待できません。","w":[null,"原因を特定していません。","原因が分からないままの対処になります。","改善の機会を、捨てることになります。"],"lv":1},{"d":5,"q":"広報チームが Project を作成しています。「常に敬体で書く」「結論、理由、補足の順で構成する」というルールと、ブランドガイドラインのPDFがあります。それぞれの設定先として最も適切な組み合わせはどれですか。","o":["ルールはナレッジに登録し、PDFの内容はカスタム指示に全文を貼り付ける","ルールもPDFの内容も、毎回のチャットの最初のメッセージに貼り付ける","ルールとPDFのどちらも設定せず、出力を見てからその都度修正を依頼する","ルールは Project のカスタム指示に記述し、PDFはナレッジとして登録する"],"a":[3],"e":"Project のカスタム指示は、その Project 全体に適用したい振る舞いや出力のルールを記述する場所です。ナレッジは、参照させたい資料を登録する場所です。この使い分けにより、すべてのチャットで一貫した出力が得られます。毎回の貼り付けや、その都度の修正では、Project の利点が生かされません。","w":["ルールと資料の置き場所が、逆になっています。","手間がかかり、Project の利点を生かせません。","毎回の修正が、必要になります。",null],"lv":1},{"d":5,"q":"社内ヘルプデスク用の Project に設定するカスタム指示として、最も効果的なものはどれですか。","o":["「あなたは社内ITヘルプデスクの担当です。どのような質問にも必ず回答してください。分からない場合でも、利用者が困らないよう、それらしい手順を作成して案内してください」","「あなたは役に立つアシスタントです。社員からの質問に対して、できるだけ親切かつ丁寧に、相手の立場に立って回答してください」","「あなたは優秀なアシスタントです。絶対に間違えないでください。間違いは一切許されません。どのような場合でも、常に完璧で正確な回答だけを返してください」","「あなたは社内ITヘルプデスクの担当です。ITに詳しくない社員に、手順を番号付きで説明してください。ナレッジに記載がなければ、推測せずにIT部門を案内してください」"],"a":[3],"e":"効果的な指示は、役割、対象となる読み手、出力の形式、そして情報が不足しているときの対応を具体的に定めています。「親切に」のような曖昧な指示では振る舞いが定まらず、「間違えないで」という要求は実行可能な指針になりません。分からなくても回答を作らせる指示は、ハルシネーションを助長します。","w":["推測による誤った案内を、誘発します。","役割、対象、制約が、具体的ではありません。","禁止や強調だけでは、行動の指針になりません。",null],"lv":1},{"d":5,"q":"営業支援用の Project で、Claude が旧価格で回答していることが分かりました。調べると、ナレッジに昨年度の価格表が残っていました。再発防止を含めた対応として最も適切なものはどれですか。","o":["モデルをより上位のものに切り替え、正しい価格を判断させる","新しい価格表を追加し、古い価格表も念のため残しておく","チャットで「最新の価格を使って」とその都度指示することにする","古い価格表を最新版に差し替え、ナレッジを定期的に見直す担当者と頻度を決める"],"a":[3],"e":"ナレッジは、登録した時点の内容のまま参照されるため、更新の管理が必要です。古い資料は削除して最新版に差し替え、定期的な見直しの責任者と頻度を定めることで再発を防げます。新旧の資料を併存させると混同の原因になり、その都度の指示やモデルの変更では、ナレッジにない最新価格は補えません。","w":["モデルは、どちらの価格表が最新かを知りません。","新旧の価格が、混在して参照されます。","古い資料が残っているため、指示を忘れると再発します。",null],"lv":1},{"d":5,"q":"プロジェクト推進チームが、頻繁に更新される進行管理ドキュメント（Google ドキュメント）を Claude に参照させたいと考えています。最も適切な方法はどれですか。","o":["Google Drive コネクタを利用し、ドキュメントの現在の内容を参照できるようにする","ドキュメントの内容を一度だけカスタム指示に貼り付け、以後は更新しない","更新が落ち着くまで、Claude での参照を行わない","ドキュメントが更新されるたびにPDFへ書き出し、古いファイルと入れ替える形で、手作業でアップロードし直す"],"a":[0],"e":"Google Drive などのコネクタを利用すると、接続先にある資料の現在の内容を参照できるため、頻繁に更新される資料に適しています。静的なファイルを手作業で差し替える運用は、手間がかかるうえ更新漏れを起こしやすく、一度だけ貼り付けた内容はすぐに古くなります。","w":[null,"内容が、すぐに古くなります。","必要な時期に、活用できません。","手間がかかり、更新が遅れたり漏れたりします。"],"lv":1},{"d":5,"q":"経理チームでは、月次報告書を社内の決まった書式と手順で作成しています。この手順を、特定の Project に限らず、必要なときに Claude が再利用できるようにしたいと考えています。最も適した方法はどれですか。","o":["手順書を印刷して手元に置き、出力を見ながら修正を指示する","手順と必要なリソースをまとめた Skill として登録する","手順を毎回チャットに手入力する","手順を覚えているチャットを削除せずに、ずっと使い続ける"],"a":[1],"e":"Skill は、特定の作業の手順や必要なリソースをまとめたもので、関連するタスクのときに Claude が読み込んで利用できます。繰り返し使う定型の手順を再利用可能にする手段として適しています。毎回の手入力や修正指示は非効率で、1つのチャットを使い続ける方法は、コンテキストの肥大化を招きます。","w":["手順を Claude に伝えられず、毎回の修正が必要になります。",null,"手間がかかり、内容に揺れが生じます。","会話が長くなって品質が下がり、共有もできません。"],"lv":1},{"d":5,"q":"ある Project のナレッジに、同じ社内規程の「2024年版」と「2026年版」が、どちらも「就業規則.pdf」に近い名前で登録されています。Claude の回答に、新旧の内容が混在することがあります。最も適切な対応はどれですか。","o":["規程の数を増やせば精度が上がるので、関連する規程の過去の版もすべて追加する","現行版だけを残して旧版を削除し、ファイル名に版と日付を明記する","両方を残したまま、カスタム指示に「正しいほうを使うこと」と書く","両方を残したまま、回答が混在したときだけ再生成する"],"a":[1],"e":"矛盾する資料が併存していると、Claude はどちらが有効かを確実には判断できません。信頼できる唯一の情報源となるようナレッジを整理し、版や日付が分かる名前を付けることが、根本的な対策です。「正しいほうを使う」という指示は判断基準を与えておらず、再生成は対症療法にすぎません。旧版の追加は、混在をさらに悪化させます。","w":["古い情報が増えて、混乱が大きくなります。",null,"どちらが正しいのかを、Claude は判断できません。","混在に気づけない場合があります。"],"lv":1},{"d":5,"q":"チームで共有する Project を新しく設定します。適切な方法を2つ選んでください。","o":["指示は一度作成したら、運用が始まった後は変更しない","関連しそうな資料は、古い版や下書きも含めてすべてナレッジに登録する","用途に直接関係する、最新で正確な資料を選んでナレッジに登録する","機密区分を確認せずに、全社の資料をまとめて登録する","カスタム指示に、Project の目的、想定する読み手、出力の形式を明記する"],"a":[2,4],"e":"Project の効果を高めるには、明確な指示と、厳選された関連資料の両方が必要です。目的、読み手、形式を指示に明記し、最新で正確な資料だけを登録すると、一貫性のある出力が得られます。不要な資料や古い資料は、混同や精度低下の原因になります。指示は運用の中で見直すべきものであり、資料の登録にあたっては機密区分の確認が欠かせません。","w":["利用の実態に合わせた改善が、できなくなります。","古い情報や未確定の情報が、回答に混ざります。",null,"閲覧してはならない人に、情報が渡るおそれがあります。",null],"lv":1},{"d":6,"q":"人事担当者が、氏名と評価コメントを含む従業員の人事評価データを Claude にアップロードして傾向を分析したいと考えています。社内ポリシーでは、個人を特定できる情報を AI ツールに入力することが制限されています。最も適切な対応はどれですか。","o":["分析そのものを断念する","氏名などの個人を特定できる情報を削除または匿名化し、ポリシーに沿った形で分析する","社内での分析なので問題ないと判断し、そのままアップロードする","アップロードしたうえで、Claude に「このデータは保存しないでください」と指示する"],"a":[1],"e":"制限対象の識別情報を削除・匿名化すれば、ポリシーを守りながら分析の目的を達成できます。利用が社内に限られていても、ポリシーの適用は免れません。モデルに「保存しないで」と指示することは、ポリシー上の管理策にはなりません。匿名化によって実施できるのであれば、分析を断念する必要もありません。","w":["匿名化すれば、ポリシーに沿って分析できます。",null,"社内の利用でも、個人情報の取り扱いのルールは適用されます。","指示では、データの取り扱いは変わりません。"],"lv":1},{"d":6,"q":"次のうち、Claude の利用方法として不適切なものはどれですか。","o":["求人票の下書きを作成させ、人事担当者が修正して公開する","応募者の合否を Claude に決定させ、人が確認せずにそのまま結果を通知する","面接の評価基準の整理を手伝わせ、採用委員会で議論して決定する","採用面接の質問案を作成させ、面接官が内容を確認して使用する"],"a":[1],"e":"採用の合否のように、個人に重大な影響を与える判断を、人の関与なしに AI へ委ねることは不適切です。公平性と説明責任の観点から、人による判断と確認が必要です。質問案や求人票の下書き、基準の整理は、人が確認して最終的に決定する限り、適切な支援的利用といえます。","w":["人が修正して公開するため、適切な利用です。",null,"決定は人が行うため、適切な利用です。","人が確認して使うため、適切な利用です。"],"lv":1},{"d":6,"q":"コンサルタントが、秘密保持契約（NDA）を結んでいる顧客から受け取った資料を Claude に読み込ませて要約したいと考えています。自社の AI 利用ポリシーには、このケースについての明確な記載がありません。最も適切な対応はどれですか。","o":["顧客には知らせず、資料の一部だけを読み込ませる","法務や情報セキュリティなどの担当部門に確認し、判断が出るまで読み込ませない","明確に禁止されていないので、許可されていると解釈して進める","Claude に「この利用は契約上適切ですか」と質問し、問題ないという回答であれば、そのまま進める"],"a":[1],"e":"ポリシーの記載が不明確で、契約上の義務が関わる場合は、担当部門に確認することが適切な統制です。「禁止されていない」ことは「許可されている」ことを意味しません。組織のポリシーや契約の解釈を Claude に委ねることはできず、資料の一部であっても、無断で読み込ませることは契約違反となるおそれがあります。","w":["一部であっても、秘密情報であることは変わりません。",null,"契約上の義務を、自己判断で解釈することになります。","Claude は、その契約の内容や社内の規程を判断できる立場にありません。"],"lv":1},{"d":6,"q":"コンサルティング会社の担当者が、Claude を活用して作成した分析レポートを顧客に納品します。社内には、AI を利用した成果物について顧客へ開示するという規程があります。最も適切な対応はどれですか。","o":["AI が作成したことを理由に、内容に関する責任は負わないと伝える","規程に従って AI の利用を開示し、内容は自ら検証したうえで、成果物に責任を持つ","開示が必要にならないよう、レポートから Claude が書いた部分の痕跡を消してから納品する","品質に問題がなければ、AI の利用は伏せておく"],"a":[1],"e":"組織の規程が開示を求めている場合は、それに従う必要があります。また、AI を利用したとしても、成果物の内容に対する責任は利用者と組織にあるため、検証は欠かせません。利用を隠すことは規程違反であり、信頼を損ないます。責任を AI に転嫁することはできません。","w":["成果物の責任は、納品する側にあります。",null,"開示の義務を、意図的に回避する行為です。","社内の規程に反します。"],"lv":1},{"d":6,"q":"保険会社の担当者が、顧客からの「この治療は保険の支払い対象になりますか」という問い合わせに対する回答を、Claude に作成させました。最も適切な取り扱いはどれですか。","o":["回答の末尾に「この回答は AI が作成しました」と記載したうえで、内容は確認せずにそのまま送信する","約款に詳しそうな回答であれば、そのまま顧客に送信する","下書きとして扱い、約款と照合したうえで、支払い査定の権限を持つ担当者が確認してから回答する","Claude に3回質問し、回答が一致した場合に送信する"],"a":[2],"e":"保険金の支払い可否のように、契約や規制に関わり、顧客への影響が大きい判断は、権限と専門性を持つ担当者による確認が必要です。Claude の出力は下書きとして扱い、根拠となる約款と照合します。AI が作成した旨の表示や、複数回の一致は、内容の正確性と責任ある判断の代わりにはなりません。","w":["開示しても、内容の誤りは防げません。","もっともらしさは、正しさを保証しません。",null,"一致しても、約款に沿っているとは限りません。"],"lv":1},{"d":6,"q":"財務担当者が、未公表の決算情報を含む資料の要約を急いでいます。会社が契約している法人向けの Claude 環境は自宅から利用できないため、個人で契約している無料アカウントを使おうと考えています。最も適切な対応はどれですか。","o":["会社名だけを伏せれば十分なので、個人アカウントで要約する","同僚の個人アカウントを借りて要約する","急ぎの業務なので、今回に限って個人アカウントで要約し、作業が終わったら会話の履歴を削除しておく","個人アカウントは使わず、会社が承認した環境で作業する。利用できなければ上長や担当部門に相談する"],"a":[3],"e":"機密情報は、組織が承認した環境とアカウントで扱う必要があります。個人アカウントは、組織のデータ保護や契約上の管理の対象外であり、履歴の削除や会社名の伏せ字では統制の代わりになりません。業務を急いでいることは、ポリシーを逸脱する理由にはなりません。","w":["内容から特定される可能性があり、機密であることも変わりません。","承認されていない環境であることは、同じです。","承認されていない環境に、機密情報を渡すことになります。履歴の削除では取り消せません。",null],"lv":1},{"d":6,"q":"ECサイトの運営担当者が、新商品のページに掲載するために、実在の顧客が書いたように見えるレビューを Claude に10件作成させようとしています。最も適切な判断はどれですか。","o":["レビューの文体を1件ずつ変えれば、問題にはならない","架空のレビューを顧客の声として掲載することは、消費者を誤認させるため行わない。実際のレビューの要約などに Claude を使う","新商品にはまだ実際のレビューが集まっていないので、発売直後の期間に限って掲載し、実際のレビューが集まった時点で差し替える","競合他社も行っている可能性があるので、同じように掲載する"],"a":[1],"e":"架空のレビューを実際の顧客の声として掲載することは、消費者を欺く行為であり、倫理的に不適切です。法令上の問題になる可能性もあります。Claude は、実際のレビューの整理や商品説明の改善など、正当な用途に活用すべきです。文体を変えることや他社の動向は、行為の不適切さを解消しません。","w":["偽装を、巧妙にするだけです。",null,"期間を限っても、消費者を誤認させる点は変わりません。","他社の行為は、正当化の理由になりません。"],"lv":1},{"d":6,"q":"調査担当者が、他社が有料で販売している調査レポートの全文を Claude に貼り付け、ほぼ同じ内容の資料を自社名義で作成して、顧客に配布しようとしています。最も適切な判断はどれですか。","o":["出典を記載しなければ、問題になることはない","利用許諾の範囲を確認し、出典を明示して要点を参照するにとどめる。迷う場合は担当部門に確認する","文章の言い回しと構成を Claude に変えさせて、元のレポートと一致しないようにすれば、自社の資料として配布できる","社内で購入したレポートなので、自由に再配布できる"],"a":[1],"e":"第三者の著作物を実質的に複製して自社名義で配布することは、著作権や利用許諾の面で問題となるおそれがあります。レポートを購入していても、再配布の権利があるとは限りません。許諾の範囲を確認し、出典を示して参照する範囲にとどめ、迷う場合は担当部門に確認します。言い回しの変更や出典の省略は、問題の解決になりません。","w":["出典を隠しても、権利の侵害はなくなりません。",null,"表現を変えても、内容の無断利用であることは変わりません。","購入しても、再配布の権利があるとは限りません。"],"lv":1},{"d":6,"q":"ある部門が、顧客データを使う新しい業務で Claude の利用を始めようとしています。開始前に確認すべき事項を2つ選んでください。","o":["出力される文章が十分に長いかどうか","扱うデータの機密区分と、その利用が組織の AI 利用ポリシーで認められているか","他の部門が、同様の利用をすでに始めているかどうか","Claude 自身が「この利用は安全です」と回答するかどうか","個人情報保護に関する法令や、顧客との契約上の制約に抵触しないか"],"a":[1,4],"e":"新しい利用を始める前には、データの機密区分と組織のポリシー、そして適用される法令や契約上の制約を確認する必要があります。これらは、利用の可否を決める根拠となる基準です。Claude 自身の回答や他部門の利用状況は、判断の根拠になりません。出力の長さは、ガバナンスとは無関係です。","w":["リスクの確認とは、関係がありません。",null,"他部門の利用は、自部門の利用が適切である根拠になりません。","Claude は、組織のポリシーや法令への適合を保証できません。",null],"lv":1},{"d":7,"q":"担当者が、背景説明、資料、複数の依頼事項を1つにまとめた長いプロンプトを送りました。出力はおおむね良好ですが、プロンプトの中ほどに書いた「金額はすべて税込で表記する」という条件だけが守られていません。原因と対処として最も可能性が高いものはどれですか。","o":["重要な条件が長い文章に埋もれているので、条件を独立した項目としてまとめ、目立つ位置に明示する","モデルの能力が不足しているので、上位のモデルに切り替える","Claude は税込表記の条件には対応できないと判断し、出力された金額を毎回手作業で修正する運用にする","同じプロンプトを、条件が守られるまで繰り返し送る"],"a":[0],"e":"特定の条件だけが守られない場合、その指示が欠落している、曖昧である、埋もれている、他の指示と矛盾している、のいずれかであることが多くあります。この事例では、条件が長い文章の中に埋もれているため、制約を独立させて明示する構造に改めます。モデルの変更や再送信は、原因に対処していません。","w":[null,"出力はおおむね良好で、原因はプロンプトの構成にあります。","伝え方を直せば、対応できます。","条件が埋もれている状況は、変わりません。"],"lv":1},{"d":7,"q":"ある Project では、カスタム指示に「回答は常に箇条書きにする」とあります。利用者がチャットで「文章で説明して」と依頼すると、出力の形式が毎回ばらつきます。最も適切な対処はどれですか。","o":["形式が安定するまで、同じ依頼を繰り返す","チャットでの依頼に「必ず」「絶対に」といった語を加えて、文章で説明してほしいことを強調する","指示と依頼の矛盾を解消する。たとえば、指示を「指定がなければ箇条書きにする」と改める","形式のばらつきはモデルの特性なので、対処せずに受け入れる"],"a":[2],"e":"出力がばらつく原因は、Project の指示とチャットでの依頼が矛盾していることです。どちらを優先するのかを指示の中で明確にして、矛盾そのものを解消することが根本的な対処になります。繰り返しや語気の強調は、矛盾を残したままであり、安定した結果にはつながりません。","w":["矛盾が残る限り、形式は安定しません。","矛盾を強めるだけで、解消にはなりません。",null,"原因は、指示どうしの矛盾にあります。"],"lv":1},{"d":7,"q":"社内規程に関する質問に答える Project で、Claude が廃止済みの手当について案内していることが分かりました。プロンプトは明確で、利用者の質問の仕方にも問題はありません。最初に確認すべきことはどれですか。","o":["ナレッジに登録されている規程が、最新版であるかどうか","使用しているモデルが最上位のものかどうか","利用者が、質問をより丁寧な言葉で書いているかどうか","回答の文字数の指定が、十分に長いかどうか"],"a":[0],"e":"問題の診断では、原因が指示、文脈、情報源、アプローチのどこにあるのかを切り分けます。プロンプトに問題がなく、内容が古いという症状からは、情報源であるナレッジが古い可能性が最も高いと考えられます。モデルの性能、質問の丁寧さ、文字数は、古い情報が返される原因ではありません。","w":[null,"モデルは、ナレッジにある古い規程をそのまま参照します。","言葉づかいは、参照する情報の新しさに影響しません。","回答の長さは、内容の新しさと無関係です。"],"lv":1},{"d":7,"q":"担当者が契約書のPDFをアップロードして質問したところ、Claude は「該当する記載が見つかりません」と回答しました。しかし、PDFには確かにその条項があります。確認したところ、このPDFは紙の契約書をスキャンした、画質の粗い画像でした。最も適切な対処はどれですか。","o":["「必ず見つけてください」と指示を強めて、同じPDFで再度質問する","テキストを含むPDFや原本の文書ファイルなど、文字を正確に読み取れる資料を用意して質問し直す","Claude は契約書を扱えないと判断し、利用をやめる","記載が見つからないのであれば、一般的な契約書の内容から条項を推測して回答するよう、Claude に依頼する"],"a":[1],"e":"この事例の原因は、プロンプトではなく、情報源が処理に適していないことにあります。画質の粗いスキャン画像は、文字が正確に読み取られないことがあるため、読み取り可能な形式の資料を用意します。指示を強めても、読み取れない内容は参照できません。内容を推測させることは、ハルシネーションを招きます。","w":["文字を読み取れない資料では、指示を強めても見つかりません。",null,"原因は資料の形式にあり、解決できます。","実際の契約書と異なる内容を、作らせることになります。"],"lv":1},{"d":7,"q":"担当者が出力に満足できず、プロンプトの書き換え、モデルの変更、添付資料の差し替えを一度に行いました。結果は改善しましたが、何が効いたのかが分かりません。今後の進め方として最も適切なものはどれですか。","o":["毎回、まずモデルを変更し、それで改善しなければ他の要素を変更する","改善したのだから、原因は気にせず、次回もすべてを同時に変更する","評価基準を毎回変えて、もっとも良く見える結果を採用する","同じ評価基準を保ったまま、変更する要素を1つずつにして、結果を比較する"],"a":[3],"e":"複数の要素を同時に変更すると、改善の原因を特定できず、次回に知見を生かせません。評価基準を一定に保ち、1つずつ変更して比較することで、効果のある対処を把握できます。モデルの変更は万能の解決策ではなく、評価基準を変えてしまうと比較そのものが成り立ちません。","w":["原因についての思い込みに基づく進め方です。","効果のあった要素が分からず、再現できません。","結果どうしを、比較できなくなります。",null],"lv":1},{"d":7,"q":"週次で繰り返す定型レポートの作成に時間がかかっています。品質を保ちながらワークフローを効率化する方法として適切なものを2つ選んでください。","o":["うまく機能したプロンプトを、テンプレートや Project の指示として保存し、再利用する","時間を短縮するため、出力の検証の工程を廃止する","毎回5回ずつ生成し、最も良いものを目視で選ぶ","単純な整形などの工程には高速なモデルを使い、検証の工程は維持する","すべての工程を1つの巨大なプロンプトにまとめ、途中の確認をなくす"],"a":[0,3],"e":"効率化とは、品質を保ったまま無駄を減らすことです。実績のあるプロンプトを再利用可能にすること、工程の難易度に合ったモデルを選ぶことは、どちらも効果的な方法です。検証の廃止や途中確認の削減は品質のリスクを高め、毎回複数回生成して選ぶ方法は、かえって時間とコストを増やします。","w":[null,"品質を保てなくなります。","手間が増えるだけで、効率化になりません。",null,"途中の誤りに気づけず、品質が下がります。"],"lv":1},{"d":1,"lv":2,"q":"営業担当者が、走り書きの商談メモから上長向けの週次報告を Claude に作らせています。上長は「次のアクションと期限、リスクだけ分かればよい」と言っていますが、出力は毎回、商談の経緯の説明が大半を占めます。最も効果的な改善策はどれですか。","o":["次のアクション、期限、リスクを見出しとする出力構成を指定し、経緯は1文以内に収めるよう指示する","商談メモを自分で短く整理し、情報量を減らしてから Claude に渡す","「簡潔にまとめること」と指示し、全体の文字数の上限を200字に設定する","上長の役職や関心事、これまでの指摘の傾向を詳しく説明し、求めている内容を Claude に推測させる"],"a":[0],"e":"読み手が必要とする項目が分かっているのであれば、それを出力の構成として直接指定するのが最も確実です。文字数の制限だけでは、何を残すかが Claude の判断に委ねられ、必要な項目が削られることがあります。入力を減らしても出力の構成は決まらず、読み手の人物像から推測させる方法は、項目を明示する方法よりも遠回りです。","w":[null,"手間が増え、必要な情報まで削るおそれがあります。","短くはなりますが、何を残すかが指定されていません。","求められている項目は分かっており、直接指定するほうが確実です。"]},{"d":1,"lv":2,"q":"人材開発の担当者が、3日間の新人研修の設計を Claude に依頼しました。全日程の詳細スケジュールと教材を一度に作らせたところ、日ごとの内容に一貫性がなく、研修の目的ともずれていました。進め方として最も適切なものはどれですか。","o":["同じ依頼に「全体の整合性を保つこと」と追記し、出力の長さの上限を引き上げる","到達目標と受講者像を確認して全体構成の案を固めてから、日ごとの詳細、教材の順に作らせる","1日目から3日目までを別々のチャットで並行して作らせ、最後に1つに結合する","教材を先に作らせ、その内容に合わせてスケジュールを組み立てさせる"],"a":[1],"e":"タスク分解では、分ける順序が重要です。目的と全体構成を先に固めておくと、後続の詳細がそれに沿って作られ、一貫性が保たれます。日ごとに別のチャットで作らせる方法も分解の一種ですが、全体の文脈を共有しないため、整合性はかえって失われます。教材から作る方法は、目的とのずれを解消しません。","w":["一度に作らせる構造は、変わりません。",null,"日程の間の整合性が、取れなくなります。","目標と全体の構成が決まる前に、細部を作ることになります。"]},{"d":1,"lv":2,"q":"Claude が作成した提案書の下書きは、構成と前半は良好ですが、「費用対効果」の節だけ根拠が弱い状態です。締め切りが迫っています。最も効率的な対応はどれですか。","o":["該当の節を指定し、弱い点と、根拠として使う実際の数値を示して、その節だけを書き直させる","「費用対効果の節を、もっと説得力のある内容にしてください」と依頼する","新しいチャットを開き、最初のプロンプトに「費用対効果を強化すること」と加えてやり直す","提案書の全体をもう一度生成させ、良くなった節だけを元の下書きに差し替える"],"a":[0],"e":"反復改善では、直す範囲と直し方を具体的に示すことが効率につながります。根拠となる数値を渡さずに「説得力を高めて」と依頼すると、Claude が根拠のない数値を補ってしまうおそれがあります。全体の再生成や新しいチャットでのやり直しは、良好だった部分まで変わってしまい、確認の手間が増えます。","w":[null,"根拠となる数値がなく、何を直すのかも伝わりません。","良好だった構成と前半を、捨てることになります。","良好だった部分まで変わり、時間もかかります。"]},{"d":1,"lv":2,"q":"企画担当者が、Claude に (1) 新サービス名の案出し と (2) 競合各社の料金体系の調査 を依頼します。プロンプトの使い分けとして最も適切なものはどれですか。","o":["案出しでは厳密な評価基準を先に示して候補を絞り込ませ、調査では範囲を定めずに自由な発想を促す","どちらの依頼でも、最初に最良の1案または1つの結論だけを求めて、時間を節約する","どちらの依頼でも「必ず出典を付けること」を条件にして、信頼性を確保する","案出しでは数と多様性を求め、調査では範囲と時点を指定して、出典と不確かな点の明示を求める"],"a":[3],"e":"プロンプトの方針は、タスクの種類に合わせて変えます。ブレインストーミングでは発散を優先し、調査では範囲、時点、根拠を明確にして検証可能にすることが重要です。出典の要求は調査には有効ですが、案出しには意味を持ちません。最初から1つに絞らせると、案出しでは発想の幅が、調査では比較の材料が失われます。","w":["案出しと調査で、求め方が逆になっています。","案出しでは幅が失われ、調査では根拠を確認できません。","案出しに出典は不要で、発想を妨げます。",null]},{"d":1,"lv":2,"q":"広報担当者が新製品のプレスリリースの下書きを Claude に依頼したところ、まだ決まっていない発売日と価格が、具体的な数字で書かれていました。再発を防ぐプロンプトの工夫として最も適切なものはどれですか。","o":["過去のプレスリリースを数本、手本として渡し、同じ構成と同じ水準の具体性で書くよう依頼する","出力のたびに、発売日と価格に関する記述を削除するよう依頼する","確定した事実を箇条書きで渡し、未確定の情報は推測で埋めずに「要確認」と書くよう指示する","冒頭に「事実だけを書くこと」と強調したうえで、同じ内容を依頼する"],"a":[2],"e":"Claude は、与えられていない情報を、文書の体裁を整えるために補ってしまうことがあります。確定した事実を明示的に渡し、不明な点の扱いを決めておくことが、根本的な対策です。「事実だけを書く」という指示では、何が事実なのかが Claude には分かりません。手本は文体には有効ですが、内容の創作は防げません。毎回の削除依頼は、原因に対処していません。","w":["具体的な数字を書く傾向を、かえって強めます。","毎回の手戻りになり、原因が残ります。",null,"何が事実なのかを、Claude は知りません。"]},{"d":1,"lv":2,"q":"総務担当者が、移転先のオフィス候補3件について、賃料、通勤の便、拡張性、契約期間の条件を伝え、推奨を求めました。Claude は結論だけを短く返し、判断の根拠が分かりません。最も適切な改善策はどれですか。","o":["同じ質問を3回行い、最も多く推奨された候補を採用する","候補ごとに別のチャットを使って詳しく評価させ、それぞれに付けさせた総合点を、後から並べて比較する","評価基準とその重みを示し、候補を基準ごとに評価してから結論を出すよう、手順を指定する","結論が返ってくるたびに「なぜですか」と尋ねて、理由を説明させる"],"a":[2],"e":"複数の基準を比較する判断では、評価の手順を指定して、基準ごとの検討を経てから結論を出させると、根拠が明確になり、利用者が検証しやすくなります。結論の後に理由を尋ねると、結論に合わせた説明が返るだけになりがちです。候補ごとに別のチャットで評価すると、基準の適用が揃いません。多数決では根拠は得られません。","w":["評価の根拠が、分からないままです。","共通の基準がないため、点数を比較できません。",null,"後付けの説明になり、評価の過程は安定しません。"]},{"d":1,"lv":2,"q":"上司から「例の調査報告、Claude でいい感じにまとめておいて」と頼まれました。報告書は30ページあり、何に使うのか、誰が読むのかは分かりません。上司には今日中に連絡が取れます。最も適切な進め方はどれですか。","o":["用途と読み手、必要な分量を上司に確認し、その内容をプロンプトに含めて依頼する","30ページを均等に圧縮した汎用的な要約を作り、指摘を受けてから修正する","報告書の全文を渡し、重要だと思う点を Claude に自由に選ばせる","Claude に用途を推測させて複数のパターンの要約を作り、上司に選んでもらう"],"a":[0],"e":"目的と読み手は、出力の質を左右する最も重要な文脈です。要件を知っている人に確認できる状況であれば、先に確認するのが最も効率的です。複数のパターンを用意する方法は、確認が取れない場合の次善策としては有効ですが、推測に基づくため手戻りが生じやすくなります。汎用的な要約や Claude 任せの選択は、的外れになる可能性があります。","w":[null,"用途に合わず、手戻りになります。","重要さの基準が、伝わっていません。","確認すればすぐに分かることを、推測で補っています。"]},{"d":1,"lv":2,"q":"総務担当者が、100ページの規程集をもとに、3つの具体的な質問への回答を Claude から得ようとしています。回答の精度を高める方法を2つ選んでください。","o":["3つの質問を番号付きで明確に分け、規程集は指示と区切って渡す","質問の意図は伝えず、関連するキーワードだけを伝える","質問ごとに、根拠となる条文の番号と該当箇所の引用を示すよう求める","規程集を読ませる前に結論を先に答えさせ、後から規程集で補強させる","「一般的な知識も積極的に補って回答すること」と指示する"],"a":[0,2],"e":"根拠の条文と引用を求めると、回答が資料に基づくようになり、利用者による照合も容易になります。また、質問を明確に分け、資料と指示を区切ることで、Claude が対象を取り違えにくくなります。先に結論を出させると、資料がその結論の後付けに使われます。一般知識で補わせると、自社の規程と異なる内容が混ざるおそれがあります。","w":[null,"質問の意図が伝わらず、的外れな回答になります。",null,"根拠のない結論を、後から正当化することになります。","規程集にない内容が、混ざります。"]},{"d":2,"lv":2,"q":"Claude が作成した会議の要約に、「A社との契約更新は合意された」と書かれています。しかし、会議の文字起こしでは、A社の担当者は「前向きに検討します」としか発言していません。最も適切な対応はどれですか。","o":["要約の決定事項を文字起こしの該当する発言と照合し、発言にない結論は事実に合わせて修正する","要約をもう一度生成させ、同じ表現が出なければ問題なしと判断する","「合意された」を「ほぼ合意された」という表現に弱めて、要約を配布する","Claude に「合意は本当に成立していましたか」と確認し、その回答の内容に従って、要約の記述を修正する"],"a":[0],"e":"要約では、発言の趣旨が、より強い結論に置き換わってしまうことがあります。決定事項のような重要な記述は、原文と照合して確認します。表現を弱めても、根拠のない結論であることは変わりません。Claude への再確認や再生成は、原文に基づく独立した検証ではないため、誤りが残る可能性があります。","w":[null,"ほかの決定事項の誤りを、確認できません。","原文にない結論が、残ったままです。","原文と照合せずに、Claude の回答に頼ることになります。"]},{"d":2,"lv":2,"q":"Claude が作成した報告書に、アップロードした顧客インタビューからの「直接引用」が5件含まれています。この報告書は社外に公開する予定です。最も確実な検証方法はどれですか。","o":["引用された文を元の文字起こしで検索し、文言と発言者が一致していることを確認する","引用の内容がインタビューの趣旨と合っているかを、担当者の記憶に基づいて判断する","引用を間接話法に書き換えて引用符を外し、文言の厳密さが問われないようにする","Claude に、引用が原文のとおりであるかどうかを再確認させる"],"a":[0],"e":"直接引用は、文言と発言者の両方が正確でなければなりません。Claude は、趣旨は合っていても、文言を変えたり、発言者を取り違えたりすることがあります。元の文字起こしでの照合が、最も確実な方法です。記憶やモデルによる再確認は、確実な検証になりません。間接話法への書き換えは、誤った帰属の問題を解消しません。","w":[null,"直接引用は、文言の一致が必要です。","発言の内容が正しいかどうかは、確認されないままです。","自己確認では、創作された引用を見抜けません。"]},{"d":2,"lv":2,"q":"Claude に、自分が作成した下書きを批判的にレビューさせる方法について、正しい理解はどれですか。","o":["論理の弱点や見落としの発見には有用だが、事実の正しさは、外部の情報源で別途確認する","文脈を引き継がない新しいチャットでレビューさせれば、独立した第三者による検証と同等に扱える","レビューで問題がないと判定されれば、事実確認の工程は省略できる","同じモデルによる確認にすぎないため、誤りの検出にはまったく役に立たない"],"a":[0],"e":"自己レビューは、構成の不備や論理の飛躍、抜けている観点を見つけるのに役立ちます。しかし、事実の誤りは、同じモデルの知識に基づいて確認する限り、見逃される可能性があります。新しいチャットで実行しても、モデルが同じであれば、独立した検証にはなりません。事実については、原典や権威ある情報源で確認します。","w":[null,"同じモデルは同じ知識に基づくため、同じ誤りを見逃します。","レビューは、事実の正しさを保証しません。","論理の弱点や見落としの発見には、役立ちます。"]},{"d":2,"lv":2,"q":"Claude の分析に、「研修を受講した営業担当者は受注率が高い。したがって、研修を全員に拡大すれば受注率が上がる」とあります。使われている数値は、元データと一致しています。この出力の評価として最も適切なものはどれですか。","o":["サンプル数が少ない可能性を考え、同じ分析をもう一度実行させて、同じ結論になるかどうかを確かめる","数値が元データと一致しているので、結論も妥当であると判断する","数値は正しいが、相関から因果を導いている点を指摘し、経験年数など他の要因の検討を求める","結論の表現を「上がる可能性が高い」に変えれば、問題は解消される"],"a":[2],"e":"出力の評価では、事実の正確さに加えて、推論の妥当性も確認します。この分析は、相関関係を因果関係として扱っています。たとえば、もともと成績の良い担当者が研修を受けていた可能性があります。数値が正しくても、結論が正しいとは限りません。表現を弱めたり、同じ分析を繰り返したりしても、推論の問題は残ります。","w":["同じデータからは、同じ推論が返ります。","数値が正しくても、因果の推論が正しいとは限りません。",null,"因果を前提とする点は、変わりません。"]},{"d":2,"lv":2,"q":"Claude が作成した新規事業の市場分析は、市場の成長を支持する情報ばかりで構成されています。経営会議に提出する前の対応として最も適切なものはどれですか。","o":["楽観的に読める表現を、中立的な言い回しに書き換える","市場の成長を裏付ける出典の数をさらに増やすよう依頼して、分析全体の信頼性と説得力を高める","反対の見方やリスク要因、予測の前提が崩れる条件を追加で調べさせ、出典とともに併記する","分析の末尾に「予測には不確実性があります」という注記を加える"],"a":[2],"e":"一方の結論を支持する情報だけで構成された分析は、偏っている可能性があります。意思決定に使う前に、反対の根拠やリスクを意図的に調べて、判断材料を補います。言い回しの変更や注記の追加は、内容の偏りを是正しません。出典の数を増やしても、同じ方向の情報が増えるだけになるおそれがあります。","w":["情報の偏りそのものは、残ります。","偏りを、さらに強めます。",null,"具体的なリスクが、示されません。"]},{"d":2,"lv":2,"q":"少人数のチームで、専門家に確認を依頼できる時間が限られています。次の Claude の出力のうち、専門家による確認を最優先すべきものはどれですか。","o":["社内報に掲載する、懇親イベントの告知文","自社ブログの記事タイトルの候補","産業用機械の取扱説明書のうち、安全上の注意の英訳","社内勉強会のアジェンダの案"],"a":[2],"e":"確認の優先度は、誤りがあった場合の影響の大きさと、取り返しのつきにくさで決めます。安全上の注意の誤訳は、人身事故や法的責任につながる可能性があるため、最優先で専門家の確認を受けます。告知文、アジェンダ、タイトル案は、誤りの影響が限定的で、通常の確認で対応できます。","w":["誤りの影響が小さい内容です。","誤りの影響が小さい内容です。",null,"誤りの影響が小さく、容易に修正できます。"]},{"d":2,"lv":2,"q":"Claude に2,000件の問い合わせを分類させました。全件を目視で確認する時間はありません。品質を確認する方法として最も適切なものはどれですか。","o":["先頭の50件を確認し、問題がなければ全体を採用する","件数の多い分類だけを確認し、件数の少ない分類は確認を省略する","Claude に全件をもう一度分類させ、1回目と結果が一致したものだけを、正しい分類として採用する","無作為に抽出したサンプルで誤りの割合を把握し、判断の難しい類型を重点的に確認する"],"a":[3],"e":"全件を確認できない場合は、無作為抽出によって全体の品質を推定し、誤りが起きやすい箇所を重点的に確認します。先頭の50件は、全体を代表しているとは限りません。再分類の結果が一致しても、同じ誤りを繰り返している可能性があり、正確さの確認にはなりません。件数の少ない分類は、むしろ誤りが見つかりにくい箇所です。","w":["先頭の部分は、全体を代表しません。","件数の少ない分類の誤りを、見逃します。","同じ誤りを、2回繰り返す可能性があります。",null]},{"d":2,"lv":2,"q":"技術部門の調査結果を、経営層向けの1ページの要約と、現場のエンジニア向けの詳細版に作り分けます。進め方として最も適切なものはどれですか。","o":["読み手ごとに別のチャットで、元の調査結果を渡さずに書かせて、表現の違いを出す","1つの文書に両方の内容を盛り込み、読み手が必要な箇所を選んで読めるようにする","検証済みの同じ内容をもとに、読み手ごとに詳細度を指定して作り分け、数値と結論の一致を確認する","経営層向けの要約を先に作り、それを Claude に膨らませることで、エンジニア向けの詳細版を作成する"],"a":[2],"e":"読み手に合わせて作り分ける場合も、もとになる内容は同じ検証済みのものにします。作り分けた後は、数値や結論にずれがないかを確認します。要約を膨らませて詳細版を作ると、元の調査にない内容が補われるおそれがあります。元の資料を渡さずに書かせると、事実の根拠が失われます。1つの文書にまとめると、どちらの読み手にも読みにくくなります。","w":["根拠のない内容になります。","どちらの読み手にも、合わない文書になります。",null,"要約にない詳細を、Claude が補って創作します。"]},{"d":2,"lv":2,"q":"3つのツールを5つの評価軸で比較した結果を、会議で1枚の資料として示します。出力形式として最も適切なものはどれですか。","o":["ツールごとに長所と短所を並べた箇条書き","評価軸ごとに段落を分けて記述した文章","総合評価の高い順に並べた、推奨の文章","行にツール、列に評価軸を配置した表"],"a":[3],"e":"複数の対象を複数の軸で比較する情報は、表にすると、行と列の両方向で見比べることができます。文章や箇条書きでは、同じ軸での横の比較がしにくくなります。推奨の文章は結論を伝えるには適していますが、比較の根拠が見えなくなります。出力形式は、情報の構造と使われ方に合わせて選びます。","w":["評価軸がそろわず、比較しにくくなります。","ツール間の比較が、一覧できません。","評価の根拠が、一覧できません。",null]},{"d":2,"lv":2,"q":"文書の作成中に、「この敬語表現はどちらが自然か」といった短い確認を、Claude に何度も行います。出力の受け取り方として最も適切なものはどれですか。","o":["確認のたびに Artifact を作成して、結果を残す","会話の中の短い回答として受け取る","専用の Project を作成し、確認の結果をナレッジに登録する","リサーチ機能を使い、出典付きの報告として受け取る"],"a":[1],"e":"短く、その場で完結する確認は、会話内の回答で十分です。Artifact は、まとまった分量があり、繰り返し編集したり再利用したりする成果物に適しています。リサーチ機能は、複数の情報源を横断する調査のための機能で、時間もかかります。出力の形式や機能は、内容の規模と使われ方に合わせて選びます。","w":["短い確認には、過剰です。",null,"一時的な確認には、過剰です。","言い回しの確認に、調査は不要です。"]},{"d":2,"lv":2,"q":"リサーチで30件の知見が得られました。これを、役員が意思決定に使う1ページの資料にまとめます。情報の整理の仕方として最も適切なものはどれですか。","o":["Claude に重要度を判定させ、上位5件を、選定の理由は確認せずにそのまま資料に採用する","意思決定への影響で優先順位を付けて絞り込み、出典を付け、省いたものは付録に回す","30件すべてを、1行ずつに圧縮して掲載する","関連する知見の件数が多いテーマから順に掲載する"],"a":[1],"e":"情報の整理では、読み手の目的、ここでは意思決定への関連性を基準に取捨選択します。出典を残すことで検証が可能になり、省いた情報を付録に回すことで透明性が保たれます。すべてを圧縮すると、重要な点が埋もれます。Claude に選択を任せきりにすると、選択の基準が不明確になります。件数の多さは、重要性を表しません。","w":["選定の妥当性を、検証していません。",null,"優先順位がなく、意思決定に使えません。","件数は、意思決定への影響の大きさを示しません。"]},{"d":2,"lv":2,"q":"長い報告書の要約について、品質を評価する観点として適切なものを2つ選んでください。","o":["要約の長さが、原文のちょうど1割になっている","原文にない主張や数値が、加えられていない","原文の章の数と同じ数の段落に分かれている","原文よりも格調の高い語彙が使われている","原文の主要な論点と結論が、漏れなく含まれている"],"a":[1,4],"e":"要約の品質は、網羅性（主要な論点と結論が含まれていること）と、忠実性（原文にない内容が加わっていないこと）で評価します。語彙の格調、長さの比率、段落の数は形式的な特徴であり、内容の正確さや完全性を示すものではありません。","w":["長さの比率は、品質の基準になりません。",null,"形式が一致しても、内容が正しいとは限りません。","語彙の格調は、要約の正確さと関係がありません。",null]},{"d":2,"lv":2,"q":"事実に関する同じ質問を Claude に2回行ったところ、異なる回答が返ってきました。適切な対応を2つ選んでください。","o":["2つの回答の内容を折衷して使用する","資料を渡している場合は、根拠となる箇所の引用を求めて、資料と照合する","回答が安定しないことを不確実性の兆候と捉え、権威ある情報源で確認する","後から得た回答のほうが新しいので、そちらを採用する","より詳しく書かれているほうの回答を採用する"],"a":[1,2],"e":"回答が実行のたびに変わることは、その内容が不確かであることを示す兆候です。外部の権威ある情報源で確認するか、渡した資料の該当箇所と照合して、正しい内容を確定します。回答の順序、詳しさ、折衷は、いずれも正確さの根拠になりません。","w":["どちらも誤っている可能性があります。",null,null,"回答の順序は、正しさと関係がありません。","詳しさは、正しさを示しません。"]},{"d":3,"lv":2,"q":"会議の直前に、ある企業が昨日発表した決算の売上高だけを確認したいと考えています。最も適切な方法はどれですか。","o":["Web 検索を使わずに質問し、モデルが持つ知識で回答させる","Project を作成し、その企業の過去の決算資料をナレッジに登録してから質問する","Web 検索を有効にしたチャットで質問し、示された出典を確認する","リサーチ機能を使い、その企業に関する包括的な調査レポートを作らせる"],"a":[2],"e":"最新の事実を1つ、すばやく確認したい場合は、Web 検索を有効にした通常のチャットが適しています。リサーチ機能は、多数の情報源を統合する深い調査のための機能で、完了までに時間がかかるため、この目的には過剰です。昨日の発表は、モデルの知識にも過去の資料にも含まれていません。得られた数値は、出典で確認します。","w":["昨日の発表は、モデルの知識に含まれません。","昨日の発表が含まれず、準備の手間もかかります。",null,"1つの数値の確認には過剰で、時間もかかります。"]},{"d":3,"lv":2,"q":"ある担当者は、文書の作成、要約、表の読み取りといった作業を、一日を通して Claude で行っています。一定の品質は必要ですが、応答の速さも重要で、利用上限も気になっています。既定のモデルの選び方として最も適切なものはどれですか。","o":["バランス型のモデル（Sonnet）を既定にし、特に難しい分析だけ上位のモデルに切り替える","品質を最優先し、すべての作業で最上位のモデル（Opus）を使う","速度を最優先し、品質が不足する場合でも最軽量のモデル（Haiku）を使い続ける","作業のたびに3つのモデルすべてで出力を生成して見比べ、最も良かったものをその都度採用する"],"a":[0],"e":"日常的な幅広い作業には、品質と速度のバランスが取れたモデルを既定とし、必要なときだけ上位のモデルを使うのが合理的です。常に最上位のモデルを使うと、応答が遅くなり、利用上限にも早く達します。最軽量のモデルに固定すると、必要な品質が得られない場面が生じます。毎回の比較は、時間と利用量の無駄になります。","w":[null,"日常的な作業には過剰で、速度と利用量の面で不利です。","必要な品質を満たせません。","手間と利用量が、3倍になります。"]},{"d":3,"lv":2,"q":"5万行の売上データ（CSV）から、地域別の合計と前年比を正確に求めたいと考えています。最も適切な方法はどれですか。","o":["先頭の100行だけを渡し、全体の傾向を推定させる","CSV の内容をチャットに貼り付け、Claude に数値を読み取らせて合計を答えさせる","リサーチ機能を使い、同業他社の売上の傾向を調べさせる","ファイルをアップロードし、コード実行の機能でデータを処理させて集計する"],"a":[3],"e":"大量のデータの正確な集計には、Claude がコードを書いて実行する、コード実行の機能が適しています。計算がプログラムによって行われるため、結果が正確で再現可能になります。大量の数値を文章として読ませて合計を答えさせる方法は、計算の誤りや、扱える分量の制約があります。一部のデータからの推定では、正確な合計は得られません。結果は、抜き取りで確認します。","w":["全体の正確な合計は、求められません。","大量の数値を読み取って計算すると、誤りが生じやすくなります。","自社のデータの集計になりません。",null]},{"d":3,"lv":2,"q":"契約書のレビューについて、Claude と長い会話を続けてきました。次に、まったく無関係な社内イベントの案内文を作りたいと考えています。最も適切な方法はどれですか。","o":["新しいチャットを開始して依頼する","同じチャットで「契約書の話は忘れてください」と指示してから依頼する","契約書の会話を要約させてから、同じチャットで依頼する","Claude がこれまでの経緯を把握しているので、同じチャットでそのまま依頼する"],"a":[0],"e":"無関係な話題は、新しいチャットで始めます。長い会話の履歴は、新しい依頼には不要な文脈であり、応答の質を下げたり、利用量を増やしたりする原因になります。「忘れてください」と指示しても、履歴は文脈に残ります。要約は、同じ作業を続ける場合の引き継ぎには有効ですが、無関係な依頼には必要ありません。","w":[null,"指示をしても、文脈はコンテキストに残ります。","無関係な内容を、さらに増やすことになります。","無関係な文脈が、出力に影響します。"]},{"d":3,"lv":2,"q":"Claude が、過去の会話に基づいて、利用者を「営業部の所属」として回答を続けています。利用者は、すでに別の部署に異動しています。最も適切な対応はどれですか。","o":["モデルを別のものに切り替えて、記憶をリセットする","異動後の部署名を、すべての質問文に書き添える","メモリに保存されている内容を確認し、古い情報を修正または削除する","チャットを開始するたびに、「営業部ではありません」と冒頭で伝える"],"a":[2],"e":"Claude が会話をまたいで保持している情報は、メモリの設定から確認でき、修正や削除ができます。古い情報が残っている場合は、原因であるメモリの内容を直すのが根本的な対処です。毎回の訂正や書き添えは対症療法であり、手間がかかります。モデルを切り替えても、保持されている情報は変わりません。","w":["メモリは、モデルの切り替えでは消えません。","毎回の手間がかかり、原因が残ります。",null,"毎回の手間がかかり、原因が残ります。"]},{"d":3,"lv":2,"q":"ある担当者が、月末になると利用上限に頻繁に達します。調べると、大きな PDF を添付した1つのチャットで数十回のやり取りを続けており、すべての作業に最上位のモデルを使っていました。最も効果的な改善策はどれですか。","o":["資料は Project に置き、話題ごとにチャットを分け、単純な作業には軽いモデルを使う","すべての作業を1つのチャットにまとめることで、チャットの数と、資料を添付し直す回数を減らす","PDF を、毎回のメッセージに添付し直す","質問文をできるだけ短く書くようにする"],"a":[0],"e":"利用量は、会話の長さ、添付した資料の大きさ、使用するモデルに左右されます。長い会話では、過去のやり取り全体が毎回処理されるため、消費が増えます。資料を Project に置き、話題ごとにチャットを分け、作業に合ったモデルを選ぶと、消費を大きく抑えられます。質問文を短くする効果は限定的です。チャットを1つにまとめると、状況はかえって悪化します。","w":[null,"履歴がさらに長くなり、消費が増えます。","同じ資料を、重複して処理させることになります。","消費の大半は、PDF と長い履歴によるものです。"]},{"d":3,"lv":2,"q":"次のうち、通常のチャットよりも Project を使うほうが適している場面を2つ選んでください。","o":["同じ資料と方針を参照しながら、数週間にわたって続く提案活動","一度きりの、簡単な文章の翻訳","思いついたときに尋ねる、雑学的な質問","その場で完結する、文章の言い換え","チームで同じ指示と資料を共有して進める、定例の業務"],"a":[0,4],"e":"Project は、同じ指示と資料を継続的に使う作業や、チームで設定を共有する業務に適しています。指示とナレッジが、その中のすべてのチャットに適用されるためです。一度きりの翻訳や言い換え、単発の質問は、設定を保持する必要がないため、通常のチャットで十分です。","w":[null,"一度きりの作業であり、通常のチャットで足ります。","継続して参照する資料や指示がありません。","その場で完結する作業です。",null]},{"d":4,"lv":2,"q":"ある部門で、Claude を活用する業務の候補が4つ挙がっています。最初に試行する対象として最も適切なものはどれですか。","o":["毎日発生する、定型的な問い合わせへの回答の下書き（担当者が確認して送信する）","年に1回作成する、役員報酬に関する取締役会資料","経理システムへの仕訳の自動登録（基幹システムとの連携の開発が、新たに必要になる）","契約違反に当たるかどうかの、法務としての最終判定"],"a":[0],"e":"最初の試行には、発生頻度が高く効果が見えやすいこと、誤りの影響が限定的であること、人が確認できること、追加の開発が不要であることを満たす業務が適しています。年1回の重要資料は、効果の検証がしにくく、影響も大きい業務です。法務の最終判定は、人が担うべき判断です。システム連携を伴う自動化は、技術担当者への引き継ぎが必要です。","w":[null,"頻度が低く、機密性が高いため、効果も学びも得にくい対象です。","開発が必要で、誤りの影響も大きい業務です。","専門家の判断が必要で、リスクが高い業務です。"]},{"d":4,"lv":2,"q":"部長から「請求書の確認業務を Claude で効率化してほしい」と依頼されました。ワークフローの設計に入る前に、最初に行うべきことはどれですか。","o":["効率化の効果が最大になるよう、確認の工程を省く設計にする","現在の手順と所要時間、誤りの発生状況を把握し、何をもって成功とするかを関係者と合意する","他社の導入事例を Claude に調べさせ、同じ構成を採用する","請求書を数件 Claude に読み込ませて、どの項目をどの程度の精度で読み取れるのかを、先に試す"],"a":[1],"e":"ユースケースの分析は、現状の把握と成功基準の合意から始めます。基準がなければ、設計の良し悪しも、試行の結果も評価できません。Claude での試用は有用ですが、何を達成すべきかが定まってから行うほうが効果的です。確認の工程の省略は、効率化ではなくリスクの増加です。他社の構成が、自社の業務に合うとは限りません。","w":["誤りを、見逃します。",null,"自社の現状や課題に合うとは限りません。","成功の基準がないと、試した結果を評価できません。"]},{"d":4,"lv":2,"q":"提案書作成用の Project を、営業部門の全員に展開しようとしています。展開の前に行うこととして最も適切なものはどれですか。","o":["過去の実際の案件を数件使って出力を評価し、指示やテンプレートを調整したうえで、少人数で試行する","架空の簡単な案件を1件使い、動作することを確認して展開する","画面の操作と注意点をまとめた詳しい利用マニュアルを作成し、説明会を開いたうえで、全員へ一斉に展開する","問題が報告されたら修正する方針で、すぐに全員へ展開する"],"a":[0],"e":"ソリューションは、実際の業務に近い条件で評価し、小さく試してから広げます。過去の実案件は、出力の質を具体的に判断できる材料になります。架空の簡単な案件では、実務で起きる難しさが再現されません。マニュアルは必要ですが、出力の質の検証の代わりにはなりません。全員に展開してから修正する方法は、影響の範囲が大きくなります。","w":[null,"実際の案件の複雑さを、反映しません。","出力の品質を、検証していません。","問題の影響が、全員に及びます。"]},{"d":4,"lv":2,"q":"議事録から Claude が抽出したタスクを、担当者がタスク管理ツールに手作業で登録しています。項目の抜けや形式の揺れが多く、手戻りが発生しています。現時点で最も適切な改善策はどれですか。","o":["登録に必要な項目と形式を出力テンプレートとして定め、不明な項目は「未定」と明示させる","登録の前に、担当者が毎回 Claude に抜けがないかを質問する","タスク管理ツールと API で連携させて、抽出から登録までを、人手を介さずに完全に自動化する","会議の参加者全員に、議事録の書き方を統一してもらう"],"a":[0],"e":"後続の工程が必要とする項目と形式を、出力のテンプレートとして定めると、抜けと揺れを出力の段階で防げます。不明な項目を明示させれば、確認すべき点も分かります。毎回の質問は手間が残ります。参加者全員の書き方を変えるのは負担が大きく、効果も不確実です。API 連携は技術的な実装であり、まずテンプレートで改善を図るのが現実的です。","w":[null,"自己確認は確実ではなく、形式の揺れも解消しません。","抜けや揺れが解消しないまま、誤った登録が自動で行われます。","実現が難しく、出力の形式も定まりません。"]},{"d":4,"lv":2,"q":"チームの一部のメンバーが、「AI に仕事を奪われる」「出力が信用できない」として、Claude の利用に消極的です。導入を進める担当者の対応として最も適切なものはどれですか。","o":["下書きは Claude、判断は人という役割を説明し、実例と検証の手順を共有して、意見を集める","不安を与えないよう、出力の誤りの事例は共有せず、うまくいった事例だけを選んで、繰り返し紹介する","Claude の利用を義務とし、利用回数を個人の評価指標に加える","消極的なメンバーを対象から外し、積極的なメンバーだけで進める"],"a":[0],"e":"関係者には、価値と限界の両方を率直に伝えます。役割の位置づけを明確にし、誤りにどう対処するかを含めて共有することで、懸念に応えられます。利用の義務化は、形だけの利用を生みます。消極的なメンバーを外すと、懸念が解消されないまま残ります。誤りの事例を隠すと、後に信頼を損ないます。","w":[null,"限界を隠すことになり、信頼を損ないます。","不安の原因に対処せず、形だけの利用を招きます。","チーム内に、分断が生じます。"]},{"d":4,"lv":2,"q":"営業部長が、「Claude に聞けば、当社の最新の在庫数がいつでも正確に分かるのだろう」と期待しています。現在、Claude は在庫管理システムと連携していません。説明として最も適切なものはどれですか。","o":["Web 検索を有効にすれば、社内の在庫数も調べられるようになる","連携していないシステムのデータは参照できないため、データの提供か連携が必要で、数値の確認も要る","過去1年分の在庫表をナレッジに登録しておけば、傾向から、現在の在庫数も十分な精度で推定できる","最上位のモデルを使えば、より正確な在庫数を回答できる"],"a":[1],"e":"Claude は、与えられていない、あるいは接続されていない情報源のデータを参照できません。この限界を正確に伝え、データの提供または連携という選択肢と、確認の必要性を示します。Web 検索では、社内システムの情報は得られません。過去の在庫表から、現在の在庫数は分かりません。モデルの性能は、データへのアクセスとは無関係です。","w":["社内の在庫数は、Web 上にはありません。",null,"過去のデータからの推定は、現在の実数ではありません。","参照できないデータは、どのモデルでも回答できません。"]},{"d":4,"lv":2,"q":"報告書の作成に Claude を使う試行を行いました。下書きの作成時間は30分から10分に短縮されましたが、確認と修正に40分かかっています。この結果の判断として最も適切なものはどれですか。","o":["作成時間が短縮されたので、成功と評価して展開する","確認の工程を省いて、短縮の効果を確保する","全体の時間では効果が出ていないため、指示を改善して修正量を減らせるかを試し、だめなら適用を見直す","最上位のモデルに切り替えれば、確認と修正にかかる時間はほぼ不要になるはずなので、モデルを変えて展開する"],"a":[2],"e":"効果は、確認と修正を含めた工程全体で評価します。この試行では、合計の時間が30分から50分に増えています。まず、修正が多い原因（不足している文脈、曖昧な指示など）を特定して改善を試み、それでも効果が出なければ、この業務への適用を見直します。確認の省略はリスクを高めます。モデルの変更で修正が不要になる保証はありません。","w":["全体の時間は、30分から50分に増えています。","修正が必要な出力を、そのまま出すことになります。",null,"検証していない仮定であり、確認はどのモデルでも必要です。"]},{"d":4,"lv":2,"q":"Claude を組み込んだ問い合わせ対応のワークフローを設計しています。出力が回答の基準を満たさない場合や、Claude では判断がつかない場合の扱いが、まだ決まっていません。設計として最も適切なものはどれですか。","o":["基準を満たさない場合に、担当者が引き取って対応する手順と、その判断の基準を定める","基準を満たす出力が得られるまで、自動的に再生成を繰り返す","そのような場合はまれなので、発生してから個別に検討する","基準を満たさない回答には注意書きを付けて、そのまま送信する"],"a":[0],"e":"ワークフローには、うまくいかない場合の経路を、あらかじめ組み込んでおきます。人が引き取る条件と手順を定めることで、品質と責任の所在が保たれます。再生成の繰り返しは、基準を満たす保証がなく、時間もかかります。基準を満たさない回答の送信は、顧客に不利益を与えます。事後の検討では、対応が場当たり的になります。","w":[null,"解決できない場合に、終わりがありません。","対応が遅れ、判断もばらつきます。","基準を満たさない回答が、顧客に届きます。"]},{"d":4,"lv":2,"q":"業務部門の担当者が、Claude を使ったシステム連携の実現を、技術チームに依頼します。引き継ぎの資料に含めるべきものを2つ選んでください。","o":["解決したい業務上の課題と、期待する成果および成功の基準","使用すべきプログラミング言語とライブラリの指定","Claude に生成させた、動作を確認していないサンプルコード","扱うデータの種類、量、機密区分などの制約","API の呼び出し方に関する詳細な設計"],"a":[0,3],"e":"引き継ぎでは、業務側が責任を持つ情報、つまり課題と成功の基準、そしてデータに関する制約を明確に伝えます。これらは、技術チームが適切な設計を判断するための前提になります。言語やライブラリの選定、API の設計は、技術チームが決めるべき事項です。未検証のコードは、誤解や手戻りの原因になります。","w":[null,"技術的な選択は、技術チームが行います。","誤解や不具合の原因になります。",null,"技術チームの担当する範囲です。"]},{"d":4,"lv":2,"q":"3つの外部研修サービスの中から1つを選ぶ検討に、Claude を活用します。活用の方法として最も適切なものはどれですか。","o":["比較と選定は従来どおり人だけで行い、Claude には、決定した後に関係者へ送る通知文だけを作成させる","各サービスの宣伝資料を渡し、最も魅力的に書かれているものを選ばせる","Claude に最適なサービスを1つ選ばせ、その結論をそのまま採用する","選定の基準を示して各サービスを比較させ、不足している情報を洗い出させたうえで、チームで決定する"],"a":[3],"e":"Claude は、基準に沿った比較の整理や、判断に必要な情報の不足を見つけることに役立ちます。最終的な決定は、状況と責任を持つチームが行います。宣伝資料の書き方は、サービスの質を示しません。通知文だけを作らせる使い方は、検討の過程で得られる支援を活用できていません。結論をそのまま採用すると、判断の根拠と責任が曖昧になります。","w":["比較や情報の整理という、価値の大きい使い方を逃しています。","宣伝の巧みさと、自社への適合は別のものです。","判断の根拠を、人が検証していません。",null]},{"d":5,"lv":2,"q":"経費規程に関する質問に答える Project を運用しています。利用者が税務の相談や他部門の手続きについても質問し、Claude がナレッジにない内容を一般的な知識で回答してしまいます。最も適切な対応はどれですか。","o":["指示に、回答の対象範囲と、範囲外の質問には回答せずに担当窓口を案内することを明記する","指示に「正確に回答すること」と追記する","税務や他部門の手続きの資料もナレッジに追加して、この Project で回答できる範囲を広げる","利用者に、範囲外の質問をしないよう周知する"],"a":[0],"e":"Project の指示には、何に答えるかだけでなく、範囲外の質問をどう扱うかも定めておきます。これにより、根拠のない回答を防ぎつつ、利用者を適切な窓口へ案内できます。対象範囲を広げると、資料の維持管理の負担と、誤答のリスクが増えます。周知だけでは、範囲外の質問はなくなりません。「正確に」という指示は、振る舞いを具体的に定めていません。","w":[null,"回答の範囲は、制限されません。","専門外の領域まで、誤った回答をするリスクが広がります。","利用者の行動に依存しており、防げません。"]},{"d":5,"lv":2,"q":"20個のシートを含む Excel ファイルを、そのまま Project のナレッジに登録しました。シートの大半は、古い試算や作業用のものです。Claude が、誤ったシートの数値を使って回答することがあります。最も適切な対応はどれですか。","o":["指示に「最新のシートを使うこと」と記載する","質問のたびに、参照すべきシートの名前を伝える","必要なシートだけを抜き出して整理し、内容が分かる名前を付けて登録し直す","同じファイルを PDF に変換して登録する"],"a":[2],"e":"ナレッジは、登録する前に整理しておくことが重要です。不要な内容や古い内容が混ざっていると、Claude はどれが有効なのかを判断できません。必要な内容だけを、分かりやすい名前で登録します。「最新のシートを使う」という指示には、判断の手がかりがありません。形式を変換しても、内容の混在は変わりません。毎回のシート名の指定は、対症療法です。","w":["どれが最新なのかを、Claude は判断できません。","毎回の手間がかかり、伝え忘れも起こります。",null,"不要な情報が、そのまま残ります。"]},{"d":5,"lv":2,"q":"全社共通の1つの Project に、人事、営業、IT の資料が数百件登録されています。回答に、質問とは無関係な部門の情報が混ざることがあります。最も適切な対応はどれですか。","o":["用途ごとに Project を分け、それぞれに関連する資料と指示だけを設定する","資料のファイル名の先頭に、部門名を付ける","質問の冒頭で、毎回部門名を伝えてもらう","カスタム指示に、部門ごとの回答ルールと、参照すべき資料の一覧を、漏れなくすべて書き並べる"],"a":[0],"e":"Project は、用途を絞って構成すると、指示とナレッジが目的に集中し、回答の精度が高まります。用途の異なる資料を1つにまとめると、無関係な情報が参照されやすくなります。指示にルールを書き並べると、指示が長く複雑になり、矛盾も生じやすくなります。ファイル名の工夫や、質問時の部門名の指定は、一定の効果はあっても根本的な解決にはなりません。","w":[null,"無関係な資料が、参照の対象に残ります。","利用者に依存しており、資料も混在したままです。","指示が長く複雑になり、保守もできなくなります。"]},{"d":5,"lv":2,"q":"ある部門が、メールやドライブのコネクタの利用を始めます。運用の方針として最も適切なものはどれですか。","o":["利便性を高めるため、利用可能なコネクタをすべて有効にする","コネクタ経由で取得した情報は、接続先の最新の内容であり常に正確なので、回答の確認は省略してよい","業務に必要なコネクタに限って、組織のポリシーに従って有効にし、回答の参照元も確認する","各自の判断で、私用のアカウントのコネクタも業務に接続する"],"a":[2],"e":"コネクタは、Claude が参照できる情報の範囲を広げます。そのため、必要最小限に限り、組織のポリシーに従って有効にします。コネクタ経由で取得した情報に基づく回答であっても、参照先の取り違えや古い資料の参照は起こり得るため、参照元を確認します。すべてを有効にすることや、私用アカウントの接続は、情報管理上のリスクを高めます。","w":["不要なデータへのアクセスが広がります。","接続先の内容が正しいとは限らず、読み違いも起こります。",null,"業務のデータと私用のデータが、混在します。"]},{"d":5,"lv":2,"q":"社内の承認フローが変更され、承認者が部長から課長になりました。関連する Project の指示には、旧フローが記載されています。最も適切な対応はどれですか。","o":["指示と関連するナレッジを新フローに更新し、変更した日付と内容を記録して、利用者に知らせる","新フローを説明する文書をナレッジに追加し、指示はそのままにする","新フロー専用の Project を別に作成し、旧 Project も、参照用として、設定を変えずにそのまま残しておく","利用者に、回答に出てくる承認者を読み替えるよう周知する"],"a":[0],"e":"業務のルールが変わったときは、Project の指示とナレッジの両方を更新し、変更の記録を残して利用者に伝えます。指示を旧フローのままにして新しい文書だけを追加すると、指示とナレッジが矛盾します。読み替えの周知は、誤りの原因を残します。新旧の Project を併存させると、どちらを使うべきかが分からなくなります。","w":[null,"新旧の内容が、矛盾します。","旧フローの回答が、出続けます。","誤った回答が、出続けます。"]},{"d":5,"lv":2,"q":"Project の指示を大きく書き換えました。利用者に公開する前に行うこととして最も適切なものはどれですか。","o":["指示の文面を読み返して、誤字がないことを確認する","まず公開して利用者からの報告を待ち、問題が報告された場合には、元の指示に戻して対応する","簡単な質問を1つ試して、回答が返ってくることを確認する","代表的な質問に加えて、範囲外や曖昧な質問も使い、意図どおりの振る舞いかを確かめる"],"a":[3],"e":"設定を変更した後は、実際の利用を想定した質問で、振る舞いを確認します。代表的な質問だけでなく、範囲外や曖昧な質問のような境界の事例を含めると、指示の不備を見つけやすくなります。文面の確認だけでは、実際の振る舞いは分かりません。簡単な質問を1つ試すだけでは不十分です。利用者の報告に頼ると、誤った回答が使われてしまうおそれがあります。","w":["振る舞いを、確認していません。","利用者が、問題のある回答を受け取ることになります。","代表的な使い方も、境界の事例も、確認していません。",null]},{"d":5,"lv":2,"q":"Project のカスタム指示に記述する内容として適切なものを2つ選んでください。","o":["情報が不足している場合や、範囲外の質問を受けた場合の対応方針","個人のパスワードやアクセスキー","常に適用したい役割、トーン、出力の形式","今回の依頼だけに関係する、一時的な作業の内容","毎回異なる、入力データそのもの"],"a":[0,2],"e":"カスタム指示は、Project 内のすべてのチャットに適用されます。そのため、常に守らせたい役割、トーン、形式や、例外的な状況での対応方針を記述します。一時的な依頼や、毎回変わるデータは、個々のチャットで伝えます。認証情報は、指示やナレッジに含めてはいけません。","w":[null,"機密情報を、指示に書いてはなりません。",null,"チャットで伝える内容です。","チャットで渡す内容です。"]},{"d":6,"lv":2,"q":"ある管理職が、部下への評価フィードバックの文章を Claude で下書きしたいと考えています。社内ポリシーでは、個人を特定できる評価情報を AI ツールに入力することが制限されています。最も適切な利用方法はどれですか。","o":["氏名を伏せれば制限の対象外になるので、評価点の決定も Claude に任せる","ポリシーで制限されている以上、文章の推敲を含めて、Claude は一切使えないものと判断する","評価シートをそのままアップロードし、評価の結論も Claude に提案させる","氏名などを伏せ、事実と評価は自分で用意して文章化だけを支援させ、内容は自分で確認する"],"a":[3],"e":"ポリシーが制限しているのは、個人を特定できる評価情報の入力です。識別情報を除いたうえで、文章の整理や推敲を支援させることは可能です。評価の判断そのものは、管理職が行い、責任を持ちます。評価シートをそのまま入力することは、ポリシーに反します。評価点の決定を任せることは、不適切です。一切使えないという判断は、ポリシーを必要以上に広く解釈しています。","w":["評価の判断は、管理職の責任です。","個人を特定できる情報を除けば、文章化の支援には使えます。","ポリシーに反し、評価の判断まで任せています。",null]},{"d":6,"lv":2,"q":"人事担当者が、休職中の従業員の診断書の内容を整理するために、Claude に入力しようとしています。社内の AI 利用ポリシーには、健康情報についての明確な記載がありません。最も適切な対応はどれですか。","o":["氏名を消せば個人情報ではなくなるので、そのまま入力する","入力した後に会話を削除すれば、問題は生じない","健康情報は特に慎重な取り扱いが求められるため、入力せずに、担当部門に可否を確認する","社内での利用であり、第三者への提供には当たらないので、入力する"],"a":[2],"e":"健康に関する情報は、特に慎重な取り扱いが求められる情報です。ポリシーに記載がない場合は、自己判断で進めずに、担当部門に確認します。氏名を消しても、病名や時期などから個人が特定される可能性があります。社内での利用であることは、取り扱いの制約を免れる理由になりません。事後の削除は、入力したという事実を取り消しません。","w":["内容から本人を特定できる場合があり、健康情報であることも変わりません。","入力した事実は、取り消せません。",null,"社内の利用でも、取り扱いの制限は適用されます。"]},{"d":6,"lv":2,"q":"サポート対応のために取得した顧客のメールの内容を、Claude で分析し、マーケティング用の顧客プロファイルの作成に使いたいという提案がありました。最も適切な対応はどれですか。","o":["すでに自社が適法に取得して保有しているデータなので、当初の目的にかかわらず、社内であれば自由に利用できる","顧客名を仮名に置き換えれば、利用目的の制約はなくなる","取得したときの利用目的や同意の範囲を超える可能性があるため、プライバシーの担当部門に確認する","Claude が分析するだけで、人は内容を読まないので、問題にならない"],"a":[2],"e":"個人に関するデータは、取得したときに示した目的の範囲で利用するのが原則です。サポートのために取得した情報をマーケティングに使うことは、目的の範囲を超える可能性があるため、担当部門への確認が必要です。保有していることは、自由に利用できることを意味しません。仮名への置き換えは、目的の制約を解消しません。誰が処理するかは、目的の問題とは別です。","w":["利用目的による制限は、社内の利用にも及びます。","利用目的の制約は、仮名にしてもなくなりません。",null,"誰が読むかは、利用目的の制約と関係がありません。"]},{"d":6,"lv":2,"q":"Claude を活用して作成した顧客向けのレポートに、誤った数値が含まれており、顧客から指摘を受けました。最も適切な対応はどれですか。","o":["自社の成果物として誤りを認めて訂正し、検証の手順を見直す","今後は Claude の利用を全面的に禁止する","AI が生成した部分の誤りであることを説明し、責任の範囲外であると伝える","指摘された箇所だけを、説明をせずに差し替える"],"a":[0],"e":"AI を利用して作成した成果物であっても、内容に対する責任は、利用者と組織にあります。誤りを認めて訂正し、再発を防ぐために検証の手順を改善します。責任を AI に転嫁することはできません。説明のない差し替えは、信頼を損ないます。全面的な禁止は、原因である検証の不足に対処しておらず、有用な活用の機会も失わせます。","w":[null,"原因は、検証の手順にあります。","成果物の責任は、自社にあります。","顧客の信頼を損ない、再発の防止にもなりません。"]},{"d":6,"lv":2,"q":"同僚が、会社が承認していない AI サービスに顧客リストを入力して、作業を進めていることに気づきました。最も適切な対応はどれですか。","o":["業務が効率化されているので、特に問題にしない","承認されたツールを使うよう伝え、組織の手順に従って、情報セキュリティの担当に報告する","自分も同じサービスを試し、便利であれば部内に広める","入力したデータをサービスから削除するよう同僚に頼み、それが済めば、それ以上の対応はしない"],"a":[1],"e":"承認されていないサービスへの顧客データの入力は、組織のデータ保護の管理が及ばない場所に、情報を持ち出すことになります。承認されたツールの利用を促し、組織の手順に従って報告することで、影響の確認と再発の防止が可能になります。黙認や利用の拡大は、リスクを広げます。削除を頼むだけでは、すでに起きた影響を把握できません。","w":["顧客データが、承認されていない先に渡っています。",null,"問題を、さらに広げます。","すでに起きた事象を、組織が把握できません。"]},{"d":6,"lv":2,"q":"Claude が提案した新商品の名称とキャッチコピーを、そのまま商品のパッケージに使用しようとしています。使用の前に行うべきこととして最も適切なものはどれですか。","o":["AI が新しく生成したものなので、他者の権利と衝突することはないと判断する","表記を1文字だけ変えて、重複の可能性を避ける","既存の商標や他社の表現と類似していないかを調査し、必要に応じて法務の確認を受ける","Claude に「既存の商標と重複していませんか」と尋ね、問題ないとの回答であれば使用する"],"a":[2],"e":"AI が生成した名称や表現であっても、既存の商標や他社の表現と類似する可能性があります。商用で利用する前に、商標の調査と、必要に応じた法務の確認を行います。Claude への確認は、商標の調査の代わりにはなりません。1文字の変更で、類似の問題が解消されるとは限りません。","w":["生成されたものでも、既存の商標と類似する可能性があります。","類似の商標として、問題になり得ます。",null,"Claude は、商標の登録状況を確実には確認できません。"]},{"d":6,"lv":2,"q":"秘書が、社長名義の全社向けメールを Claude で作成し、社長の確認を経ずに、社長のアカウントから送信しようとしています。最も適切な判断はどれですか。","o":["社長の文体を十分に反映させれば、本人の確認は不要である","下書きの作成に使うことは問題ないが、本人の確認と承認を得てから送信する","名義人以外が関わる文書には、Claude を一切使うべきではない","末尾に「AI が作成しました」と記載すれば、確認なしで送信してよい"],"a":[1],"e":"本人の名義で発信する文書は、作成の方法にかかわらず、本人が内容を確認して承認する必要があります。下書きの作成に Claude を使うこと自体は、適切な利用です。文体が似ていることは、本人の意思を示しません。AI が作成した旨を表示しても、本人が承認していないという問題は解消されません。一切使わないという判断は、過度に制限的です。","w":["文体が似ていても、本人の承認にはなりません。",null,"下書きの作成に使うことは、問題ありません。","本人の承認がないことは、変わりません。"]},{"d":6,"lv":2,"q":"業務部門が、融資の申込みを Claude に審査させ、可否を自動で通知する仕組みを提案しています。最も適切な対応はどれですか。","o":["精度を確認するために、まず本番で1か月運用して結果を見る","否決の場合だけを自動で通知し、可決の場合は人が確認する","審査の基準と例外の扱いを、漏れなく詳しく指示に書き込んでおけば、可否の通知まで自動化して問題ない","個人に重大な影響を与える判断であるため、コンプライアンス部門に相談し、人による判断を組み込む"],"a":[3],"e":"融資の可否のように、個人に重大な影響を与える判断を自動化することは、規制、公平性、説明責任の面で、慎重な検討が必要です。担当部門に相談し、人による判断を組み込みます。基準を詳しく書いても、誤りや偏りは防ぎきれません。否決は、申込者に不利益を与える判断であり、むしろ人の関与が求められます。本番での試行は、実際の申込者に影響を与えます。","w":["実際の申込者を、検証されていない判断にさらします。","最も影響の大きい判断を、自動化することになります。","指示を詳しくしても、判断の責任と誤りのリスクは残ります。",null]},{"d":6,"lv":2,"q":"顧客データを含む資料を Claude で分析する際の、データ最小化の実践として適切なものを2つ選んでください。","o":["念のため、関連しそうなデータをすべて渡す","分析に必要な列や範囲だけを抜き出して渡す","データを渡した後で、Claude に削除を依頼する","機密性の高いデータは、画像に変換してから渡す","氏名や連絡先などの識別情報を、マスキングするか、仮の ID に置き換える"],"a":[1,4],"e":"データ最小化とは、目的に必要な範囲のデータだけを扱うことです。必要な列や範囲に絞ることと、識別情報をマスキングまたは仮の ID に置き換えることが、その実践に当たります。データをすべて渡すことは、最小化に反します。事後の削除の依頼は、管理策になりません。画像に変換しても、情報の内容は変わりません。","w":["最小化とは、反対の行為です。",null,"渡した後では、最小化になりません。","内容は読み取れるため、保護になりません。",null]},{"d":7,"lv":2,"q":"1つのチャットに5件の契約書を添付し、「解約条項はどうなっていますか」と質問したところ、Claude は、意図していた契約書とは別の契約書の条項を回答しました。最も適切な対処はどれですか。","o":["「正しい契約書を参照すること」と指示する","5件の契約書を1つのファイルに結合して、添付し直す","意図した回答が得られるまで、同じ質問を繰り返す","対象の契約書の名前を質問で明示するか、対象の契約書だけを渡して質問する"],"a":[3],"e":"原因は、質問がどの契約書を対象としているのかを、特定していなかったことにあります。対象を明示するか、不要な資料を取り除くことで解決します。「正しい契約書」という指示は、どれが正しいのかを伝えていません。ファイルを結合すると、契約書の境界がさらに分かりにくくなります。質問の繰り返しは、原因に対処していません。","w":["どの契約書が正しいのかが、伝わりません。","区別が、さらにつきにくくなります。","対象が曖昧なままです。",null]},{"d":7,"lv":2,"q":"顧客の導入事例の記事を Claude に依頼したところ、実際には存在しない導入効果の数値が含まれていました。原因の診断と対処として最も適切なものはどれですか。","o":["モデルの性能の問題と考え、上位のモデルで再生成する","事実を渡していなかったために Claude が補ったと考え、実際の数値を提供し、ない情報は書かせない","数値を含む文だけを記事から削除し、残りの部分は事実に基づいているものと見なして、そのまま公開する","文体の問題と考え、控えめな表現にするよう指示する"],"a":[1],"e":"事例の記事には数値が期待されるため、情報が与えられていないと、Claude はもっともらしい内容を補ってしまうことがあります。原因は文脈の不足にあるため、事実を提供し、不明な項目の扱いを指示します。上位のモデルでも、与えられていない事実は分かりません。表現を控えめにしても、創作された内容は残ります。数値の文だけを削除しても、他の創作を見落とすおそれがあります。","w":["事実が与えられていなければ、どのモデルも補って書きます。",null,"ほかの部分にも、補われた内容が含まれている可能性があります。","根拠のない数値であることは、変わりません。"]},{"d":7,"lv":2,"q":"全10章の研修テキストを、一度に Claude に書かせたところ、後半の章が極端に短く、内容も薄くなりました。最も適切な対処はどれですか。","o":["出力が終わるたびに「続けてください」と入力して、最後まで書かせる","「すべての章を同じ詳しさで書くこと」と強調して、もう一度まとめて依頼する","章ごとに分けて依頼し、全体の構成と前の章の要点を引き継ぎながら、順に作成する","章の数を5つに減らして、1章あたりの分量を確保する"],"a":[2],"e":"1回の出力で扱える分量には限りがあるため、長い成果物を一度に求めると、後半が圧縮されがちです。章ごとに分け、全体の構成と前の章の要点を引き継ぐことで、分量と一貫性の両方を確保できます。強調するだけでは、分量の制約は変わりません。「続けて」を繰り返す方法では、章ごとの品質が揃いにくくなります。章を減らすと、必要な内容が失われます。","w":["構成の管理がなく、品質のばらつきは解消しません。","1回の出力の長さには、限りがあります。",null,"必要な内容を、削ることになります。"]},{"d":7,"lv":2,"q":"リサーチ機能に「AI の市場について調べて」と依頼したところ、広く浅い内容のレポートになり、自社の検討（国内の中堅製造業向けの導入支援サービス）には使えませんでした。最も適切な対処はどれですか。","o":["レポートの中から関係しそうな箇所を探し、足りない部分は推測で補う","同じ依頼をもう一度実行して、別の結果を得る","レポートの分量を2倍にするよう依頼する","対象とする地域、業種、期間、知りたい論点を具体的に指定して、依頼し直す"],"a":[3],"e":"調査の結果が的外れになる主な原因は、依頼の範囲が広すぎることです。地域、業種、期間、論点を指定すると、目的に合った情報が集まります。同じ依頼を繰り返しても、範囲は変わりません。分量を増やしても、焦点は定まりません。不足を推測で補うと、根拠のない内容が検討に混ざります。","w":["根拠のない内容が、混ざります。","依頼が曖昧なままでは、同じ結果になります。","広く浅い内容が、増えるだけです。",null]},{"d":7,"lv":2,"q":"確認者が、Claude の下書きに対して、毎回同じ修正（免責文の追加と、社名の表記の統一）を行っています。ワークフローの最適化として最も適切なものはどれですか。","o":["確認者が修正に慣れているので、現在の進め方を続ける","修正が不要になるまで、下書きを生成し直す","下書きを作成する担当者に、必要になる修正の内容を、確認者が毎回、口頭で伝えるようにする","繰り返し発生している修正の内容を、Project の指示やテンプレートに反映する"],"a":[3],"e":"繰り返し発生する修正は、指示やテンプレートの改善点を示しています。その内容を上流の指示に反映すると、下書きの段階で要件が満たされ、確認の負担が減ります。現状の維持や、口頭での伝達は、同じ手間を残します。再生成は、要件を伝えない限り、同じ結果を繰り返します。フィードバックを設定に還元することが、最適化の基本です。","w":["同じ手戻りが、続きます。","指示を変えなければ、同じ修正が必要になります。","毎回の手間がかかり、仕組みになりません。",null]},{"d":7,"lv":2,"q":"Claude の出力が期待に届かないとき、モデルを変更する前に確認すべきことを2つ選んでください。","o":["同じプロンプトを、これまでに何回送信したか","必要な文脈や資料が与えられており、その内容が正しく、最新であるか","プロンプトに、強調の表現が十分に含まれているか","会話を開始してから、どのくらいの時間が経過したか","指示が具体的で、矛盾や抜けがないか"],"a":[1,4],"e":"出力の問題の多くは、指示の不備か、文脈や資料の不足、あるいは誤りに起因します。モデルを変更する前に、この2点を確認することで、原因に合った対処ができます。送信の回数、強調の表現の量、経過時間は、出力の品質の原因ではありません。上位のモデルに変えても、曖昧な指示や不足した情報は補われません。","w":["回数は、品質の原因ではありません。",null,"強調は、具体性の代わりになりません。","経過した時間そのものは、原因ではありません。",null]},{"d":1,"lv":2,"q":"法務部門の担当者が、英文契約書の和訳を Claude に依頼しています。訳文は自然ですが、「indemnify」が箇所によって「補償する」「免責する」「賠償する」と訳し分けられ、社内の定訳とも一致しません。最も効果的な改善策はどれですか。","o":["社内の定訳をまとめた用語の対応表を渡し、それに従うよう指示する","「用語の訳は必ず統一すること」という一文を、プロンプトの冒頭と末尾の両方に書き加える","法律文書の翻訳に強いと思われる最上位のモデルに切り替えて、同じ依頼をやり直す","契約書を条項ごとに別々のチャットで訳させ、あとから訳語を検索して手作業で置き換える"],"a":[0],"e":"訳語が揺れる原因は、どの訳語を使うべきかという情報が Claude に渡っていないことです。統一を求めるだけでは、統一はされても社内の定訳と一致する保証がありません。定訳の対応表という具体的な材料を渡すことで、一貫性と社内基準への適合の両方が得られます。","w":[null,"統一はされても、社内の定訳と一致する保証がありません。","定訳は社内の情報であり、モデルを変えても伝わりません。","チャットを分けると、揺れがさらに大きくなります。"]},{"d":1,"lv":2,"q":"カスタマーサポートの担当者が、製品の不具合に関する苦情への返信を Claude に下書きさせています。出力は毎回、過失を全面的に認めて返金を約束する内容になりますが、会社の方針は「不便へのお詫びはするが、原因は調査中であり、補償は約束しない」です。最も適切な改善策はどれですか。","o":["顧客の苦情の文面を短く要約してから渡し、Claude が感情的な表現に引きずられないようにする","「謝罪しすぎないこと」と指示する","伝えてよいことと、約束してはならないことを方針として明記し、方針に沿った返信の例を1通添える","出力から返金に触れた文を毎回削除し、残りの文面はそのまま利用する運用にする"],"a":[2],"e":"Claude は、会社の方針を知らなければ、一般的に丁寧とされる対応を選びます。「謝罪しすぎない」という否定形の指示は、どこまでが許されるのかを示しません。何を伝え、何を約束しないのかを方針として明示し、手本を添えることで、判断の基準が伝わります。","w":["方針が伝わっていないという原因は、解消しません。","どこまでが許されるのかが、伝わりません。",null,"原因が残り、過失を認める表現も文面に残ります。"]},{"d":1,"lv":2,"q":"社内向けの IT 手順書を Claude に書かせています。「専門用語を使わないでください」と指示しましたが、出力には依然として専門用語が残り、一部は不自然な言い換えになっています。指示の改善として最も効果的なものはどれですか。","o":["出力のあとで、専門用語を1つずつ指摘して修正させる","使ってはならない専門用語を思いつくかぎり列挙し、その一覧を禁止語として渡す","「専門用語は絶対に使わないでください」と、禁止であることをより強い表現で伝える","読み手と望ましい書き方を示す（例：画面の表示名で説明する）"],"a":[3],"e":"「〜しないで」という指示は、代わりに何をすればよいのかを示しません。読み手が誰で、どのような書き方が望ましいのかを肯定形で伝えると、Claude は表現全体をその読み手に合わせて選べます。禁止語の列挙は、漏れが避けられず、不自然な言い換えの原因にもなります。","w":["毎回の手戻りになり、指示は改善されません。","漏れが避けられず、不自然な言い換えの原因にもなります。","強調しても、代わりにどう書くのかは伝わりません。",null]},{"d":1,"lv":2,"q":"総務担当者が、会議の文字起こしから決定事項を抽出させています。出力の形式が毎回異なり、担当者や期限が書かれていないこともあります。週次で同じ作業を繰り返す前提で、最も効果的な改善策はどれですか。","o":["文字起こしを渡す前に、決定事項に関係する発言だけを自分で抜き出しておく","形式がそろうまで再生成を繰り返し、最もよいものを採用する","「決定事項を、漏れなく、分かりやすく、同じ形式で抽出してください」と依頼する","欄を決めた出力例を示し、発言にない項目は「記載なし」と書かせる"],"a":[3],"e":"形式を言葉で求めるだけでは、どの形式なのかが伝わりません。欄の構成を具体的な出力例として示すと、形式が安定します。あわせて、発言にない項目の扱いを決めておくことで、担当者や期限を推測で埋めることを防げます。","w":["抽出の作業を、自分で行うことになります。","指示が変わらない限り、形式は安定しません。","どの形式なのかが、具体的に伝わりません。",null]},{"d":1,"lv":2,"q":"Web アプリの画面に表示されるエラーメッセージの文言を、Claude に改善してもらおうとしています。担当者は、画面の構成やボタンの位置を文章で長く説明しましたが、的外れな提案が返ってきました。次の一手として最も適切なものはどれですか。","o":["画面の説明をさらに詳しく書き足し、ボタンの色や大きさ、配置の座標まで文章で伝える","画面の情報は伝えず、一般的に良いとされるエラーメッセージの例を10個挙げさせる","該当する画面のスクリーンショットを添付し、どの文言を、誰に向けて直したいのかを伝える","同じ説明のまま、提案を複数回生成させる"],"a":[2],"e":"Claude は画像を読み取れるため、画面の様子は、文章で説明するよりもスクリーンショットで渡すほうが正確に伝わります。そのうえで、対象の文言と読み手を指定すれば、文脈に合った提案が得られます。文章の説明を増やしても、伝わりにくさは解消しません。","w":["文章では伝わりにくいという問題が、解消しません。","自社の画面の文脈に合わない提案になります。",null,"入力が同じであれば、的外れな提案が続きます。"]},{"d":1,"lv":2,"q":"採用担当者が、求人票の下書きを Claude に依頼します。求人票には、必須の記載事項（雇用形態、勤務地、給与の範囲など）が8項目あります。記載漏れを減らす依頼の仕方として最も効果的なものはどれですか。","o":["過去の求人票を1通だけ手本として渡し、同じように書くよう依頼する","求人票を2回生成させ、2つを見比べて、項目の多いほうを採用する","8項目の一覧を渡し、作成後に照合して不足を報告させる","「漏れのないように注意して書いてください」と依頼する"],"a":[2],"e":"必須の項目が決まっているのであれば、それを一覧として渡し、作成後に照合させるのが確実です。「注意して」という依頼では、何が必須なのかが伝わりません。手本が1通だけの場合、その手本に含まれていない項目は漏れます。なお、最
