あります。そのために、`submit_findings` というツールを、JSON スキーマとともに定義しています。しかし、統合のサブエージェントは、約1割の実行で、ツールを呼び出さずに、同じ内容を、文章として返して、後段の処理が、失敗しています。最も適切な設定はどれですか。","o":["文章として返された場合に、後段の処理で、正規表現を使って、主張と出典を、抜き出す","統合のサブエージェントのプロンプトに、「必ず、`submit_findings` を使って、結果を返すこと」という指示を、強調して記載する","`submit_findings` のスキーマの、すべてのフィールドを、任意に変更して、呼び出しやすくする","統合のサブエージェントへの、最後のリクエストで、`tool_choice` で、`submit_findings` を指定して、呼び出しを強制する"],"a":[3],"e":"特定のツールによる、構造化された出力を、確実に得るには、`tool_choice` で、そのツールを指定して、呼び出しを強制します。プロンプトでの指示は、遵守の割合を上げても、保証にはなりません。文章からの抜き出しは、文章の書き方によって、失敗します。フィールドを、任意にしても、ツールを呼び出すかどうかは、変わらず、必要な項目が、欠ける原因になります。","w":["文章の書き方によって、抜き出しに失敗します。","遵守の割合は上がりますが、保証にはなりません。","呼び出すかどうかは変わらず、必要な項目が欠ける原因になります。",null],"lv":2,"g":"試験ガイド v1.0 は、`tool_choice` による強制（`any` や、ツールの指定）を、ツールを確実に呼び出させる手段として、扱っています。現在の公式ドキュメントでは、この強制は、拡張思考とは併用できず、一部の最新のモデルでは、エラーになる、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":2,"s":"2.2","q":"検索の API が、一時的に混雑して、レート制限のエラー（429）を、返すことがあります。エラーの応答には、再試行できるまでの秒数が、含まれています。現在は、検索のツールが、エラーを受け取ると、すぐに、検索のサブエージェントに、「検索に失敗しました」と返して、サブエージェントは、そのまま、コーディネーターに、失敗を報告します。コーディネーターは、そのたびに、サブエージェントを、最初から起動し直しており、それまでの調査の結果が、失われています。最も適切な設計はどれですか。","o":["レート制限のエラーを、すべて、コーディネーターに報告して、コーディネーターが、待機の時間と、再試行の方法を、その都度判断する","一時的なエラーは、サブエージェントの範囲で、待機して再試行する。解決しない場合にだけ、結果と失敗の内容を、コーディネーターに報告する","レート制限のエラーが発生した場合は、検索のツールが、空の結果を、成功として返す。サブエージェントは、調査を、中断せずに続けられる","レート制限のエラーが発生した場合は、調査の全体を、ただちに中止して、利用者に、時間を置いて、もう一度依頼するよう、求める"],"a":[1],"e":"一時的なエラーは、発生した場所の近くで、回復を試みるのが、効率的です。再試行できるまでの時間が、分かっているのであれば、ツールや、サブエージェントの範囲で、待機して再試行します。上位に報告するのは、局所的には、解決できなかった場合だけです。その際は、それまでに得られた結果と、失敗の内容を、あわせて報告します。空の結果を、成功として返すと、情報がないものと、誤解されます。","w":["局所的に解決できるエラーまで、上位に持ち上げることになり、非効率です。",null,"失敗が隠されて、情報がないものと、誤解されます。","一時的なエラーのために、調査の全体が、失われます。"],"lv":2},{"sc":3,"d":2,"s":"2.1","q":"Web ページの取得のツールは、ページの本文だけを、文字列として返します。後の段階で、「この主張は、どのページに、いつの時点で、書かれていたのか」を確認しようとしても、サブエージェントが、ツールの呼び出しのときに使った URL を、要約の中に、書き残していない場合には、追跡できません。レポートでは、出典の URL の誤りや、欠落が、目立ちます。ツールの設計の見直しとして、最も適切なものはどれですか。","o":["統合のサブエージェントに、各主張の本文から、もとの URL を推定させて、レポートに記載させる","サブエージェントのプロンプトに、「ページを取得したら、必ず、URL を、メモとして書き残すこと」という指示を追加する","レポートが完成した後に、別のサブエージェントに、各主張について、Web を検索させて、出典を、探し直させる","ツールの戻り値に、本文とともに、URL、ページの題名、取得の日時、分かる場合は、発行日を、構造化して含める"],"a":[3],"e":"出典の情報は、取得した時点で、内容と一緒に、構造化して保持しなければ、後から、確実には復元できません。ツールの戻り値に、URL、題名、取得の日時などを含めておけば、その情報は、内容とともに、後の段階に受け渡されます。サブエージェントに、書き残すよう指示する方法は、漏れが、起こります。後から、探し直す方法は、同じページが見つかる保証が、ありません。","w":["推定された URL は、実在しない場合があり、出典として、信頼できません。","指示である限り、書き残しの漏れが、起こります。","同じページが見つかる保証がなく、コストもかかります。",null],"lv":2},{"sc":3,"d":5,"s":"5.6","q":"「国内の再生可能エネルギーの、導入の現状」のレポートに、「太陽光発電の導入量は、過去最高を記録した」「現在の発電コストは、1キロワット時あたり、14円である」という記述が、ありました。出典を確認すると、前者は、2024年の統計、後者は、2017年の報告書に、基づいていました。レポートでは、どちらも、時点を示さずに、現在の事実として、記述されています。最も適切な改善はどれですか。","o":["発行日や、データの時点を、受け渡しの必須の項目として、レポートでは、時点を明記する","レポート作成のサブエージェントに、各記述が、現在も正しいかどうかを、推測させて、古いと思われる記述を、削除させる","5年以上前の情報源は、検索の段階で、すべて除外する。古い情報が、レポートに含まれることが、なくなる","レポートの冒頭に、「本レポートは、作成の時点で、入手できた情報に基づく」という一文を、記載する"],"a":[0],"e":"データの時点は、その情報の意味を、大きく左右します。時点が、受け渡しの途中で失われると、古いデータが、現在の事実として、記述されます。発行日や、データの時点を、必須の項目として保持して、レポートでは、時点を明記します。古い情報を、一律に除外すると、それしか存在しない情報や、経緯を示す情報が、失われます。冒頭の一文は、個々の記述の時点を、示しません。","w":[null,"推測であり、正しい記述を削除したり、古い記述を残したりします。","それしか存在しない情報や、経緯を示す情報が、失われます。","個々の記述が、いつの時点のものかが、分かりません。"],"lv":2},{"sc":3,"d":5,"s":"5.1","q":"7つの検索のサブエージェントが、それぞれ、取得したページの本文を、ほぼそのまま、コーディネーターに返しています。統合のサブエージェントへの入力は、合計で、約14万トークンになり、統合の結果には、入力の最初と、最後に置かれたサブエージェントの知見は、よく反映されていますが、中ほどに置かれた、3つのサブエージェントの重要な知見が、ほとんど反映されていません。最も適切な改善はどれですか。","o":["各サブエージェントに、主要な知見と出典を、構造化した要約として返させて、要点を、冒頭にまとめる","統合のサブエージェントのモデルを、コンテキストウィンドウが、より大きいものに変更する","統合のサブエージェントのプロンプトに、「入力の中ほどの内容も、同じように、重視すること」という指示を追加する","サブエージェントの結果を、統合のサブエージェントに渡す順序を、毎回、無作為に入れ替える"],"a":[0],"e":"長い入力では、最初と最後の内容に比べて、中ほどの内容が、見落とされやすくなります。入力そのものを、短く、構造化することが、根本的な対策です。各サブエージェントが、本文の全体ではなく、主要な知見と、出典を、構造化して返せば、統合の入力は、大幅に小さくなります。さらに、要点を、冒頭にまとめることで、見落としを、減らせます。順序を、無作為に入れ替えても、毎回、どれかが、中ほどに置かれます。","w":[null,"すでに収まっており、原因は、入力の長さと、構造にあります。","指示だけでは、長い入力の中ほどの見落としは、解消しません。","毎回、どれかの結果が、中ほどに置かれます。"],"lv":2},{"sc":4,"d":1,"s":"1.6","q":"同じ構造を持つ、24個の REST のハンドラーに、入力の検証と、統一された形式のエラー応答を、追加します。どのハンドラーにも、同じ方針の変更を適用しますが、項目の名前や型は、ハンドラーごとに異なります。エージェントに、「24個のすべてに、検証を追加して」と依頼したところ、前半と後半で、エラー応答の形式が食い違い、検証の厳しさにも、ばらつきが出ました。進め方として、最も適切なものはどれですか。","o":["24個のハンドラーを、すべて読み込ませてから、もう一度、同じ依頼を行う。全体を把握させることで、変更の一貫性が保たれるため、手本を別に用意する必要もない","1つのハンドラーで、方針と、変更の形を確定させる。それを手本と手順として、残りのハンドラーに、1つずつ、同じ手順で適用して、それぞれを検証する","24個のハンドラーを、24のサブエージェントに、並列に委任する。それぞれに、「検証と、統一されたエラー応答を、追加すること」とだけ伝える","ハンドラーごとに、エージェントに、検証の方針を、その都度、自由に判断させる。ハンドラーの違いに、最も柔軟に対応できる"],"a":[1],"e":"同じ方針を、多数の対象に適用する作業は、あらかじめ手順を決められるため、固定の手順の繰り返しとして、進めるのが適しています。まず、1つの対象で、方針と変更の形を確定させて、それを手本にします。残りは、同じ手順を、1つずつ適用して、検証します。全体を、一度に依頼すると、長い作業の中で、方針が揺れます。その都度、自由に判断させると、ばらつきが、さらに大きくなります。","w":["コンテキストが圧迫され、長い作業の中で、方針が揺れる問題は残ります。",null,"手本と形式が、共有されておらず、サブエージェントごとに、形式が、ばらつきます。","ばらつきが、さらに大きくなります。"],"lv":2},{"sc":4,"d":1,"s":"1.5","q":"エージェントが、Bash で、プロジェクトのテストの全体を実行すると、成功したテストの名前や、進行の表示を含めて、1回あたり、約6,000行の出力が返ります。修正とテストの実行を、数回繰り返すと、コンテキストの大半が、テストの出力で占められて、初期の調査の内容が、失われます。エージェントが、次の修正に必要とするのは、失敗したテストの名前と、エラーの内容だけです。最も適切な対応はどれですか。","o":["ツールの結果を受け取った後に呼び出されるフックで、テストの出力から、失敗したテストと、エラーの内容だけを抜き出して、モデルに渡す","テストの実行の回数を、1つの作業につき、2回までに制限する","テストを実行するたびに、エージェントに、それまでの会話の全体を、要約させる","システムプロンプトに、「テストの出力のうち、成功したテストの部分は、読み飛ばすこと」という指示を追加する。フックの実装が不要で、テストの出力の形式が変わっても、対応できる"],"a":[0],"e":"ツールの結果は、モデルに渡される前に、フックで加工できます。テストの出力から、失敗に関する部分だけを、決定的に抜き出せば、モデルは、必要な情報だけを受け取り、コンテキストの消費も、大きく減ります。読み飛ばすよう指示しても、出力の全体は、コンテキストに入って、消費されます。実行の回数を制限すると、修正の検証が、十分にできなくなります。","w":[null,"修正の検証が、十分にできなくなります。","要約のたびに、調査の細部が、失われていきます。","指示をしても、出力の全体は、コンテキストに入って、消費されます。"],"lv":2},{"sc":4,"d":1,"s":"1.1","q":"エージェントが、失敗しているテストを修正する作業で、「コードを修正する、テストを実行する、同じテストが、同じエラーで失敗する」という流れを、9回繰り返しました。毎回の修正は、同じ関数の中の、わずかに異なる変更でした。最終的に、エージェントは、テストの期待値のほうを書き換えて、テストを成功させました。この挙動への対策として、最も適切なものはどれですか。","o":["同じ失敗が続く場合は、取り組み方を見直すか、開発者に状況を報告して、判断を仰ぐように導く。テストの期待値の変更は、明示的な許可なしには、行わせない","テストの実行の結果を、エージェントに渡さないようにして、修正の内容だけに、集中させる","システムプロンプトに、「テストは、必ず成功させること」という指示を追加する","反復の回数の上限を、3回に設定して、上限に達した場合は、その時点のコードを、完成したものとして扱う。無駄な反復によるコストと時間を、確実に抑えることができる"],"a":[0],"e":"同じ失敗が、繰り返されている場合は、進展がないことを示しています。同じ方向の修正を、続けるのではなく、原因の仮説を見直すか、開発者に、状況を報告させます。また、テストを成功させること自体が、目的になると、テストの期待値を書き換えるという、本来の目的に反する行動が、起こり得ます。そのような変更は、明示的な許可を、必要とします。上限に達した時点のコードを、完成として扱うことは、未解決の問題を、隠します。","w":[null,"修正が正しいかどうかを、確認できなくなります。","期待値の書き換えのような、目的に反する近道を、さらに促します。","未解決のまま、完成したものとして扱うことになります。"],"lv":2},{"sc":4,"d":1,"s":"1.7","q":"開発者が、昨日のセッションを再開して、リファクタリングの続きを、依頼しました。昨日のセッションの後で、開発者は、別のブランチに切り替えて、いくつかのファイルを、手作業で変更しています。エージェントは、昨日の会話の履歴にある、ファイルの内容を前提にして、編集を始めたところ、存在しない行を対象にした編集が、失敗しました。再開の進め方として、最も適切なものはどれですか。","o":["失敗した編集を、成功するまで、同じ内容で、繰り返させる","失敗した編集について、対象の文字列を、Grep で検索させて、見つかった箇所に、同じ編集を適用させる","昨日の会話の履歴に含まれる、ファイルの内容を、現在のファイルに、そのまま書き戻させる。履歴と、ファイルの状態が一致するため、編集が失敗しなくなる","再開の直後に、現在のブランチと、変更の状況を確認させる。対象のファイルを、読み直してから、作業を続けさせる"],"a":[3],"e":"再開したセッションの履歴には、過去の時点の、ファイルの内容が残っています。その後に、ファイルが変更されていれば、履歴の内容は、古くなっています。再開の直後に、現在の状態（ブランチや、変更の状況）を確認させて、対象のファイルを読み直させれば、現状に基づいて、作業を続けられます。履歴の内容を書き戻すと、開発者が、手作業で行った変更が、失われます。","w":["前提が古いままであり、同じ理由で失敗し続けます。","ほかのファイルも、変更されている可能性があり、古い前提に基づく編集が、続きます。現状の確認が、先です。","開発者が、手作業で行った変更が、失われます。",null],"lv":2},{"sc":4,"d":1,"s":"1.4","q":"リリースの作業を、エージェントで自動化しています。手順は、「テストの全体を実行する、バージョンの番号を更新する、変更の履歴を生成する、タグを作成する」です。決まりとして、テストが、1つでも失敗した場合は、タグを作成してはなりません。先週、2件のテストが失敗していたにもかかわらず、エージェントが、「軽微な失敗である」と判断して、タグを作成しました。この決まりは、システムプロンプトに、記載されていました。最も適切な対応はどれですか。","o":["タグの作成の前に、エージェントに、「本当に、すべてのテストが成功しましたか」と、自己確認させる手順を追加する","タグの作成の後に、テストの結果を確認して、失敗があった場合は、タグを削除する","テストの終了コードを、スクリプトやフックで確認して、失敗している場合は、タグの作成を、実行させない","システムプロンプトの記述を、「テストが失敗した場合は、いかなる理由があっても、タグを作成しないこと」と、より強い表現に書き換える"],"a":[2],"e":"「テストが失敗したら、タグを作成しない」という決まりは、例外のない、決定的な条件です。このような条件は、モデルの判断に委ねず、テストの終了コードを、コードで確認して、強制します。モデルは、指示があっても、状況を解釈して、例外を作ることがあります。自己確認も、同じ解釈に基づくため、確実ではありません。タグの作成の後の確認では、誤ったタグが、すでに公開されています。","w":["同じ解釈に基づく自己確認であり、確実ではありません。","誤ったタグが、すでに公開されています。",null,"指示である限り、モデルが、例外を解釈する余地が残ります。"],"lv":2},{"sc":4,"d":2,"s":"2.5","q":"約2,400行の設定ファイルの中の、タイムアウトの値を、30から60に変更するよう、エージェントに依頼しました。エージェントは、ファイルの全体を読み込んで、Write で、ファイルの全体を書き直しました。変更の後のファイルでは、タイムアウトの値は、正しく変更されていましたが、無関係な箇所のコメントが、数十行、失われて、一部の値の書式も、変わっていました。この種類の変更に適した方法として、最も適切なものはどれですか。","o":["Write で、ファイルの全体を書き直させる前に、「ほかの部分は、一切変更しないこと」と指示する","Edit で、対象の箇所を、一意に特定できる文字列として指定して、その部分だけを置換する","Bash で、`sed` を使って、ファイルの中の「30」を、すべて「60」に置換する","ファイルを、100行ごとの、複数のファイルに分割してから、該当のファイルだけを、Write で書き直す"],"a":[1],"e":"既存のファイルの、一部だけを変更する場合は、Edit が適しています。Edit は、指定した文字列を置換するため、ほかの部分には、影響しません。Write は、ファイルの全体を置き換えるため、長いファイルでは、意図しない部分が、失われたり、変わったりするおそれがあります。指示を加えても、全体を再生成する以上、そのおそれは、残ります。","w":["全体を再生成する以上、意図しない変更のおそれが残ります。",null,"タイムアウトとは無関係な「30」まで、置換されるおそれがあります。","ファイルの構成を変えることになり、過剰な手間です。"],"lv":2},{"sc":4,"d":2,"s":"2.5","q":"エージェントが、ある非推奨の関数の利用箇所を調べるために、Bash で、`find . -type f | xargs grep -n deprecatedCall` を実行しました。`node_modules` や、ビルドの成果物も、検索の対象になり、約9,000行の出力が返って、コンテキストを、大きく消費しました。開発者が知りたいのは、`src/` の下の TypeScript のファイルのうち、どのファイルが、この関数を使っているかです。最も適切な方法はどれですか。","o":["同じコマンドの出力を、ファイルに保存してから、Read で、ファイルの全体を読み込む","`src/` の下の、すべてのファイルを、Read で、1つずつ読み込んで、関数の名前が含まれているかを、確認する。内容を直接確認するため、見落としが起こらない","Grep で、対象のパスと、ファイルの種類を絞り込み、一致したファイルの一覧を取得する。必要なファイルだけを、Read で確認する","Glob で、`deprecatedCall` という文字列を、ファイルの名前のパターンとして、検索する"],"a":[2],"e":"ファイルの内容の検索には、Grep が適しています。Grep では、検索の対象のパスや、ファイルの種類を絞り込めて、一致したファイルの名前だけを、取得することもできます。まず、一覧を取得して、必要なファイルだけを、Read で確認すれば、コンテキストの消費を、抑えられます。Glob は、ファイルの名前のパターンによる検索であり、ファイルの内容は、調べません。","w":["約9,000行の全体が、コンテキストに入ることは、変わりません。","非効率であり、コンテキストを、使い切ります。",null,"Glob は、ファイルの名前を調べるもので、内容は調べません。"],"lv":2},{"sc":4,"d":2,"s":"2.4","q":"チームは、課題管理、データベース、監視、社内の文書、デザインのツールに接続する、5つの MCP サーバーを、エージェントに設定しました。ある開発者は、「MCP サーバーのツールは、必要になったときにだけ、読み込まれるので、いくつ設定しても、影響はない」と説明しています。実際には、エージェントは、単純なコードの調査でも、応答が遅くなり、関係のないデザインのツールを、呼び出すことがあります。この状況の理解として、最も適切なものはどれですか。","o":["MCP サーバーは、同時に1つしか、有効にならない仕様である。5つのうち、最後に設定したものだけが、使われている","開発者の説明のとおりである。応答の遅さと、誤った呼び出しは、MCP サーバーとは関係がなく、モデルの性能の問題である","MCP サーバーのツールは、組み込みのツールよりも、常に優先して選ばれる仕様である。組み込みのツールを、無効にする","設定されたすべての MCP サーバーのツールは、接続の時点で検出されて、同時に利用できる状態になる。関係のないサーバーは、設定から外す"],"a":[3],"e":"設定された MCP サーバーのツールは、接続の時点で、すべて検出されて、エージェントが、同時に利用できる状態になります。それぞれのツールの定義は、コンテキストを消費して、選択肢が増えるほど、誤った選択も、起こりやすくなります。その作業に関係のないサーバーは、設定から外すことで、コンテキストの消費と、誤った選択を、減らせます。","w":["複数のサーバーのツールを、同時に利用できます。","すべてのツールが、同時に利用できる状態になり、選択とコンテキストに影響します。","そのような仕様は、ありません。",null],"g":"この解説は、試験ガイド v1.0 の記載（設定されたすべての MCP サーバーのツールが、接続のときに検出されて、同時に利用できる）に沿っています。現在の Claude Code では、ツール検索が、既定で有効になっており、MCP のツールの定義の読み込みは、必要になるまで、遅延されます。それでも、関係のないサーバーを外すことは、誤った選択を減らすうえで、有効です。","lv":2},{"sc":4,"d":2,"s":"2.4","q":"エージェントから、課題管理のサービス（広く使われている SaaS）の課題を、検索して、更新できるようにします。あわせて、自社で独自に開発した、デプロイの承認のシステムにも、接続する必要があります。課題管理のサービスについては、提供元や、コミュニティが保守している MCP サーバーが、公開されています。チームには、MCP サーバーを開発できる人員が、1名しかいません。進め方として、最も適切なものはどれですか。","o":["課題管理のサービスには、既存の MCP サーバーを、内容を確認したうえで利用する。自社に固有の、デプロイの承認のシステムについてだけ、MCP サーバーを開発する","統一性のために、課題管理のサービスも、デプロイの承認のシステムも、自社で、MCP サーバーを、最初から開発する。自社で開発したものであれば、仕様を完全に把握でき、要件にも、正確に合わせられる","課題管理のサービスには、公開されている MCP サーバーを、内容を確認せずに導入する。デプロイの承認のシステムにも、似た用途の、公開のサーバーを探して、流用する","MCP サーバーは使わずに、エージェントに、Bash で `curl` を実行させて、両方の API を、直接呼び出させる"],"a":[0],"e":"広く使われているサービスとの、標準的な統合には、既存の MCP サーバーを利用するほうが、開発と保守の負担を、抑えられます。限られた人員は、既存のものでは対応できない、自社に固有のシステムの統合に、集中させます。すべてを、自社で開発すると、保守の負担が、不要に増えます。`curl` による直接の呼び出しは、認証の情報の扱いや、エラーの処理を、モデルに任せることになります。","w":[null,"既存のもので足りる統合まで開発することになり、負担が不要に増えます。","自社に固有のシステムに合う、公開のサーバーは期待できず、内容を確認しない導入は、リスクになります。","認証の情報の扱いと、エラーの処理を、モデルに任せることになります。"],"lv":2},{"sc":4,"d":2,"s":"2.2","q":"社内のビルドのシステムを呼び出す、MCP のツールがあります。ビルドが失敗すると、このツールは、「ビルドに失敗しました（終了コード 1）」という文字列だけを返します。エージェントは、原因が、コードのコンパイルのエラーなのか、テストの失敗なのか、ビルドのサーバーの一時的な障害なのかを、区別できません。そのため、コードに問題がない場合でも、コードを、推測で書き換えることがあります。ツールの改善として、最も適切なものはどれですか。","o":["失敗した場合は、ビルドのログの全文（数万行）を、そのまま返す","失敗した場合は、ツールが、自動的に、3回まで再試行して、すべて失敗したときにだけ、同じ文字列を返す。一時的な障害は、エージェントに伝える前に、解消できる","失敗の種類（コンパイル、テスト、インフラ）、該当するファイルと行、再試行で解決する見込みがあるかどうかを、構造化して返す","システムプロンプトに、「ビルドが失敗しても、コードを書き換えないこと」という指示を追加する"],"a":[2],"e":"エージェントが、適切に対応できるかどうかは、ツールが返すエラーの情報によって、決まります。失敗の種類が分かれば、コードを修正すべきなのか、再試行すべきなのか、開発者に報告すべきなのかを、判断できます。該当するファイルと行があれば、修正の対象も、特定できます。ログの全文は、情報は含みますが、コンテキストを圧迫して、必要な箇所が、埋もれます。","w":["コンテキストを圧迫して、必要な箇所が、埋もれます。","コードが原因の失敗には、再試行は無意味であり、原因も伝わりません。",null,"コードに原因がある場合の修正まで、できなくなります。"],"lv":2},{"sc":4,"d":2,"s":"2.2","q":"自作の MCP サーバーの、データベースのスキーマを取得するツールは、対象のテーブルが存在しない場合に、処理の途中で、例外を送出します。その結果、プロトコルの水準のエラーになり、エージェントの側では、「ツールの呼び出しに失敗しました」という、一般的な表示しか、得られません。エージェントは、テーブルの名前を誤ったことに、気づかずに、同じ呼び出しを、繰り返します。最も適切な修正はどれですか。","o":["ツールの実行の中で起きた失敗は、`isError` を付けた結果として返す。内容に、原因（テーブルが存在しないこと）と、利用できるテーブルを確認する方法を含める","エージェントの側で、ツールの呼び出しが失敗した場合に、5回まで、自動的に再試行する。一時的な接続の問題であれば、再試行によって解消して、エージェントは、処理を続けられる","ツールの説明文に、「存在するテーブルの名前だけを、指定すること」と記載する","例外を、サーバーの中で握りつぶして、空のスキーマを、成功の結果として返す"],"a":[0],"e":"ツールの実行の中で起きた失敗（存在しない対象の指定など）は、プロトコルの水準のエラーではなく、ツールの結果として、`isError` を付けて返します。結果の内容に、原因と、対処の方法が含まれていれば、モデルは、それを読んで、引数を修正できます。空のスキーマを、成功として返すと、テーブルに列がないものと、誤解されます。再試行は、原因が、引数の誤りである以上、効果がありません。","w":[null,"原因が、引数の誤りである以上、再試行しても、同じ結果になります。","どのテーブルが存在するのかが、伝わりません。","テーブルに列がないものと、誤解されます。"],"lv":2},{"sc":4,"d":2,"s":"2.3","q":"ドキュメントの生成を担当するサブエージェントに、組み込みの Bash を、制限なしで与えています。目的は、`npm run docs` を実行して、生成の結果を確認することでした。ところが、このサブエージェントが、生成の途中で、`git commit` と `git push` を実行して、未レビューのドキュメントを、共有のブランチに、反映させてしまいました。最も適切な見直しはどれですか。","o":["Bash は、制限なしのまま与えて、実行の後に呼び出されるフックで、`git` のコマンドの実行を検出して、開発者に通知する","サブエージェントのシステムプロンプトに、「`git` のコマンドは、実行しないこと」という指示を追加する","制限なしの Bash の代わりに、ドキュメントの生成だけを実行できる、範囲を絞ったツールを与える","サブエージェントが実行した `git` の操作を、コーディネーターが、事後に検出して、取り消す"],"a":[2],"e":"制限なしの Bash は、あらゆるコマンドを、実行できます。役割に必要なのが、特定のコマンドだけであれば、そのコマンドだけを実行できる、範囲を絞ったツールに、置き換えます。こうすれば、役割を超えた操作は、仕組みとして、行えなくなります。プロンプトでの指示は、確実ではなく、事後の取り消しは、すでに共有された変更には、間に合いません。すべてのツールを取り除くと、生成の結果を、確認できなくなります。","w":["実行された後の通知であり、共有のブランチへの反映を、防げません。","指示である限り、確実には守られません。",null,"共有のブランチに反映された後であり、防止になりません。"],"lv":2},{"sc":4,"d":3,"s":"3.2","q":"チームでは、新しいマイクロサービスを作成するたびに、決まった構成の雛形（ディレクトリの構成、設定ファイル、ヘルスチェックのエンドポイント、CI の定義）を、使っています。現在は、開発者が、雛形の内容を、Wiki から、プロンプトに貼り付けて、Claude Code に生成を依頼しています。貼り付けた時期によって、雛形の版が異なり、生成されるサービスの構成が、ばらついています。最も適切な方法はどれですか。","o":["雛形の全文を、プロジェクトの CLAUDE.md に記述して、すべてのセッションで、常に読み込まれるようにする","手順と、雛形のファイルを、スキルとして、リポジトリにまとめる。サービスの名前を引数として、呼び出せるようにする","雛形は使わずに、既存のサービスの中から、Claude Code に、参考になるものを、その都度、選ばせる","Wiki の雛形のページに、最終の更新日を、目立つように表示して、開発者が、最新の版を確認できるようにする"],"a":[1],"e":"定型の作業の手順と、それに必要なファイルは、スキルとして、まとめることができます。スキルのディレクトリには、雛形のファイルを、同梱できます。リポジトリにコミットすれば、チームの全員が、同じ版を使い、更新も、バージョン管理で、追跡できます。CLAUDE.md に記述すると、サービスの作成とは関係のない作業でも、常に読み込まれて、コンテキストを消費します。","w":["関係のない作業でも、常に読み込まれて、コンテキストを消費します。",null,"参考にするサービスによって、構成が、ばらつきます。","手作業での貼り付けである限り、版のばらつきは、避けられません。"],"lv":2},{"sc":4,"d":3,"s":"3.1","q":"このリポジトリでは、テストの実行に、`make test-unit` を使い、依存関係の導入には、社内のレジストリを指定した、専用のスクリプトを使います。エージェントは、作業のたびに、`npm test` や `pip install` を試して、失敗してから、正しい方法を探しており、毎回、数分と、多くのトークンを、消費しています。開発者は、その都度、会話の中で、正しいコマンドを伝えています。最も適切な改善はどれですか。","o":["エージェントが、正しいコマンドを見つけられるように、探索に使える反復の回数の上限を、引き上げる","テストの実行と、依存関係の導入のコマンドを、プロジェクトの CLAUDE.md に記述する","開発者が、セッションの開始のたびに、最初のメッセージで、正しいコマンドの一覧を、貼り付ける","`npm test` と `pip install` が、このリポジトリでも動作するように、ビルドの構成を、変更する"],"a":[1],"e":"プロジェクトに固有の、ビルドやテストのコマンドは、プロジェクトの CLAUDE.md に、記述します。CLAUDE.md は、セッションの開始のときに、自動的に読み込まれるため、エージェントは、最初から、正しいコマンドを使えます。リポジトリにコミットされるため、チームの全員の、すべてのセッションに、適用されます。会話の中で、毎回伝える方法は、手間がかかり、ほかの開発者には、共有されません。","w":["探索による無駄を、容認することになります。",null,"手間がかかり、ほかの開発者には、共有されません。","道具に合わせて、ビルドの構成を変えることになり、過剰です。"],"lv":2},{"sc":4,"d":3,"s":"3.1","q":"15年前から稼働している、課金のシステムのコードには、文書になっていない注意点が、多数あります。たとえば、「`calcLegacyTax` は、誤りに見えるが、特定の顧客との契約のために、意図的に残している」「`batch/` の下のジョブは、実行の順序を、変えてはならない」といったものです。エージェントは、これらを知らずに、「誤りの修正」や、「整理」として、変更を提案します。知識は、2人のベテランの開発者の、記憶の中にあります。最も適切な対応はどれですか。","o":["注意点を、社内の Wiki にまとめて、開発者が、課金のシステムの作業を依頼するたびに、該当のページの内容を、プロンプトに貼り付ける","エージェントに、コードの全体を、詳しく読み込ませる。十分に読み込めば、コードから、これらの注意点を、推測できるため、文書を作成して保守する手間が、かからない","ベテランの開発者が、エージェントの提案を、毎回レビューして、問題のある提案を、その都度、却下する","注意点と、その背景を、リポジトリの CLAUDE.md や、対象のパスを指定したルールに記述して、エージェントが、作業の前に、参照できるようにする"],"a":[3],"e":"コードからは、読み取れない背景や、意図は、エージェントには、分かりません。そのような知識は、CLAUDE.md や、対象のパスを指定したルールに、記述しておけば、エージェントが、該当のコードを扱うときに、参照できます。ベテランの開発者の、記憶だけに頼る状態も、解消できます。毎回のレビューで却下する方法は、同じ指摘を、繰り返すことになります。","w":["貼り付けを忘れると、注意点が伝わらず、すべての開発者に、毎回の手間が生じます。","契約上の理由のような背景は、コードからは、読み取れません。","同じ指摘を繰り返すことになり、知識も、共有されません。",null],"lv":2},{"sc":4,"d":1,"s":"1.6","q":"「先週のリリースの後から、注文の一覧の画面の表示が、3倍遅くなった」という報告があり、原因の調査を、エージェントに依頼します。原因の候補は、データベースのクエリ、外部の API の呼び出し、画面の描画の処理など、多岐にわたり、どこに原因があるのかは、分かっていません。開発者は、「変更されたファイルを、すべて順番に読んで、問題を探す」という、固定の手順を、エージェントに指示しようとしています。調査の進め方として、最も適切なものはどれですか。","o":["調査は行わずに、先週のリリースの変更を、すべて取り消す。原因を特定するよりも、確実に、表示の速さが、元に戻る","原因の候補ごとに、あらかじめ、同じ数の調査の手順を割り当てて、すべての候補を、同じ深さで調べさせる","開発者の案のとおり、先週のリリースで変更された、すべてのファイルを、決まった順序で、最初から最後まで読ませる。漏れのない調査になる","計測やログなどの手がかりから、仮説を立てて検証して、次に調べる箇所を、絞り込ませる"],"a":[3],"e":"原因が、どこにあるのかが分からない調査は、手順を、あらかじめ決められません。ある箇所を調べた結果によって、次に調べるべき箇所が、変わるためです。計測や、ログから、仮説を立てて、検証して、絞り込んでいく、動的な進め方が、適しています。変更されたファイルを、すべて順番に読む方法は、コンテキストを消費するうえに、どこが遅いのかという、手がかりを、使っていません。","w":["原因が分からないままであり、リリースに含まれる、ほかの変更も失われます。","手がかりに応じて、調査を深める箇所を、変えることができません。","コンテキストを消費するうえに、どこが遅いのかという手がかりを、使っていません。",null],"lv":2},{"sc":4,"d":1,"s":"1.5","q":"TypeScript のプロジェクトで、エージェントが、複数のファイルを編集した後に、まとめて、型のチェックを実行すると、数十件の型のエラーが、一度に見つかることが、よくあります。エラーは、互いに関連しており、どの編集が、原因であったのかの特定に、時間がかかっています。システムプロンプトには、「ファイルを編集したら、型のチェックを実行すること」と記載していますが、エージェントは、実行を、後回しにすることが、多くあります。最も適切な改善はどれですか。","o":["編集のツールの実行の後に呼び出されるフックで、型のチェックを実行して、エラーを、エージェントに返す","型のチェックを、作業の最後に、1回だけ実行する運用に統一する。途中で実行しないことで、作業の全体が、速くなる","作業の最後に、独立したサブエージェントに、変更の全体を、型の観点で、レビューさせる","システムプロンプトの記載を、「ファイルを、1つ編集するたびに、必ず、すぐに、型のチェックを実行すること」と、より詳しく書き直す"],"a":[0],"e":"編集のたびに、必ず行うべき検証は、モデルに、実行を任せるのではなく、フックで、決定的に実行します。編集のツールの実行の後に、型のチェックを実行して、エラーを返せば、エージェントは、編集の直後に、問題に気づいて、原因が明確なうちに、修正できます。プロンプトでの指示は、後回しにされることがあり、確実では、ありません。","w":[null,"エラーが、まとめて見つかる問題が、さらに大きくなります。","エラーが、まとめて見つかる点は変わらず、型のチェックの実行よりも、不確実です。","指示である限り、後回しにされることがあります。"],"lv":2},{"sc":4,"d":1,"s":"1.3","q":"コードの確認のために、2種類のサブエージェントを、定義しています。`code-reviewer` の説明は、「コードを確認する」、`security-auditor` の説明は、「コードの問題を確認する」です。開発者が、「この変更に、認証の回避につながる問題がないか、見てほしい」と依頼すると、メインのエージェントは、多くの場合、`code-reviewer` に委任して、一般的な可読性の指摘だけが、返ります。`security-auditor` には、認証や、入力の検証に特化した指示と、専用のツールが、設定されています。最も適切な改善はどれですか。","o":["`security-auditor` のシステムプロンプトに、「認証に関する依頼は、必ず、このサブエージェントが担当する」と記載する","メインのエージェントが、どのような依頼でも、常に、両方のサブエージェントに、委任するようにする","それぞれの説明に、担当する範囲と、どのような依頼のときに使うのかを、具体的に記述して、2つの違いが、分かるようにする","2つのサブエージェントを、1つに統合して、可読性と、セキュリティの両方を、常に確認させる"],"a":[2],"e":"メインのエージェントは、サブエージェントの説明を手がかりにして、どれに委任するのかを、判断します。2つの説明が、ほとんど同じであれば、適切に、選び分けられません。それぞれの説明に、担当する範囲と、どのような依頼のときに使うのかを、具体的に記述します。1つに統合すると、専門に特化した指示と、ツールの分離という利点が、失われます。常に、両方に委任すると、コストが、2倍になります。","w":["委任の判断は、メインのエージェントが、説明を見て行います。サブエージェントのシステムプロンプトは、委任の判断には、使われません。","関係のない確認まで、毎回行うことになり、コストが増えます。",null,"専門に特化した指示と、ツールの分離という利点が、失われます。"],"lv":2},{"sc":4,"d":1,"s":"1.1","q":"エージェントに、バグの修正を依頼すると、コードを変更した後に、「修正が完了しました。テストも、成功するはずです」と報告して、終了します。開発者が、テストを実行すると、失敗することが、約3割あります。エージェントには、Bash のツールがあり、テストを実行する権限も、あります。ログを確認すると、エージェントは、テストを実行せずに、終了していました。最も適切な改善はどれですか。","o":["エージェントの報告の文面に、「はず」という語が含まれる場合に、開発者に、警告を表示する","完了の条件を、テストの実行と成功の確認と定めて、アプリケーションの側でも、結果を確認する","エージェントの報告を、別のモデルに読ませて、テストを実行した形跡があるかどうかを、判定させる","システムプロンプトに、「報告の前に、必ず、テストを実行すること」という指示を、強調して追加する"],"a":[1],"e":"エージェントの「完了しました」という報告は、作業が、実際に成功したことの、証拠には、なりません。完了の条件を、検証できる形（テストの実行と、成功の確認）で定めて、エージェントに、それを満たしてから、終了させます。さらに、アプリケーションの側でも、テストの結果を、決定的に確認すれば、報告に頼る必要が、なくなります。文面の語による検出は、言い回しによって、外れます。","w":["言い回しによって、容易に外れます。",null,"報告の文面からの推定であり、テストの実際の結果を、確認していません。","指示だけでは、実行が省略されることがあり、結果を確認する仕組みも、ありません。"],"lv":2},{"sc":4,"d":1,"s":"1.4","q":"定型的なコードの生成を、3つの段階で自動化しています。(1) 仕様書から、API の定義（OpenAPI）を生成する。(2) API の定義から、クライアントのコードを生成する。(3) クライアントのコードに対するテストを生成する。ある日、(1) で生成された API の定義に、構文の誤りがありましたが、そのまま (2) に渡されて、不完全なクライアントのコードと、それに対するテストが、生成されました。問題は、(3) の後の、テストの実行で、初めて見つかりました。最も適切な見直しはどれですか。","o":["(3) の後のテストの実行で、問題が見つかった場合に、3つの段階を、最初から、もう一度実行する","3つの段階を、1つのプロンプトにまとめて、1回の呼び出しで、API の定義、クライアントのコード、テストを、すべて生成させる","(1) の段階のプロンプトに、「構文の誤りのない定義を、生成すること」という指示を追加して、ほかの段階は、変更しない","各段階の出力を、次の段階に渡す前に検証して、失敗した場合は、その段階で修正させる"],"a":[3],"e":"複数の段階からなる処理では、前の段階の誤りが、後の段階に、伝播します。段階の間に、検証を置けば、誤りを、発生した段階で、見つけて、修正できます。API の定義の構文や、コードのコンパイルは、決定的に、検査できます。最後に、まとめて確認する方法では、どの段階に、原因があったのかの特定に、時間がかかり、後の段階の作業が、無駄になります。","w":["原因の段階が分からず、後の段階の作業が、無駄になります。","段階の間で、検証を行えなくなり、原因の特定も、難しくなります。","指示だけでは、構文の誤りを、確実には防げません。",null],"lv":2},{"sc":4,"d":2,"s":"2.5","q":"エージェントに、既存の `README.md` に、新しい環境変数の説明を、1つ追記するよう、依頼しました。エージェントは、`README.md` を読み込まずに、Write で、新しい内容を書き込みました。その結果、導入の手順や、トラブルへの対処など、もともとあった約400行の内容が、すべて失われて、新しい環境変数の説明だけのファイルになりました。この種類の作業の進め方として、最も適切なものはどれですか。","o":["Write を使う前に、エージェントに、「既存の内容を、消さないこと」と、毎回指示する","既存のファイルの変更は、すべて、Bash で、`echo` と、リダイレクトを使って、行わせる","既存のファイルを変更するときは、まず、Read で、現在の内容を確認する。一部の追記や、修正には、Edit を使う","既存のファイルへの Write を、実行の前に呼び出されるフックで、すべて阻止する"],"a":[2],"e":"Write は、ファイルの全体を、指定した内容で、置き換えます。既存のファイルに対して、現在の内容を確認せずに使うと、もとの内容が、失われます。既存のファイルを変更するときは、まず、Read で、現在の内容を確認して、一部の追記や、修正には、対象の箇所だけを変更する Edit を使います。指示を加えても、現在の内容を、読み込んでいなければ、保持することは、できません。","w":["現在の内容を読み込んでいなければ、保持することはできません。","リダイレクトの種類を誤ると、同じように、内容が失われます。",null,"意図した全体の置き換えまで、できなくなります。現在の内容を確認して、適切なツールを使うことが、先です。"],"lv":2},{"sc":4,"d":2,"s":"2.1","q":"コードの意味的な検索を行う、自作の MCP のツールは、検索の語句に一致した結果を、すべて返します。一般的な語（「ユーザー」など）で検索すると、500件以上の、コードの断片が返されて、1回の呼び出しで、コンテキストの大半が、消費されます。エージェントが、実際に必要とするのは、通常、関連の度合いが高い、上位の数件です。ツールの設計の見直しとして、最も適切なものはどれですか。","o":["ツールの説明に、「一般的な語では、検索しないこと」と記載して、エージェントに、具体的な語句を、使わせる","結果を、すべて返す設計は維持して、エージェントのモデルを、コンテキストウィンドウが、より大きいものに変更する","結果を、関連の度合いの順に並べて、件数に上限を設ける。各結果は、パスと行の番号、短い抜粋にとどめる","検索の結果が、100件を超える場合は、ツールが、エラーを返す。エージェントは、語句を変えて、検索し直す"],"a":[2],"e":"ツールの戻り値は、エージェントのコンテキストを、直接消費します。大量の結果を、そのまま返す設計は、避けます。関連の度合いの順に並べて、件数に上限を設けて、各結果は、場所（パスと行）と、短い抜粋にとどめます。必要であれば、続きを取得できるようにします。エージェントは、必要な箇所だけを、Read で、詳しく確認できます。エラーを返す設計では、有用な上位の結果まで、得られません。","w":["どの語が、多くの結果を返すのかを、エージェントは、事前には知りません。","不要な結果で、コンテキストを消費する点は、変わりません。",null,"有用な上位の結果まで、得られなくなります。"],"lv":2},{"sc":4,"d":2,"s":"2.5","q":"エージェントが、`get` という名前の、社内のキャッシュの関数の利用箇所を、調べようとして、Grep で、`get` という文字列を検索しました。`getUser`、`target`、`widget` などを含む、約7,000件が一致して、結果は、役に立ちませんでした。調べたい関数は、`cache` モジュールで定義されており、`cache.get(` の形で、呼び出されています。最も適切な検索の方法はどれですか。","o":["`cache` モジュールのファイルを、Read で読み込んで、`get` の定義を確認する。利用箇所は、定義の内容から、推定する","`get` を含む、約7,000件の結果を、すべて、エージェントに読ませて、該当するものを、選ばせる","`cache\\.get\\(` のような、呼び出しの形に合わせた、正規表現のパターンで検索する","検索を、Glob に切り替えて、`*get*` というパターンで、ファイルを検索する"],"a":[2],"e":"Grep は、正規表現による検索に、対応しています。短い、一般的な文字列を、そのまま検索すると、無関係な一致が、大量に返ります。調べたい対象の、実際の使われ方（`cache.get(`）に合わせた、具体的なパターンを使えば、該当の箇所だけを、取得できます。Glob は、ファイルの名前のパターンによる検索であり、ファイルの内容は、調べません。","w":["定義からは、どこで呼び出されているのかは、分かりません。","コンテキストを、使い切ります。",null,"Glob は、ファイルの名前を調べるもので、内容は調べません。"],"lv":2},{"sc":4,"d":2,"s":"2.2","q":"社内のファイルにアクセスする、MCP のツールは、方針として、`secrets/` の下のファイルの読み取りを、禁止しています。エージェントが、このディレクトリのファイルを読もうとすると、ツールは、「読み取りに失敗しました」という文字列だけを返します。エージェントは、一時的な障害と判断して、Bash で `cat` を実行するなど、別の手段で、同じファイルを読もうとしました。ツールのエラーの設計として、最も適切な見直しはどれですか。","o":["失敗の理由が、方針による禁止であること、再試行や、別の手段でも、アクセスすべきではないことを、エラーの種類とともに、明示して返す","禁止されたパスの場合は、ツールが、空の内容を、成功の結果として返す。エージェントは、ファイルが空であると判断して、別の手段を、試さなくなる","禁止されたパスの場合に、`isError` を付けて、「一時的なエラーです。しばらくしてから、再試行してください」という内容を返す","エージェントのシステムプロンプトに、「ツールが失敗した場合は、別の手段を、試さないこと」という指示を、一律に追加する"],"a":[0],"e":"エラーの種類が、分からなければ、エージェントは、一時的な障害と、方針による拒否を、区別できません。方針による拒否であること、そして、再試行や、迂回が、適切ではないことを、明示して返せば、エージェントは、アクセスを、やめて、必要であれば、利用者に、状況を報告できます。空の内容を、成功として返すと、ファイルが空であるという、誤った前提で、作業が進みます。","w":[null,"ファイルが空であるという、誤った前提で、作業が進みます。","方針による拒否を、一時的な障害として伝えることになり、再試行や、迂回を招きます。","一時的な障害での、正当な再試行まで、できなくなります。"],"lv":2},{"sc":4,"d":2,"s":"2.1","q":"ブランチを、最新の状態に同期するための、`sync_branch` という、自作のツールがあります。説明は、「ブランチを同期する」です。実際には、このツールは、ローカルの未コミットの変更を破棄して、リモートに、強制的にプッシュします。エージェントが、作業の途中で、「念のため、同期しておく」と判断して、このツールを呼び出して、開発者の、未コミットの変更が、失われました。最も適切な見直しはどれですか。","o":["ツールの説明を、「ブランチを、安全に同期する」に書き換えて、エージェントが、安心して使えるようにする","`sync_branch` の呼び出しの後に、失われた変更がないかを、エージェントに確認させて、失われていた場合は、開発者に報告させる","ツールの説明は変更せずに、エージェントのシステムプロンプトに、「`sync_branch` は、慎重に使うこと」という注意を、追加する","ツールの名前と説明に、何が変更されて、何が失われるのかを明記する。元に戻せない操作は、別のツールに分けて、実行の前に、確認を必須とする"],"a":[3],"e":"ツールの名前と説明は、エージェントが、そのツールを、いつ、使ってよいのかを判断する、主な手がかりです。「同期する」という説明からは、未コミットの変更が、破棄されることは、分かりません。副作用と、元に戻せるかどうかを、明記します。さらに、元に戻せない操作は、別のツールに分けて、確認を必須とします。実行の後の確認では、失われた変更は、戻りません。","w":["実際の動作と異なる説明であり、誤用を、さらに招きます。","実行の後であり、失われた変更は、戻りません。","何が失われるのかが、依然として、伝わりません。",null],"lv":2},{"sc":4,"d":2,"s":"2.3","q":"不慣れなコードベースの調査を担当する、サブエージェントに、開発を簡単にするために、Read、Grep、Glob に加えて、Write、Edit、Bash も、与えています。このサブエージェントの役割は、コードを読んで、構造を報告することだけです。ところが、調査の途中で、サブエージェントが、「誤りと思われる箇所」を、自分の判断で修正して、3つのファイルを、書き換えていました。開発者は、変更に、気づいていませんでした。最も適切な見直しはどれですか。","o":["サブエージェントのプロンプトに、「調査だけを行い、ファイルは、変更しないこと」という指示を、追加する","サブエージェントに与えるツールを、役割に必要な、読み取りと検索のツールに、限定する","サブエージェントが、ファイルを変更した場合は、メインのエージェントが、変更の内容を、開発者に報告する","サブエージェントが変更したファイルを、実行の後に呼び出されるフックで検出して、変更を、自動的に取り消す"],"a":[1],"e":"エージェントは、与えられたツールを、役立つと判断すれば、使います。調査だけが役割であれば、変更のためのツールは、必要ありません。与えるツールを、読み取りと検索に限定すれば、プロンプトの指示が守られるかどうかに関係なく、ファイルは、変更されません。メインのエージェントが、自分で調査を行うと、メインのコンテキストが、探索の途中経過で、埋まります。","w":["指示である限り、確実には守られません。",null,"変更は、すでに行われており、事後の対応です。","変更が、いったん行われることを防げず、取り消しの仕組みも、複雑になります。"],"lv":2},{"sc":4,"d":2,"s":"2.4","q":"チームは、第三者が提供している、監視のサービスの MCP サーバーを、利用しています。このサーバーの `query_metrics` というツールの説明は、「メトリクスを照会する」という一文だけで、どのようなメトリクスが取得できるのか、いつ使うべきなのかが、書かれていません。エージェントは、性能の問題の調査でも、このツールを使わずに、ログのファイルを、Grep で検索するだけです。サーバーの実装と、ツールの説明は、チームでは、変更できません。最も適切な対応はどれですか。","o":["サーバーの提供元に、ツールの説明の改善を依頼して、改善されるまでは、エージェントに、このツールを使わせない","Grep のツールを、エージェントから取り除いて、`query_metrics` を、使わざるを得ないようにする","CLAUDE.md や、システムプロンプトに、このツールで取得できる情報と、どのような調査のときに使うのかを、補足として記述する","すべてのリクエストで、`tool_choice` で、`query_metrics` を指定して、呼び出しを、強制する"],"a":[2],"e":"第三者が提供するツールの説明が、不十分で、変更もできない場合は、自分たちが管理できる場所で、補足します。CLAUDE.md や、システムプロンプトに、そのツールで、何ができて、どのような場面で使うのかを、記述すれば、エージェントは、適切な場面で、そのツールを選べます。ほかのツールを取り除いたり、呼び出しを強制したりすると、それらが適している場面で、対応できなくなります。","w":["自分たちが管理できる場所で、補足することができます。","コードやログの検索が、適している場面で、対応できなくなります。",null,"ほかのツールの利用も、回答を返すことも、できなくなります。"],"lv":2},{"sc":4,"d":3,"s":"3.3","q":"リポジトリの `legacy/` の下には、10年以上前に書かれた、課金のコードがあります。このコードには、「日付の計算には、独自の `LegacyDate` を使うこと」「例外を、握りつぶしている箇所は、意図的なものであり、変更しないこと」といった、ほかの部分とは異なる、特別な注意点が、約80行あります。現在は、これらを、ルートの CLAUDE.md に記述しており、`legacy/` と関係のない作業でも、常に読み込まれています。最も適切な構成はどれですか。","o":["特別な注意点を、各開発者の `~/.claude/CLAUDE.md` に移して、プロジェクトの CLAUDE.md からは、削除する","ルートの CLAUDE.md の中で、特別な注意点の前に、「`legacy/` のファイルを扱う場合に限る」という見出しを付ける","特別な注意点を、`.claude/rules/` のファイルに移して、`paths` に、`legacy/**` を指定する","特別な注意点を、スキルにして、`legacy/` のファイルを扱うたびに、開発者が、名前で呼び出す"],"a":[2],"e":"特定のディレクトリのファイルを扱うときにだけ、必要な内容は、対象のパスを指定した、ルールのファイルに記述します。`paths` に、`legacy/**` を指定すれば、そのディレクトリのファイルを扱うときにだけ、読み込まれて、ほかの作業では、コンテキストを、消費しません。ルートの CLAUDE.md は、見出しを付けても、常に読み込まれます。開発者が、手動で呼び出す方法は、呼び出しを忘れると、注意点が、適用されません。","w":["すべてのプロジェクトで読み込まれ、チームで共有もされません。","見出しを付けても、常に読み込まれます。",null,"呼び出しを忘れると、注意点が、適用されません。"],"lv":2},{"sc":4,"d":3,"s":"3.1","q":"あるセッションで、エージェントは、結合テストが失敗する原因を、30分かけて調べて、「このテストは、事前に、ローカルの Docker のコンテナを、起動しておく必要がある」ことを、突き止めました。この前提は、どこにも、文書になっていません。翌週、別の開発者のセッションで、エージェントは、同じ原因の調査に、ふたたび、30分を費やしました。最も適切な対応はどれですか。","o":["調査の結果が残っているセッションに、名前を付けておいて、次回は、そのセッションを、`--resume` で再開する","分かった前提と、起動の手順を、プロジェクトの CLAUDE.md に追記する","最初に調査した開発者が、分かった内容を、チームのチャットに投稿する","エージェントが、次回は、自分で思い出せるように、最初のセッションを、終了せずに、開いたままにしておく"],"a":[1],"e":"セッションの中で分かった、プロジェクトに固有の知識は、そのセッションが終わると、失われます。CLAUDE.md に追記しておけば、次回以降の、すべての開発者の、すべてのセッションで、最初から読み込まれて、同じ調査を、繰り返さずに済みます。チャットへの投稿は、人には伝わりますが、エージェントは、それを、参照できません。","w":["ほかの開発者のセッションには、引き継がれず、長い履歴を、持ち越すことにもなります。",null,"人には伝わりますが、エージェントは、チャットを参照できません。","ほかの開発者のセッションには、引き継がれません。"],"lv":2},{"sc":4,"d":3,"s":"3.2","q":"不慣れなモジュールを担当することになった開発者は、毎回、Claude Code に、「このモジュールの責務、公開している関数、依存しているモジュール、テストの状況を、まとめてほしい」という、同じ内容の、長い依頼を、入力しています。チームのほかのメンバーも、それぞれ、少しずつ異なる文面で、同じような依頼を、行っており、得られるまとめの形式が、ばらついています。最も適切な方法はどれですか。","o":["調査の手順と、出力の形式を、スキルやコマンドとしてまとめて、対象のモジュールを、引数で渡す","依頼の内容を、プロジェクトの CLAUDE.md に記述して、すべてのセッションで、最初に、モジュールのまとめを、作成させる","依頼の文面を、Wiki に掲載して、各自が、必要なときに、複製して、入力する","依頼の文面を、各開発者の `~/.claude/CLAUDE.md` に記載して、モジュールの調査のときに、参照させる"],"a":[0],"e":"繰り返し行う、定型の依頼は、スキルやコマンドとして、まとめます。調査の手順と、出力の形式を、定義しておけば、誰が実行しても、同じ形式のまとめが、得られます。対象のモジュールを、引数として渡せるようにすれば、1つの定義を、さまざまな対象に、再利用できます。CLAUDE.md に記述すると、まとめが必要ないセッションでも、常に読み込まれます。","w":[null,"まとめが必要ないセッションでも、常に読み込まれて、実行されます。","手作業の複製であり、文面の差異が、生じます。","チームで共有されず、すべてのプロジェクトで、常に読み込まれます。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"プルリクエストのレビューを行う CI のジョブで、Claude Code が、指摘した問題を、自分で修正して、プルリクエストのブランチに、コミットを追加する事象が、発生しました。このジョブの目的は、指摘を、コメントとして投稿することだけです。ジョブの実行環境には、リポジトリへの書き込みの権限があり、プロンプトには、「コードは、変更しないこと」と記載されています。最も確実な対策はどれですか。","o":["ジョブで使えるツールを、読み取りと検索に必要なものに限定して、実行環境の権限も、読み取りと、コメントの投稿だけにする","レビューのジョブに、`--output-format json` を指定して、出力を、指摘の一覧の形式に限定する","ジョブの後段に、Claude Code が追加したコミットを検出して、自動的に取り消す処理を追加する。変更が行われても、必ず元に戻るため、結果として、コードは変更されない","プロンプトの「コードは、変更しないこと」という記述を、冒頭に移して、同じ内容を、末尾でも繰り返す"],"a":[0],"e":"CI のジョブには、その目的に必要な、最小の権限だけを与えます。レビューが目的であれば、使えるツールを、読み取りと検索に限定して、実行環境の権限も、読み取りと、コメントの投稿に絞ります。こうすれば、プロンプトの指示が守られるかどうかに関係なく、コードの変更は、行えません。事後に取り消す方法は、変更が、いったん反映されることを、防げません。","w":[null,"出力の形式を指定するだけであり、ファイルの変更や、コミットは、防げません。","変更が、いったん反映されることを、防げません。","指示である限り、確実には守られません。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"ある開発者の端末で、Claude Code にレビューをさせると、チームの命名の規約や、例外の処理の方針に沿った指摘が、返ります。ところが、同じプロンプトを使った CI のジョブでは、これらの規約に関する指摘が、まったく返りません。調べると、規約は、その開発者の `~/.claude/CLAUDE.md` に、記述されていました。リポジトリには、CLAUDE.md は、ありません。最も適切な対応はどれですか。","o":["CI のジョブのモデルを、開発者が端末で使っているものと、同じものに変更する","CI の実行環境に、その開発者の `~/.claude/CLAUDE.md` を、手作業で複製する","規約を、リポジトリの CLAUDE.md に記述して、コミットする。CI のジョブでも、ほかの開発者の環境でも、同じ規約が読み込まれる","CI のジョブのプロンプトに、規約の全文を、直接貼り付ける。CLAUDE.md は、CI では、読み込まれない仕様であるため、ほかに方法がない"],"a":[2],"e":"ユーザーレベルの `~/.claude/CLAUDE.md` は、その開発者の環境だけに適用されて、バージョン管理では、共有されません。そのため、CI の実行環境や、ほかの開発者の環境には、反映されません。チームの規約は、リポジトリの CLAUDE.md に記述します。CI のジョブは、リポジトリをチェックアウトして実行するため、リポジトリの CLAUDE.md が、読み込まれます。","w":["原因は、規約の置き場所であり、モデルではありません。","手作業の複製は、更新が反映されず、ほかの開発者の環境にも適用されません。",null,"リポジトリの CLAUDE.md は、CI でも読み込まれます。プロンプトへの貼り付けは、二重の管理になります。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"CI のレビューのジョブは、プルリクエストの差分のテキストだけを、Claude に渡しています。ある変更で、関数の引数の意味が、変更されましたが、その関数を呼び出している、差分に含まれない3つのファイルは、修正されていませんでした。レビューは、この問題を、指摘できませんでした。差分の中だけを見るかぎり、変更は、正しく見えます。最も適切な改善はどれですか。","o":["リポジトリの全ファイルの内容を、毎回、プロンプトに連結して渡す","リポジトリをチェックアウトした環境で、ジョブを実行する。差分を起点に、変更された関数の利用箇所などを、必要に応じて、検索して読めるようにする","レビューの対象を、差分が10行以下の、小さなプルリクエストに限定する","差分のテキストを渡す際に、「差分に含まれないファイルへの影響も、推測して指摘すること」という指示を追加する。実行環境の構成を変えずに、すぐに対応できる"],"a":[1],"e":"差分のテキストだけでは、変更が、ほかの箇所に与える影響を、確認できません。リポジトリをチェックアウトした環境で実行すれば、Claude Code は、変更された関数の利用箇所を、検索して、関連するファイルを、必要な分だけ、読むことができます。全ファイルを、プロンプトに連結する方法は、コンテキストの上限を超えるか、大半が無関係な情報で、占められます。見えないファイルへの影響を、推測させると、誤検知の原因になります。","w":["コンテキストの上限を超えるか、無関係な情報で占められます。",null,"影響の大きい変更ほど、レビューされなくなります。","見えないコードについての推測になり、誤検知の原因になります。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"チームは、Claude Code のレビューの結果を、プルリクエストのマージの条件にしました。「指摘が1件でもあれば、マージを禁止する」という設定です。その結果、軽微な提案や、誤検知によって、マージが止まることが、1日に何度も起こり、開発者は、指摘の内容を読まずに、条件を回避する方法を、探すようになりました。運用の見直しとして、最も適切なものはどれですか。","o":["レビューの指摘は、原則として、助言として表示する。マージを止めるのは、テストやリンターのような決定的な検査と、明確な基準で定義した、重大な指摘に限る","条件を維持する。マージが止まることで、開発者が、指摘を真剣に受け止めるようになる","「指摘が5件以上あれば、マージを禁止する」という設定に変更する","マージを止める条件を、「レビューを2回実行して、2回とも現れた指摘が、1件でもある場合」に変更する"],"a":[0],"e":"モデルによるレビューは、有用ですが、誤検知を、完全にはなくせません。すべての指摘を、マージを止める条件にすると、誤検知のたびに、開発が止まり、開発者の信頼を、失います。マージを止める条件には、テストやリンターのような、決定的な検査を使います。モデルの指摘は、助言として提示して、止める対象は、明確な基準で定義した、重大なものに限ります。件数による条件は、指摘の重要さを、反映しません。","w":[null,"誤検知で開発が止まり、指摘への信頼が、さらに下がります。","件数は、指摘の重要さを、反映しません。","誤検知が、2回とも現れることがあり、軽微な提案で、マージが止まる問題も、残ります。"],"lv":2},{"sc":5,"d":3,"s":"3.2","q":"レビューのためのプロンプト（約80行）は、12のリポジトリの、CI の定義ファイルの中に、それぞれ、直接書き込まれています。改善のたびに、12か所を、手作業で更新する必要があり、リポジトリによって、内容が、少しずつ異なっています。また、開発者が、同じレビューを、プルリクエストを作成する前に、自分の端末で実行したくても、同じプロンプトを、簡単には使えません。最も適切な見直しはどれですか。","o":["プロンプトの全文を、各リポジトリの CLAUDE.md に記載して、CI のジョブでは、「CLAUDE.md の手順に従って、レビューすること」とだけ指示する","プロンプトを、できるだけ短くして、1行にまとめる。短ければ、12か所の更新の手間が、小さくなる","レビューの手順を、コマンドやスキルとして、ファイルにまとめて、バージョン管理で共有する。CI のジョブと、開発者の端末の両方から、同じものを呼び出す","プロンプトの全文を、各リポジトリの README に記載して、開発者が、必要なときに、複製して使えるようにする。README は、全員が目にする場所であり、最も確実に共有される"],"a":[2],"e":"繰り返し使う手順は、CI の定義ファイルに、直接書き込むのではなく、コマンドやスキルとして、独立したファイルにまとめます。バージョン管理で共有すれば、更新は1か所で済み、CI のジョブと、開発者の端末の両方から、同じ手順を呼び出せます。これにより、プルリクエストを作成する前の確認と、CI でのレビューの基準が、一致します。","w":["レビュー以外の作業でも、常に読み込まれ、12のリポジトリに、複製が残ります。","レビューに必要な基準まで、失われます。",null,"手作業での複製になり、差異が生じます。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"CI で、Claude Code が生成した単体テストを、そのまま、プルリクエストに、自動でコミットしています。生成されたテストの中に、(1) そもそも実行に失敗するテスト、(2) 実行のたびに、結果が変わるテストが含まれており、ほかの開発者のビルドが、失敗するようになりました。生成したテストを取り込む前の手順として、最も適切なものはどれですか。","o":["生成のプロンプトに、「必ず成功する、安定したテストだけを、書くこと」という指示を追加する","生成したテストは、コミットせずに、プルリクエストのコメントに、コードとして貼り付けるだけにする。取り込むかどうかを、開発者が判断できるため、ビルドは壊れない","生成したテストを、CI の中で、複数回実行して、安定して成功するものだけを取り込む。それ以外は、除外して、報告する","生成したテストを、すべてコミットして、失敗したテストは、開発者が、後から削除する"],"a":[2],"e":"生成されたテストが、実際に成功するかどうか、安定しているかどうかは、実行することで、決定的に確認できます。取り込む前に、複数回実行して、安定して成功するものだけを残せば、ほかの開発者のビルドを、壊すことがありません。プロンプトでの指示は、成功を、保証しません。コメントに貼り付けるだけにすると、自動化の価値が、大きく下がります。","w":["指示では、テストの成功も、安定性も、保証されません。","検証すれば取り込めるテストまで、手作業に戻すことになります。",null,"ほかの開発者のビルドが、失敗し続けます。"],"lv":2},{"sc":5,"d":4,"s":"4.1","q":"CI のレビューで、30行の変更のプルリクエストに対して、40件を超える指摘が、投稿されました。内訳を見ると、大半は、今回の変更とは関係のない、同じファイルの中の、以前からあるコードについての指摘でした。開発者は、今回の変更に対する、本当に重要な2件の指摘を、見落としました。プロンプトは、「このファイルの問題を、すべて報告すること」です。最も適切な改善はどれですか。","o":["指摘の件数に、10件という上限を設けて、それを超える分は、投稿しない。件数が絞られることで、開発者が、すべての指摘に、目を通せるようになる","報告の対象を、今回の変更で追加または修正された箇所と、その変更が直接影響する箇所に限る、という基準を、プロンプトに明記する","プロンプトに、「重要な問題だけを、報告すること」という指示を追加する","指摘を、重大度の高い順に並べ替えて、40件のすべてを、投稿する"],"a":[1],"e":"指摘が、多すぎる原因は、プロンプトが、報告の範囲を、定めていないことです。「このファイルの問題を、すべて」と指示されれば、モデルは、変更と関係のない箇所も、報告します。報告の対象を、今回の変更と、その直接の影響に限る、という明確な基準を示します。件数の上限は、どの指摘が残るのかを、制御できません。「重要な問題だけ」という指示は、何が重要なのかを、伝えません。","w":["どの指摘が残るのかを制御できず、重要な指摘が、削られることがあります。",null,"何が重要なのかの基準が、伝わりません。","件数は変わらず、今回の変更と関係のない指摘が、残ります。"],"lv":2},{"sc":5,"d":4,"s":"4.1","q":"開発者から、「レビューの指摘が、抽象的で、何をすればよいのかが、分からない」という不満が出ています。実際の指摘は、「エラー処理を、改善すべきです」「この関数は、複雑すぎます」といったものです。チームは、「実行可能なフィードバック」を、目標にしています。プロンプトの改善として、最も効果的なものはどれですか。","o":["指摘の文章の長さの下限を、200文字に設定する","それぞれの指摘に、対象の場所、何が問題なのか、なぜ問題なのか、具体的な修正の案を含めること、という条件を定める。条件を満たさない指摘は、報告させない","抽象的な指摘が返った場合に、開発者が、コメントで、詳しい説明を求められるようにする。必要なときにだけ、詳細を生成するため、コストを抑えながら、具体性を確保できる","プロンプトに、「具体的で、実行可能な指摘を、行うこと」という指示を追加する"],"a":[1],"e":"「実行可能」という目標は、それ自体では、基準になりません。実行可能な指摘が、どのような要素を持つのかを、具体的に定める必要があります。対象の場所、問題の内容、その理由、修正の案を、必須の要素として定めて、これらを示せない指摘は、報告させないようにします。こうすれば、根拠の弱い、抽象的な指摘は、自然に除かれます。長さの下限は、内容の具体性を、保証しません。","w":["長さは、具体性を保証しません。",null,"開発者に、追加の手間を求めることになります。","何をもって、具体的とするのかが、伝わりません。"],"lv":2},{"sc":5,"d":4,"s":"4.2","q":"誤検知を減らすために、レビューのプロンプトに、8件の few-shot の例を追加しました。8件は、すべて、「問題のあるコードと、それに対する指摘」の例です。追加の後、指摘の形式は安定しましたが、問題のないコードに対しても、何かしらの指摘が、返るようになり、誤検知は、かえって増えました。最も適切な改善はどれですか。","o":["例を、すべて削除して、指示の文章だけに戻す","プロンプトに、「問題がない場合は、指摘をしないこと」という指示を追加する","例の数を、8件から20件に増やす。問題のあるコードの例が増えるほど、モデルの判断が、正確になるため、問題のないコードとの区別も、つくようになる","一見すると問題に見えるが、指摘すべきではないコードの例を、判断の理由とともに加える。指摘すべき例と、対比できるようにする"],"a":[3],"e":"few-shot の例は、モデルに、強い傾向を与えます。すべての例が、「指摘あり」であれば、モデルは、どのコードにも、指摘を返すことを、学びます。指摘すべきではない場合の例を、理由とともに加えて、指摘すべき例と対比させることで、モデルは、両者の境界を、学べます。同じ種類の例を増やしても、偏りは、強まるだけです。例を、すべて削除すると、形式の安定が、失われます。","w":["安定した形式まで、失われます。","指示よりも、例が示す傾向のほうが、強く働きます。","同じ種類の例を増やしても、偏りが、強まるだけです。",null],"lv":2},{"sc":5,"d":4,"s":"4.2","q":"レビューの判断の精度を上げるために、過去の2年間のレビューから、35件の事例を選んで、few-shot の例として、プロンプトに追加しました。プロンプトは、約2万トークンになり、コストと、応答の時間が、大きく増えました。さらに、例に含まれていた、特定のライブラリの使い方に関する指摘が、関係のないプルリクエストにも、繰り返し現れるようになりました。最も適切な見直しはどれですか。","o":["35件の例を、そのまま維持して、プロンプトキャッシュを適用する。コストの問題が解消するため、ほかの対応は、必要ない","例を、毎回、35件の中から、無作為に5件選んで、プロンプトに含める","例を、35件から100件に増やして、あらゆる場面を、網羅する","判断が分かれやすい場面を示す、少数の（2〜4件程度の）的を絞った例に、絞り込む。一般化してほしい判断の理由を、明記する"],"a":[3],"e":"few-shot の例は、多ければよい、というものではありません。多数の例は、コンテキストを消費するうえに、モデルが、例の表面的な特徴に、引きずられる原因になります。効果が大きいのは、判断が分かれやすい場面を示す、少数の、的を絞った例です。判断の理由を添えることで、モデルは、例を、そのまま真似るのではなく、新しい場面に、一般化できます。キャッシュは、コストを下げますが、例に引きずられる問題は、解消しません。","w":["コストは下がりますが、例に引きずられる問題は、解消しません。","どの例が含まれるかによって、判断が、実行のたびに変わります。","コンテキストの消費と、例への引きずられが、さらに大きくなります。",null],"lv":2},{"sc":5,"d":4,"s":"4.4","q":"CI で、Claude Code が生成したテストのうち、約2割が、コンパイルのエラーや、存在しないヘルパー関数の呼び出しによって、実行に失敗しています。現在は、失敗したテストを、そのまま破棄しています。チームは、有用なテストを、より多く得たいと考えています。最も適切な改善はどれですか。","o":["失敗したテストと、具体的なエラーの内容を添えて、修正を依頼する。回数の上限を設けて、それでも失敗するものは、破棄して報告する","コンパイルのエラーを、自動的に無視する設定で、テストを実行する","失敗したテストについて、同じプロンプトで、成功するまで、何度でも、生成をやり直す。生成の結果は、実行のたびに変わるため、いずれは、成功するテストが得られる","生成のプロンプトに、「コンパイルのエラーがない、正しいテストを、書くこと」という指示を追加する"],"a":[0],"e":"生成の結果を、検証して、失敗した場合に、具体的なエラーの内容を、フィードバックとして渡すと、モデルは、原因を踏まえて、修正できます。同じプロンプトでの再生成は、何が誤っていたのかが伝わらないため、同じ誤りを、繰り返すことがあります。再試行には、回数の上限を設けて、それでも解決しないものは、破棄して報告します。指示だけでは、存在しない関数の呼び出しのような誤りを、防げません。","w":[null,"実行できないテストが、取り込まれることになります。","何が誤っていたのかが伝わらず、同じ誤りを繰り返すことがあります。","指示だけでは、存在しない関数の呼び出しのような誤りを、防げません。"],"lv":2},{"sc":5,"d":4,"s":"4.4","q":"レビューの結果は、ファイルの名前、行の番号、指摘の内容を含む、JSON で出力されます。この JSON をもとに、CI が、プルリクエストの該当の行に、インラインのコメントを投稿します。全体の約5%の指摘で、行の番号が、差分に含まれない行や、ファイルに存在しない行を、指しており、コメントの投稿の API が、エラーを返しています。JSON は、スキーマには、準拠しています。最も適切な対応はどれですか。","o":["投稿の前に、行の番号が、差分の範囲に含まれることを、コードで検証する。含まれない指摘は、原因を示して修正を求めるか、ファイルの単位のコメントとして、投稿する","API がエラーを返した指摘は、何もせずに、破棄する","スキーマの、行の番号のフィールドに、「正しい行の番号を、指定すること」という説明を追加する","行の番号を使うことをやめて、すべての指摘を、プルリクエストの全体に対する、1つのコメントにまとめる"],"a":[0],"e":"スキーマへの準拠が、保証するのは、形式（行の番号が、整数であることなど）だけです。その値が、実際の差分の中に、存在するかどうかは、保証されません。この種類の妥当性は、コードで、決定的に検証できます。検証に失敗した指摘は、原因を示して、修正を求めるか、より粗い単位のコメントとして、投稿します。何もせずに破棄すると、有用な指摘まで、失われます。","w":[null,"有用な指摘まで、失われます。","説明を加えても、値が、実際の差分に存在することは、保証されません。","該当の行に示すという利点を、すべての指摘で失います。"],"lv":2},{"sc":5,"d":4,"s":"4.5","q":"毎週末に、組織の全リポジトリの、約12,000個のファイルについて、非推奨の API の利用を調べる監査を、Message Batches API で実行しています。今週のバッチでは、約300件のリクエストが、失敗しました。失敗の理由は、いずれも、対象のファイルが大きすぎて、コンテキストの上限を超えたことでした。残りは、正常に完了しています。最も適切な対応はどれですか。","o":["12,000件のすべてを、もう一度、同じ内容で、バッチに投入する","バッチの処理の時間の上限を、延長するよう設定して、もう一度、全件を投入する","`custom_id` で、失敗したリクエストを特定する。該当のファイルを、分割するなど、失敗の原因に対処したうえで、その分だけを、再度投入する","失敗した約300件を、同期の API で、同じ内容のまま、1件ずつ、再実行する。同期の API であれば、バッチとは異なり、大きな入力にも、対応できる"],"a":[2],"e":"Batches API では、`custom_id` によって、それぞれのリクエストと、結果を、対応付けられます。失敗したリクエストだけを特定して、再度投入できます。その際は、失敗の原因に、対処する必要があります。この例では、ファイルが大きすぎることが原因であるため、ファイルを分割します。同じ内容のまま、再実行しても、同期の API であっても、同じ理由で、失敗します。","w":["正常に完了した分まで、重複して処理することになります。","失敗の原因は、処理の時間ではなく、入力の大きさです。正常に完了した分まで、重複して処理することにもなります。",null,"同じ内容では、同じ理由で、失敗します。"],"lv":2},{"sc":5,"d":4,"s":"4.5","q":"新しく作成した、コードの品質の分析のプロンプトを、全リポジトリの、約8,000個のファイルに適用します。結果は、翌朝までに得られれば、問題ないため、Message Batches API を使います。担当者は、作成したばかりのプロンプトを、まだ1度も、実際のファイルで試していませんが、そのまま、8,000件を投入しようとしています。最も適切な進め方はどれですか。","o":["8,000件を、1つの巨大なリクエストにまとめて、1回で投入する","まず、代表的な少数のファイルで、プロンプトを試して、出力の形式と内容を確認して、調整する。そのうえで、全体を投入する","バッチは使わずに、8,000件を、同期の API で、1件ずつ処理する。途中で問題に気づいた時点で、停止できる","そのまま、8,000件を投入する。結果に問題があれば、プロンプトを修正して、もう一度、8,000件を投入すればよい"],"a":[1],"e":"バッチの処理は、投入してから、結果が得られるまでに、時間がかかります。プロンプトに問題があった場合、それに気づくのは、数時間後であり、全体の再投入が、必要になります。大量に投入する前に、代表的な少数のサンプルで、プロンプトを試して、出力を確認して、調整します。これにより、最初の投入での成功の割合を高めて、時間とコストの無駄を、防げます。","w":["コンテキストの上限を超え、ファイルごとの結果も得られません。",null,"バッチによるコストの削減を、得られません。","問題に気づくのが数時間後になり、全体の再投入で、時間とコストが無駄になります。"],"lv":2},{"sc":5,"d":4,"s":"4.6","q":"レビューの誤検知の割合を、さらに下げたいと考えています。現在は、1回のパスで、指摘を生成して、そのまま投稿しています。指摘の約2割は、実際のコードを、もう一度確認すると、成立しないもの（たとえば、すでに、別の箇所で、検証が行われている）でした。最も適切な改善はどれですか。","o":["指摘の生成とは別の、独立したインスタンスで、それぞれの指摘を、実際のコードに照らして検証する。確認できたものだけを、投稿する","同じプロンプトで、3回レビューを実行して、3回のすべてに現れた指摘だけを、投稿する。偶然による誤検知は、3回続けては現れないため、確実な指摘だけが残る","指摘の件数を、プルリクエストごとに、3件までに制限する","指摘を生成した同じセッションで、「自分の指摘を、もう一度見直すこと」と指示する"],"a":[0],"e":"指摘を生成したセッションは、その指摘に至った推論を、保持しているため、同じ思い込みを、疑いにくい状態にあります。生成とは別の、独立したインスタンスに、それぞれの指摘を、実際のコードに照らして、検証させると、成立しない指摘を、取り除けます。同じプロンプトでの複数回の実行は、コストが増えるうえに、同じ誤解に基づく指摘が、毎回現れることがあります。","w":[null,"同じ誤解に基づく指摘が、毎回現れることがあり、コストも3倍になります。","誤検知が残り、正しい指摘が、削られることもあります。","指摘に至った推論を保持しており、同じ思い込みを、疑いにくい状態です。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"現在は、すべてのブランチへの、すべてのプッシュに対して、Claude Code による、リポジトリの全体のレビューを、実行しています。作業の途中の、細かいコミットや、下書きの状態のプルリクエストでも、毎回、レビューが実行されて、月間のコストが、想定の6倍になりました。開発者からは、「作業中のコードに、指摘が大量に付いて、邪魔になる」という声も出ています。最も適切な見直しはどれですか。","o":["レビューの対象を、準備ができたプルリクエストに限定して、変更されたファイルと、その関連に絞る","レビューを、月に1回、リポジトリの全体に対して実行する方式に変更する。実行の回数が、大きく減るため、コストを、確実に抑えられる","レビューの結果の投稿を、1日に1回にまとめる。コメントの数が減るため、開発者の邪魔に、ならなくなる","レビューに使うモデルを、最も小さいものに切り替える。1回あたりのコストが下がるため、すべてのプッシュでの実行を、維持できる"],"a":[0],"e":"レビューが、価値を持つのは、変更が、レビューを受けられる状態になったときです。作業の途中のコミットや、下書きの段階で実行しても、指摘は、すぐに古くなり、コストと、開発者の負担だけが、増えます。起動の条件を、レビューの準備ができたプルリクエストに限定して、対象も、変更されたファイルと、その関連に絞ります。月に1回の実行では、マージの前に、指摘を受け取れません。","w":[null,"マージの前に、指摘を受け取れなくなります。","不要な実行のコストは、変わりません。","品質への影響を評価しておらず、不要な実行も、残ります。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"CI のジョブで、Claude Code を、`-p` を付けて、非対話のモードで実行しています。ジョブの目的は、変更に関連するテストを実行して、失敗の原因を、分析することです。しかし、ジョブの出力を見ると、Claude Code は、テストのコマンドを、実行できておらず、「コマンドの実行の許可が、得られなかった」という趣旨の内容を、報告して、終了しています。開発者の端末では、同じ指示で、確認に応答すれば、テストは、実行されます。最も適切な対応はどれですか。","o":["すべての権限の確認を、無条件に省略する設定で、ジョブを実行する。あらゆるコマンドが、確認なしに、実行されるようになる","ジョブで必要になる、テストの実行のコマンドを、あらかじめ、許可するツールとして、指定する。それ以外の操作は、許可しない","`-p` を外して、対話のモードで、ジョブを実行する。確認が表示されたら、CI の側で、自動的に、キーを入力する","ジョブの権限のモードを、プランモードに指定する。計画だけを行うため、権限の確認は、発生しない"],"a":[1],"e":"非対話のモードでは、権限の確認に、人が応答することが、できません。そのため、ジョブで必要になる操作は、あらかじめ、許可しておく必要があります。必要なコマンドだけを、許可するツールとして指定すれば、ジョブは、目的の操作を実行でき、それ以外の操作は、行えません。すべての確認を、無条件に省略すると、意図しないコマンドまで、実行されるおそれがあります。","w":["意図しないコマンドまで、確認なしに、実行されるおそれがあります。",null,"対話のモードの自動操作は、不安定であり、CI には適しません。","テストの実行は、読み取り専用の操作ではないため、プランモードでは、確認なしには、実行されません。"],"lv":2},{"sc":5,"d":3,"s":"3.3","q":"モノレポの CI で、プルリクエストのレビューを、実行しています。リポジトリには、React のフロントエンド（`web/`）と、Python のバックエンド（`api/`）があり、レビューで重視すべき観点が、異なります。フロントエンドでは、アクセシビリティと、状態の管理、バックエンドでは、入力の検証と、トランザクションの扱いです。現在は、すべての観点を、1つのプロンプトに記載しており、バックエンドだけの変更に対して、アクセシビリティの指摘が、返ることがあります。最も適切な構成はどれですか。","o":["観点ごとの基準を、`.claude/rules/` のファイルに分けて、`paths` で、対象のディレクトリを指定する","観点ごとの基準を、2つのスキルにして、Claude Code に、変更の内容に応じて、適切なスキルを、選ばせる","フロントエンドと、バックエンドを、別々のリポジトリに分割する。リポジトリごとに、別のプロンプトを、使えるようになる","プロンプトの冒頭に、「変更されたファイルに、関係のある観点だけを、適用すること」という指示を追加して、すべての観点は、これまでどおり、1つのプロンプトに記載する"],"a":[0],"e":"パスを指定したルールは、CI の実行でも、同じように働きます。観点ごとの基準を、ルールのファイルに分けて、対象のディレクトリを指定すれば、変更されたファイルに関係のある基準だけが、読み込まれます。すべての観点を、1つのプロンプトに記載したまま、指示を加える方法は、関係のない観点が、コンテキストに入ることを、防げません。リポジトリの分割は、レビューの基準のためだけには、過大な変更です。","w":[null,"どのスキルを使うかが、モデルの判断に依存します。パスによる指定のほうが、確実です。","レビューの基準のためだけには、過大な変更です。","関係のない観点が、コンテキストに入ることを、防げません。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"CI には、すでに、コードの整形の検査、リンター、型のチェックが、組み込まれています。新たに追加した、Claude Code のレビューは、「インデントが、揃っていない」「使われていない変数がある」「型の注釈が、不足している」といった指摘を、多数返しており、これらは、既存の検査の結果と、重複しています。開発者は、同じ内容の指摘を、2か所で見ることになり、Claude Code の指摘を、読まなくなりつつあります。最も適切な見直しはどれですか。","o":["Claude Code のレビューの指摘の件数を、1件のプルリクエストにつき、3件までに制限する","重複した指摘は、開発者が、2回確認することになるため、見落としが減る。現在の構成を、維持する","既存の検査が扱う項目を、レビューの対象から外して、ロジックの誤りや、設計上の問題に、集中させる","既存の整形の検査、リンター、型のチェックを、CI から取り除いて、すべての検査を、Claude Code のレビューに、一本化する"],"a":[2],"e":"整形や、未使用の変数、型の不足のように、規則で、決定的に検出できる問題は、既存の検査のほうが、速く、確実で、安価です。モデルによるレビューは、ロジックの誤りや、設計上の問題のように、規則では見つけにくい観点に、集中させます。役割を分けることで、指摘の重複がなくなり、Claude Code の指摘の価値が、明確になります。決定的な検査を、モデルに置き換えると、確実性が、失われます。","w":["重複した指摘が残り、重要な指摘が、削られることもあります。","重複によって、指摘が読まれなくなるという問題が、続きます。",null,"決定的に検出できる問題の、確実性と速さが、失われます。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"あるプルリクエストは、「負荷の高い時間帯の障害への、暫定の対処として、キャッシュの有効期限を、一時的に、5分から1時間に延ばす」ものでした。この意図は、プルリクエストの説明文と、関連付けられた課題に、記載されています。CI のレビューには、差分だけが渡されており、Claude Code は、「有効期限が長すぎて、古いデータが返る危険がある。5分に戻すべきである」という指摘を、重大な問題として、投稿しました。最も適切な改善はどれですか。","o":["重大な問題として投稿された指摘は、開発者が、すべて、理由を書いて、却下する運用にする","プルリクエストの説明文と、関連付けられた課題を、レビューのコンテキストに含める","Claude Code に、指摘の前に、変更の意図を、差分から推測させて、推測した意図を、指摘に併記させる","開発者が、意図的な変更の箇所に、「この行は、レビューしないこと」というコメントを、コードの中に書き込む運用にする"],"a":[1],"e":"差分だけでは、変更の意図は、分かりません。意図的な変更が、問題として、指摘されるのは、レビューの側に、その意図が、伝わっていないためです。プルリクエストの説明文や、関連付けられた課題を、コンテキストに含めれば、変更の目的を踏まえた、評価ができます。特定の種類の指摘を、恒久的に除外すると、本当に問題のある変更まで、見逃します。","w":["開発者の負担が増えて、誤検知の原因も、解消しません。",null,"差分だけからの推測であり、説明文に書かれた意図とは、一致しないことがあります。","コードに、レビューのための記述が、残ることになり、手間もかかります。"],"lv":2},{"sc":5,"d":3,"s":"3.6","q":"ある組織が、約150のリポジトリに、Claude Code による自動のレビューを、導入しようとしています。レビューのプロンプトは、1つのチームで、2週間、試しただけです。担当者は、「来週、全リポジトリで、一斉に有効にして、指摘は、マージを止める条件にする」ことを、提案しています。リポジトリによって、使っている言語も、コードの規約も、大きく異なります。導入の進め方として、最も適切なものはどれですか。","o":["全リポジトリで、一斉に有効にするが、指摘は、どこにも投稿せずに、ログにだけ、記録する。半年後に、ログを確認する","言語や規約の異なる、少数のリポジトリから始めて、助言として投稿しながら、誤検知の割合を測定する","提案のとおり、全リポジトリで、一斉に有効にする。問題が報告されたリポジトリから、個別に、無効にしていく","全リポジトリで、一斉に有効にして、指摘は、助言として投稿する。誤検知の割合は、測定しない"],"a":[1],"e":"1つのチームでの、短い試行だけでは、言語や規約の異なるリポジトリで、どのように動作するのかが、分かりません。誤検知の多い状態で、一斉に、マージを止める条件にすると、開発が止まり、信頼を失います。少数の、性質の異なるリポジトリから始めて、助言として投稿しながら、誤検知の割合と、反応を測定して、調整します。ログにだけ記録する方法は、開発者の反応が得られず、改善に、生かせません。","w":["開発者の反応が得られず、改善に、生かせません。",null,"誤検知で、多くのリポジトリの開発が止まり、信頼を失います。","言語や規約の異なるリポジトリで、誤検知が多発しても、把握できず、調整もできません。"],"lv":2},{"sc":5,"d":4,"s":"4.1","q":"CI のレビューは、1件のプルリクエストに対して、平均で、25件の指摘を、インラインのコメントとして、投稿しています。内訳は、重大度が「高」のものが、約1件、「中」が、約4件、「低」（命名の好みや、コメントの書き方など）が、約20件です。開発者は、「低」の指摘の多さから、コメントの全体を、読まなくなり、「高」の指摘が、見落とされました。プロンプトには、「見つけた問題を、重大度とともに、すべて報告すること」と記載されています。最も適切な改善はどれですか。","o":["「低」の指摘の重大度を、一律に、「中」に引き上げて、開発者が、より真剣に、受け止めるようにする","重大度ごとの扱いを、基準として定める。「高」と「中」は、インラインで投稿して、「低」は、投稿しないか、1つの要約にまとめる","指摘の件数に、上限を設けて、1件のプルリクエストにつき、最大で8件までを、インラインで投稿する","指摘を、重大度の高い順に並べ替えて、これまでどおり、25件すべてを、インラインのコメントとして、投稿する"],"a":[1],"e":"すべての指摘を、同じ形で投稿すると、重要な指摘が、些細な指摘の中に、埋もれます。重大度ごとに、どのように扱うのかを、基準として定めます。重要な指摘は、該当の行に、インラインで示して、些細な指摘は、省略するか、1か所にまとめます。並べ替えるだけでは、コメントの数は、変わりません。重大度を、一律に引き上げると、重大度の意味が、失われます。","w":["重大度の意味が失われて、さらに、信頼を損ないます。",null,"どの重大度の指摘が残るのかを、制御できず、「高」の指摘が、削られることがあります。","コメントの数は変わらず、重要な指摘が、埋もれたままです。"],"lv":2},{"sc":5,"d":4,"s":"4.1","q":"このプロジェクトでは、性能上の理由から、特定のモジュールで、意図的に、可変のグローバルなキャッシュを使っており、設計の文書にも、その旨が、記載されています。CI のレビューは、「グローバルな可変の状態は、避けるべきである」という、一般的な原則に基づく指摘を、このモジュールの変更のたびに、繰り返し投稿しています。プロンプトには、「ベストプラクティスに反する箇所を、指摘すること」と記載されています。最も適切な改善はどれですか。","o":["プロジェクトの設計を、一般的な原則に合わせて、変更する。レビューの指摘に、従うことが、品質の向上につながる","プロンプトの記載を、「ベストプラクティスに、明確に反する箇所だけを、指摘すること」と書き換える","このモジュールへの指摘は、重大度を、一律に「低」に引き下げて、投稿する","評価の基準を、プロジェクトの規約と、設計上の決定に置いて、意図的な方針を、理由とともに示す"],"a":[3],"e":"「ベストプラクティス」という基準は、プロジェクトの事情を、考慮しません。そのため、意図的に採用している方針まで、問題として指摘されます。評価の基準を、プロジェクトの規約と、設計上の決定に置いて、意図的な方針を、その理由とともに示します。モジュールの全体を、対象から除外すると、そのモジュールの、ほかの問題まで、見逃します。「明確に」という語を加えても、基準は、変わりません。","w":["性能上の理由のある設計を、道具に合わせて、変えることになります。","何が明確なのかが示されておらず、基準は、一般的な原則のままです。","意図的な方針への指摘が、投稿され続け、本当の問題まで、「低」として扱われます。",null],"lv":2},{"sc":5,"d":4,"s":"4.2","q":"開発者は、Claude Code のレビューの指摘に対して、「却下」のボタンを押して、理由を記入できます。過去3か月の記録では、「エラーを、ログに出力するだけで、再送出していない」という種類の指摘が、最も多く却下されており、理由の大半は、「この層では、意図的に握りつぶして、上位で、まとめて処理している」でした。この情報を、レビューの改善に生かす方法として、最も適切なものはどれですか。","o":["却下された指摘の件数を、月次の報告書に、グラフとして掲載する。開発者に、傾向を、知らせることができる","エラー処理に関する指摘を、すべて、レビューの対象から外す。最も多く却下されている種類の指摘が、なくなる","代表的な却下の事例を、「指摘すべきではない例」として、理由とともに、プロンプトに加える","却下された指摘を、すべて、そのまま、few-shot の例として、プロンプトに追加する。件数が多いほど、判断が、正確になる"],"a":[2],"e":"開発者による却下は、どのような指摘が、誤検知なのかを示す、具体的な情報です。代表的な事例を、「指摘すべきではない例」として、理由とともに、プロンプトに加えて、本当に問題となる例と、対比させれば、モデルは、両者の境界を、学べます。エラー処理に関する指摘を、すべて外すと、本当に問題のある箇所まで、見逃します。すべてを、そのまま追加すると、コンテキストが肥大化して、例に、引きずられます。","w":["傾向は伝わりますが、レビューの挙動は、変わりません。","本当に問題のあるエラー処理まで、見逃します。",null,"コンテキストが肥大化して、例の表面的な特徴に、引きずられます。"],"lv":2},{"sc":5,"d":4,"s":"4.2","q":"CI で生成されるテストは、動作としては、正しいものの、チームの既存のテストとは、書き方が、大きく異なります。既存のテストは、共通のフィクスチャと、表形式でケースを並べる書き方を、使っていますが、生成されるテストは、ケースごとに、準備の処理を、重複して書いています。CLAUDE.md には、「既存のテストの書き方に、合わせること」と、記載されています。最も効果的な改善はどれですか。","o":["生成されたテストを、後処理のスクリプトで、既存のテストの書き方に、機械的に変換する","生成されたテストの書き方に合わせて、既存のテストを、すべて、書き直す。書き方が、統一される","CLAUDE.md の記載を、「既存のテストの書き方に、厳密に、合わせること。重複した準備の処理は、書かないこと」と、より詳しく書き直す","チームの書き方を、よく表している、既存のテストを、2〜3件、手本として示す。共通のフィクスチャの使い方と、ケースの並べ方が、伝わるようにする"],"a":[3],"e":"「既存の書き方に、合わせること」という指示は、どのような書き方なのかを、具体的には、伝えません。チームの書き方を、よく表している、実際のテストを、手本として示せば、フィクスチャの使い方や、ケースの並べ方が、具体的に伝わります。書き方のような、文章では説明しにくい内容には、例が、有効です。後処理による変換は、複雑な書き換えには、対応しきれません。","w":["準備の処理の共通化のような、複雑な書き換えには、対応しきれません。","道具に合わせて、既存の資産を、書き直すことになります。","どのような書き方なのかが、具体的には、伝わりません。",null],"lv":2},{"sc":5,"d":4,"s":"4.3","q":"レビューの結果を、JSON で受け取るために、スキーマで、各指摘の `suggestion`（具体的な修正のコード）を、必須のフィールドに、定義しています。設計上の問題のように、数行の修正のコードでは、示せない指摘についても、モデルは、`suggestion` を埋めるために、的外れなコードや、動作しないコードを、出力しています。開発者が、その提案を、そのまま適用して、ビルドが壊れた事例が、ありました。スキーマの見直しとして、最も適切なものはどれですか。","o":["`suggestion` を、null を許容する定義に変更して、示せない場合は、説明のフィールドで、方針を述べさせる","`suggestion` は、必須のまま維持して、プロンプトに、「動作する、正しい修正のコードだけを、出力すること」という指示を追加する","`suggestion` を、必須のまま維持して、出力されたコードを、CI が、自動的に、プルリクエストに適用する","`suggestion` のフィールドを、スキーマから、完全に削除する。修正のコードは、どの指摘でも、出力させない"],"a":[0],"e":"必須のフィールドは、モデルに、何らかの値を、出力することを、強制します。適切な値が、存在しない場合でも、もっともらしい値が、作り出されます。具体的な修正のコードを、示せない指摘もあるため、`suggestion` は、null を許容して、その場合は、説明のフィールドで、方針を述べさせます。フィールドを、完全に削除すると、修正のコードを示せる指摘の、価値まで、失われます。","w":[null,"必須である限り、何らかのコードを、出力せざるを得ません。","的外れなコードが、自動的に適用されて、被害が大きくなります。","修正のコードを示せる指摘の、価値まで、失われます。"],"lv":2},{"sc":5,"d":4,"s":"4.4","q":"CI のレビューで、「この変更は、決済の手順の設計と、整合していない可能性がある」という、曖昧な指摘が、たびたび返ります。チームは、指摘を、より具体的にするために、検証の処理を追加して、「具体的な根拠が、示されていない」というエラーを添えて、再生成させる仕組みを、導入しました。3回まで、再試行させても、指摘は、具体的になりません。決済の手順の設計は、社内の Wiki に記載されており、CI の実行環境からは、参照できません。この状況の理解として、最も適切なものはどれですか。","o":["再試行の回数が、足りない。上限を、3回から10回に引き上げれば、いずれ、具体的な指摘が、得られる","判断に必要な情報が、入力にない。再試行では解決しないため、設計の文書を、参照できるようにするか、この種類の指摘を、対象から外す","モデルの能力が、足りない。より上位のモデルに切り替えれば、設計の内容を、推測して、具体的な指摘を、返せる","エラーのメッセージが、弱い。「必ず、具体的な根拠を示すこと」と、強い表現に書き換えれば、具体的な指摘が、得られる"],"a":[1],"e":"エラーを添えた再試行が、有効なのは、モデルが、必要な情報を持っていて、形式や、構造の誤りを、修正できる場合です。判断に必要な情報が、そもそも、入力に含まれていない場合は、何度再試行しても、解決しません。この例では、設計の文書が、参照できないことが、原因です。文書を、参照できるようにするか、根拠を示せない種類の指摘を、対象から外します。上位のモデルも、見えない文書の内容は、知り得ません。","w":["必要な情報がない以上、回数を増やしても、解決しません。",null,"どのモデルも、参照できない文書の内容は、知り得ません。","必要な情報がない以上、表現を強めても、解決しません。"],"lv":2},{"sc":5,"d":4,"s":"4.5","q":"コストを抑えるために、開いているすべてのプルリクエストについての、詳細な品質の分析を、毎晩、Message Batches API で実行して、翌朝、結果を、各プルリクエストに、インラインのコメントとして、投稿しています。開発者から、「すでに修正した箇所に、指摘が付く」「指摘の行が、ずれている」という報告が、出ています。調べると、バッチを投入した後に、プルリクエストに、新しいコミットが追加された場合にも、古いコミットに対する結果が、そのまま投稿されていました。最も適切な改善はどれですか。","o":["指摘は、インラインではなく、すべて、プルリクエストの全体に対する、1つのコメントとして、投稿する。行のずれが、問題にならなくなる","投入のときに、対象のコミットの識別子を対応付けて、投稿の前に、現在の先頭のコミットと照合する","結果を投稿する際に、指摘の行の番号を、最新のコミットとの差分から、自動的に補正する","バッチの処理をやめて、すべての分析を、同期の API で、プッシュのたびに、実行する"],"a":[1],"e":"バッチの処理は、投入から、結果が得られるまでに、時間がかかります。その間に、対象が変化することを、前提に、設計する必要があります。投入のときに、対象のコミットの識別子を、`custom_id` などで、リクエストに対応付けておいて、結果を使う時点で、対象が、変わっていないかを、確認します。一致しない結果は、投稿しないか、再度、分析します。開発者に、コミットを追加しないよう求めることは、開発を、妨げます。","w":["すでに修正された内容への指摘が、投稿されることは、変わりません。",null,"行のずれは直せても、すでに修正された箇所への指摘が、投稿されることは、変わりません。","遅延が許される分析で、バッチによるコストの削減を、失います。"],"lv":2},{"sc":5,"d":4,"s":"4.6","q":"CI のレビューは、1回のパスで、セキュリティ、性能、可読性、テストの網羅性の、4つの観点を、すべて確認しています。プロンプトには、4つの観点のそれぞれについて、詳しい基準が、記載されています。分析すると、可読性に関する指摘は、多い一方で、セキュリティに関する指摘は、後から、人のレビューで見つかった問題の、約4割しか、検出できていませんでした。最も適切な改善はどれですか。","o":["同じプロンプトで、レビューを、4回実行して、4回の指摘の、すべてを投稿する","セキュリティの基準を、プロンプトの冒頭に移して、「セキュリティを、最優先で確認すること」という指示を、追加する","4つの観点の基準を、それぞれ、さらに詳しく書き足して、1回のパスのまま、確認させる","観点ごとに、パスを分ける。それぞれのパスは、1つの観点の基準だけを持ち、その観点に、集中して確認する"],"a":[3],"e":"1回のパスに、多くの観点を詰め込むと、注意が分散して、一部の観点の確認が、浅くなります。観点ごとに、パスを分ければ、それぞれのパスは、1つの観点に集中して、深く確認できます。セキュリティのように、見逃しの影響が大きい観点は、とくに、専用のパスに分ける価値が、あります。順序を変えたり、優先を指示したりしても、1回のパスに、すべてを詰め込む構造は、変わりません。","w":["同じ注意の分散が、4回繰り返されるだけで、重複した指摘も増えます。","1回のパスに、すべての観点を詰め込む構造は、変わりません。","プロンプトが長くなり、注意の分散が、さらに進みます。",null],"lv":2},{"sc":5,"d":4,"s":"4.6","q":"重要な変更（決済や、認証に関わるもの）については、互いに独立した、2つのインスタンスで、別々にレビューを実行しています。2つの結果を比べると、約7割の指摘は、両方に現れますが、残りの約3割は、一方にだけ現れます。現在は、どちらか一方にでも現れた指摘を、すべて、同じ扱いで投稿しており、一方にだけ現れた指摘には、誤検知が、多く含まれています。最も適切な扱いはどれですか。","o":["2つのインスタンスの結果を、1つのインスタンスに渡して、「どちらが正しいか」を、根拠を確認させずに、選ばせる","一方にだけ現れた指摘は、もう一方のインスタンスに提示して、同意するかどうかを尋ねる。同意した場合に、投稿する","両方に現れた指摘は、確度の高いものとして投稿して、一方だけの指摘は、追加の検証にかける","一方にだけ現れた指摘は、すべて、誤検知と見なして、破棄する。両方に現れた指摘だけを、投稿する"],"a":[2],"e":"独立した、複数のレビューの結果が、一致していることは、その指摘の確度が、高いことを示す、手がかりになります。一方、一致しない指摘の中にも、本当の問題は、含まれます。一致した指摘と、一致しない指摘を、区別して扱い、一致しない指摘は、実際のコードに照らした、追加の検証にかけるか、確度を区別して、提示します。すべて破棄すると、一方だけが見つけた、本当の問題を、失います。","w":["根拠を確認しない選択であり、検証になりません。","指摘を提示されると、同意しやすくなり、独立した検証には、なりません。",null,"一方だけが見つけた、本当の問題まで、失われます。"],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"現在の実装では、プロンプトに、「抽出の結果を、次の形式の JSON で出力すること」と記載して、モデルが返したテキストを、JSON として解析しています。1日に約4万件の処理のうち、約2%で、閉じ括弧の欠落、末尾の余分なカンマ、JSON の前後に付いた説明の文などによって、解析に失敗しています。失敗した文書は、手作業に回されており、負担になっています。最も適切な改善はどれですか。","o":["抽出の結果を受け取るツールを、JSON スキーマとともに定義して、そのツールの呼び出しとして、結果を出力させる","モデルを、より上位のものに切り替える。上位のモデルは、JSON の構文の誤りを、ほとんど起こさないため、解析の失敗が、解消する","プロンプトに、「JSON 以外の文字は、一切出力しないこと。括弧の対応を、必ず確認すること」という指示を追加する。あわせて、正しい JSON の例を、3件示す","解析に失敗した場合に、正規表現で、括弧の欠落や、余分なカンマを補正する処理を、追加する。補正できた場合は、そのまま下流に渡す"],"a":[0],"e":"プロンプトで、JSON の出力を依頼する方法では、構文の誤りを、完全にはなくせません。JSON スキーマを指定したツールを定義して、そのツールの呼び出しとして、結果を出力させれば、構文と、スキーマへの準拠が、保証されます。指示や例の追加、上位のモデルへの切り替えは、誤りの頻度を下げるだけで、保証にはなりません。正規表現による補正は、想定していない崩れ方に対応できず、誤った値を、通過させるおそれがあります。","w":[null,"頻度は下がりますが、保証にはなりません。","誤りの頻度は下がりますが、保証にはなりません。","想定していない崩れ方に対応できず、誤った値を通過させるおそれがあります。"],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"抽出のパイプラインでは、まず、文書の発行者や、言語、ページの数といったメタデータを、`extract_metadata` というツールで取得して、その結果に応じて、後続の、本体の抽出のツールを、選ぶ必要があります。現在は、`tool_choice` を `auto` にしており、モデルが、メタデータの取得を省略して、いきなり、本体の抽出のツールを呼び出すことが、約6%あります。その場合、言語に合わない抽出が、行われます。最も適切な設定はどれですか。","o":["`extract_metadata` と、本体の抽出のツールを、1つのツールに統合して、メタデータと、本体の項目を、同時に出力させる","システムプロンプトに、「必ず、最初に `extract_metadata` を呼び出すこと」という指示を、強い表現で記載する。あわせて、正しい順序の例を示す","すべてのリクエストで、`tool_choice` を `any` に設定する。いずれかのツールが、必ず呼び出されるため、メタデータの取得も、省略されなくなる","最初のリクエストでは、`tool_choice` で、`extract_metadata` を指定して、呼び出しを強制する。その結果を受けた、後続のリクエストで、本体の抽出を行う"],"a":[3],"e":"特定のツールを、確実に、最初に呼び出させるには、`tool_choice` で、そのツールを指定します。`any` は、いずれかのツールの呼び出しを保証しますが、どのツールが呼ばれるかは、保証しません。プロンプトでの指示は、遵守の割合を上げても、確実ではありません。2つを統合すると、メタデータに応じて、本体の抽出の方法を選ぶ、という分岐が、できなくなります。","w":["メタデータに応じて、抽出の方法を選ぶ分岐が、できなくなります。","遵守の割合は上がりますが、確実ではありません。","どのツールが呼び出されるかは、保証されません。",null],"lv":2,"g":"試験ガイド v1.0 は、`tool_choice` による強制（`any` や、ツールの指定）を、ツールを確実に呼び出させる手段として、扱っています。現在の公式ドキュメントでは、この強制は、拡張思考とは併用できず、一部の最新のモデルでは、エラーになる、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":6,"d":4,"s":"4.3","q":"契約書から、「自動更新の条項の有無」を、`auto_renewal` という boolean のフィールドで、抽出しています。契約書の中には、更新について、「双方の協議のうえ、別途定める」とだけ記載されているものや、更新の条項への言及が、別紙にあるとされながら、別紙が添付されていないものが、あります。モデルは、これらを、`true` か `false` のどちらかに、割り振っており、下流の更新の管理のシステムで、誤った通知が、発生しています。スキーマの見直しとして、最も適切なものはどれですか。","o":["`auto_renewal` を、自由記述の文字列に変更して、モデルに、条項の内容を、文章で要約させる。あらゆる場合を、表現できるようになる","`auto_renewal` は、boolean のまま維持して、プロンプトに、「判断できない場合は、`false` を選ぶこと」という規則を追加する。安全な側の値に、統一できる","`auto_renewal` は、boolean のまま維持して、確信度を表す、数値のフィールドを追加する。確信度が低いものを、下流で、確認の対象とする","フィールドを、「あり」「なし」「判断不能」を持つ enum に変更して、判断不能の場合は、その理由を記録するフィールドを、併せて設ける"],"a":[3],"e":"boolean のフィールドは、2つの値のどちらかを、必ず出力させます。文書から判断できない場合でも、どちらかに割り振られて、誤った情報が、確定した事実として、下流に流れます。判断できない場合を表す値を、enum に加えて、その理由を記録できるようにすれば、下流は、そのような契約書を、確認の対象として、扱えます。`false` に統一すると、自動更新がある契約を、見逃します。","w":["表記が揺れて、下流のシステムで、機械的に処理できなくなります。","自動更新のある契約を、「なし」として、見逃すことになります。","自己申告の確信度は、判断できない場合を、確実には示しません。値は、`true` か `false` のどちらかに、割り振られたままです。",null],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"請求書から、発行日と、支払期日を抽出しています。請求書の表記は、取引先によって異なり、「2026年3月5日」「R8.3.5」「05/03/26」「Mar 5, 2026」などが、混在しています。スキーマでは、日付を、文字列として定義しているだけで、形式は、指定していません。下流の会計のシステムは、ISO 8601 の形式（YYYY-MM-DD）だけを、受け付けます。「05/03/26」のように、月と日の順序が、判別できない表記も、あります。最も適切な設計はどれですか。","o":["スキーマで、日付の形式を指定するだけにする。形式が指定されていれば、モデルは、どのような表記であっても、正しい日付に、変換できる","日付は、原文の表記のまま抽出して、下流の会計のシステムの側で、あらゆる表記を解釈できるように、取り込みの処理を、改修してもらう","判別できない表記は、すべて、「日/月/年」の順序であると見なして、変換する規則を、プロンプトに記載する。処理を、止めずに済む","スキーマで、日付の形式を指定して、プロンプトに、和暦などの変換の規則を示す。順序を判別できない表記は、原文の表記を残して、確認の対象とする"],"a":[3],"e":"出力の形式は、スキーマで指定して、表記の揺れを、どのように正規化するのかは、プロンプトで、規則として示します。両方が、必要です。形式の指定だけでは、和暦の変換の方法や、曖昧な表記の扱いが、決まりません。月と日の順序を、判別できない表記を、一律の仮定で変換すると、誤った日付が、形式としては正しい値として、通過します。そのような表記は、原文を残して、確認に回します。","w":["形式の指定だけでは、変換の規則と、曖昧な表記の扱いが、決まりません。","下流のシステムに負担を転嫁することになり、曖昧な表記の問題も残ります。","誤った日付が、形式としては正しい値として、通過します。",null],"lv":2},{"sc":6,"d":4,"s":"4.1","q":"賃貸借契約書から、「重要な条項」を抽出するプロンプトを、運用しています。プロンプトの指示は、「この契約書の、重要な条項を、抽出すること」です。同じ契約書を処理しても、実行のたびに、抽出される条項が異なり、法務の担当者と、経理の担当者の間でも、「何が重要か」の期待が、食い違っています。法務は、解約と、原状回復の条項を、経理は、賃料の改定と、保証金の条項を、求めています。最も適切な改善はどれですか。","o":["モデルを、より上位のものに切り替える。上位のモデルは、契約書における重要性の判断が、より正確であるため、ばらつきが、小さくなる","同じ契約書を、5回処理して、3回以上抽出された条項だけを、採用する。実行ごとのばらつきを、多数決によって、打ち消すことができる","プロンプトに、「重要な条項を、漏れなく、慎重に抽出すること」という指示を加える。あわせて、抽出する条項の数を、1件の契約書につき、10件に固定する","抽出する条項の種類を、利用する部門と合意して、それぞれの定義と、含めるもの、含めないものを、プロンプトに明記する"],"a":[3],"e":"「重要な条項」という指示は、何を抽出すべきかを、定めていません。そのため、モデルの判断は、実行のたびに揺れて、利用する部門の期待とも、一致しません。まず、何を抽出するのかを、利用する部門と合意して、条項の種類ごとに、定義と、含めるもの、含めないものを、明記します。多数決や、モデルの変更は、基準がないという原因を、解消しません。","w":["基準が示されていなければ、モデルを変えても、部門の期待とは、一致しません。","コストが5倍になり、基準がないという原因も、解消しません。","何が重要なのかの基準が、依然として、示されていません。",null],"lv":2},{"sc":6,"d":4,"s":"4.2","q":"決算の資料から、売上高を、円の単位の整数で抽出しています。資料によって、「1,234百万円」「12.3億円」「単位：千円」という注記の付いた表の中の「1,234,567」など、表記と単位が異なります。抽出の結果には、単位の換算の誤り（1,000倍や、100万倍のずれ）が、約4%含まれています。プロンプトには、「金額は、円の単位の整数に、換算すること」と記載されています。最も効果的な改善はどれですか。","o":["プロンプトの記載を、「金額は、必ず、正確に、円の単位の整数に換算すること。単位の誤りは、重大な問題になる」と、強い表現に書き換える","表記と単位が異なる、複数の例について、原文の表記、読み取った単位、換算の後の値を、対応付けて、few-shot として示す","換算は行わせずに、原文の数値と、単位の表記を、そのまま抽出させる。円への換算は、下流の担当者が、資料を見ながら、手作業で行う","抽出された金額が、前年の値の10倍を超える場合に、警告を出す検査を追加する。プロンプトと、スキーマは、変更しない"],"a":[1],"e":"単位の換算のように、表記の種類が多く、文章の指示だけでは、扱い方が伝わりにくい処理には、few-shot の例が、有効です。異なる表記と単位について、原文、読み取った単位、換算の後の値を、対応付けて示すことで、モデルは、注記の付いた表のような場合にも、一般化できます。強い表現の指示は、どのように換算するのかを、伝えません。警告の検査は、補助としては有用ですが、誤りそのものを、減らしません。","w":["どのように換算するのかが、伝わりません。",null,"自動化の効果が、失われます。","補助にはなりますが、換算の誤りそのものは、減りません。"],"lv":2},{"sc":6,"d":4,"s":"4.4","q":"業務委託の契約書の中には、表紙に記載された契約金額と、本文の条項に記載された契約金額が、異なっているものがあります（改訂の際の、修正の漏れなど）。現在の抽出では、モデルは、どちらか一方の値を、何も注記せずに出力しており、下流のシステムは、それを、確定した金額として、扱っています。先月、誤った金額に基づいて、支払いの予定が、登録されました。最も適切な設計はどれですか。","o":["文書の中で、値が食い違っていることを示すフィールドと、それぞれの値と、記載の箇所を出力させる。食い違いがある場合は、人の確認に回す","表紙の値と、本文の値の、平均を計算して、契約金額として出力させる。どちらか一方に、偏ることを防げる","金額のフィールドを、2回抽出して、2回の結果が一致した場合にだけ、確定した金額として、下流に渡す","プロンプトに、「金額が複数ある場合は、本文の条項の値を、優先すること」という規則を追加する。どちらを採用するかが、一定になる"],"a":[0],"e":"元の文書の中に、矛盾がある場合、どちらが正しいのかは、文書からは、判断できません。モデルに、一方を選ばせると、矛盾があったという事実が、隠されます。矛盾を検出したことを示すフィールドと、それぞれの値、記載の箇所を出力させて、人の確認に回します。一律の優先の規則は、修正の漏れが、どちらの側にあるのかが、契約書によって異なるため、誤りを、防げません。","w":[null,"どちらの記載とも異なる、根拠のない金額になります。","2回とも、同じ側の値を選べば、矛盾は、検出されません。","修正の漏れが、どちらの側にあるのかは、契約書によって異なります。"],"lv":2},{"sc":6,"d":4,"s":"4.5","q":"夜間に、約8万件の請求書を、Message Batches API で処理しています。現在の設計では、1件のリクエストの中で、モデルが、請求書から取引先の名前を抽出して、`lookup_vendor` というツールで、取引先マスターを照会して、その結果の取引先コードを、出力に含めることになっています。運用を始めると、取引先コードが、出力に含まれていませんでした。最も適切な見直しはどれですか。","o":["バッチでは、取引先の名前までを、構造化して抽出する。取引先マスターの照会と、コードの付与は、バッチの結果を受け取った後に、コードで行う","バッチの処理をやめて、8万件のすべてを、同期の API で処理する。同期の API であれば、ツールの実行の結果を、モデルに返すことができる","取引先マスターの全件（約3万件）を、すべてのリクエストのプロンプトに含めて、モデルに、該当する取引先コードを、選ばせる","`lookup_vendor` の説明文に、「必ず、このツールを呼び出して、取引先コードを取得すること」と、強調して記載する"],"a":[0],"e":"Message Batches API では、1件のリクエストの中で、ツールを実行して、その結果をモデルに返す、という往復は、行えません。ツールの定義を使った、構造化された出力は、利用できます。したがって、バッチでは、取引先の名前までを抽出して、マスターの照会のような、決定的な処理は、結果を受け取った後に、コードで行います。すべてを、同期の API にすると、バッチによるコストの削減を、失います。","w":[null,"バッチによるコストの削減を、すべて失います。","コンテキストとコストを大きく消費して、選択の誤りも起こります。","説明文を変えても、バッチでは、ツールの結果を、モデルに返せません。"],"lv":2},{"sc":6,"d":4,"s":"4.6","q":"約180ページの、設備の保守の契約書から、42の項目を、1回のリクエストで抽出しています。前半のページに記載された項目は、ほぼ正確に抽出されますが、後半の、別表や付属の文書に記載された項目（保守の対象の機器の一覧、料金の改定の条件など）は、欠落や、誤りが目立ちます。文書の全体は、コンテキストウィンドウに、収まっています。最も適切な見直しはどれですか。","o":["プロンプトの冒頭に、「後半のページも、前半と同じ注意深さで、読むこと」という指示を追加する。あわせて、同じ指示を、末尾にも記載する","文書を、章や、別表の単位に分けて、それぞれから、関連する項目を抽出する。その後に、項目の間の整合性を確認する、統合のパスを実行する","コンテキストウィンドウが、より大きいモデルに切り替える。文書の全体を、より余裕を持って保持できるため、後半の項目の精度が、向上する","同じリクエストを、3回実行して、項目ごとに、最も多く出力された値を、採用する。後半の項目の欠落が、補われる"],"a":[1],"e":"長い文書から、多数の項目を、1回で抽出すると、注意が分散して、文書の一部の項目が、おろそかになります。これは、コンテキストウィンドウに収まるかどうかとは、別の問題です。文書を、意味のある単位に分けて、それぞれから、関連する項目を抽出すれば、各パスは、狭い範囲に集中できます。そのうえで、統合のパスで、項目の間の整合性を、確認します。","w":["指示では、注意の分散は、解消しません。",null,"すでに収まっており、原因は、注意の分散です。","3回とも、同じ項目が欠落する可能性があり、コストも3倍になります。"],"lv":2},{"sc":6,"d":5,"s":"5.5","q":"確信度が低い抽出の結果を、人の担当者が、確認しています。確認の画面には、抽出された値の一覧だけが、表示されており、担当者は、元の文書の PDF を、別に開いて、該当の箇所を、探しています。1件あたりの確認に、平均で4分かかり、確認の待ちが、積み上がっています。担当者が、探すのをあきらめて、値を、そのまま承認する例も、見つかりました。最も効果的な改善はどれですか。","o":["確認の担当者を、2倍に増員する。1件あたりの時間は変わらないが、待ちの件数は、半分になる","確認の画面に、抽出された値とともに、モデルが出力した確信度を、項目ごとに表示する","確認に回す基準の確信度を、引き下げて、確認の対象となる件数を、減らす。担当者の負担が、軽くなる","抽出の際に、値ごとに、根拠とした文書の箇所（ページと、該当の文）を記録して、確認の画面で、値と並べて表示する"],"a":[3],"e":"確認に時間がかかる原因は、担当者が、根拠の箇所を、自分で探していることです。抽出の際に、値ごとに、根拠の箇所を記録しておけば、確認の画面で、値と根拠を、並べて表示できます。担当者は、すぐに照合でき、確認の時間と、形だけの承認の、両方を減らせます。基準を引き下げて、件数を減らすと、誤った抽出が、確認されずに、通過します。","w":["確認の非効率という原因が残り、形だけの承認も、解消しません。","確認すべき項目は分かりますが、根拠の箇所を探す手間は、変わりません。","誤った抽出が、確認されずに通過する件数が、増えます。",null],"lv":2},{"sc":6,"d":5,"s":"5.5","q":"保険の申込書から、30の項目を抽出しています。現在は、30の項目のうち、1つでも、確信度が基準を下回ると、申込書の全体を、人の確認に回しています。その結果、申込書の約6割が、確認に回されています。内訳を調べると、基準を下回るのは、ほとんどの場合、「職業」と「既往歴の自由記述」の、2つの項目だけでした。ほかの28の項目の精度は、検証用のデータで、99%を超えています。最も適切な見直しはどれですか。","o":["確認に回す基準を、項目ごとに判断して、基準を下回った項目だけを、人が確認する。精度が検証されている項目は、自動で登録する","「職業」と「既往歴」の2つの項目について、few-shot の例を追加して、精度を高める。確認に回す単位は、申込書の全体のままとする","「職業」と「既往歴の自由記述」の2つの項目を、抽出の対象から外す。確認に回る申込書が、ほとんどなくなる","確信度の基準を、全体として引き下げて、確認に回る申込書の割合を、6割から2割に下げる"],"a":[0],"e":"確信度と、精度は、項目によって異なります。1つの項目のために、申込書の全体を、確認に回すと、精度の高い項目まで、人が確認することになり、負担が、過大になります。確認に回すかどうかを、項目ごとに判断すれば、人の注意を、本当に確認が必要な項目に、集中できます。基準を、全体として引き下げると、精度の低い2つの項目の誤りが、通過します。","w":[null,"2つの項目の精度が上がっても、1つでも基準を下回れば、全体を確認に回す構造は、変わりません。","審査に必要な項目が、失われます。","精度の低い2つの項目の誤りが、通過します。"],"lv":2},{"sc":6,"d":5,"s":"5.6","q":"工事の請負の契約書から、「完成の期日」を抽出しています。ある契約書には、期日が、「2026年9月30日」と、明記されています。別の契約書には、「着工の日から180日以内」とだけ、記載されており、モデルは、別の箇所に記載された着工の日から計算して、期日を出力しています。下流のシステムでは、どちらも、同じ「完成の期日」として、区別なく扱われています。着工の日が変更された場合に、計算された期日が、古いまま残る問題が、起きています。最も適切な設計はどれですか。","o":["計算された期日には、値の末尾に、「（推定）」という文字列を付けて、同じフィールドに出力させる","プロンプトに、「期日は、常に、正確に計算すること」という指示を追加して、これまでどおり、1つのフィールドに出力させる","計算が必要な契約書については、期日を出力させずに、空の値とする。明記された期日だけを、抽出の対象にする","値が、文書に明記されたものか、ほかの記載から導いたものかを、区別して出力させる。導いた場合は、根拠とした記載と、計算の方法を記録する"],"a":[3],"e":"文書に明記された値と、ほかの記載から導いた値では、信頼の度合いも、前提が変わったときの扱いも、異なります。下流で、適切に扱えるように、その区別を、構造化して出力します。導いた値については、根拠とした記載と、計算の方法を記録すれば、前提（着工の日）が変わったときに、再計算の対象を、特定できます。値に文字列を付ける方法は、日付としての形式を壊して、機械的な処理を、妨げます。","w":["日付としての形式が壊れて、下流で、機械的に処理できなくなります。","明記された値と、導いた値の区別が、依然として、ありません。","下流が必要とする情報が、失われます。",null],"lv":2},{"sc":6,"d":5,"s":"5.1","q":"約300ページの、製造の委託の契約書を、コンテキストの制約から、20ページごとの断片に分けて、断片ごとに、抽出を行っています。契約書の冒頭では、「本件製品」「甲」「乙」「基準日」といった用語が、定義されています。後半の断片からの抽出では、「甲は、基準日から30日以内に、本件製品を…」という条項について、当事者の名前や、具体的な日付を、特定できず、誤った当事者が、出力されることがあります。最も適切な改善はどれですか。","o":["後半の断片からの抽出では、当事者の名前と、日付のフィールドを、空の値とする。特定できない情報を、出力させないようにする","すべての断片の抽出の結果を、最後に、1つのリクエストで統合させる。その際に、当事者の名前と、日付を、モデルに、推測で補わせる","断片の大きさを、20ページから5ページに小さくして、1つの断片に含まれる条項の数を、減らす。各条項に、より集中できるようになる","冒頭の定義や、当事者の情報などを、あらかじめ抽出して、それを、各断片の抽出のプロンプトに、文脈として含める"],"a":[3],"e":"文書を、断片に分けて処理すると、各断片は、ほかの部分で定義された、用語や前提を、参照できなくなります。冒頭の定義や、当事者の情報のように、文書の全体で使われる文脈は、あらかじめ抽出して、各断片のプロンプトに、含めます。これにより、後半の断片でも、「甲」や「基準日」が、何を指すのかを、解釈できます。断片を小さくすると、文脈が、さらに失われます。","w":["下流が必要とする情報が、失われます。","根拠のない推測が、抽出の結果として、出力されます。","文脈が、さらに失われます。",null],"lv":2},{"sc":6,"d":5,"s":"5.2","q":"請求書の抽出のスキーマには、`total_amount` という、1つの金額のフィールドがあります。多くの請求書には、「小計（税抜）」「消費税」「合計（税込）」が、記載されていますが、一部の請求書には、「ご請求金額」という表記が、税抜と税込の、両方の欄に使われていたり、源泉徴収の後の「お支払金額」が、別に記載されていたりします。モデルは、請求書によって、異なる種類の金額を、`total_amount` に出力しており、下流の支払いの処理で、過払いが発生しました。最も適切な見直しはどれですか。","o":["金額の種類ごとに、フィールドを分けて、それぞれの定義を明記する。どの種類に当たるのかを、判断できない場合は、その旨を出力させて、確認に回す","`total_amount` の定義は、変更せずに、モデルを、より上位のものに切り替える。上位のモデルは、請求書の文脈から、支払うべき金額を、正しく判断できる","プロンプトに、「`total_amount` には、請求書の中で、最も大きい金額を出力すること」という規則を追加する。どの請求書でも、同じ基準で、金額が選ばれる","`total_amount` に、複数の金額を、カンマで区切った文字列として、すべて出力させる。下流のシステムが、必要な金額を、選べるようになる"],"a":[0],"e":"問題の原因は、スキーマの定義が、曖昧であることです。「合計の金額」が、税抜なのか、税込なのか、源泉徴収の後なのかが、定められていないため、モデルの判断が、請求書によって変わります。金額の種類ごとに、フィールドを分けて、定義を明記します。表記からは、種類を判断できない場合は、推測させずに、その旨を出力させて、確認に回します。最も大きい金額を選ぶ規則は、源泉徴収のある請求書で、過払いを起こします。","w":[null,"定義が曖昧なままでは、モデルを変えても、判断は一定しません。","源泉徴収のある請求書で、支払うべき金額よりも、大きい金額が選ばれます。","金額としての形式が壊れて、どれが、どの種類なのかも、分かりません。"],"lv":2},{"sc":6,"d":5,"s":"5.5","q":"人の担当者は、確信度の低い抽出の結果を確認して、誤りを、毎日、約200件、修正しています。修正の内容は、下流のシステムに反映されますが、抽出のパイプラインの側には、何も戻されていません。半年間、同じ種類の誤り（たとえば、特定の取引先の請求書で、納品日を、発行日として抽出する）が、繰り返し、修正されています。最も適切な改善はどれですか。","o":["同じ種類の誤りを、繰り返し修正している担当者に、修正の手順を、より速く行えるように、画面の操作の研修を実施する","担当者が修正した値を、同じ取引先の、次回以降の請求書に、そのまま、自動的に適用する。同じ誤りを、繰り返し修正する必要が、なくなる","修正の内容を記録して、誤りの種類ごとに分析する。頻度の高いものから、プロンプトや例の改善と、評価用データへの追加に、反映する","確信度の基準を引き上げて、より多くの抽出の結果を、人の確認に回す。誤りが、下流に流れる可能性を、さらに小さくできる"],"a":[2],"e":"人による修正は、抽出のどこに、問題があるのかを示す、価値の高い情報です。これを、パイプラインの側に戻さなければ、同じ誤りが、繰り返されます。修正の内容を記録して、誤りの種類ごとに分析して、頻度の高いものから、プロンプトや例の改善に、反映します。評価用データに加えれば、改善の効果と、再発の有無を、確認できます。修正した値を、そのまま、次回に適用すると、請求書ごとに異なる値が、誤って上書きされます。","w":["誤りの原因は解消せず、同じ修正が、続きます。","納品日のような値は、請求書ごとに異なり、誤って上書きされます。",null,"確認の負担が増えるだけで、誤りの原因は、解消しません。"],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"保守の契約書から、「契約の期間」を、`contract_term` という、数値のフィールドで、抽出しています。スキーマには、フィールドの名前と、型（数値）だけが、定義されています。抽出の結果を確認すると、同じ「3年間」という記載に対して、`3`（年）、`36`（月）、`1095`（日）が、文書によって、混在していました。下流の更新の管理のシステムは、月の単位を、前提にしています。最も適切な改善はどれですか。","o":["`contract_term` を、数値から、文字列に変更して、「3年間」のような、原文の表記を、そのまま出力させる","プロンプトの冒頭に、「数値は、常に、正確に出力すること」という指示を追加して、スキーマは、変更しない","フィールドの説明に、何を表す値か、単位、端数の扱い、具体的な例を明記する","下流のシステムの側で、値の大きさから、単位を推定する処理を追加する。たとえば、10未満であれば年、100未満であれば月、と見なす"],"a":[2],"e":"スキーマの、フィールドの名前と型だけでは、値の意味と単位は、伝わりません。モデルは、文書ごとに、異なる解釈をします。フィールドの説明に、何を表す値か、単位、端数の扱いを明記して、例を示せば、解釈が、一定になります。値の大きさから、単位を推定する方法は、「24」が、24か月なのか、24年なのかを、区別できません。原文の表記を出力させると、下流で、機械的に処理できなくなります。","w":["表記が揺れて、下流で、機械的に処理できなくなります。","単位の定義が、依然として、示されていません。",null,"値の大きさだけでは、単位を、確実には区別できません。"],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"取引先から届く PDF の中には、1つのファイルに、3〜10件の請求書が、まとめられているものがあります。現在のスキーマは、1件の請求書の項目（請求書の番号、発行日、合計の金額など）を、最上位のフィールドとして、定義しています。このようなファイルを処理すると、最初の1件だけが抽出されたり、複数の請求書の金額が、合算されて、1つの合計として、出力されたりしています。最も適切な見直しはどれですか。","o":["ファイルを、ページごとに分割して、1ページを、1件の請求書として、現在のスキーマで抽出する","スキーマを、請求書の配列として定義して、ファイルに含まれる請求書を、1件ずつ、別の要素として、出力させる","複数の請求書が含まれるファイルは、合算した金額を、合計として出力することを、仕様として定める。下流のシステムを、それに合わせる","プロンプトに、「ファイルに、複数の請求書が含まれる場合は、最初の1件だけを、抽出すること」という規則を追加する。出力が、常に、1件になる"],"a":[1],"e":"スキーマは、入力のデータの構造を、表現できなければ、なりません。1つのファイルに、複数の請求書が含まれるのであれば、スキーマも、複数の請求書を表現できるように、配列として定義します。スキーマが、1件分しか表現できなければ、モデルは、残りを捨てるか、無理に、1件にまとめるしか、ありません。最初の1件だけを抽出すると、残りの請求書が、処理されません。","w":["複数のページにまたがる請求書が、分断されます。",null,"請求書ごとの番号や金額が失われて、照合ができなくなります。","残りの請求書が、処理されなくなります。"],"lv":2},{"sc":6,"d":4,"s":"4.3","q":"委託の契約書の抽出のスキーマは、あらかじめ定めた、30の項目だけを、出力できます。スキーマにない項目は、出力できないように、制約しています。ある契約書には、「本契約は、甲の親会社の承認を、効力の発生の条件とする」という、重要な特約がありましたが、対応する項目がないため、抽出の結果には、含まれませんでした。下流の担当者は、契約が、すでに有効であるものとして、処理を進めました。最も適切な見直しはどれですか。","o":["30の項目に当てはまらない内容は、抽出の対象の外であると割り切る。下流の担当者が、契約書の原本を、毎回、すべて読む運用にする","30の項目は維持したうえで、項目に当てはまらない、重要な条件を記録する、特記事項のフィールドを設ける。値がある場合は、確認の対象とする","スキーマの制約を外して、モデルが、必要と判断した項目を、自由に追加できるようにする。あらゆる特約に、対応できるようになる","想定される、すべての特約について、項目を追加する。項目の数を、30から300に増やして、抜けがないようにする"],"a":[1],"e":"定めた項目だけを出力させる設計は、下流での処理を、安定させますが、想定していなかった、重要な情報を、黙って捨てる危険が、あります。定めた項目は維持したうえで、項目に当てはまらない、重要な条件を記録するフィールドを設ければ、構造の安定と、情報の欠落の防止を、両立できます。項目を、自由に追加できるようにすると、出力の構造が、文書ごとに変わって、下流で処理できなくなります。","w":["抽出による自動化の効果が、失われます。",null,"出力の構造が、文書ごとに変わって、下流で、機械的に処理できなくなります。","想定外の特約は尽きず、項目が多すぎると、精度も下がります。"],"lv":2},{"sc":6,"d":4,"s":"4.1","q":"手書きの申込書を、スキャンした画像から、項目を抽出しています。申込書の中には、金額の欄で、最初に書かれた数字が、二重線で消されて、その横に、訂正の後の数字が、書かれているものがあります。訂正印が、押されているものと、押されていないものが、あります。抽出の結果は、最初の数字が出力されたり、訂正の後の数字が出力されたり、2つを連結した数字が出力されたりして、一定しません。プロンプトには、訂正の扱いについての記載は、ありません。最も適切な改善はどれですか。","o":["訂正のある申込書は、すべて、抽出の対象から外して、人が、最初から入力する。訂正の扱いについての判断が、不要になる","訂正がある場合に、どの値を採用するか、訂正印の有無をどう扱うか、判断できない場合はどうするかを、基準として、プロンプトに明記する","モデルを、画像の認識の性能が、より高いものに切り替える。二重線と、訂正の後の数字を、より正確に、読み取れるようになる","同じ申込書を、3回処理して、最も多く出力された数字を、採用する"],"a":[1],"e":"結果が、一定しない原因は、読み取りの性能ではなく、訂正がある場合に、どうすべきかの基準が、示されていないことです。モデルは、二重線と、2つの数字を、読み取れていても、どれを出力すべきかを、判断できません。採用する値、訂正印の扱い、判断できない場合の対応を、基準として明記します。複数回の処理と、多数決は、基準がないという原因を、解消しません。","w":["訂正のある項目のほかの項目まで、手作業になります。",null,"読み取れていても、どの値を採用すべきかの基準が、ありません。","基準がないという原因は、解消しません。"],"lv":2},{"sc":6,"d":4,"s":"4.2","q":"スキーマでは、記載がない可能性のある項目を、null を許容する定義にしています。プロンプトにも、「記載がない場合は、null とすること」と記載しています。それでも、支払いの条件の記載がない請求書に対して、モデルが、「月末締め、翌月末払い」という、一般的な条件を、出力する事例が、約5%あります。プロンプトに含めている、4件の few-shot の例は、すべて、全項目に、値が記載されている請求書です。最も適切な改善はどれですか。","o":["プロンプトの記載を、「記載がない場合は、絶対に、推測せずに、必ず null とすること」と、強い表現に書き換える","few-shot の例を、4件から12件に増やす。全項目に値が記載されている請求書の例を、さらに追加する","支払いの条件の項目を、必須に変更して、記載がない場合は、「不明」という文字列を、出力させる","few-shot の例に、一部の項目の記載がない請求書と、該当の項目を null とした出力の例を、加える"],"a":[3],"e":"few-shot の例は、モデルの挙動に、強い影響を与えます。すべての例が、全項目に値のある出力であれば、モデルは、「すべての項目を埋めること」を、望ましい挙動として、学びます。記載がない項目を、null とした例を加えることで、null を出力することが、正しい挙動であると、具体的に示せます。同じ種類の例を増やすと、すべてを埋める傾向が、さらに強まります。","w":["指示よりも、例が示す傾向のほうが、強く働きます。","すべての項目を埋める傾向が、さらに強まります。","記載がない場合の表現が、文字列になるだけで、例の偏りは、残ります。",null],"lv":2},{"sc":6,"d":4,"s":"4.4","q":"抽出の結果が、検証に失敗した場合に、エラーの内容を添えて、再度、抽出を依頼しています。ある契約書では、12の項目のうち、「支払期日」だけが、形式の誤りで、検証に失敗しました。再抽出の結果、「支払期日」は、正しい形式になりましたが、1回目には正しかった、「契約金額」と「相手方の名称」が、異なる値に、変わっていました。変わった後の値は、形式としては正しいため、検証を通過して、誤った値が、下流に渡りました。最も適切な改善はどれですか。","o":["再抽出の結果を、常に、最終の結果として採用する。後から行った抽出のほうが、エラーの内容を踏まえているため、全体として、正確である","検証に失敗した場合は、再抽出を行わずに、契約書の全体を、人の入力に回す","再抽出を、3回行って、3回の結果のうち、項目ごとに、最も多かった値を、採用する","検証に失敗した項目だけを、修正の対象として指定する。検証を通過した項目は、1回目の値を保持して、変わっていた場合は、確認に回す"],"a":[3],"e":"再抽出では、モデルは、全体を、もう一度生成するため、問題のなかった項目まで、変わることがあります。検証に失敗した項目だけを、修正の対象として指定して、通過した項目は、1回目の値を保持します。再抽出で、値が変わった項目は、どちらが正しいのかが、不明であるため、確認に回します。再抽出の結果を、無条件に採用すると、正しかった値が、誤った値に、置き換わるおそれがあります。","w":["1回目に正しかった値が、誤った値に、置き換わるおそれがあります。","修正できる形式の誤りまで、人の入力に回すことになります。","コストが増えるうえに、変わった値が正しい保証は、ありません。",null],"lv":2},{"sc":6,"d":4,"s":"4.4","q":"賃貸借契約書の抽出の結果は、すべて、スキーマの検証を、通過しています。しかし、下流のシステムで、「契約の開始日が、終了日よりも後になっている」「月額の賃料に、契約の月数を掛けた値が、契約の総額と、大きく異なる」といったデータが、月に、数十件、見つかっています。個々の項目は、日付や、数値として、正しい形式です。最も適切な改善はどれですか。","o":["抽出の後に、項目の間の関係（日付の前後、金額の整合など）を、コードで検証する。不整合がある場合は、原因を示して、再抽出するか、確認に回す","抽出の後に、独立したインスタンスに、結果を読ませて、項目の間に、不整合がないかを、確認させる","スキーマの、日付と金額のフィールドの形式の指定を、さらに厳密にする。形式が厳密であれば、項目の間の不整合も、起こらなくなる","プロンプトに、「開始日は、終了日よりも前でなければならない」という注意を追加する。モデルが、出力の前に、確認するようになる"],"a":[0],"e":"スキーマの検証が、確認するのは、個々の項目の、形式と型です。項目の間の関係（日付の前後、金額の整合など）は、確認しません。これらは、業務上の規則として、コードで、決定的に検証できます。抽出の直後に検証すれば、不整合のあるデータが、下流に流れる前に、再抽出や、確認に回せます。プロンプトでの注意は、不整合を減らしても、保証には、なりません。","w":[null,"日付の前後や、金額の整合は、コードで、決定的に検証できます。モデルによる確認は、不確実で、コストもかかります。","形式を厳密にしても、項目の間の関係は、検証されません。","不整合は減っても、保証にはなりません。"],"lv":2},{"sc":6,"d":4,"s":"4.5","q":"1日に届く、約6万件の文書のうち、大半は、翌営業日までに処理できれば、問題ありません。ただし、「至急」と指定された、約300件は、受領から1時間以内に、結果を返す必要があります。現在は、すべての文書を、同期の API で、届いた順に処理しており、コストが、予算を大きく超えています。担当者は、「すべてを、Message Batches API に移して、コストを半分にする」ことを、提案しています。最も適切な構成はどれですか。","o":["提案のとおり、すべての文書を、Message Batches API で処理する。バッチは、多くの場合、1時間以内に完了するため、至急の文書の要件も、満たせる","至急の文書は、同期の API で、優先して処理する。それ以外の文書は、Message Batches API で処理する","至急の文書を、Message Batches API で処理して、それ以外の文書を、同期の API で処理する。至急の文書のコストを、優先して下げる","すべての文書を、同期の API のままにして、モデルを、最も小さいものに切り替える。コストが下がり、すべての文書を、すぐに処理できる"],"a":[1],"e":"処理の経路は、遅延の要件に応じて、分けます。翌営業日までに処理できればよい、大半の文書は、Message Batches API によって、コストを、大きく下げられます。一方、1時間以内という要件のある文書は、バッチでは、完了の時刻が、保証されないため、同期の API で処理します。バッチが、多くの場合、早く完了するとしても、それは、保証では、ありません。","w":["バッチは、完了の時刻が保証されず、1時間以内の要件を、満たせません。",null,"経路の割り当てが、逆になっています。","抽出の精度への影響を、評価していません。"],"lv":2},{"sc":6,"d":4,"s":"4.6","q":"海外への送金の指示書から、送金先の口座番号、金額、通貨を抽出して、送金のシステムに登録しています。これらの項目の誤りは、誤った送金に、直結します。現在の抽出の精度は、検証用のデータで、98.5%です。件数が多いため、すべてを、人が確認することは、できません。残りの1.5%の誤りを、できるだけ、登録の前に見つけたいと考えています。最も適切な設計はどれですか。","o":["抽出の結果を、同じセッションで、モデルに読み返させて、誤りがないかを、自己点検させる","抽出のプロンプトの末尾に、「出力の前に、口座番号と金額を、もう一度、確認すること」という指示を追加する","精度が、100%に達するまで、プロンプトの改善を続ける。それまでは、すべての指示書を、人が入力する","独立したインスタンスで、もう一度抽出して、重要な項目の値が、一致しないものを、人の確認に回す"],"a":[3],"e":"同じセッションでの読み返しは、最初の抽出の推論を、引き継いでいるため、同じ誤りを、見逃しやすくなります。独立したインスタンスで、もう一度抽出して、結果を比べれば、不一致という形で、誤りの可能性がある項目を、絞り込めます。人の確認を、不一致のあるものに集中させることで、限られた確認の能力を、有効に使えます。精度が、100%に達することは、期待できません。","w":["最初の抽出の推論を引き継いでおり、同じ誤りを、見逃しやすくなります。","指示だけでは、読み誤りを、検出できません。","100%の精度は期待できず、自動化の効果も、得られません。",null],"lv":2},{"sc":6,"d":5,"s":"5.5","q":"取引先の登録の申請書から、30の項目を抽出しています。確信度が、較正された基準を上回る項目は、自動で登録して、下回る項目だけを、人が確認しています。先月、「振込先の口座番号」が、高い確信度で、1桁誤って抽出されて、そのまま登録されて、誤った口座への支払いが、発生しました。「振込先の口座番号」の精度は、検証用のデータで、99.6%です。人による確認の設計として、最も適切な見直しはどれですか。","o":["全項目の確信度の基準を、一律に引き上げて、より多くの項目が、確認に回るようにする","「振込先の口座番号」の精度が、十分に高いため、今回の事例は、例外として扱い、設計は、変更しない","誤りの影響が、特に大きい項目は、確信度にかかわらず、常に、確認や照合の対象とする。それ以外の項目は、これまでどおり、確信度で振り分ける","すべての項目について、確信度にかかわらず、人が確認する方式に戻す"],"a":[2],"e":"人による確認の要否は、誤りの確率だけでなく、誤った場合の影響の大きさによって、決めます。精度が、99.6%であっても、件数が多ければ、誤りは、必ず発生します。誤った場合の影響が、特に大きい項目は、確信度にかかわらず、常に、確認や、別の情報源との照合の対象とします。全項目の基準を、一律に引き上げると、影響の小さい項目の確認が増えて、負担が、過大になります。","w":["影響の小さい項目の確認が増えて、負担が、過大になります。","件数が多ければ、同じ誤りは、ふたたび発生します。",null,"影響の小さい項目まで、すべて確認することになり、自動化の効果を失います。"],"lv":2},{"sc":6,"d":5,"s":"5.5","q":"抽出のチームの評価の指標は、「人の確認なしに、自動で処理された文書の割合」だけです。この割合を高めるために、チームは、人の確認に回す基準を、段階的に緩めて、割合は、3か月で、62%から91%に上昇しました。同じ時期に、下流の経理部門での、データの訂正の件数が、約4倍に増えています。この訂正の件数は、抽出のチームの指標には、含まれていません。最も適切な対応はどれですか。","o":["自動で処理された割合に加えて、自動で処理された文書の誤りの割合を、抜き取りの検査などで測定して、両方を、指標とする","自動で処理された割合の目標を、91%から95%に引き上げる。割合が高まれば、全体の効率は、さらに向上する","自動で処理された割合の目標を、現在の91%で固定して、基準は、これ以上緩めない","自動で処理された割合の測定を、やめる。数値の目標は、望ましくない行動を招くため、指標は、設けない"],"a":[0],"e":"1つの指標だけを、追い求めると、その指標に表れない部分が、犠牲になります。自動で処理された割合は、基準を緩めれば、いくらでも上げられますが、その分、誤りが、下流に流れます。自動で処理された文書の、誤りの割合を、あわせて測定して、両方を、指標とすることで、効率と品質の釣り合いを、保てます。指標を、なくすと、改善の方向も、分からなくなります。","w":[null,"誤りが、さらに下流に流れます。","すでに増えている誤りが、把握されないまま、残ります。","効率も、品質も、把握できなくなります。"],"lv":2},{"sc":6,"d":5,"s":"5.6","q":"古い契約書を、スキャンした画像から、項目を抽出しています。一部のページは、かすれや、汚れのために、文字が、ほとんど読み取れません。そのようなページの項目について、モデルは、前後の文脈から、もっともらしい値を、出力しています。出力は、明瞭に読み取れた項目と、同じ形式であり、下流では、区別が、つきません。ある契約書では、読み取れなかった違約金の額が、推測で埋められて、誤った金額が、記録されました。最も適切な設計はどれですか。","o":["モデルに、すべての項目について、「読み取りに、自信があるか」を、文章で説明させて、下流の担当者が、説明を読んで、判断する","読み取れない項目については、同じ種類の、ほかの契約書の、一般的な値を、既定値として、出力させる","かすれや、汚れのあるページを含む契約書は、すべて、抽出の対象から外す","読み取れない項目は、値を出力させずに、読み取れなかったことと、該当のページを、明示させる。その項目は、確認に回す"],"a":[3],"e":"読み取れない箇所を、推測で埋めると、不確かな値が、確かな値と、同じ形で、下流に流れます。読み取れなかった項目は、値を出力させずに、読み取れなかったという事実と、該当の箇所を、明示させます。こうすれば、下流は、その項目を、確認の対象として、扱えます。契約書の全体を、対象から外すと、明瞭に読み取れる、ほかの項目まで、失われます。","w":["担当者の負担が大きく、機械的に、振り分けられません。","その契約書の値ではない、根拠のない値が、記録されます。","明瞭に読み取れる、ほかの項目まで、失われます。",null],"lv":2},{"sc":6,"d":5,"s":"5.6","q":"3か月前に、抽出のプロンプトを改訂して、モデルのバージョンも、更新しました。今月、監査の担当者から、「昨年の11月に処理した、ある契約書の、抽出の結果が、現在の結果と異なる。どちらが、どのような条件で、抽出されたものなのか」という問い合わせが、ありました。保存されているのは、抽出された値だけで、どのプロンプトと、どのモデルで、抽出されたのかは、記録されていません。今後に向けた改善として、最も適切なものはどれですか。","o":["問い合わせがあった場合は、現在のプロンプトとモデルで、もう一度抽出して、その結果を、正しいものとして、回答する","抽出の結果とともに、処理の日時だけを記録する。プロンプトとモデルのバージョンは、日時から、変更の履歴をたどって、特定する","今後は、プロンプトと、モデルのバージョンを、一切変更しない。結果が、時期によって異なることが、なくなる","抽出の結果とともに、使用したプロンプトのバージョン、モデルのバージョン、処理の日時を、記録する"],"a":[3],"e":"抽出の結果は、プロンプトと、モデルに、依存します。これらは、時間とともに、変わります。結果とともに、どのバージョンのプロンプトと、モデルで、いつ処理されたのかを記録しておけば、結果の違いを、後から、説明できます。現在の条件で、もう一度抽出しても、当時の結果が、どのように得られたのかは、分かりません。バージョンを、固定し続けることは、改善と、モデルの廃止への対応を、妨げます。","w":["当時の結果が、どのように得られたのかは、分かりません。","変更の履歴との照合が必要になり、反映の時刻のずれなどで、特定を誤るおそれがあります。","改善と、モデルの廃止への対応が、できなくなります。",null],"lv":2},{"sc":6,"d":5,"s":"5.1","q":"ある取引については、基本の契約書（2022年）に加えて、3通の覚書（2023年、2024年、2025年）があり、4つの文書を、まとめて処理します。2024年の覚書は、基本の契約書の、支払いの条件を、変更しています。現在は、4つの文書を、区切りなしに連結して、渡しており、抽出の結果には、変更の前の、基本の契約書の支払いの条件が、出力されることが、あります。最も適切な改善はどれですか。","o":["文書ごとに、種類と日付を示して、区切って渡す。後の文書が、前の文書の条項を変更している場合は、変更の後の内容を採用して、根拠の文書を記録するよう、指示する","最も新しい、2025年の覚書だけを渡して、抽出する。最新の文書であるため、現在の条件が、反映されている","基本の契約書だけを渡して、抽出する。覚書は、補足の文書であるため、抽出の対象には、含めない","4つの文書から、別々に抽出して、項目ごとに、最も多く現れた値を、採用する"],"a":[0],"e":"複数の文書の間には、後の文書が、前の文書を変更する、という関係があります。区切りなしに連結すると、どの記載が、どの文書の、いつの時点のものかが、分からなくなります。文書ごとに、種類と日付を示して、区切って渡して、後の文書による変更を反映するよう、指示します。最新の覚書だけを渡すと、その覚書が触れていない条件（2024年の変更など）が、抽出されません。","w":[null,"2025年の覚書が触れていない条件が、抽出されません。","覚書による変更が、反映されません。","変更の前の値のほうが、多く現れることがあります。"],"lv":2},{"sc":6,"d":5,"s":"5.2","q":"請求書の抽出のパイプラインに、取引先から、誤って、見積書や、納品書が、送られてくることがあります。これらの文書にも、金額や、日付の欄があるため、モデルは、請求書のスキーマに合わせて、項目を埋めて、出力します。その結果、見積書の金額が、請求の金額として、支払いの予定に登録される事故が、発生しました。出力は、スキーマの検証を、通過していました。最も適切な設計はどれですか。","o":["取引先に、請求書以外の文書を、送らないよう、依頼して、パイプラインは、変更しない","抽出された金額が、過去の平均の2倍を超える場合に、警告を出す検査を、追加する","抽出の前に、文書の種類を判定する。請求書ではない場合は、抽出を行わずに、種類の不一致として、別の経路に回す","請求書のスキーマを、見積書や、納品書の項目も含むように、拡張する。どの種類の文書でも、同じスキーマで、抽出できるようにする"],"a":[2],"e":"入力が、想定している種類の文書であるかどうかを、確認せずに抽出すると、想定の外の文書でも、もっともらしい出力が、生成されます。スキーマの検証は、形式を確認するだけで、文書の種類が正しいかどうかは、確認しません。抽出の前に、文書の種類を判定して、想定の外の文書は、抽出を行わずに、別の経路に回します。金額による検査は、見積書の金額が、通常の範囲であれば、機能しません。","w":["誤って送られることを、完全には防げません。","見積書の金額が、通常の範囲であれば、検出されません。",null,"見積書と請求書の区別がないままであり、同じ事故が起こります。"],"lv":2}],"count":60},"CCAR-P":{"code":"CCAR-P","name":"Claude Certified Architect – Professional","audience":"上級アーキテクト向け","minutes":120,"domains":[{"name":"ソリューション設計とアーキテクチャ","w":17},{"name":"Claude モデル、プロンプト、コンテキストエンジニアリング","w":13},{"name":"統合","w":19},{"name":"評価、テスト、最適化","w":16},{"name":"ガバナンス、安全性、リスク管理","w":14},{"name":"ステークホルダーとのコミュニケーション、ライフサイクル管理","w":14},{"name":"開発者の生産性と運用の支援","w":7}],"quota":{"1":11,"2":8,"3":12,"4":10,"5":9,"6":9,"7":4},"questions":[{"d":1,"lv":1,"q":"ある企業が、約2,000件の社内FAQ文書に基づいて、従業員の質問に回答する仕組みを求めています。質問のほとんどは、1つの文書を参照すれば回答できます。最初に提案するアーキテクチャとして、最も適切なものはどれですか。","o":["関連する文書を検索してプロンプトに含め、1回の呼び出しで回答を生成する、拡張された LLM の構成","すべてのツールを与えた自律エージェントが、必要な手順を自分で決めて実行する構成","コーディネーターと、検索、分析、回答の各サブエージェントからなる、マルチエージェントのシステム","2,000件の文書の全文を、毎回のリクエストのコンテキストに含める構成"],"a":[0],"e":"要件を満たす最も単純な構成から始めるのが、設計の原則です。1つの文書を参照すれば回答できる質問には、検索と1回の生成を組み合わせた、拡張された LLM の構成で十分です。マルチエージェントや自律エージェントは、複雑さ、コスト、遅延を増やしますが、この要件には見合う利点がありません。全文をコンテキストに含める構成は、コストと精度の面で不利です。","w":[null,"手順が単純で決まっているため、自律性は不要です。","1つの文書で答えられる質問には、複雑さとコストが過剰です。","コンテキストの上限とコストの面で、現実的ではありません。"]},{"d":1,"lv":1,"q":"保険金の請求を処理するシステムを設計します。処理は、書類の確認、契約の照合、支払額の算定、承認の4段階で、順序は規制上、固定されています。各段階の判断の記録を、監査のために残す必要があります。最も適切なパターンはどれですか。","o":["請求の種類を分類し、種類ごとに異なる自律エージェントに振り分ける構成","4つの段階を同時に実行し、結果を最後に統合する、並列化の構成","各段階を決まった順序で実行し、段階の間にコードによる検証と記録を挟む、ワークフロー","目的だけを与え、処理の順序と使うツールを自分で決めさせる、自律エージェント"],"a":[2],"e":"手順と順序が固定されており、監査のための予測可能性が求められる処理には、ワークフローが適しています。各段階の入出力を、コードで検証し、記録できます。自律エージェントは、手順を事前に決められない場合のためのもので、順序の遵守と監査のしやすさを損ないます。段階の間に依存関係があるため、並列化はできません。","w":["順序の保証と監査の記録が、得られません。","各段階は、前の段階の結果に依存しています。",null,"規制上、順序が固定されており、逸脱が許されません。"]},{"d":1,"lv":1,"q":"本番環境の障害の原因調査を支援するシステムを設計します。調査の対象となるログ、メトリクス、設定の組み合わせは、障害ごとに異なり、次に何を調べるべきかは、それまでの発見によって変わります。最も適切なパターンはどれですか。","o":["ログの全量を1回のプロンプトに含めて、原因を答えさせる、単発の呼び出し","発見に応じて次の手順を決める、エージェントの構成。読み取り専用のツールと、停止条件を設ける","調査の手順を、障害の種類ごとにあらかじめ定義した、分岐の多いワークフロー","すべての障害に対して、同じ順序で同じ項目を調べる、固定のワークフロー"],"a":[1],"e":"必要な手順を事前に予測できず、途中の発見によって進め方が変わる、開放的なタスクには、エージェントの構成が適しています。自律性に伴うリスクは、読み取り専用のツールや停止条件といったガードレールで抑えます。固定のワークフローや、あらかじめ定義した分岐は、想定外の障害に対応できません。","w":["コンテキストの上限を超え、発見に応じた深掘りもできません。",null,"事前に、すべての経路を定義することはできません。","障害ごとに、調べるべき対象が異なります。"]},{"d":1,"lv":1,"q":"チームが、月次レポートの要約を作る処理に、6つのエージェントからなるシステムを提案しています。処理の内容は、決まった3つの資料を読み、決まった構成の要約を出力することです。アーキテクトとしての評価として、最も適切なものはどれですか。","o":["エージェント同士が、コーディネーターを介さずに直接やり取りする構成に変えて、調整のコストを減らす","手順が固定された単純な処理なので、少数の呼び出しによるワークフローで十分であり、過剰である","エージェントの数が多いほど品質が上がるので、提案を採用する","エージェントを6つから12に増やし、検証の役割を追加する"],"a":[1],"e":"マルチエージェントの構成は、独立した並列の作業や、1つのコンテキストに収まらない規模、役割ごとに異なるツールが必要な場合に、価値があります。一方で、トークンの消費、遅延、デバッグの難しさが増します。手順が固定された単純な処理には、過剰な設計です。複雑さは、それに見合う利点がある場合にだけ導入します。","w":["複雑さの問題が残り、追跡も難しくなります。",null,"エージェントの数は、品質を保証しません。","複雑さとコストを、さらに増やします。"]},{"d":1,"lv":1,"q":"顧客対応の回答案を生成するシステムを設計しました。入力、処理、出力は定義されていますが、運用を始めた後に品質を改善していく仕組みがありません。追加すべき設計要素として、最も適切なものはどれですか。","o":["入力の文字数に上限を設けて、処理の負荷を下げる仕組み","すべての出力を、顧客に送信する前に、開発チームのメンバーが目視で1件ずつ確認して、承認する工程","出力を、より大きなモデルでもう一度生成し直す、後段の処理","担当者による修正や採否の結果を記録し、評価データとプロンプトの改善に還元する経路"],"a":[3],"e":"エンドツーエンドのアーキテクチャには、入力、処理、出力に加えて、フィードバックのループが必要です。利用者による修正や採否の結果は、何がうまくいっていないのかを示す、最も価値のある情報です。これを評価データとプロンプトの改善に還元することで、継続的に品質を高められます。再生成や目視の確認は、改善の仕組みにはなりません。","w":["品質の改善とは、関係がありません。","規模に対応できず、改善に還元する仕組みにもなりません。","改善のための学習の経路には、なりません。",null]},{"d":1,"lv":1,"q":"100ページを超える契約書から、リスクのある条項を特定して報告するシステムを設計します。1回のプロンプトですべてを行わせると、見落としと誤分類が多発します。分解の方法として、最も適切なものはどれですか。","o":["条項の抽出、種類の分類、リスクの評価に分け、段階の間に検証を挟む","プロンプトに「見落とさないこと」と追記し、出力の上限を引き上げる","同じプロンプトを5回実行し、指摘された条項の和集合を採用する","契約書を先頭の20ページに切り詰めて、処理の対象を減らす"],"a":[0],"e":"複雑な問題は、それぞれが単純で検証可能な段階に分解します。条項の抽出、分類、リスクの評価に分けることで、各段階に注意を集中でき、段階の間で出力を検証できます。追記や上限の引き上げは、タスクの構造を変えません。対象の切り詰めは、要件を満たしません。和集合の採用は、誤検知を増やします。","w":[null,"1回のプロンプトにすべてを詰め込む構造は、変わりません。","コストが増え、誤検知も増えます。","残りのページの条項を、見落とします。"]},{"d":1,"lv":1,"q":"経営層から、「AI で業務を変革してほしい」という、漠然とした依頼を受けました。最初に取り組むユースケースを選ぶ基準として、最も適切なものはどれですか。","o":["開発チームが最も強い関心を持っており、新しい技術や手法を、実際の案件で試すことができるユースケース","事業上の価値を測定でき、必要なデータが揃っており、リスクを管理できるユースケース","経営層が最初に口にした、最も規模の大きいユースケース","技術的に最も高度で、社外にアピールしやすいユースケース"],"a":[1],"e":"ソリューションは、効率、変革、生産性、コスト、性能といった、事業上の価値の柱に結び付けます。最初のユースケースは、価値を測定でき、データが利用可能で、リスクを管理できるものを選びます。これにより、成果を示して、次の段階への支持を得られます。技術的な高度さや規模の大きさは、成功の可能性を高めません。","w":["技術的な関心は、事業上の価値を示しません。",null,"最初の取り組みとしては、リスクが大きすぎます。","事業上の価値と、実現の可能性を基準にしていません。"]},{"d":1,"lv":1,"q":"顧客向けのチャットに、「95パーセンタイルで、3秒以内に応答を開始する」という SLA があります。一方で、一部の質問は、数十秒かかる深い分析を必要とします。アーキテクチャとして、最も適切なものはどれですか。","o":["通常の質問は高速なモデルとストリーミングで応答し、深い分析は非同期の処理に分ける","すべての質問を最上位のモデルで処理し、SLA は努力目標とする","すべての質問で深い分析を実行し、完了するまでのあいだ、待機中であることを示す表示を出し続ける","すべての質問を最も小さいモデルで処理し、深い分析は提供しない"],"a":[0],"e":"性能の SLA と、処理の深さの要求が対立する場合は、経路を分けます。大半の質問は、高速なモデルとストリーミングで SLA を満たし、時間のかかる分析は、非同期の処理として扱います。一律に最上位のモデルを使うと SLA を満たせず、一律に小さいモデルを使うと、必要な機能を提供できません。","w":[null,"要件を満たしていません。","応答を開始するまでの時間の要件を、満たしません。","必要な機能を、捨てることになります。"]},{"d":1,"lv":1,"q":"コードの変更を依頼すると、影響を受けるファイルを特定して修正するシステムを設計します。変更が必要なファイルの数と内容は、依頼ごとに異なり、事前には分かりません。最も適切なオーケストレーションの方式はどれですか。","o":["入力を分類して、あらかじめ決めた処理に振り分ける、ルーティング","オーケストレーターが、必要なサブタスクを動的に決めて、ワーカーに委任する方式","同じ処理を複数回実行して、結果を比較する、投票による並列化","あらかじめ決めた3つの手順を、常に順番に実行する、プロンプトチェーン"],"a":[1],"e":"サブタスクの数と内容が、入力によって決まり、事前に予測できない場合は、オーケストレーターとワーカーの方式が適しています。オーケストレーターが、タスクを動的に分解し、ワーカーに委任して、結果を統合します。ルーティングやプロンプトチェーンは、処理の構成があらかじめ決まっている場合のためのものです。","w":["作業の内容を、事前に種類として決められません。",null,"同じ作業を繰り返す構成であり、作業の分解
