: \"enabled\", \"budget_tokens\": 8000}` が含まれています。最も適切な対応はどれですか。","o":["400 エラーが発生した場合にだけ、thinking の指定を取り除いたリクエストを自動的に再送する処理を追加する","一時的な障害であるため、指数バックオフでリトライする","新しいモデルでは手動の思考予算が使えないため、移行ガイドに従って適応型思考と `effort` に置き換える","`budget_tokens` の値が小さすぎるため、値を大きくして再送する"],"a":[2],"e":"モデルの世代が変わると、パラメータの扱いが変わることがあります。新しいモデルでは、`budget_tokens` による手動の思考予算が受け付けられず、適応型思考と `effort` を使用します。モデルを更新するときは、移行ガイドで破壊的な変更を確認し、評価セットで回帰を確認します。値の変更やリトライでは、解決しません。エラー時に指定を取り除く処理は、意図しない挙動の変化を見えにくくします。","w":["意図しない挙動の変化を、見えにくくします。","400 は、一時的な障害ではありません。",null,"値の問題ではなく、パラメータ自体が受け付けられません。"]},{"d":5,"s":"5.4","lv":2,"q":"仮に、入力の料金が100万トークンあたり3ドル、出力の料金が100万トークンあたり15ドルであるとします。1リクエストあたりの平均は、入力が2,000トークン、出力が500トークンで、月に100万リクエストを処理します。キャッシュやバッチの割引は使用しません。月額の費用として正しいものはどれですか。","o":["13,500ドル","6,000ドル","7,500ドル","37,500ドル"],"a":[0],"e":"入力は 2,000 × 100万 = 20億トークンで、20億 ÷ 100万 × 3ドル = 6,000ドルです。出力は 500 × 100万 = 5億トークンで、5億 ÷ 100万 × 15ドル = 7,500ドルです。合計は 13,500ドルになります。出力のトークン数は入力の4分の1ですが、単価が高いため、費用は入力を上回ります。コストの見積もりでは、入力と出力を分けて計算します。","w":[null,"入力の分だけの金額です。","出力の分だけの金額です。","入力にも、出力の単価を適用した金額です。"]},{"d":5,"s":"5.4","lv":2,"q":"API の月額の費用が急増しましたが、どの機能や顧客が原因なのかが分かりません。最も適切な対応はどれですか。","o":["原因の特定は後回しにして、すべてのリクエストの `max_tokens` を、一律に現在の半分に引き下げる","すべての機能を、最も小さいモデルに切り替える","各レスポンスの `usage` を、機能や顧客を示す識別子とともに記録して、集計する","請求の合計額を、週ごとに確認する"],"a":[2],"e":"コスト管理の基本は、使用量を、原因が分かる単位で把握することです。各レスポンスの `usage` を、機能や顧客の識別子とともに記録すると、どこで消費が増えたのかを特定できます。合計額の確認だけでは、内訳が分かりません。`max_tokens` の一律の削減や、モデルの一律の変更は、原因を特定しないまま、品質を損なうおそれがあります。","w":["原因を特定しておらず、品質を損なうおそれがあります。","原因を特定しておらず、品質を損なうおそれがあります。",null,"内訳が分かりません。"]},{"d":6,"s":"6.1","lv":2,"q":"コードベースを扱うエージェントが、起動時に、全ファイルの内容をコンテキストに読み込む設計になっています。無関係な情報が多く、精度の低下とコストの増加が起きています。最も適切な設計変更はどれですか。","o":["全ファイルの内容を system プロンプトに移して、固定の内容とする","全ファイルの内容をあらかじめ別の呼び出しで要約しておき、その要約のすべてを、起動時に読み込ませる","コンテキストウィンドウが最も大きいモデルを選び、設計は変更しない","ファイルの一覧などの手がかりだけを与え、必要になった時点で、ツールで該当のファイルを読み込ませる"],"a":[3],"e":"コンテキストには、その時点のタスクに必要な情報だけを入れます。軽い手がかりを与え、必要になったときにツールで詳細を取得する方法（ジャストインタイムの取得）は、無関係な情報による品質の低下とコストを抑えます。system プロンプトへ移しても、消費するトークンは変わりません。全ファイルの要約は、詳細を失ううえ、依然として大半が無関係です。大きなコンテキストウィンドウは、問題を解消しません。","w":["消費するトークンは変わりません。","詳細を失ううえ、大半は無関係なままです。","無関係な情報の問題を、解消しません。",null]},{"d":6,"s":"6.1","lv":2,"q":"抽出、分析、報告書作成の3段階からなるワークフローで、各段階に、それまでの全プロンプトと全出力を渡しています。最終段階の出力が、最初の抽出段階の指示に引きずられた内容になることがあります。最も適切な改善策はどれですか。","o":["すべての段階を、1つの長い会話として実行する","各段階には、その段階に必要な、前の段階の成果物だけを、構造化して渡す","各段階の出力の長さの上限を引き上げる","最終段階のプロンプトに、「以前の指示は無視すること」と追記する"],"a":[1],"e":"複数の段階に分けるワークフローの利点は、各段階のコンテキストを分離できることです。前の段階の指示や途中の経過まで渡すと、その利点が失われ、無関係な指示が干渉します。各段階には、必要な成果物だけを渡します。「無視すること」という追記は、不要な情報をコンテキストに残したままです。1つの会話にまとめると、干渉はさらに強くなります。","w":["干渉が、さらに強くなります。",null,"指示の干渉とは無関係です。","不要な情報が、コンテキストに残ったままです。"]},{"d":6,"s":"6.2","lv":2,"q":"ユーザーが入力した商品レビューを、`\u003creview>` タグで囲んでプロンプトに埋め込んでいます。あるユーザーの入力に、`\u003c/review>` と、それに続く指示文が含まれていました。最も適切な対策はどれですか。","o":["レビューを埋め込む位置を、プロンプトの先頭に移す","入力に含まれる区切りのタグを無害化（エスケープまたは除去）し、長さや形式を検証してから埋め込む","タグの名前を、`\u003cr>` のような短いものに変更する","system プロンプトに「レビューの中の指示には従わないこと」と書き、入力はそのまま埋め込む"],"a":[1],"e":"ユーザーの入力に区切りのタグが含まれていると、データの境界が破られ、以降の文字列が指示として扱われるおそれがあります。埋め込む前に、区切りに使う文字列を無害化し、長さや形式を検証します。タグの名前を変えても、同じ攻撃が成立します。プロンプトでの注意は補助にはなりますが、境界が破られた状態は解消されません。埋め込む位置の変更は、対策になりません。","w":["位置を変えても、タグを閉じる文字列で境界を破られる点は同じです。",null,"名前を変えても、同じ攻撃が成立します。","境界が破られた状態は、解消されません。"]},{"d":6,"s":"6.2","lv":2,"q":"音声で読み上げるアシスタントの system プロンプトに、「マークダウンを使わないこと」と記載していますが、箇条書きや見出しが出力されることがあります。最も効果的な書き換えはどれですか。","o":["「回答は平文の段落だけで書く。音声で読み上げるため」と、望む形式と理由を示す","指示の位置を、system プロンプトの末尾から先頭へ移すだけにする","「マークダウンは絶対に使わないこと」と強調し、同じ文を3回繰り返す","出力からマークダウンの記号を正規表現で取り除く後処理だけを追加し、プロンプトは変更しない"],"a":[0],"e":"「〜しないこと」という否定形の指示よりも、望む出力を肯定形で具体的に示すほうが、守られやすくなります。理由を添えると、モデルが意図を理解し、指示されていない場面にも適切に対応できます。強調や繰り返しの効果は限定的で、過剰な反応を招くこともあります。後処理は安全策として有用ですが、記号を取り除くだけでは、文章の構造が不自然になることがあります。","w":[null,"指示の内容は変わりません。","効果は限定的です。","記号を取り除くだけでは、文章の構造が不自然に残ります。"]},{"d":6,"s":"6.3","lv":2,"q":"構造化出力の機能を利用できない環境で、モデルが出力した JSON を、スキーマで検証しています。検証に失敗した場合の処理として最も適切なものはどれですか。","o":["検証に失敗した項目を、空の文字列で埋めて通過させる","検証エラーの内容をモデルに伝えて再生成させ、回数に上限を設けて、超えたら人の確認に回す","検証に成功する出力が得られるまで、同じプロンプトのままで、回数の制限を設けずに再試行を続ける","失敗した出力を、そのまま後続の処理に渡す"],"a":[1],"e":"防御的な解析では、検証に失敗した場合の経路を設計しておきます。エラーの内容をモデルに伝えると、修正される可能性が高まります。回数の上限と、超えた場合の代替の経路（フォールバックや人の確認）を設けて、処理が止まらないようにします。同じプロンプトでの無制限の再試行は、コストが増え、成功の保証もありません。不正な出力を通過させると、後続の処理で障害が起こります。","w":["不正なデータが通過します。",null,"コストが増え、成功の保証もありません。","後続の処理で、障害の原因になります。"]},{"d":6,"s":"6.3","lv":2,"q":"コーディングエージェントが、最終報告で「すべてのテストが成功しました」と述べました。変更を CI に進める前に、ハーネスが行うべきことはどれですか。","o":["報告の文面に、「成功」という語が含まれていることを確認する","エージェントの報告を根拠とせずに、テストを実際に実行して、終了コードと出力を確認する","報告が詳細に書かれていれば、信頼できるものとして扱う","エージェントに、「本当に成功しましたか」と再確認する"],"a":[1],"e":"モデルの報告は、検証された事実ではありません。テストを実行していない、あるいは失敗を見落としたまま、成功と述べることがあります。重要な主張は、実際の実行結果という、独立した証拠で確認します。文面の確認や再確認は、同じ主張を繰り返させるだけです。報告が詳細であることや、断定的であることは、正しさの根拠になりません。","w":["文面は、証拠になりません。",null,"詳しさは、正しさを示しません。","同じ主張を繰り返させるだけです。"]},{"d":7,"s":"7.1","lv":2,"q":"顧客対応のアプリケーションで、デバッグのために、すべてのプロンプトと応答をログに保存しています。ログには、顧客の氏名、住所、カード番号の一部が含まれています。適切な対策を2つ選んでください。","o":["ログに記録する前に、個人情報をマスキングするか、除去する","ログへのアクセス権を必要な担当者に限定し、保持する期間を定める","ログを、ファイル名から内容が分かりにくい場所に置く","system プロンプトに、「個人情報を出力しないこと」と記載する","ログの保存先を、開発者の全員が参照できる共有フォルダにする"],"a":[0,1],"e":"ログは、見落とされやすい情報漏えいの経路です。記録の前に個人情報を最小化すること、そしてアクセス権と保持期間を管理することが、基本的な対策です。保存場所を分かりにくくすることは、保護になりません。system プロンプトの指示は、モデルの出力には影響しても、ユーザーが入力した個人情報が、ログに記録されることを防げません。","w":[null,null,"保護になりません。","入力がログに記録されることを、防げません。","アクセスできる範囲が広がります。"]},{"d":7,"s":"7.2","lv":2,"q":"社内のデータについて回答するエージェントに、SQL を実行するツールを与えます。用途は、売上テーブルの参照だけです。データベースへの接続に使う認証情報として最も適切なものはどれですか。","o":["管理者のアカウントを使い、実行された SQL を、事後にログで確認する","対象のテーブルの読み取りだけを許可した、専用のアカウントを使う","管理者のアカウントを使い、system プロンプトで「参照だけを行うこと」と指示する","読み書きが可能なアカウントを使い、DELETE や DROP を含む SQL を、文字列の一致で拒否する"],"a":[1],"e":"最小権限の原則に従い、エージェントには、用途に必要な権限だけを持つ認証情報を与えます。権限をデータベースの側で制限すれば、誤動作や、注入された指示があっても、被害を構造的に防げます。プロンプトでの指示には、強制力がありません。事後のログの確認は、被害の防止になりません。文字列の一致による拒否は、表記を変えるなどの方法で回避されます。","w":["被害を防げません。",null,"指示には、強制力がありません。","表記を変えるなどの方法で、回避されます。"]},{"d":7,"s":"7.3","lv":2,"q":"全社で、特定の破壊的なコマンドをブロックするフックを、強制的に適用したいと考えています。開発者が、自分の設定で無効にできてはなりません。最も適切な方法はどれですか。","o":["各リポジトリの `.claude/settings.json` に、フックを記述する","各リポジトリの CLAUDE.md に、フックの内容を説明として記載する","各開発者に、`~/.claude/settings.json` へ設定するよう、手順書で依頼する","管理ポリシーの設定（managed settings）として、フックを配布する"],"a":[3],"e":"管理ポリシーの設定は、設定の優先順位の中で最も高く、利用者やプロジェクトの設定では上書きできません。組織として強制したいガードレールは、この階層で配布します。プロジェクトやユーザーの設定は、開発者が変更できます。CLAUDE.md の記載は、コンテキストとして与えられる指示であり、フックとしては実行されません。","w":["開発者が、変更や上書きをできます。","フックとしては実行されません。","設定の漏れや、解除を防げません。",null]},{"d":7,"s":"7.4","lv":2,"q":"開発、検証、本番の各環境で、同じ API キーを共有しています。開発者のノート PC の設定ファイルにも、同じキーが保存されています。最も適切な改善策はどれですか。","o":["環境ごとにキーを分け、本番のキーはシークレット管理の仕組みに保管して、取得できる主体を限定する","キーは全環境で共有のままとし、月に1度、開発者の全員が日時を合わせて、同時に新しいキーへ更新する","本番のキーを、リポジトリの非公開のブランチにコミットして共有する","キーは共有のままとし、各自が設定ファイルを暗号化して保存する"],"a":[0],"e":"キーを環境ごとに分離すると、開発環境での漏えいが、本番に波及しません。本番のキーは、シークレット管理の仕組みに保管し、取得できる主体を限定します。共有のままでは、1か所の漏えいが、すべての環境に影響します。定期的な更新は有効ですが、共有という根本の問題は残ります。リポジトリへのコミットは、非公開であっても、避けるべきです。","w":[null,"キーを共有しているという問題が、残ります。","リポジトリへのコミットは、非公開でも避けるべきです。","キーを共有しているという問題が、残ります。"]},{"d":8,"s":"8.1","lv":2,"q":"請求書のテキストから項目を抽出する処理で、モデルに必ず `record_invoice` ツールを呼び出させたいと考えています。しかし、ときどき、ツールを呼び出さずに、文章で回答が返ります。最も確実な方法はどれですか。","o":["`tool_choice` を `auto` に設定する","ツールの説明に、「必ずこのツールを使うこと」と記載する","`tool_choice` で、そのツールの使用を指定する","`tool_choice` を `none` に設定する"],"a":[2],"e":"`tool_choice` に、ツールの種別と名前を指定すると、モデルに特定のツールの呼び出しを強制できます。`auto` は、呼び出すかどうかをモデルが判断する、既定の動作です。`none` は、ツールを使わせない設定です。説明文への記載は、傾向を強めますが、保証にはなりません。なお、思考を有効にしている場合は、指定できる値に制約があるため、ドキュメントを確認します。","w":["既定の動作であり、呼び出しを強制しません。","傾向は強まりますが、保証にはなりません。",null,"ツールを使わせない設定です。"]},{"d":8,"s":"8.1","lv":2,"q":"社内 API の80個のエンドポイントを、そのまま1対1でツールとして定義しました。エージェントがツールの選択を誤ることが多く、ツール定義によるコンテキストの消費も大きくなっています。改善策として適切なものを2つ選んでください。","o":["ツールをさらに細かく分割して、1つのツールの機能を単純にする","エージェントの実際のタスクに沿って、複数の操作をまとめた、少数の高水準なツールに再設計する","すべてのツールの説明を、1行に短縮する","ツールの結果として、常に API の生のレスポンスの全体を返す","名前と説明で役割の違いが明確になるようにし、機能が重複するツールを整理する"],"a":[1,4],"e":"ツールセットは、API の構造ではなく、エージェントが行うタスクに合わせて設計します。関連する操作をまとめた少数のツールにし、役割の違いを名前と説明で明確にすると、選択の精度が上がり、コンテキストの消費も減ります。さらに細かく分割すると、選択肢が増えて逆効果です。説明を短縮すると、選択の手がかりが失われます。生のレスポンスの全体を返すと、コンテキストを圧迫します。","w":["選択肢が増えて、逆効果です。",null,"選択の手がかりが失われます。","コンテキストを圧迫します。",null]},{"d":8,"s":"8.1","lv":2,"q":"エージェントに、「予定の参照」「メールの送信」「ファイルの削除」のツールを与えます。承認の設計として最も適切なものはどれですか。","o":["承認が必要かどうかの判断を、その都度モデルに任せる","読み取りだけの操作は自動で実行し、送信や削除は、ハーネスが実行前に利用者の承認を求める","すべての操作を自動で実行し、実行の履歴を事後に通知する","安全性を最優先し、参照を含むすべての操作について、実行のたびに毎回、利用者の承認を求める"],"a":[1],"e":"承認の設計は、操作の影響の大きさと、取り消しができるかどうかに応じて決めます。読み取りだけの操作は自動で実行し、副作用のある操作は、ハーネスが実行前に承認を求めます。すべてに承認を求めると、利用者が内容を確認せずに承認するようになり、かえって安全性が下がります。事後の通知では、被害を防げません。承認の要否をモデルに任せると、注入された指示によって回避されるおそれがあります。","w":["注入された指示によって、回避され得ます。",null,"被害を防げません。","確認が形骸化して、かえって安全性が下がります。"]},{"d":8,"s":"8.2","lv":2,"q":"MCP サーバーで、「利用者がメニューから明示的に選んで起動する、定型のコードレビュー依頼のテンプレート」を提供したいと考えています。使用すべきプリミティブはどれですか。","o":["サンプリング（sampling）","プロンプト（prompts）","ツール（tools）","リソース（resources）"],"a":[1],"e":"MCP サーバーが提供する主なプリミティブは3つあります。ツールは、モデルが判断して呼び出す操作です。リソースは、アプリケーションがコンテキストとして取り込むデータです。プロンプトは、利用者が明示的に選んで使う、定型のテンプレートです。この要件には、プロンプトが適しています。サンプリングは、サーバーが、クライアント側のモデルに生成を依頼するための機能です。","w":["サーバーが、モデルに生成を依頼するための機能です。",null,"モデルが判断して呼び出す操作です。","アプリケーションが取り込むデータです。"]},{"d":8,"s":"8.3","lv":2,"q":"1つの社内アプリケーションだけで使用する、単純な関数（社員番号から部署名を返す）を、Claude に呼び出させたいと考えています。他のアプリケーションで再利用する予定はありません。最も簡潔で適切な方法はどれですか。","o":["全社員の対応表を、system プロンプトに含める","そのアプリケーションの API リクエストに、カスタムツールとして直接定義する","専用の MCP サーバーを新たに開発し、別のプロセスとして運用する","部署名を調べる手順を、Skill として作成する"],"a":[1],"e":"単一のアプリケーションで使う単純な関数であれば、API リクエストにカスタムツールとして直接定義するのが、最も簡潔です。MCP サーバーは、複数のアプリケーションやクライアントで再利用する場合に価値がありますが、この要件では、運用の負担が増えるだけです。Skill は、手順や知識を与える手段で、関数の実行には向きません。対応表を system プロンプトに含めると、コンテキストを消費し、更新の管理も必要になります。","w":["コンテキストを消費し、更新の管理も必要になります。",null,"再利用しない用途には、運用の負担が過剰です。","関数の実行には向きません。"]},{"d":8,"s":"8.3","lv":2,"q":"MCP サーバーを通じて、課題管理システムにアクセスできるようになりました。しかし、Claude が起票する課題が、チーム固有の記載ルール（必須の項目、ラベルの付け方）に従っていません。最も適切な対応はどれですか。","o":["MCP サーバーをもう1つ追加し、ルールを返すためのツールを実装する","ルールが守られるまで、起票をやり直させる","課題管理システムへのアクセスを、MCP から、Bash と `curl` による呼び出しに変更する","起票の手順とルールを Skill にまとめ、MCP のツールと組み合わせて使わせる"],"a":[3],"e":"MCP は、外部のシステムへの接続を提供します。一方、Skill は、そのシステムをどのように使うかという、手順や知識を提供します。両者は補完の関係にあり、チーム固有のルールは、Skill にまとめるのが適切です。ルールを返すだけの MCP サーバーは、過剰な実装です。アクセスの手段を変えても、ルールは伝わりません。やり直しは、ルールを伝えない限り、同じ結果を繰り返します。","w":["ルールを伝えるだけの用途には、過剰な実装です。","ルールを伝えない限り、同じ結果になります。","手段を変えても、ルールは伝わりません。",null]},{"d":1,"s":"1.1","lv":2,"q":"依存ライブラリの更新に伴うコードの修正を、自動化します。修正が必要なファイルの数と内容は、更新の内容によって毎回異なり、事前には分かりません。ファイルごとの修正は互いにほぼ独立しています。最も適切な構成はどれですか。","o":["あらかじめ決めた5つの工程を、常に同じ順序で実行するプロンプトチェーン型にして、工程の数を固定する","入力を3つの種類に分類し、種類ごとに用意した固定の処理へ振り分けるルーティング型にする","中心となるモデルが必要な作業を洗い出して割り振り、結果を統合するオーケストレーター・ワーカー型","すべてのファイルの内容を1つのプロンプトに連結し、1回の呼び出しで、全ファイルの修正を出力させる"],"a":[2],"e":"必要な作業の数と内容が入力によって変わり、事前に決められない場合は、中心となるモデルが作業を動的に分解して割り振る、オーケストレーター・ワーカー型が適しています。プロンプトチェーン型やルーティング型は、工程や種類を事前に固定できる場合の構成です。1回の呼び出しにまとめると、コンテキストと出力の上限に達しやすく、修正の質も下がります。","w":["作業の数と内容を、事前に固定できません。","問題は入力の種類ではなく、作業の数と内容が変わることです。",null,"コンテキストと出力の上限に達しやすく、修正の質も下がります。"]},{"d":1,"s":"1.1","lv":2,"q":"本番環境の障害の原因を調査する仕組みを開発します。調査では、ログの検索、メトリクスの確認、設定の差分の確認を、前の結果に応じて繰り返します。必要な手順の数は、障害によって大きく異なります。最も適切な設計はどれですか。","o":["3つの調査を常に並列で1回ずつ実行し、得られた結果を、最後に1回の呼び出しで要約する","ツールを与えたエージェントに手順を決めさせ、反復回数の上限と、人に引き継ぐ条件を設ける","「ログ、メトリクス、設定」の順に各1回ずつ調べる固定のワークフローにして、挙動を予測しやすくする","調査に使うツールは与えず、障害の症状の説明だけから、原因をモデルに推測させる"],"a":[1],"e":"手順の数と順序が、途中の結果に依存して変わる、開かれた問題には、モデルが次の行動を決めるエージェントが適しています。そのうえで、反復回数の上限や、人に引き継ぐ条件を設けて、暴走を防ぎます。固定のワークフローや1回ずつの並列実行では、前の結果を踏まえた深掘りができません。","w":["結果に応じて調査を重ねることが、できません。",null,"前の結果を踏まえた深掘りが、できません。","証拠を調べられず、推測だけの結論になります。"]},{"d":1,"s":"1.2","lv":2,"q":"Claude Agent SDK で、親のエージェントが、調査用のサブエージェントに作業を委任しています。親は、ユーザーとの長い会話で、対象のリポジトリや除外すべきディレクトリを把握していますが、サブエージェントは、無関係なディレクトリまで調べてしまいます。原因と対処として、最も適切なものはどれですか。","o":["サブエージェントに与えるツールが不足しているため、すべてのツールを使えるようにする","親の会話履歴は自動的に共有されているため、サブエージェントを再実行すれば解消する","サブエージェントは親の履歴を引き継がないため、前提を委任のプロンプトに明記する","サブエージェントのモデルの性能が不足しているため、より上位のモデルを割り当てる"],"a":[2],"e":"サブエージェントは、独立したコンテキストで動作し、親の会話履歴を自動的には引き継ぎません。サブエージェントが知っているのは、委任のときに渡されたプロンプトの内容だけです。対象、除外の条件、期待する出力の形式といった前提は、委任のプロンプトに明記する必要があります。","w":["ツールを増やしても、除外の条件は伝わりません。","親の履歴は、自動的には共有されません。",null,"原因は、前提が渡されていないことです。"]},{"d":1,"s":"1.2","lv":2,"q":"大規模なコードベースの調査で、メインのエージェントが、検索とファイルの読み込みを大量に行った結果、コンテキストが調査の途中経過で埋まり、本来の実装作業の質が下がっています。サブエージェントの使い方として、最も適切なものはどれですか。","o":["調査と実装の両方をサブエージェントに任せ、メインのエージェントは、何も把握しないまま完了を報告する","サブエージェントは使わず、メインのエージェントのコンテキストウィンドウが大きいモデルに切り替える","調査をサブエージェントに任せ、読み込んだファイルの全文と検索結果のすべてを、そのままメインに返させる","調査をサブエージェントに任せ、メインには、結論と関連するファイルの場所だけを要約して返させる"],"a":[3],"e":"サブエージェントの大きな利点は、コンテキストの分離です。探索の途中経過はサブエージェントの中にとどまり、メインには、要約された結論だけが返ります。全文をそのまま返させると、分離の利点が失われます。コンテキストウィンドウを大きくしても、無関係な情報で埋まるという問題は残ります。","w":["メインが結果を検証できず、内容に責任を持てません。","無関係な情報で埋まるという問題は、残ります。","途中経過がメインに持ち込まれ、分離の利点が失われます。",null]},{"d":1,"s":"1.2","lv":2,"q":"Claude Agent SDK で、長い調査のセッションを進めてきました。ここまでの文脈を保ったまま、2つの異なる実装の方針を、それぞれ試して比較したいと考えています。元のセッションの履歴は、そのまま残しておく必要があります。最も適切な方法はどれですか。","o":["元のセッションから分岐（フォーク）させたセッションを作り、それぞれで別の方針を試す","これまでの履歴をすべて破棄し、2つの方針を、1つのプロンプトで同時に実装させる","新しいセッションを2つ開始し、これまでの経緯を、それぞれに手作業で説明し直す","元のセッションを再開して、1つ目の方針を試し、そのまま続けて、2つ目の方針も試す"],"a":[0],"e":"セッションのフォークを使うと、元のセッションの履歴を変更せずに、同じ文脈から分岐した新しいセッションを作れます。それぞれの分岐で別の方針を試せば、互いの試行が干渉しません。同じセッションで続けて試すと、1つ目の試行の内容が、2つ目の試行のコンテキストに混ざります。","w":[null,"これまでの調査の文脈が、失われます。","文脈の再現に手間がかかり、漏れも生じます。","1つ目の試行が、2つ目の試行のコンテキストに混ざります。"]},{"d":1,"s":"1.3","lv":2,"q":"自作のエージェントループで、「レスポンスにテキストのブロックが含まれていたら、最終回答とみなして終了する」という条件にしています。その結果、Claude が「まず在庫を確認します」というテキストとともにツールを要求した場合にも、ツールを実行せずに終了してしまいます。最も適切な修正はどれですか。","o":["テキストのブロックが2つ以上あるときに限って、最終回答とみなして終了するようにする","system プロンプトに、「ツールを使うときは、テキストを出力しないこと」と指示する","ループを続けるかどうかを、`stop_reason` で判断する","レスポンスの文字数が一定の長さを超えたときに限って、最終回答とみなして終了するようにする"],"a":[2],"e":"Claude は、ツールを要求するときにも、説明のテキストを同じレスポンスに含めることがあります。ループを続けるかどうかは、テキストの有無ではなく、`stop_reason` で判断します。`tool_use` であればツールを実行して結果を返し、`end_turn` であれば終了します。プロンプトで出力を抑える方法は、確実ではありません。","w":["ブロックの数は、ターンの終了を示しません。","指示では確実に抑えられず、終了の判定も誤ったままです。",null,"文字数は、ターンの終了を示しません。"]},{"d":1,"s":"1.3","lv":2,"q":"Web 検索のサーバーツールを使うリクエストで、レスポンスの `stop_reason` が `pause_turn` でした。最も適切な処理はどれですか。","o":["最終回答として扱い、そこまでに得られたテキストを、ユーザーに表示して終了する","エラーとして扱い、同じリクエストを、最初から送り直す","検索の結果に相当する内容をアプリケーションの側で用意し、`tool_result` として返す","受け取った内容を履歴に加えて、そのまま次のリクエストを送り、続きを処理させる"],"a":[3],"e":"`pause_turn` は、サーバーツールを使う長いターンが、途中で一時停止されたことを示します。エラーでも、完了でもありません。受け取った内容をそのまま会話に加えて、次のリクエストを送ると、Claude が続きを処理します。サーバーツールは Anthropic の側で実行されるため、アプリケーションが結果を用意する必要はありません。","w":["ターンは完了しておらず、回答は途中のものです。","エラーではなく、途中までの処理が無駄になります。","サーバーツールは、Anthropic の側で実行されます。",null]},{"d":1,"s":"1.3","lv":2,"q":"チームが、ある機能をマルチエージェントの構成にするかどうかを検討しています。マルチエージェントの構成が、単一のエージェントよりも適している可能性が最も高いのは、どの作業ですか。","o":["数十の独立した情報源を幅広く調べて、結果を統合する調査の作業","1つの関数の中の、数行のバグを修正する作業","互いに密接に依存する複数のファイルを、整合性を保ちながら同時に書き換える作業","ユーザーと1対1で、短い質問に即座に答える対話の作業"],"a":[0],"e":"マルチエージェントの構成は、互いに独立した多数の作業を並列に進められ、それぞれが大量の情報を扱う場合に、効果を発揮します。幅広い調査は、その典型です。一方、トークンの消費は単一のエージェントの数倍になり、密接に依存する作業では、エージェントの間で文脈を共有しにくいことが、かえって不利になります。","w":[null,"小さな作業には、コストと複雑さが見合いません。","エージェントの間で文脈を共有しにくく、整合性を保ちにくくなります。","即時性が必要な短い対話には、遅延とコストが見合いません。"]},{"d":2,"s":"2.1","lv":2,"q":"監査部門は、「AI の入出力は、すべて1年間保存すること」を求めています。一方、プライバシー担当は、「顧客の個人情報は、ログに残さないこと」を求めています。開発者として、最も適切な進め方はどれですか。","o":["両者に意図を確認し、マスキングして保存するなど、両立する案を合意する","プライバシーの要件のほうが重要であると判断し、入出力のログを、一切保存しない","監査の要件のほうが重要であると判断し、個人情報を含む入出力を、そのまま保存する","どちらの要件を優先するかは実装の都合で決め、決定の内容は、文書には残さない"],"a":[0],"e":"要件どうしが衝突している場合、開発者が一方を独断で選ぶのではなく、それぞれの意図を確認して、両立する案を探します。この場合、監査の目的は追跡できることであり、プライバシーの目的は個人情報を残さないことです。マスキングや仮名化をしたうえで保存すれば、両方の目的を満たせる可能性があります。","w":[null,"監査の要件に、反します。","プライバシーの要件に、反します。","要件の衝突を、関係者の合意なしに処理することになります。"]},{"d":2,"s":"2.1","lv":2,"q":"契約書から項目を抽出する機能について、依頼元は「十分な精度で」とだけ述べています。開発に着手する前に行うこととして、最も適切なものはどれですか。","o":["プロンプトに、「100%の精度で抽出すること」と明記する","まず最上位のモデルで実装し、依頼元が満足するかどうかを、リリースの後に確認する","項目ごとに許容できる誤りの水準を決め、正解付きの評価用データを用意する","「十分」の基準は開発チームで決め、依頼元には、完成してから伝える"],"a":[2],"e":"曖昧な品質の要件は、測定できる成功の基準に置き換える必要があります。項目ごとに、どの程度の誤りが許容されるのかを依頼元と決め、正解付きの評価用データで測れるようにします。基準がなければ、改善の方向も、完成の判断も定まりません。プロンプトに精度を書いても、精度は保証されません。","w":["プロンプトに書いても、精度は保証されません。","基準がないままでは、完成したかどうかを判断できません。",null,"業務上の許容範囲は、依頼元でなければ決められません。"]},{"d":2,"s":"2.2","lv":2,"q":"リリースの前の評価では合格していた要約の機能について、リリースから2か月後に、「最近、要約の質が下がった」という声が出始めました。モデルもプロンプトも、変更していません。再発を早期に検知するための仕組みとして、最も適切なものはどれですか。","o":["本番の入出力を継続的に抜き取って評価し、指標の推移を監視する","リリースの前に使った評価用データでの評価を、もう一度だけ実行する","利用者からの苦情が一定の件数に達した時点で、調査を開始する","品質が下がらないよう、モデルの ID を、常に最新を指すエイリアスに変更する"],"a":[0],"e":"モデルとプロンプトが同じでも、本番の入力の傾向が変わると、品質は下がることがあります。リリースの前の評価用データは、その変化を反映しません。本番の入出力を継続的に抜き取って評価し、指標の推移を監視することで、変化を早期に検知できます。苦情を待つ方法では、検知が遅れます。","w":[null,"リリース前のデータは、本番の入力の変化を反映しません。","検知が遅れ、その間、利用者が影響を受け続けます。","意図しない時点で挙動が変わり、原因の切り分けも難しくなります。"]},{"d":2,"s":"2.3","lv":2,"q":"200ページの製品マニュアル（PDF）について、1日に数百回、異なる質問に答えるアプリケーションがあります。現在は、リクエストのたびに、PDF を Base64 にエンコードして送信しており、リクエストのサイズと転送の時間が問題になっています。最も適切な改善はどれですか。","o":["PDF を、ページごとの画像に変換し、すべての画像を、毎回のリクエストに添付して送信する","PDF のファイルのパスをプロンプトに書き、API の側でファイルを読み込ませる","PDF を一度アップロードしておき、以後のリクエストでは、ファイルの ID で参照する","PDF の Base64 の文字列を system プロンプトに貼り付けて、毎回のリクエストで送信する"],"a":[2],"e":"同じファイルを繰り返し使う場合は、Files API で一度アップロードし、以後は、ファイルの ID で参照します。リクエストのたびにファイルの本体を送る必要がなくなります。Base64 の文字列を system プロンプトに貼り付けても、文書としては解釈されず、送信の量も減りません。API は、ローカルのファイルを読み取れません。","w":["送信の量が、かえって増えます。","API は、ローカルのファイルを読み取れません。",null,"文書として解釈されず、送信の量も減りません。"]},{"d":2,"s":"2.3","lv":2,"q":"300トークンほどの短い system プロンプトに `cache_control` を指定しましたが、`usage` の `cache_creation_input_tokens` と `cache_read_input_tokens` は、どちらも常に 0 です。エラーは発生していません。原因として、最も可能性が高いものはどれですか。","o":["キャッシュの対象が、モデルごとに決まっている最小のトークン数に達していないため","キャッシュは、ストリーミングを使った場合にしか機能しない仕様であるため","system プロンプトは、キャッシュの対象にできない仕様であるため","キャッシュの保持期間が、既定では0秒に設定されているため"],"a":[0],"e":"プロンプトキャッシュには、モデルごとに、キャッシュできる最小のトークン数があります。これに満たない場合、`cache_control` を指定しても、エラーにはならず、単にキャッシュされません。短いプロンプトでは、キャッシュの効果を得られません。system プロンプトは、キャッシュの対象にできます。","w":[null,"ストリーミングの有無は、関係がありません。","system プロンプトは、キャッシュの対象にできます。","既定の保持期間は、5分です。"]},{"d":2,"s":"2.3","lv":2,"q":"社内の基幹システムを操作するツールを Claude に与えています。Claude が、同じターンで複数のツールを同時に要求することがあり、基幹システムの側で、順序に依存する処理が競合します。ツールの呼び出しを、1回のレスポンスにつき1つに制限する方法として、最も適切なものはどれですか。","o":["`disable_parallel_tool_use` を `true` に設定する","ツールの定義を、リクエストごとに1つだけ渡すようにして、ほかのツールは使えないようにする","`max_tokens` を小さくして、複数の呼び出しが、出力に収まらないようにする","ツールの説明に、「必ず1つずつ呼び出すこと」と記載するだけにする"],"a":[0],"e":"`tool_choice` の `disable_parallel_tool_use` を `true` にすると、Claude は、1回のレスポンスで、最大1つのツールだけを要求します。説明文での依頼は、傾向を変えるだけで、保証にはなりません。`max_tokens` を小さくすると、呼び出しが途中で切れるおそれがあります。ツールを1つしか渡さない方法では、Claude が適切なツールを選べなくなります。","w":[null,"Claude が、状況に応じたツールを選べなくなります。","呼び出しが途中で切れるおそれがあり、制御の手段ではありません。","傾向は変わりますが、保証にはなりません。"]},{"d":2,"s":"2.3","lv":2,"q":"商品の写真に写っている内容について答える機能を実装します。写真は、自社のストレージに保存されており、アプリケーションのサーバーから取得できます。Messages API への渡し方として、最も適切なものはどれですか。","o":["写真を image ブロックとして渡し、質問の text ブロックと組み合わせる","写真の Base64 の文字列を、そのまま text ブロックに貼り付ける","写真のファイル名だけを text ブロックに書き、内容は、ファイル名から推測させる","写真を別のモデルで説明文に変換し、常に、その説明文だけを渡す"],"a":[0],"e":"Claude は、画像を直接理解できます。画像は、Base64 のデータなどを指定した image ブロックとして渡し、質問の text ブロックと組み合わせます。Base64 の文字列を text ブロックに貼り付けても、画像としては解釈されません。説明文に変換してから渡すと、説明に含まれなかった情報が失われます。","w":[null,"画像としては解釈されず、トークンを浪費します。","ファイル名からは、写真の内容は分かりません。","説明に含まれなかった情報が、失われます。"]},{"d":2,"s":"2.4","lv":2,"q":"Claude を使う機能のテストを設計しています。モデルの出力は、実行のたびに変わり得ます。テストの構成として、最も適切なものはどれですか。","o":["モデルの出力は検証できないため、この機能は、テストの対象から除外する","モデルの出力の文面が、期待する文字列と完全に一致することを、すべてのテストで検証する","テストのたびに本番と同じ量のリクエストを送り、目視で、すべての結果を確認する","決定的な処理は単体テストで、出力の品質は評価用データで確認する"],"a":[3],"e":"Claude を使う機能には、決定的な部分と、非決定的な部分があります。出力の解析、検証、エラー処理といった決定的な部分は、モデルの呼び出しを差し替えて、通常の単体テストで確認します。モデルの出力の品質は、評価用データと採点の基準で確認します。文面の完全一致は、些細な違いで失敗し、安定しません。","w":["決定的な部分も、出力の品質も、確認できる方法があります。","些細な言い回しの違いで失敗し、テストが安定しません。","コストと時間がかかり、継続して実行できません。",null]},{"d":2,"s":"2.4","lv":2,"q":"一般に公開しているチャット機能で、あるユーザーが、数十万文字のテキストを繰り返し送信し、API の費用が急増しました。最も適切な対策はどれですか。","o":["サーバーの側で、入力の長さの上限と、ユーザーごとの利用量の制限を設ける","費用が急増した日だけ、手作業で、サービスを停止する","すべてのユーザーについて、`max_tokens` を最小の値にする","system プロンプトに、「長い入力には応答しないこと」と記載する"],"a":[0],"e":"入力の長さと利用の量は、モデルに渡す前に、サーバーの側で制限します。モデルへの指示で制限しようとしても、入力はすでに処理されており、入力トークンの費用が発生します。`max_tokens` は出力の上限であり、入力の費用は減りません。手作業での停止は、検知が遅れ、ほかのユーザーにも影響します。","w":[null,"検知が遅れ、ほかのユーザーにも影響します。","出力の上限であり、入力の費用は減りません。","入力はすでに処理されており、入力の費用が発生します。"]},{"d":2,"s":"2.4","lv":2,"q":"注文の受付の画面に、Claude による「おすすめの商品の一言コメント」を表示しています。Claude API の応答が遅いときに、注文の受付の画面全体が、表示されなくなる障害が発生しました。最も適切な設計の見直しはどれですか。","o":["応答が返るまで、同じリクエストを、間隔を空けずに何度でも再送する","タイムアウトを設け、失敗したときは、コメントを省いて画面を表示する","API の呼び出しのタイムアウトを無制限にして、応答が返るまで待ち続ける","コメントの生成を、注文の受付の処理の中で、同期的に、必ず完了させるようにする"],"a":[1],"e":"外部の API に依存する補助的な機能は、その API が遅い、または失敗したときに、主要な機能を巻き込まないように設計します。タイムアウトを設け、失敗したときは、その部分を省くか、代わりの表示にします。待ち続ける設計や、間隔を空けない再送は、障害を広げます。","w":["負荷を高め、障害をさらに広げます。",null,"応答がない間、画面が表示されないままになります。","補助的な機能の失敗が、注文の受付を止めることになります。"]},{"d":2,"s":"2.4","lv":2,"q":"Claude Code が生成したコードに、見慣れない名前のパッケージを `import` する行が含まれていました。そのパッケージは、チームの誰も使ったことがありません。マージの前に行うこととして、最も適切なものはどれですか。","o":["パッケージの名前を、Claude に、もう一度確認させる","Claude が提案したパッケージであるため、信頼できると判断して、そのままインストールする","テストが通ることを確認できれば十分であるため、それ以外の確認は省略する","パッケージが実在すること、提供元と保守の状況、ライセンスを確認してから、採用を判断する"],"a":[3],"e":"言語モデルは、実在しないパッケージの名前を、もっともらしく生成することがあります。その名前を狙って、悪意のあるパッケージが公開される事例も知られています。新しい依存関係は、人が書いたコードの場合と同じように、実在、提供元、保守の状況、ライセンスを確認します。テストの成功は、パッケージの安全性を示しません。","w":["自己確認では、実在や安全性を保証できません。","実在しない名前や、悪意のあるパッケージである可能性があります。","テストの成功は、パッケージの安全性を示しません。",null]},{"d":2,"s":"2.5","lv":2,"q":"全社の文書を1つの検索インデックスに登録し、検索の結果を Claude に渡して回答させる、社内のアシスタントがあります。一般の社員の質問に対して、役員だけが閲覧できる文書の内容が、回答に含まれてしまいました。最も適切な修正はどれですか。","o":["検索の段階で、質問したユーザーの権限で閲覧できる文書だけに絞り込む","回答を送信する前に、機密らしい語句が含まれていないかを、別のモデルに判定させる","system プロンプトに、「権限のない文書の内容には、言及しないこと」と記載する","役員向けの文書を、検索の順位が下がるように設定する"],"a":[0],"e":"アクセスの制御は、モデルにデータを渡す前に、アプリケーションの側で行います。権限のない文書がコンテキストに入ってしまえば、プロンプトでの指示や、出力のフィルターでは、漏えいを確実には防げません。検索の段階で、ユーザーの権限に基づいて絞り込むことが、根本的な対策です。","w":[null,"言い換えなどによる漏えいを、確実には防げません。","コンテキストに入った情報は、指示では確実に守れません。","順位を下げても、権限のない文書が渡る可能性は残ります。"]},{"d":2,"s":"2.5","lv":2,"q":"予約を受け付けるアシスタントで、ユーザーが「明日の午後」と入力すると、Claude が、誤った日付で予約を登録することがあります。system プロンプトには、日付に関する情報は含まれていません。最も適切な修正はどれですか。","o":["アプリケーションが、現在の日時とタイムゾーンをコンテキストとして渡す","system プロンプトに、「現在の日付を正確に把握すること」と記載する","より上位のモデルに切り替えて、日付の推論の能力を高める","ユーザーに、相対的な表現を使わず、必ず年月日で入力するよう求める"],"a":[0],"e":"モデルは、現在の日時を知りません。知っているのは、学習の時点までの情報と、コンテキストに含まれる内容だけです。「明日」のような相対的な表現を解釈するには、アプリケーションが、現在の日時とタイムゾーンを渡す必要があります。指示やモデルの変更では、存在しない情報は補えません。","w":[null,"現在の日付は、モデルには与えられていない情報です。","どのモデルも、渡されていない現在の日時は知りません。","利用者に負担を強いるうえ、入力の誤りも防げません。"]},{"d":2,"s":"2.5","lv":2,"q":"社内規程の検索と回答のシステムで、同じ規程の旧版と新版の両方が、検索の結果としてヒットし、Claude が、旧版の内容で回答することがあります。インデックスから旧版を完全に取り除くことは、監査の都合でできません。最も適切な改善はどれですか。","o":["system プロンプトに、「常に正しい規程に基づいて回答すること」と記載する","検索の件数を増やし、より多くの文書を Claude に渡す","各チャンクに、文書名、版、施行日を付けて渡し、最新の版を優先するよう指示する","旧版と新版の内容を、Claude に統合させた文書を作り、それだけを検索の対象にする"],"a":[2],"e":"検索で得た断片には、それがどの文書の、どの版の、いつの時点の内容なのかという情報が、失われがちです。各チャンクに、文書名、版、施行日といったメタデータを付けて渡せば、Claude は、どれが最新なのかを判断できます。あわせて、検索の段階で、現行の版を優先する絞り込みを行うと、さらに確実です。","w":["どれが正しい版なのかを、Claude は判断できません。","旧版の断片も増え、混在が大きくなります。",null,"統合の誤りが入り込み、原文との対応も失われます。"]},{"d":2,"s":"2.5","lv":2,"q":"API を使ったアシスタントで、「前回伝えた好み（回答は英語で、箇条書きで）を覚えておいてほしい」という要望が、ユーザーから寄せられています。会話は、毎回、新しい `messages` で始まります。最も適切な実装はどれですか。","o":["Messages API が、ユーザーごとの好みを自動的に記憶するため、追加の実装は必要ない","ユーザーに、会話を始めるたびに、好みを入力し直してもらう","好みをアプリケーションの側で保存し、次の会話から、コンテキストに含めて渡す","ユーザーの過去のすべての会話を、毎回のリクエストの先頭に、省略せずに連結する"],"a":[2],"e":"Messages API は、ステートレスです。リクエストの間で、情報を保持しません。会話をまたいで覚えておきたい情報は、アプリケーションの側で保存し、必要なときに、コンテキストに含めて渡します。過去の会話をすべて連結する方法は、コンテキストとコストを浪費し、必要な情報も埋もれます。","w":["API はステートレスであり、リクエストの間で情報を保持しません。","要望を満たしていません。",null,"コンテキストとコストを浪費し、必要な情報も埋もれます。"]},{"d":2,"s":"2.6","lv":2,"q":"Claude Code の設定について、あるコマンドが、ユーザーの設定（`~/.claude/settings.json`）では許可され、リポジトリで共有しているプロジェクトの設定（`.claude/settings.json`）では拒否されています。組織が管理する設定は、ありません。このリポジトリでの挙動として、正しいものはどれですか。","o":["2つの設定が矛盾しているため、Claude Code は起動に失敗する","ユーザーの設定は個人の意思を表すため、プロジェクトの設定よりも優先され、コマンドは許可される","後から編集されたファイルの設定が優先されるため、挙動は、編集の順序によって変わる","プロジェクトの設定が、ユーザーの設定よりも優先され、コマンドは拒否される"],"a":[3],"e":"Claude Code の設定には、優先順位があります。組織が管理する設定が最も優先され、次いで、コマンドラインの引数、プロジェクトのローカルの設定、プロジェクトの共有の設定、ユーザーの設定の順です。より範囲の狭い設定が、より広い設定を上書きします。また、拒否のルールは、許可のルールよりも優先されます。","w":["矛盾は、優先順位によって解決されます。","ユーザーの設定は、プロジェクトの設定よりも優先度が低い設定です。","優先順位は、設定の種類で決まり、編集の順序とは関係がありません。",null]},{"d":2,"s":"2.6","lv":2,"q":"リポジトリのルートにある CLAUDE.md が、数百行に膨らんでいます。大半は、`frontend/` や `db/migrations/` など、特定のディレクトリのファイルを扱うときにだけ必要な規約です。最も適切な整理の方法はどれですか。","o":["規約の全文を、`.claude/settings.json` の `permissions` の中に、文字列として書き込む","CLAUDE.md の内容を、そのまま各開発者の `~/.claude/CLAUDE.md` に移して、リポジトリからは削除する","規約を `.claude/rules/` の複数のファイルに分け、対象のパスを指定して、該当するファイルを扱うときに読み込ませる","CLAUDE.md は変更せず、重要な規約の前に、「重要」という見出しを追加する"],"a":[2],"e":"`.claude/rules/` に置いたルールのファイルには、対象のパスを指定できます。パスを指定したルールは、該当するファイルを扱うときにだけ読み込まれるため、常に読み込まれる CLAUDE.md を小さく保てます。ユーザーの CLAUDE.md は、すべてのプロジェクトに適用され、チームで共有もされません。","w":["権限の設定であり、指示を書く場所ではありません。","すべてのプロジェクトに適用され、チームで共有もされません。",null,"常に読み込まれる量は、変わりません。"]},{"d":3,"s":"3.1","lv":2,"q":"Claude Code で、認証の仕組みを別のライブラリに置き換える変更を行います。影響は数十のファイルに及び、進め方には複数の選択肢があります。作業の始め方として、最も適切なものはどれですか。","o":["すぐに編集を始めさせ、問題が見つかるたびに、その都度、方針を修正していく","プランモードで調査と計画の作成を行わせ、計画を確認してから、実装に進む","権限の確認をすべて省略する設定にして、完了するまで、内容は確認せずに任せる","変更の対象のファイルを、1つずつ手作業で指定し、1ファイルごとに新しいセッションを開始する"],"a":[1],"e":"影響の範囲が広く、進め方に複数の選択肢がある変更では、先に、プランモードで調査と計画を行わせます。プランモードでは、Claude はファイルを編集せずに、調査して計画を提示します。計画を確認してから実装に進むことで、誤った方針での大きな手戻りを防げます。","w":["誤った方針で進んだ場合の手戻りが、大きくなります。",null,"方針の誤りに気づく機会が、なくなります。","ファイル間の整合性を保つための文脈が、失われます。"]},{"d":3,"s":"3.1","lv":2,"q":"昨日、Claude Code で進めていた機能の実装を、今日、同じ文脈のまま続けたいと考えています。ターミナルは、すでに閉じています。最も適切な方法はどれですか。","o":["`/init` を実行して、昨日の会話の履歴を、CLAUDE.md から読み込ませる","`claude -p` を実行して、非対話のモードで、昨日のセッションを自動的に復元させる","`claude --continue` で、直前のセッションを再開する","新しいセッションを開始し、昨日の作業の内容を、記憶を頼りに、最初から説明し直す"],"a":[2],"e":"Claude Code のセッションは保存されており、`claude --continue` で直近のセッションを、`claude --resume` で選択したセッションを、再開できます。`-p` は、非対話で1回の指示を実行するためのオプションです。`/init` は、CLAUDE.md を作成するためのコマンドであり、会話の履歴を復元するものではありません。","w":["`/init` は、CLAUDE.md を作成するためのコマンドです。","`-p` は、非対話で1回の指示を実行するためのオプションです。",null,"保存されているセッションを、再開できます。"]},{"d":4,"s":"4.1","lv":2,"q":"エージェントが、ときどき、誤った顧客のレコードを更新してしまいます。最終的な応答の文面は、どの場合も「更新が完了しました」で、違いがありません。原因を特定する方法として、最も適切なものはどれですか。","o":["最終的な応答の文面を、成功した場合と失敗した場合で、さらに細かく比較する","エージェントに、「なぜ誤ったのですか」と尋ね、その説明を、原因として採用する","原因の調査は行わず、system プロンプトに、「正しい顧客を更新すること」と追記する","失敗した実行のツール呼び出しの履歴を追い、誤った ID が現れた時点を調べる"],"a":[3],"e":"エージェントの不具合は、最終的な応答ではなく、途中の過程に原因があることが多いものです。ツールの呼び出しとその結果の履歴を順に追うことで、誤った値が、どの時点で、どこから入ったのかを特定できます。モデルに理由を尋ねても、実際の過程を正確に説明するとは限りません。","w":["最終的な文面には、違いが現れていません。","事後の説明は、実際の過程を正確に表すとは限りません。","原因が分からないままの追記は、対策になりません。",null]},{"d":5,"s":"5.1","lv":2,"q":"チャットボットのユーザーが、Claude の誤りを訂正しました。Claude は、その会話の中では訂正を受け入れましたが、翌日、別のユーザーとの会話で、同じ誤りを繰り返しました。この挙動の説明として、正しいものはどれですか。","o":["API の不具合であり、本来は、訂正がすべての会話に反映される","モデルは会話から学習しないため、訂正は、プロンプトやナレッジに反映する必要がある","訂正の回数が足りないためであり、同じ訂正を数回繰り返せば、モデルに定着する","ユーザーが異なるためであり、同じユーザーであれば、新しい会話にも訂正が引き継がれる"],"a":[1],"e":"モデルの重みは、会話によって変化しません。会話の中での訂正が有効なのは、その会話の履歴がコンテキストに含まれている間だけです。恒久的に反映させるには、system プロンプトや、参照させるナレッジを修正する必要があります。同じユーザーであっても、新しい会話に履歴を含めなければ、訂正は引き継がれません。","w":["仕様どおりの挙動です。",null,"何度訂正しても、モデルの重みは変わりません。","履歴を含めなければ、同じユーザーでも引き継がれません。"]},{"d":5,"s":"5.1","lv":2,"q":"コンテキストウィンドウに関する説明として、正しいものはどれですか。","o":["入力と出力の合計に対する上限であり、上限に近づくほど、情報の想起の精度が下がることがある","コンテキストウィンドウに収まっているかぎり、情報の量や位置は、回答の精度に影響しない","コンテキストウィンドウは入力だけの上限であり、出力のトークンは、別に、無制限に生成できる","`max_tokens` を大きくすれば、コンテキストウィンドウも、同じだけ大きくなる"],"a":[0],"e":"コンテキストウィンドウは、モデルが一度に扱えるトークンの総量であり、入力と、生成する出力の両方が含まれます。また、上限に収まっていても、コンテキストが長くなるほど、個々の情報を正確に想起する精度は下がる傾向があります。そのため、必要な情報だけを渡すことが重要です。`max_tokens` は出力の上限であり、コンテキストウィンドウを広げません。","w":[null,"長くなるほど、情報の想起の精度は下がる傾向があります。","出力のトークンも、コンテキストウィンドウに含まれます。","`max_tokens` は出力の上限であり、コンテキストウィンドウを広げません。"]},{"d":5,"s":"5.1","lv":2,"q":"思考（thinking）を有効にしたリクエストについて、費用の見積もりを行います。思考のトークンの扱いとして、正しいものはどれですか。","o":["思考のトークンは、要約された部分だけが、課金の対象になる","思考のトークンは、入力のトークンとして、割引の料金で課金される","思考のトークンは、内部の処理であるため、課金の対象にならない","思考のトークンは、出力のトークンとして課金される"],"a":[3],"e":"思考のトークンは、出力のトークンとして課金されます。レスポンスに含まれる思考の内容が要約されている場合でも、課金は、実際に生成された思考のトークンに対して行われます。難しい問題で思考を使うと、品質は上がりますが、出力のトークンと応答の時間が増えるため、用途に応じて使い分けます。","w":["課金は、実際に生成された思考のトークンに対して行われます。","入力ではなく、出力のトークンとして課金されます。","思考のトークンも、課金の対象です。",null]},{"d":5,"s":"5.2","lv":2,"q":"ストリーミングのレスポンスを処理するコードで、最終的な `stop_reason` と、出力トークン数の合計を取得します。参照すべきイベントはどれですか。","o":["最初の `content_block_start` のイベント","`message_delta` のイベント","`message_start` のイベント","それぞれの `content_block_delta` のイベント"],"a":[1],"e":"ストリーミングでは、`message_start` で始まり、コンテンツのブロックごとのイベントが続き、最後に `message_delta` と `message_stop` が送られます。最終的な `stop_reason` と、累計の出力トークン数は、`message_delta` に含まれます。`message_start` の時点では、`stop_reason` はまだ決まっていません。","w":["ブロックの開始を示すイベントで、終了の理由は含まれません。",null,"この時点では、`stop_reason` はまだ決まっていません。","テキストなどの断片を運ぶイベントです。"]},{"d":5,"s":"5.2","lv":2,"q":"API から、HTTP 529（`overloaded_error`）が返されました。自社のレート制限には、余裕があります。最も適切な対応はどれですか。","o":["一時的な過負荷と判断し、指数バックオフで間隔を空けて、再試行する","自社のレート制限を超えたと判断し、上限の引き上げを申請する","リクエストの形式が誤っていると判断し、リクエストボディを修正する","API キーが無効になったと判断し、新しいキーを発行する"],"a":[0],"e":"529 は、API の側が、一時的に過負荷の状態にあることを示します。自社のレート制限の超過を示す 429 とは、別のエラーです。リクエストの内容に問題はないため、指数バックオフとジッターを使って、間隔を空けて再試行します。認証のエラーは 401、リクエストの形式のエラーは 400 です。","w":[null,"自社のレート制限の超過は、429 です。","リクエストの形式のエラーは、400 です。","認証のエラーは、401 です。"]},{"d":5,"s":"5.2","lv":2,"q":"ドキュメントに「ベータ」と記載されている API の機能を、HTTP で直接呼び出して利用したいと考えています。リクエストで必要になることとして、最も適切なものはどれですか。","o":["リクエストの URL を、ベータ専用の別のドメインに変更する","`anthropic-beta` ヘッダーに、その機能に対応する値を指定する","`x-api-key` の値の先頭に、「beta-」という文字列を付ける","`anthropic-version` ヘッダーを削除して、最新の仕様で動作させる"],"a":[1],"e":"ベータの機能は、`anthropic-beta` ヘッダーに、その機能に対応する値を指定することで、有効になります。`anthropic-version` ヘッダーは、引き続き必要です。公式の SDK を使う場合は、ベータ用の名前空間やパラメータを通じて、同じヘッダーが送られます。","w":["ベータの機能は、ヘッダーの指定で有効にします。",null,"API キーの値は、変更しません。","`anthropic-version` ヘッダーは、引き続き必要です。"]},{"d":5,"s":"5.3","lv":2,"q":"新しい機能に使うモデルを選びます。品質の要件を満たしたうえで、コストと遅延を抑える必要があります。進め方として、最も適切なものはどれですか。","o":["最も安価なモデルを選び、品質に問題が報告されてから、上位のモデルを検討する","開発者が、数件の入力を手作業で試し、印象の良かったモデルを選ぶ","ベンチマークで最も順位の高いモデルを選び、自社の評価は行わない","自社の評価用データで要件を確認し、より小さいモデルでも満たせるかを比較する"],"a":[3],"e":"モデルの選択は、自社のタスクでの評価に基づいて行います。まず、要件を満たせるモデルを確認し、そのうえで、より小さいモデルでも要件を満たせるかを、同じ評価用データで比較します。公開のベンチマークの順位や、数件の試行の印象は、自社のタスクでの性能を保証しません。","w":["品質の問題が、利用者に影響してからの対応になります。","数件の印象では、品質を判断できません。","ベンチマークの順位は、自社のタスクでの性能を保証しません。",null]},{"d":5,"s":"5.4","lv":2,"q":"1万トークンのプロンプトを使う処理があります。このプロンプトは、1日に1回だけ実行され、内容も毎日変わります。担当者は、コストを下げるために、プロンプトキャッシュの利用を検討しています。この判断について、最も適切な説明はどれですか。","o":["内容が毎日変わっても、長さが同じであれば、キャッシュはヒットする","キャッシュは24時間保持されるため、翌日の実行で、読み取りの割引が得られる","キャッシュの書き込みは無料であるため、指定しておいて損はない","書き込みには割増の料金がかかり、再利用されないため、かえってコストが増える"],"a":[3],"e":"プロンプトキャッシュでは、書き込みに、通常の入力よりも割増の料金がかかり、読み取りで、大きな割引が得られます。効果があるのは、同じ内容が、保持期間のうちに繰り返し使われる場合です。1日に1回だけの実行で、内容も毎回変わる場合は、書き込みの割増だけが発生します。","w":["キャッシュは、内容が完全に一致した場合にだけヒットします。","既定の保持期間は5分で、延長しても1時間です。","書き込みには、割増の料金がかかります。",null]},{"d":5,"s":"5.4","lv":2,"q":"エージェントの入力トークンの費用を調べたところ、ユーザーの発言は短いにもかかわらず、毎回のリクエストで、数万トークンが消費されていました。原因として確認すべきものを2つ選んでください。","o":["毎回のリクエストに含まれる、過去のツール結果を含む会話の履歴","`max_tokens` に指定している値の大きさ","レスポンスを受信するときの、ストリーミングの有無","API キーを発行したワークスペースの名前","リクエストに含めている、使われていない多数のツールの定義"],"a":[0,4],"e":"入力のトークンには、ユーザーの発言だけでなく、system プロンプト、ツールの定義、そして、過去のツール結果を含む会話の履歴の全体が含まれます。ツールの定義は、使われなくても、毎回の入力として課金されます。`max_tokens` は出力の上限であり、ストリーミングの有無やワークスペースの名前は、トークンの数に影響しません。","w":[null,"出力の上限であり、入力のトークン数には影響しません。","受信の方法は、トークンの数に影響しません。","名前は、トークンの数に影響しません。",null]},{"d":6,"s":"6.1","lv":2,"q":"カスタマーサポートのエージェントの system プロンプトが、「A の場合は X、ただし B のときは Y、C かつ D なら Z」という条件分岐の列挙で、数百行になっています。想定していない状況では、挙動が不安定になります。最も適切な見直しはどれですか。","o":["想定していなかった状況を見つけるたびに、条件分岐を追記し続ける","system プロンプトを、「顧客に親切に対応してください」という一文だけにする","条件分岐の列挙はそのままにして、すべての行を、大文字と感嘆符で強調する","判断の原則と優先順位を明確に示し、代表的な例を添えて、個別の状況はモデルに判断させる"],"a":[3],"e":"system プロンプトは、細かすぎる規則の列挙と、曖昧すぎる指示の、中間の抽象度が効果的です。条件分岐の列挙は、想定外の状況に弱く、保守も困難です。一方、一文だけの指示では、判断の基準が伝わりません。原則と優先順位を示し、代表的な例を添えることで、モデルが、未知の状況にも一貫した判断を下せます。","w":["想定外の状況は尽きず、保守もできなくなります。","判断の基準が、伝わりません。","強調を増やしても、想定外の状況には対応できません。",null]},{"d":6,"s":"6.1","lv":2,"q":"system プロンプトは、「現在の日時」「ユーザーの氏名と契約プラン」「2万トークンの製品マニュアル」「応答のルール」の順に構成されています。プロンプトキャッシュを指定していますが、ほとんどヒットしません。最も適切な見直しはどれですか。","o":["変化しないマニュアルとルールを先頭に置き、リクエストごとに変わる情報を、その後ろに置く","すべての要素を、ユーザーのメッセージの側に移して、system プロンプトを空にする","現在の日時とユーザーの情報を削除して、アプリケーションの機能を減らす","キャッシュの保持期間を延長して、ヒットの機会を増やす"],"a":[0],"e":"プロンプトキャッシュは、先頭からの内容が一致した部分に対して働きます。先頭に、リクエストごとに変わる情報があると、それ以降のすべてが、キャッシュの対象から外れます。変化しない内容を先頭にまとめ、変化する内容を後ろに置くことで、大きな固定の部分がキャッシュされます。","w":[null,"変化しない内容と変化する内容の順序の問題は、解消しません。","必要な情報であり、順序を変えれば両立できます。","先頭の内容が毎回変わるかぎり、保持期間を延ばしてもヒットしません。"]},{"d":6,"s":"6.2","lv":2,"q":"商品の説明文を生成するプロンプトに、手本として、例を1件だけ含めています。出力は、どの商品についても、手本と同じ書き出し、同じ文の数、同じ言い回しになってしまいます。最も適切な改善はどれですか。","o":["例はそのままにして、生成のたびに、同じ出力が出なくなるまで再生成する","例をすべて削除し、「毎回、創造的に書くこと」と指示する","語り口の異なる複数の例を示し、例は複製するものではないと伝える","同じ1件の例を、プロンプトの中で、3回繰り返して示す"],"a":[2],"e":"例が1件だけの場合、モデルは、その例の表面的な特徴まで、忠実に再現しがちです。構成や語り口の異なる複数の例を示すと、モデルは、共通する意図を読み取り、表面的な特徴には縛られにくくなります。例を完全に取り除くと、望ましい形式や水準が伝わらなくなります。","w":["原因が残り、コストと手間が増えます。","望ましい形式や水準が、伝わらなくなります。",null,"同じ例への過剰な適合が、さらに強まります。"]},{"d":6,"s":"6.2","lv":2,"q":"以前のモデルのために書かれた system プロンプトには、「CRITICAL: 必ず検索ツールを使うこと！！」のような強い表現が、多数含まれています。新しい世代のモデルに移行したところ、不要な場面でも、検索ツールを過剰に使うようになりました。最も適切な調整はどれですか。","o":["強調をさらに増やし、「不要なときは絶対に使わないこと！！」という指示も追加する","検索ツールを、ツールの一覧から削除する","強い表現を平常の表現に改め、どのような場合に検索が必要なのかを、理由とともに説明する","以前のモデルに戻し、今後もモデルは更新しない"],"a":[2],"e":"新しい世代のモデルは、指示への反応が良いため、以前のモデルの不注意を補うために使われていた強い表現には、過剰に反応することがあります。強調を取り除いて平常の表現に改め、どのような場合に、なぜ、その行動が必要なのかを説明するほうが、適切な判断につながります。","w":["強い指示どうしが競合し、挙動がさらに不安定になります。","検索が必要な場面でも、使えなくなります。",null,"モデルの廃止に対応できず、問題の先送りになります。"]},{"d":6,"s":"6.3","lv":2,"q":"Claude が生成した回答を、Web のページに、HTML としてそのまま挿入して表示しています。回答には、ユーザーが入力した文章や、外部から取得した文書の内容が、反映されることがあります。最も適切な対応はどれですか。","o":["出力に `\u003cscript>` という文字列が含まれている場合にだけ、その回答を表示しない","モデルの出力を信頼できない入力として扱い、エスケープまたはサニタイズをしてから表示する","Claude の出力は安全に調整されているため、そのまま挿入して問題ない","system プロンプトに、「スクリプトを出力しないこと」と記載すれば、十分である"],"a":[1],"e":"モデルの出力には、ユーザーの入力や、外部の文書に含まれていた内容が、そのまま現れることがあります。そのため、モデルの出力は、ユーザーの入力と同じく、信頼できないデータとして扱います。HTML として表示する場合は、エスケープまたはサニタイズを行います。特定の文字列だけを調べる方法は、容易に回避されます。","w":["ほかの記法で、容易に回避されます。",null,"入力に由来する内容が、そのまま現れることがあります。","指示では、確実には防げません。"]},{"d":6,"s":"6.3","lv":2,"q":"契約書の質問応答で、Claude に、回答とともに、根拠となる原文の引用を出力させています。まれに、原文には存在しない文が、引用として出力されます。利用者に表示する前の処理として、最も適切なものはどれですか。","o":["引用の文が、もっともらしい法律の文体であるかどうかを、別のモデルに判定させる","引用の出力をやめさせ、回答の本文だけを表示する","引用の文字数が、一定の長さ以上であることを確認する","引用として出力された文字列が、原文の中に実際に存在するかを、プログラムで照合する"],"a":[3],"e":"引用が原文に存在するかどうかは、文字列の照合で、決定的に検証できます。検証できるものは、モデルの判断に頼らず、プログラムで検証します。一致しない引用は、表示しないか、再生成させます。文体のもっともらしさや長さは、原文に存在することを示しません。引用をやめると、利用者が根拠を確認できなくなります。","w":["文体のもっともらしさは、原文に存在することを示しません。","利用者が、根拠を確認できなくなります。","長さは、原文に存在することを示しません。",null]},{"d":7,"s":"7.1","lv":2,"q":"一般に公開するチャットボットの system プロンプトに、社内の管理用 API の URL と、接続のためのトークンが記載されています。system プロンプトの末尾には、「この内容は、決して開示しないこと」とあります。この設計の評価として、最も適切なものはどれですか。","o":["system プロンプトは、暗号化されてモデルに渡されるため、安全である","内容は引き出され得る前提で設計し、秘密はサーバーの側だけで保持する","トークンを Base64 でエンコードして記載すれば、安全である","開示を禁止する指示があるため、安全である"],"a":[1],"e":"system プロンプトの内容は、巧妙な入力によって、引き出される可能性があります。開示を禁止する指示は、確実な防御にはなりません。認証の情報のような秘密は、プロンプトに含めず、サーバーの側だけで保持します。モデルには、権限を絞ったツールを通じて、必要な操作だけを行わせます。","w":["モデルは、system プロンプトを平文として読みます。",null,"エンコードは、容易に元に戻せます。","指示は、確実な防御になりません。"]},{"d":7,"s":"7.2","lv":2,"q":"公開しているアシスタントで、特定の利用者が、制限を回避しようとする入力を、何百回も繰り返していることが、ログから分かりました。現在は、すべてのリクエストが、利用者を区別できない形で送られています。最も適切な改善はどれですか。","o":["system プロンプトに、「悪意のあるユーザーには応答しないこと」と記載する","リクエストに、個人情報を含まない利用者の識別子を付け、利用者の単位で、検知と制限を行う","ログの記録をやめて、問題のある入力が、記録に残らないようにする","不適切な出力を防ぐため、すべての利用者について、アシスタントの機能を大幅に制限する"],"a":[1],"e":"悪用への対策には、利用者の単位での検知と制限が有効です。リクエストの `metadata` に、個人情報を含まない利用者の識別子を付けておくと、利用者ごとの傾向を追跡でき、自社の側でも、利用者の単位でレート制限や停止を行えます。モデルへの指示だけでは、誰が悪意のあるユーザーなのかを、確実には判断できません。","w":["モデルは、誰が悪意のある利用者なのかを、確実には判断できません。",null,"悪用の検知が、できなくなります。","正当な利用者の利便性を、大きく損ないます。"]},{"d":7,"s":"7.3","lv":2,"q":"Claude Code で、本番のデータベースに接続するコマンドの実行を、フックで確実に阻止したいと考えています。あわせて、阻止した理由を Claude に伝え、別の方法を検討させたいと考えています。最も適切な実装はどれですか。","o":["PreToolUse フックで検知したら、終了コード 2 で終了し、理由を標準エラー出力に書く","PostToolUse フックで、該当するコマンドを検知したら、警告のメッセージをログに記録する","PreToolUse フックで、該当するコマンドを検知したら、終了コード 0 で終了し、理由を標準出力に書く","Stop フックで、セッションの終了時に、実行されたコマンドの一覧を確認する"],"a":[0],"e":"ツールの実行を阻止できるのは、実行の前に呼び出される PreToolUse フックです。フックが終了コード 2 で終了すると、ツールの呼び出しは阻止され、標準エラー出力の内容が、Claude に伝えられます。終了コード 0 は成功を意味し、実行は阻止されません。PostToolUse や Stop は、実行の後に呼び出されるため、阻止には使えません。","w":[null,"実行の後に呼び出されるため、阻止には使えません。","終了コード 0 は成功を意味し、実行は阻止されません。","セッションの終了時には、すでに実行されています。"]},{"d":7,"s":"7.4","lv":2,"q":"CI のパイプラインで、Claude Code を非対話で実行します。API キーの扱いとして、最も適切なものはどれですか。","o":["CI のシークレットの機能に専用のキーを登録し、環境変数として渡す","開発者の個人用の API キーを、CI でも共用する","パイプラインの定義ファイルに、API キーを直接書き込み、リポジトリにコミットする","API キーを CLAUDE.md に記載して、Claude Code に読み込ませる"],"a":[0],"e":"CI で使う認証の情報は、CI のシークレットの機能で管理し、実行のときに、環境変数として渡します。用途ごとに専用のキーを使えば、漏えいしたときに、そのキーだけを失効させられます。リポジトリへのコミットや、CLAUDE.md への記載は、キーを、リポジトリを閲覧できる全員とモデルのコンテキストに、さらすことになります。","w":[null,"漏えいの影響の範囲が広がり、個別の失効もできません。","リポジトリを閲覧できる全員に、キーがさらされます。","キーが、リポジトリとモデルのコンテキストにさらされます。"]},{"d":8,"s":"8.1","lv":2,"q":"注文を登録するツールで、Claude が、必須のフィールドを省略したり、スキーマにない型の値を渡したりすることが、まれにあります。ツールの入力が、常にスキーマに準拠するようにする方法として、最も適切なものはどれですか。","o":["スキーマからすべての制約を取り除き、どのような入力でも受け付けるようにする","入力が不正な場合は、アプリケーションの側で、既定値を補って実行する","ツールの説明に、「スキーマを厳密に守ること」と、強い表現で記載する","ツールの定義で `strict: true` を指定する"],"a":[3],"e":"ツールの定義で `strict: true` を指定すると、Claude が生成するツールの入力が、指定した JSON スキーマに準拠することが保証されます。説明文での依頼は、傾向を変えるだけです。既定値を補って実行すると、誤ったデータで操作が行われるおそれがあります。なお、値が業務上正しいかどうかの検証は、引き続き必要です。","w":["不正な入力が、そのまま処理されます。","誤ったデータで、操作が行われるおそれがあります。","傾向は変わりますが、保証にはなりません。",null]},{"d":8,"s":"8.1","lv":2,"q":"在庫を照会するツールが、エラーのときに、常に「エラーが発生しました」という同じ文字列を返しています。Claude は、一時的な障害でも、存在しない商品コードでも、同じように再試行を繰り返します。ツールの改善として、最も適切なものはどれですか。","o":["エラーのときは、何も返さずに、リクエストをタイムアウトさせる","エラーのときは、空の結果を返して、成功として扱わせる","エラーの種類と、次に取るべき行動が分かる内容を返す","エラーのときは、スタックトレースの全文を、そのまま返す"],"a":[2],"e":"ツールのエラーは、Claude が次の行動を判断するための情報です。エラーの種類、再試行で解決する見込みがあるかどうか、どうすれば解決するのかが分かる内容を返すことで、Claude は、再試行する、引数を修正する、ユーザーに確認する、といった適切な行動を選べます。スタックトレースの全文は、コンテキストを消費するうえ、内部の情報をさらします。","w":["対応する結果がなく、Claude が状況を判断できません。","誤った前提で、処理が進みます。",null,"コンテキストを消費し、内部の情報もさらします。"]},{"d":8,"s":"8.1","lv":2,"q":"顧客を検索するツールが、`{\"id\": \"8f3a…\", \"owner\": \"c91b…\"}` のように、内部の UUID だけを返しています。Claude は、後続のツールの呼び出しで、ID を取り違えたり、存在しない ID を作ったりすることがあります。ツールの戻り値の見直しとして、最も適切なものはどれですか。","o":["顧客名など、意味の分かる情報をあわせて返す","戻り値を、Base64 でエンコードした文字列にまとめて返す","UUID を、さらに長く、複雑な形式に変更する","データベースのレコードの全項目を、加工せずに、そのまま返す"],"a":[0],"e":"ツールの戻り値は、Claude が読んで、次の判断に使うコンテキストです。意味のない識別子だけでは、対象を取り違えやすくなります。名前などの意味の分かる情報をあわせて返すと、後続の推論の精度が上がります。一方、全項目をそのまま返すと、無関係な情報で、コンテキストを消費します。","w":[null,"Claude が、内容を自然に読めなくなります。","識別しにくさが、さらに増します。","無関係な情報で、コンテキストを消費します。"]},{"d":8,"s":"8.2","lv":2,"q":"社内のチケット管理システムに接続する MCP サーバーを開発しました。これまでは、各開発者のマシンで、ローカルのプロセスとして起動していました。今後は、全社の多数の利用者が、1つの共有のサービスとして利用できるようにします。最も適切な構成はどれですか。","o":["MCP の利用をやめ、チケットの全件を、毎回のプロンプトに貼り付ける","stdio のトランスポートのまま、サーバーのプロセスを、インターネットに直接公開する","stdio のトランスポートのまま、各利用者に、サーバーのソースコードを配布する","Streamable HTTP でリモートのサーバーとして提供し、認証を行う"],"a":[3],"e":"stdio のトランスポートは、クライアントと同じマシンで、サーバーをプロセスとして起動する、ローカルの用途に向いています。多数の利用者が共有するサービスとして提供する場合は、Streamable HTTP のトランスポートを使い、リモートのサーバーとして運用します。その際は、利用者ごとの認証と認可が必要です。","w":["コンテキストを浪費し、最新の状態も保てません。","stdio は、ネットワーク越しに接続するための方式ではありません。","配布と更新の手間がかかり、共有のサービスになりません。",null]},{"d":8,"s":"8.3","lv":2,"q":"Claude Code に、「`/fix-issue 1234` のように、課題の番号を渡して実行できる」チーム共通のコマンドを追加します。番号を、指示の文面の中に埋め込む方法として、最も適切なものはどれですか。","o":["コマンドの定義のファイルを、課題の番号ごとに、1つずつ作成する","定義のファイルで、`$ARGUMENTS` を使って引数を参照する","フックの設定で、課題の番号を、環境変数として固定で定義する","CLAUDE.md に、現在の課題の番号を、その都度、手作業で書き込む"],"a":[1],"e":"カスタムのコマンド（スキル）の定義では、`$ARGUMENTS` を使って、実行のときに渡された引数を参照できます。これにより、1つの定義を、異なる入力で再利用できます。番号ごとにファイルを作る方法や、CLAUDE.md を書き換える方法は、再利用の利点を失います。","w":["再利用できず、ファイルが際限なく増えます。",null,"番号を固定することになり、実行のたびに変えられません。","手間がかかり、すべてのセッションに影響します。"]},{"d":8,"s":"8.3","lv":2,"q":"Claude Code に、セキュリティレビュー専用のサブエージェントを追加します。このサブエージェントには、コードを読んで指摘を返すことだけを行わせます。定義に含めるべき設定を2つ選んでください。","o":["ファイルの編集やコマンドの実行を含む、すべてのツールの許可","メインのセッションの会話履歴の全体を、常に引き継ぐという指定","読み取りと検索に限定した、ツールの一覧","どのような場合に、このサブエージェントに委任するのかが分かる説明","本番環境に接続するための、認証の情報"],"a":[2,3],"e":"サブエージェントの定義では、説明が、いつ委任されるのかを決める手がかりになります。また、使えるツールを、役割に必要なものだけに限定することで、最小権限を保てます。レビュー専用であれば、読み取りと検索のツールで足ります。サブエージェントは、独立したコンテキストで動作するため、メインの履歴は引き継ぎません。","w":["役割に不要な権限であり、最小権限に反します。","サブエージェントは、独立したコンテキストで動作します。",null,null,"役割に不要であり、定義に秘密を含めるべきではありません。"]}],"count":53},"CCAR-F":{"code":"CCAR-F","name":"Claude Certified Architect – Foundations","audience":"アーキテクト向け","minutes":120,"domains":[{"name":"エージェントアーキテクチャとオーケストレーション","w":27},{"name":"ツール設計と MCP 統合","w":18},{"name":"Claude Code の設定とワークフロー","w":20},{"name":"プロンプトエンジニアリングと構造化出力","w":20},{"name":"コンテキスト管理と信頼性","w":15}],"skills":{"1.1":"エージェントループの設計と実装","1.2":"コーディネーターとサブエージェントによるオーケストレーション","1.3":"サブエージェントの呼び出しとコンテキストの受け渡し","1.4":"マルチステップのワークフローと引き継ぎ","1.5":"Agent SDK のフック","1.6":"タスク分解の戦略","1.7":"セッションの状態、再開、フォーク","2.1":"ツールインターフェースの設計","2.2":"MCP ツールの構造化エラー","2.3":"ツールの配分と tool_choice","2.4":"MCP サーバーの統合","2.5":"組み込みツールの選択","3.1":"CLAUDE.md の階層と構成","3.2":"カスタムコマンドとスキル","3.3":"パス指定のルール","3.4":"プランモードと直接実行","3.5":"反復的な改善","3.6":"CI/CD への統合","4.1":"明確な基準によるプロンプト設計","4.2":"few-shot プロンプティング","4.3":"ツール利用と JSON スキーマによる構造化出力","4.4":"検証、リトライ、フィードバックループ","4.5":"バッチ処理の戦略","4.6":"複数インスタンス・複数パスのレビュー","5.1":"会話コンテキストの管理","5.2":"エスカレーションと曖昧さの解消","5.3":"マルチエージェントでのエラー伝播","5.4":"大規模コードベースでのコンテキスト管理","5.5":"人によるレビューと確信度の較正","5.6":"情報の出所と不確実性の管理"},"pick":4,"perScenario":15,"scQuota":[{"1":8,"2":4,"5":3},{"1":2,"3":9,"5":4},{"1":9,"2":4,"5":2},{"1":5,"2":7,"3":3},{"3":6,"4":9},{"4":9,"5":6}],"scenarios":[{"title":"カスタマーサポート解決エージェント","text":"Claude Agent SDK を使い、返品、請求に関する異議、アカウントの問題など、曖昧さの大きい問い合わせを処理する、カスタマーサポートのエージェントを構築しています。エージェントは、カスタムの MCP ツール（`get_customer`、`lookup_order`、`process_refund`、`escalate_to_human`）を使用します。目標は、初回の問い合わせでの解決率を80%以上にしながら、エスカレーションすべき場面を、適切に見極めることです。"},{"title":"Claude Code によるコード生成","text":"チームで Claude Code を使い、コードの生成、リファクタリング、デバッグ、ドキュメントの作成を進めています。カスタムのスラッシュコマンドや CLAUDE.md の設定を整え、プランモードと直接実行を、いつ使い分けるのかを判断する必要があります。"},{"title":"マルチエージェント調査システム","text":"Claude Agent SDK を使い、マルチエージェントの調査システムを構築しています。コーディネーターのエージェントが、Web 検索、文書の分析、知見の統合、レポートの作成を担当する、専門のサブエージェントに作業を委任します。システムは、テーマを調査し、出典付きの包括的なレポートを作成します。"},{"title":"Claude による開発者の生産性向上","text":"Claude Agent SDK を使い、開発者の生産性を高めるツールを構築しています。エージェントは、エンジニアが、不慣れなコードベースの調査、レガシーシステムの理解、定型的なコードの生成、反復作業の自動化を行うのを支援します。組み込みのツール（Read、Write、Bash、Grep、Glob）と、MCP サーバーを使用します。"},{"title":"継続的インテグレーションでの Claude Code","text":"CI/CD のパイプラインに Claude Code を組み込み、自動のコードレビュー、テストの生成、プルリクエストへのフィードバックを行っています。実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを、設計する必要があります。"},{"title":"構造化データ抽出","text":"Claude を使い、非構造の文書から情報を抽出するシステムを構築しています。出力を JSON スキーマで検証し、高い精度を維持する必要があります。エッジケースを適切に処理し、下流のシステムと連携します。"}],"questions":[{"sc":1,"d":1,"s":"1.1","lv":1,"q":"このエージェントは、ツールを呼び出す前に「注文を確認します」のようなテキストを返すことがあります。現在の実装は、応答にテキストが含まれていればループを終了するため、処理が途中で終わってしまいます。ループの制御として正しい実装はどれですか。","o":["`stop_reason` が `tool_use` の間はツールを実行して結果を返し、`end_turn` になったら終了する","応答のテキストに「完了」や「解決」などの語が含まれているかを調べ、含まれていれば終了する","テキストと `tool_use` の両方が含まれる応答は不正な応答と見なして破棄し、テキストだけが返るまで、同じリクエストを再送する","反復回数の上限を3回に固定し、上限に達した時点で、最後のテキストを回答として返す"],"a":[0],"e":"エージェントのループは、`stop_reason` で制御します。`tool_use` であればツールを実行し、結果を会話に追加して次の反復に進み、`end_turn` で終了します。応答にテキストが含まれることや、自然言語の表現を、完了の合図として扱うのは誤りです。テキストとツール呼び出しが同じ応答に含まれることは、正常な挙動です。","w":[null,"文面の解析は不安定で、ターンの終了を正しく示しません。","テキストとツールの要求が同時に返るのは、正常な応答です。","必要な処理の途中で、打ち切られます。"]},{"sc":1,"d":1,"s":"1.4","lv":1,"q":"本番のログを分析すると、12% のケースで、エージェントが `get_customer` による本人確認を行わずに `lookup_order` や `process_refund` を呼び出しており、誤った顧客への返金が発生していました。最も確実な対策はどれですか。","o":["システムプロンプトに、本人確認が必須であることを強い表現で明記し、違反した場合の影響も説明する","本人確認を先に行う対話の例を、few-shot としてプロンプトに複数追加する","`get_customer` が確認済みの顧客 ID を返すまで、`lookup_order` と `process_refund` をコードでブロックする","本人確認が必要な問い合わせかどうかを判定する分類器を前段に置き、必要と判定された場合にだけ、本人確認を必ず先に行うよう促す注意の文を、プロンプトの末尾に追加する"],"a":[2],"e":"金銭に関わる操作の前の本人確認のように、順序の遵守が確実でなければならない場合は、プログラムによる前提条件の強制が必要です。プロンプトでの指示や few-shot の例は遵守の確率を高めますが、失敗の確率はゼロになりません。分類器による注意喚起も、最終的にはモデルの判断に依存します。","w":["指示は確率的にしか守られず、12%の逸脱はなくなりません。","遵守の傾向は上がりますが、保証にはなりません。",null,"最終的には注意の文に頼っており、強制になっていません。"]},{"sc":1,"d":1,"s":"1.5","lv":1,"q":"500ドルを超える返金は、必ず人の承認を経るという業務ルールがあります。システムプロンプトに記載していますが、まれに、エージェントがそのまま返金を実行します。最も適切な対策はどれですか。","o":["500ドルを超える返金の事例を few-shot に加え、エスカレーションする様子を示す","返金の実行後に PostToolUse フックで金額を確認し、500ドルを超えていた場合は、取り消しの処理を別途起動して、担当者に通知する","`process_refund` の説明文に、500ドルを超える場合は使用しないよう、強調した注意書きを加える","実行前にツール呼び出しを横取りするフックで、500ドルを超える `process_refund` をブロックし、人に回す"],"a":[3],"e":"業務ルールの遵守を保証する必要がある場合は、プロンプトではなく、フックによる決定的な強制を選びます。実行前にツール呼び出しを横取りするフックであれば、違反する操作をブロックし、代替の流れ（人へのエスカレーション）に回せます。説明文や few-shot は、確率的な遵守にとどまります。実行後の検知では、返金はすでに行われています。","w":["傾向は上がりますが、保証にはなりません。","返金が実行された後であり、防止になりません。","指示であり、強制力がありません。",null]},{"sc":1,"d":1,"s":"1.5","lv":1,"q":"複数の MCP ツールが、日付を Unix タイムスタンプ、ISO 8601、独自の形式で返し、ステータスも数値コードと文字列が混在しています。エージェントが、返品期限の判定を誤ることがあります。最も適切な対策はどれですか。","o":["形式を確認するためのツールを追加し、判定の前に毎回呼び出させる","上位のモデルに切り替えて、形式の違いを正しく解釈できるようにする","PostToolUse フックで、ツールの結果を統一した形式に正規化してから、モデルに渡す","システムプロンプトに、各ツールが返す形式の一覧と変換の規則を、すべて記載する"],"a":[2],"e":"PostToolUse フックは、モデルがツールの結果を処理する前に、その内容を変換できます。形式の異なるデータを決定的に正規化することで、モデルは一貫した入力に基づいて推論できます。変換の規則をプロンプトに記載する方法は、モデルに毎回の変換を委ねるため、誤りの余地が残ります。確認用のツールの追加は、呼び出しを増やすだけです。","w":["呼び出しが増えるだけで、形式は統一されません。","決定的に処理できる変換を、モデルの解釈に委ねています。",null,"モデルに毎回変換させることになり、誤りの余地が残ります。"]},{"sc":1,"d":1,"s":"1.4","lv":1,"q":"ある顧客の1通の問い合わせに、返金の依頼、配送先の変更、請求の重複の3件が含まれていました。エージェントは、最初の1件だけを解決して対応を終えました。最も適切な設計はどれですか。","o":["要望を個別の項目に分解し、共有のコンテキストを使ってそれぞれを調査してから、1つの回答にまとめる","反復回数の上限を引き上げて、ループが早く終わらないようにする","最も重要と思われる1件を選んで解決し、残りの2件は、それぞれ理由を付けて人の担当者にエスカレーションする","1件ずつ別の問い合わせとして送り直すよう、顧客に依頼する応答を返す"],"a":[0],"e":"複数の関心事を含む問い合わせは、個別の項目に分解し、共有のコンテキスト（顧客の情報など）を使ってそれぞれを調査したうえで、統合した1つの解決策として回答します。顧客に送り直しを求めたり、一部だけを解決したりすると、初回での解決という目標に反します。反復回数の上限は、この問題の原因ではありません。","w":[null,"要望を分解していないという原因は、解消しません。","ポリシーの範囲で解決できる要望まで、人に回しています。","顧客に手間を強いることになり、初回での解決になりません。"]},{"sc":1,"d":1,"s":"1.4","lv":1,"q":"エスカレーションを受ける人の担当者は、エージェントと顧客の会話の記録を見ることができません。引き継ぎの設計として最も適切なものはどれですか。","o":["エージェントの内部の推論の過程を、すべてそのまま送る","「対応できないため引き継ぎます」という定型文と、顧客の氏名だけを送る","顧客 ID、原因、返金額、推奨する対応をまとめた、構造化された要約を送る","顧客に、担当者へ経緯をもう一度説明するよう依頼する"],"a":[2],"e":"引き継ぎを受ける担当者が会話の記録を見られない場合は、対応に必要な情報を、構造化された要約としてまとめます。顧客 ID、原因、金額、推奨する対応が含まれていれば、担当者はすぐに行動できます。定型文だけでは情報が足りず、顧客に再度の説明を求めると、顧客体験が損なわれます。推論の過程の全文は、必要な情報を埋もれさせます。","w":["要点が埋もれ、担当者が判断に必要な情報を見つけにくくなります。","担当者が、経緯を最初から調べ直すことになります。",null,"顧客に負担を強い、満足度を下げます。"]},{"sc":1,"d":1,"s":"1.1","lv":1,"q":"開発者が、処理の長期化を防ぐために、反復回数の上限（5回）を主な停止条件として実装しました。その結果、複雑な問い合わせで、調査の途中に処理が打ち切られます。正しい考え方はどれですか。","o":["上限を20回に引き上げたうえで、複雑な問い合わせでも足りるようにし、引き続き、上限への到達を主な停止条件とする","上限は暴走を防ぐ安全策にとどめ、通常の終了は、`end_turn` になったことで判断する","上限に達した場合は、それまでの結果から回答を推測して生成させる","上限をなくし、モデルが「完了しました」と書いたときに終了する"],"a":[1],"e":"任意の反復回数の上限を主な停止の仕組みとすることは、避けるべきアンチパターンです。通常の終了は、モデルが `end_turn` を返したことで判断し、上限は暴走を防ぐ安全策として残します。上限を引き上げても、同じ問題が、より複雑なケースで再発します。テキストの表現を完了の合図とすることも、アンチパターンです。","w":["任意の上限を主な停止条件にしている点は、変わりません。",null,"不完全な情報に基づく回答になります。","文面は、終了の信頼できる信号ではありません。"]},{"sc":1,"d":1,"s":"1.1","lv":1,"q":"開発者が、すべての問い合わせで `get_customer`、`lookup_order`、`process_refund` の順にツールを実行するよう、処理を固定しました。その結果、アカウント設定の質問でも注文の検索が実行され、不要な返金の提案が行われます。最も適切な設計はどれですか。","o":["次に呼ぶツールはモデルに文脈から判断させ、本人確認のように必須の前提条件だけを、コードで強制する","固定の順序は維持し、不要な結果は無視するよう、プロンプトで指示する","固定の順序は維持したうえで、問い合わせの種類ごとに、別の固定の順序を、条件分岐として順次追加していく","すべてのツールを毎回並列に呼び出し、必要な結果だけを使わせる"],"a":[0],"e":"エージェントの利点は、モデルが文脈に基づいて、次に呼ぶツールを判断できることにあります。固定のツールの順序や、あらかじめ設定した判断の分岐は、想定外の問い合わせに対応できません。一方で、確実に守るべき前提条件は、コードで強制します。この2つを組み合わせるのが、適切な設計です。","w":[null,"不要な呼び出しと、不要な返金のリスクが残ります。","種類が増えるたびに分岐が増え、想定外の問い合わせに対応できません。","返金の処理まで、毎回実行されてしまいます。"]},{"sc":1,"d":2,"s":"2.1","lv":1,"q":"エージェントが、注文に関する質問に対して、`lookup_order` ではなく `get_customer` を呼び出すことが頻繁にあります。どちらのツールの説明も、「顧客の情報を取得する」「注文の詳細を取得する」という1文だけです。最初に行うべき改善はどれですか。","o":["2つのツールを `lookup_entity` に統合し、種別を引数で指定させる","各ツールの説明に、入力の形式、問い合わせの例、使い分けの境界を、具体的に記述する","正しいツールを選ぶ対話の例を、few-shot として5件以上追加する","注文に関する語を検出したら `lookup_order` に振り分けるルーティングの層を、前段に追加する"],"a":[1],"e":"ツールの説明は、モデルがツールを選ぶときの主な手がかりです。説明が最小限だと、似たツールの間で選択が不安定になります。まず、入力の形式、例、境界を説明に記述します。これは、最も手間が少なく、原因に直接対処する方法です。ツールの統合やルーティングの層は、説明の改善で解決しない場合に検討する、より大きな変更です。","w":["根本の原因である説明の不足が残り、過剰な変更です。",null,"トークンを消費するうえ、説明の不足は解消しません。","説明の改善で足りる問題に、過剰な仕組みを足しています。"]},{"sc":1,"d":2,"s":"2.2","lv":1,"q":"`process_refund` は、タイムアウト、金額の不正、ポリシー違反のいずれの場合にも、「Operation failed」という同じエラーを返します。エージェントは、ポリシー違反の返金を何度もリトライしています。最も適切な改善はどれですか。","o":["エラーのメッセージを、より丁寧で長い文章に書き換える","どのエラーの場合でも、3回までリトライするよう、システムプロンプトで指示する","エラーの種別、リトライの可否、説明を含む、構造化されたエラーを返す","エラーの場合は空の成功結果を返し、エージェントの処理を先に進ませる"],"a":[2],"e":"一律のエラーでは、エージェントは適切な回復の方法を選べません。エラーの種別（一時的、入力の検証、業務ルール、権限）、リトライが可能かどうか、人が読める説明を、構造化して返します。業務ルールの違反には、リトライ不可であることと、顧客に伝えられる説明を含めます。エラーを成功として返すことは、誤った前提での処理を招きます。","w":["エラーの種別とリトライの可否が、依然として分かりません。","ポリシー違反のような、リトライしても解決しないエラーまで再試行します。",null,"失敗を隠し、誤った前提で処理が進みます。"]},{"sc":1,"d":2,"s":"2.2","lv":1,"q":"`lookup_order` は、バックエンドがタイムアウトした場合にも、該当する注文がない場合と同じ、空の配列を返します。エージェントは、タイムアウトのときにも、顧客に「ご注文はありません」と回答しています。最も適切な改善はどれですか。","o":["タイムアウトは `isError` を付けたエラーとして返し、該当なしは成功した空の結果として区別する","空の結果が返った場合は、常に3回まで再検索するよう指示する","注文の件数を返す別のツールを追加して事前に呼び出させ、0件かどうかを確認してから、あらためて検索を実行させる","空の結果が返った場合は、常に人にエスカレーションする"],"a":[0],"e":"アクセスの失敗と、正常な空の結果は、区別して返す必要があります。前者は、リトライするかどうかの判断が必要なエラーであり、後者は、一致するものがなかったという成功した問い合わせです。常に再検索する方法は、正常な空の結果に対して無駄な呼び出しを生みます。常にエスカレーションする方法は、解決できるケースまで人に回してしまいます。","w":[null,"本当に該当がない場合にも、無駄な再検索を行います。","タイムアウトと該当なしを、依然として区別できません。","該当なしという正常な結果まで、人に回すことになります。"]},{"sc":1,"d":2,"s":"2.3","lv":1,"q":"このエージェントには、在庫管理やマーケティング用のものを含めて、18個のツールが与えられています。関係のないツールを呼び出す誤りが増えています。最も適切な改善はどれですか。","o":["ツールの定義の順序を、よく使う順に並べ替える","`tool_choice` を `any` にして、必ずいずれかのツールを呼び出させる","各ツールの説明を1行に短縮して、定義の全体のトークン数を減らす","役割に必要なツール（4〜5個）だけを与え、関係のないツールは取り除く"],"a":[3],"e":"ツールが多すぎると、判断が複雑になり、選択の信頼性が下がります。また、専門外のツールを与えられたエージェントは、それを誤用しがちです。各エージェントには、役割に必要なツールだけを与えます。説明を短縮すると、選択の手がかりが失われます。`tool_choice` を `any` にしても、どのツールを選ぶかの精度は上がりません。","w":["選択肢の数は減らず、誤選択の原因が残ります。","関係のないツールが選ばれる問題は、解消しません。","選択の手がかりが減り、誤選択が増えます。",null]},{"sc":1,"d":5,"s":"5.1","lv":1,"q":"長い対応の途中で会話を要約したところ、返金額や注文番号が、「一定の金額」「数件の注文」のような曖昧な表現に置き換わり、以降の対応が不正確になりました。最も適切な対策はどれですか。","o":["金額、日付、注文番号などを「ケースの事実」として抜き出し、要約の対象外として毎回含める","顧客に、重要な数値を定期的に言い直してもらう","要約を作るモデルを上位のものに変え、要約の文字数の上限を引き上げて、数値が残りやすくする","要約の頻度を下げ、より多くの会話をそのまま保持する"],"a":[0],"e":"段階的な要約では、数値、日付、顧客が述べた期待などの具体的な情報が、曖昧な表現に圧縮されがちです。取引に関する事実は、要約される履歴とは別の、永続的な「ケースの事実」のブロックとして保持し、毎回のプロンプトに含めます。要約の頻度を下げても、問題を先送りにするだけです。","w":[null,"顧客に負担を強いることになります。","要約である以上、細部が失われるリスクは残ります。","コンテキストの圧迫が早まり、要約したときの欠落も残ります。"]},{"sc":1,"d":5,"s":"5.2","lv":1,"q":"このエージェントが、人の担当者にエスカレーションすべき場面を2つ選んでください。","o":["問い合わせの文章が長く、複数の段落に分かれている","顧客の言葉づかいに苛立ちが見られるが、問題そのものは、ポリシーの範囲内で解決できる","エージェントが自己申告した確信度が、10段階で7である","顧客の要望について、ポリシーに規定がなく、判断の根拠がない","顧客が、人の担当者と話したいと明確に求めている"],"a":[3,4],"e":"エスカレーションの適切なきっかけは、顧客が人による対応を明確に求めた場合、ポリシーに規定がない、または例外の判断が必要な場合、そして有意義な進展が得られない場合です。顧客の感情や、モデルが自己申告した確信度は、ケースの複雑さを示す信頼できる指標ではありません。苛立ちが見られても解決できる問題であれば、気持ちを受け止めたうえで、解決策を提示します。","w":["長さは、対応の難しさを示しません。","感情の表れだけでは、エスカレーションの根拠になりません。","自己申告の確信度は、実際の難しさを反映しません。",null,null]},{"sc":1,"d":5,"s":"5.2","lv":1,"q":"顧客が氏名だけを伝えて、返金を依頼しました。`get_customer` で検索すると、同じ氏名の顧客が3人見つかりました。最も適切な対応はどれですか。","o":["一致が複数ある場合は、常に人の担当者にエスカレーションする","3人すべての注文を検索し、問い合わせの内容に最も合うものを選ぶ","メールアドレスや注文番号など、追加の識別情報を顧客に尋ねる","最も最近に注文した顧客を、該当の顧客と見なして処理を進める"],"a":[2],"e":"複数の候補が一致した場合は、経験則で1つを選ぶのではなく、追加の識別情報を尋ねて、対象を確定します。推測で選ぶと、誤った顧客の情報を扱うおそれがあります。すべての候補の注文を調べる方法は、他の顧客の情報に不必要にアクセスすることになります。この状況は、追加の質問で解決できるため、エスカレーションは不要です。","w":["追加の質問で解決できる場面を、人に回しています。","本人以外の情報を参照し、誤った特定にもつながります。",null,"推測による特定であり、別人の情報を扱うおそれがあります。"]},{"sc":2,"d":3,"s":"3.1","lv":1,"q":"新しく参加したメンバーの環境では、Claude Code がチームのコーディング規約に従いません。調べると、規約は、先輩の開発者の `~/.claude/CLAUDE.md` に記述されていました。最も適切な対処はどれですか。","o":["規約を毎回のプロンプトに貼り付けるよう、チームに周知する","新しいメンバーの環境で Claude Code を再インストールし、キャッシュを消去する","新しいメンバーに、先輩の `~/.claude/CLAUDE.md` をコピーしてもらう運用にする","規約をプロジェクトレベルの CLAUDE.md に移し、バージョン管理で共有する"],"a":[3],"e":"ユーザーレベルの `~/.claude/CLAUDE.md` は、そのユーザーにだけ適用され、バージョン管理では共有されません。チーム全員に適用したい規約は、プロジェクトレベル（`.claude/CLAUDE.md` またはルートの `CLAUDE.md`）に置きます。ファイルをコピーする運用は、内容のずれを生みます。原因は設定の階層にあるため、再インストールでは解決しません。","w":["手間がかかり、漏れも生じます。","規約が共有されていないという原因と、関係がありません。","更新が反映されず、内容がばらつきます。",null]},{"sc":2,"d":3,"s":"3.4","lv":1,"q":"次のうち、直接実行ではなく、プランモードから始めるのが適している作業を2つ選んでください。","o":["1つの関数に、入力値のチェックを1つ追加する","インフラの要件が異なる複数の統合方式の中から、採用する方式を決める","1つのファイルの中で、変数の名前を変更する","スタックトレースから原因が明確な、1ファイルのバグを修正する","モノリスのアプリケーションを、マイクロサービスに再編する"],"a":[1,4],"e":"プランモードは、大規模な変更、複数の有効な方針がある場合、アーキテクチャ上の判断、複数のファイルにまたがる変更に適しています。変更の前に、安全に調査と設計ができるため、手戻りを防げます。範囲が明確で単純な変更は、直接実行で十分です。","w":["範囲が明確な、小さな変更です。",null,"範囲が明確な、小さな変更です。","原因も修正の範囲も明確です。",null]},{"sc":2,"d":3,"s":"3.2","lv":1,"q":"コードベースの分析を行うスキルが、大量の出力を生成し、メインの会話のコンテキストを圧迫しています。最も適切な対策はどれですか。","o":["スキルを実行するたびに、開発者が直後に `/compact` を手動で実行して、増えた出力をその都度圧縮する","フロントマターに `context: fork` を指定し、独立したサブエージェントのコンテキストで実行する","スキルの本文に、「出力は簡潔にすること」と記載する","スキルの内容を CLAUDE.md に移して、常に読み込まれるようにする"],"a":[1],"e":"`context: fork` を指定すると、スキルは独立したサブエージェントのコンテキストで実行され、その出力がメインの会話を圧迫しません。大量の出力を伴う分析や、探索的な検討に適しています。「簡潔に」という指示では、探索の過程の出力は減りません。CLAUDE.md に移すと、常にコンテキストを消費します。","w":["手間がかかり、圧縮で必要な文脈を失うこともあります。",null,"探索の途中の出力は、メインのコンテキストに残ります。","常に読み込まれることになり、圧迫がさらに進みます。"]},{"sc":2,"d":3,"s":"3.2","lv":1,"q":"プロジェクトの CLAUDE.md に、年に数回しか使わない、300行のデータベース移行の手順が記述されています。最も適切な構成はどれですか。","o":["手順を `~/.claude/CLAUDE.md` に移して、プロジェクトのコンテキストから外す","手順を CLAUDE.md の先頭に移して、優先的に読まれるようにする","手順を、必要なときに呼び出すスキルに移し、CLAUDE.md には、常に適用する規約だけを残す","手順を3つに分割し、それぞれをサブディレクトリの CLAUDE.md に置く"],"a":[2],"e":"CLAUDE.md は、常に読み込まれる、普遍的な規約のための場所です。特定の作業のときだけ必要な手順は、必要に応じて呼び出されるスキルにします。これにより、普段のセッションのコンテキストを消費しません。ユーザーレベルに移すと、チームで共有できなくなります。","w":["すべてのプロジェクトで読み込まれ、チームで共有もされません。","常に読み込まれることは変わらず、コンテキストを消費します。",null,"手順は、特定のディレクトリに結び付くものではありません。"]},{"sc":2,"d":3,"s":"3.3","lv":1,"q":"テストファイルは、対象のコードと同じディレクトリに置かれており、コードベースの全体に分散しています。テストの規約を、テストファイルを編集するときにだけ適用したいと考えています。最も適切な方法はどれですか。","o":["各ディレクトリに CLAUDE.md を置き、テストの規約をそれぞれに記述する","`.claude/rules/` に、`paths` に `**/*.test.tsx` のような glob を指定したルールを置く","テストの規約をスキルにまとめ、テストを編集するたびに、開発者が呼び出す","ルートの CLAUDE.md に、「テストファイルを編集する場合にのみ適用すること」という見出しを設けて、その下にテストの規約を記述する"],"a":[1],"e":"`.claude/rules/` のルールファイルは、フロントマターの `paths` に glob を指定すると、一致するファイルを編集するときにだけ読み込まれます。ファイルの場所にかかわらず、種類で規約を適用できるため、コードベースに分散したファイルに適しています。ディレクトリごとの CLAUDE.md は、重複と保守の負担を生みます。ルートの CLAUDE.md は、常に読み込まれます。","w":["分散したテストファイルのために、同じ内容を多数の場所に置くことになります。",null,"呼び出しを忘れると、規約が適用されません。","常に読み込まれ、適用の判断もモデルに依存します。"]},{"sc":2,"d":3,"s":"3.4","lv":1,"q":"45個のファイルに影響する、ライブラリの移行を行います。進め方として最も適切なものはどれですか。","o":["すべての工程をプランモードのまま進め、実装は開発者が手作業で行う","プランモードで調査と計画を行い、合意した方針を、直接実行で実装する","直接実行で始め、問題のあるファイルを見つけるたびに、その場で修正する","ファイルごとに別のセッションを開始し、それぞれで個別に移行する"],"a":[1],"e":"多数のファイルに影響する変更では、プランモードで調査と設計を行い、方針が固まってから、直接実行で実装します。計画なしに始めると、途中で方針の変更が必要になり、手戻りが生じます。ファイルごとの個別のセッションでは、全体の一貫性が保たれません。","w":["実装を任せる利点を、捨てています。",null,"方針の誤りに、多数のファイルを変更した後で気づくことになります。","ファイル間で、方針の一貫性が失われます。"]},{"sc":2,"d":3,"s":"3.4","lv":1,"q":"プランモードでの調査が、大量の探索の出力を生み、設計の検討に入る前に、コンテキストウィンドウを使い切りそうです。最も適切な対策はどれですか。","o":["調査を Explore サブエージェントに任せ、要約だけをメインの会話に返させる","調査の結果をすべてメインの会話に出力させ、後から `/compact` で圧縮する","調査の範囲を、最初に見つかった10個のファイルに限定する","プランモードをやめ、直接実行で、調査と実装を同時に進める"],"a":[0],"e":"Explore サブエージェントは、大量の出力を伴う探索を、独立したコンテキストで実行し、要約だけを返します。これにより、メインの会話のコンテキストが保たれます。調査の範囲を機械的に限定すると、必要な情報を見落とします。後からの圧縮は、重要な詳細を失うおそれがあります。","w":[null,"圧縮の前に上限に達するおそれがあり、必要な詳細も失われます。","調査が不十分になり、計画の質が下がります。","コンテキストの問題は解消せず、計画なしの実装になります。"]},{"sc":2,"d":3,"s":"3.5","lv":1,"q":"データの変換の仕様を文章で説明して実装を依頼していますが、実行のたびに解釈が変わり、結果が一貫しません。最も効果的な改善はどれですか。","o":["同じ依頼を繰り返し、望む結果が出たものを採用する","入力と、期待する出力の具体例を、2〜3件示す","説明の文章をさらに詳しくし、例外の扱いを文章で列挙する","変換の処理を、より小さな関数に分割するよう依頼する"],"a":[1],"e":"文章による説明が一貫して解釈されない場合は、具体的な入力と出力の例を示すことが、最も効果的です。例は、期待する変換を曖昧さなく伝えます。説明をさらに詳しくしても、解釈のばらつきは残りがちです。依頼の繰り返しは、原因に対処していません。","w":["再現性がなく、手間もかかります。",null,"文章による説明は、解釈の揺れを解消しにくいものです。","仕様の解釈が揺れるという原因は、解消しません。"]},{"sc":2,"d":3,"s":"3.5","lv":1,"q":"チームにとって経験の少ない領域である、キャッシュの無効化の仕組みを実装します。実装に入る前の進め方として最も適切なものはどれですか。","o":["仕様を1行で伝え、詳細の判断はすべて Claude に任せる","すぐに実装させ、問題が見つかるたびに修正を依頼する","設計上の考慮点について、Claude から開発者に質問させる","一般的なキャッシュの実装例を検索させ、最初に見つかったものを採用する"],"a":[2],"e":"不慣れな領域では、実装の前に、Claude から質問させるインタビューのパターンが有効です。開発者が想定していなかった考慮点（無効化の戦略、障害時の挙動など）を、早い段階で洗い出せます。すぐに実装を始めると、設計上の問題が、後になってから見つかります。","w":["重要な設計の判断が、確認されないまま決まります。","考慮の漏れに、実装の後で気づくことになります。",null,"自社の要件に合うとは限りません。"]},{"sc":2,"d":5,"s":"5.4","lv":1,"q":"長時間の調査のセッションで、Claude の回答が、以前に見つけた具体的なクラスではなく、「一般的なパターン」に基づいた一貫性のないものになってきました。最も適切な対策はどれですか。","o":["これまでの会話の全文を、もう一度貼り付ける","コンテキストウィンドウのより大きいモデルに切り替えて、同じセッションをそのまま最後まで続ける","重要な発見をスクラッチパッドのファイルに記録し、以降の質問ではそれを参照させる","同じ質問を繰り返して、以前の回答を思い出させる"],"a":[2],"e":"長いセッションでは、コンテキストの劣化によって、以前の発見が反映されにくくなります。重要な発見をスクラッチパッドのファイルに書き出しておくと、コンテキストの境界を越えて、確実に参照できます。会話の全文の貼り直しは、コンテキストをさらに圧迫します。大きなコンテキストウィンドウは、劣化を先送りにするだけです。","w":["コンテキストをさらに圧迫します。","長いコンテキストで細部が薄れる問題は、残ります。",null,"薄れた文脈は、繰り返しても戻りません。"]},{"sc":2,"d":5,"s":"5.4","lv":1,"q":"複数のエージェントを使った、数時間かかるコードベースの調査が、途中でクラッシュすることがあります。復旧の設計として最も適切なものはどれですか。","o":["クラッシュした時点までの会話とツール呼び出しを、記録に基づいて、最初からすべて順番に再実行して、状態を復元する","クラッシュに備えて、すべての処理を1つのエージェントにまとめる","再開の際は、以前の結果を使わずに、新しい調査を始める","各エージェントが状態を決まった場所に書き出し、再開時に、コーディネーターがそのマニフェストを読み込む"],"a":[3],"e":"各エージェントが、進捗と発見を、構造化された状態として決まった場所に書き出しておけば、クラッシュの後に、コーディネーターがそのマニフェストを読み込んで、続きから再開できます。最初からの再実行や、新しい調査の開始は、完了した作業を無駄にします。1つのエージェントにまとめると、コンテキストの問題が悪化します。","w":["時間とコストがかかり、結果が再現される保証もありません。","コンテキストの問題が生じ、クラッシュからの復旧もできません。","それまでの成果が、すべて失われます。",null]},{"sc":2,"d":5,"s":"5.4","lv":1,"q":"調査の第1段階（構造の把握）が終わり、第2段階（個別のモジュールの詳細な分析）のサブエージェントを起動します。コンテキストの引き継ぎとして最も適切なものはどれですか。","o":["第1段階と第2段階を、同じコンテキストの中で続けて実行する","第1段階の出力をすべて、そのまま第2段階のサブエージェントに渡す","第2段階のサブエージェントには何も渡さず、必要な調査をやり直させる","第1段階の主要な発見を要約し、第2段階のサブエージェントの最初のコンテキストに含める"],"a":[3],"e":"段階が変わるときは、前の段階の主要な発見を要約し、次の段階のエージェントの最初のコンテキストに含めます。出力の全体を渡すと、無関係な詳細がコンテキストを占めます。何も渡さなければ、同じ調査を繰り返すことになります。同じコンテキストで続けると、探索の出力が蓄積します。","w":["第1段階の出力が残り、コンテキストを圧迫します。","不要な途中経過で、コンテキストを圧迫します。","同じ調査を繰り返すことになります。",null]},{"sc":2,"d":5,"s":"5.4","lv":1,"q":"メインのエージェントが、「すべてのテストファイルを見つける」「返金の処理の依存関係をたどる」といった詳細な調査を自分で行い、コンテキストが調査の出力で埋まっています。最も適切な設計はどれですか。","o":["個々の調査をサブエージェントに委任し、メインのエージェントは、全体の把握と調整に専念する","調査の出力を、すべてシステムプロンプトに移す","調査のたびに新しいセッションを開始し、結果は、開発者が手作業でメインのセッションに転記する","調査で読み込むファイルの数に、上限を設ける"],"a":[0],"e":"詳細な調査は、焦点を絞った問いとしてサブエージェントに委任します。サブエージェントは、大量の出力を自分のコンテキストに閉じ込め、要点だけを返します。メインのエージェントは、高い水準での調整を保てます。ファイルの数の上限は、必要な調査を妨げます。システムプロンプトに移しても、消費するトークンは変わりません。","w":[null,"コンテキストの消費は、変わりません。","手間がかかり、自動化の利点を失います。","調査が不十分になります。"]},{"sc":2,"d":1,"s":"1.7","lv":1,"q":"昨日のセッションを再開して作業を続けていますが、その間に、同僚が3つのファイルを変更していました。Claude は、古い内容に基づいて提案をしています。最も適切な対応はどれですか。","o":["変更されたファイルを伝えて再分析させる。古い結果が多ければ、要約を引き継いで新しく始める","以前のセッションの結果を信頼し、変更との差異は、マージの際に解消する","再開したセッションは、ファイルの最新の状態を常に自動で把握しているので、特に何もせずに作業を続ける","すべてのファイルを、最初から読み直すよう指示する"],"a":[0],"e":"再開したセッションには、以前のツールの結果が残っており、その後の変更は反映されていません。変更されたファイルを具体的に伝えれば、対象を絞って再分析できます。以前の結果の多くが古くなっている場合は、構造化した要約を引き継いで、新しいセッションを始めるほうが確実です。すべての読み直しは、効率が悪くなります。","w":[null,"古い内容に基づく誤った作業が、進んでしまいます。","再開したセッションの履歴には、古いファイルの内容が残っています。","変更されたのは3つだけであり、過剰です。"]},{"sc":2,"d":1,"s":"1.7","lv":1,"q":"コードベースの分析を終え、2つのリファクタリングの方針を比較したいと考えています。最も適切な方法はどれですか。","o":["`fork_session` で、共通の分析結果から独立した分岐を作り、それぞれで方針を試す","2つの方針を、1つのプロンプトで同時に実装するよう依頼する","同じセッションで一方を実装し、取り消してから、もう一方を実装する","新しいセッションを2つ開始し、それぞれで、分析を最初からやり直す"],"a":[0],"e":"`fork_session` は、共通の分析の基準点から、独立した分岐を作ります。それぞれの分岐で異なる方針を試し、比較できます。同じセッションで順に試すと、一方の検討が、もう一方に影響します。新しいセッションでの分析のやり直しは、完了した作業の重複になります。","w":[null,"2つの方針が混ざり、比較できません。","1つ目の試行が、コンテキストに残って影響します。","共通の分析を、重複して行うことになります。"]},{"sc":3,"d":1,"s":"1.2","lv":1,"q":"「AI が創造産業に与える影響」というテーマのレポートが、視覚芸術の内容だけで構成されていました。コーディネーターのログを確認すると、サブエージェントに割り当てたサブトピックは、「デジタルアート」「グラフィックデザイン」「写真」の3つでした。各サブエージェントは、割り当てられた範囲を適切に調査しています。根本の原因はどれですか。","o":["統合のサブエージェントに、網羅性を確認する指示が欠けていた","文書分析のサブエージェントが、視覚芸術以外の資料を除外していた","コーディネーターによるタスクの分解が狭すぎ、音楽、文筆、映像などの分野が割り当てられなかった","Web 検索のサブエージェントの検索クエリが不十分で、他の分野の情報を見つけられなかった"],"a":[2],"e":"ログは、コーディネーターが、テーマを視覚芸術のサブトピックだけに分解したことを示しています。各サブエージェントは、割り当てられた範囲を正しく実行しており、問題は割り当ての段階にあります。コーディネーターによる分解が狭すぎると、広いテーマの網羅性が損なわれます。下流のエージェントを調整しても、割り当てられなかった範囲は調査されません。","w":["統合の段階より前に、範囲が狭められています。","ログには、他の分野が割り当てられていないことが示されています。",null,"割り当てられた範囲は、検索できています。"]},{"sc":3,"d":1,"s":"1.3","lv":1,"q":"統合のサブエージェントの出力が、一般論ばかりになっています。コーディネーターが Task ツールに渡したプロンプトは、「調査結果を統合してください」という1文だけでした。最も適切な修正はどれですか。","o":["統合のサブエージェントに Web 検索のツールを与え、必要な情報を自分で調べ直させる","統合のサブエージェントのシステムプロンプトに、「具体的に詳しく書くこと」と追加する","検索と分析の結果を、出典の情報とともに、サブエージェントへのプロンプトに明示的に含める","サブエージェントに、コーディネーターの会話履歴を参照するよう指示する"],"a":[2],"e":"サブエージェントは、独立したコンテキストで動作し、コーディネーターの会話履歴を自動的には引き継ぎません。必要な情報は、プロンプトに明示的に含める必要があります。前の段階の結果を、出典の情報とともに、構造化して渡します。「詳しく書くこと」という指示では、材料の不足は補えません。調べ直しは、作業の重複であり、役割の境界も崩します。","w":["すでに得られた結果を、重複して調べることになります。","材料が渡されていなければ、具体的には書けません。",null,"サブエージェントは、コーディネーターの履歴を参照できません。"],"g":"試験ガイド v1.0 は、サブエージェントを起動するツールを、`Task` と呼んでいます。現在の Claude Code では、このツールの名前は、`Agent` に変更されています（`Task` は、別名として、引き続き使えます）。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":1,"s":"1.3","lv":1,"q":"コーディネーターは、3つの検索のサブエージェントを、1ターンに1つずつ起動し、結果を待ってから次を起動しています。レポートの完成までに時間がかかりすぎています。最も適切な改善はどれですか。","o":["コーディネーターを高速なモデルに変え、ターンの間隔を短くする","各サブエージェントの `max_tokens` を小さくして、応答を速くする","検索のサブエージェントを1つにまとめ、3つのテーマを順番に調べさせる","コーディネーターの1回の応答で、複数の Task ツールの呼び出しを出力させ、並列に実行する"],"a":[3],"e":"独立した調査は、コーディネーターの1回の応答の中で、複数の Task ツールの呼び出しを出力することで、並列に実行できます。ターンを分けて1つずつ起動すると、逐次の実行になります。サブエージェントを1つにまとめても、処理は逐次のままです。出力の上限やモデルの変更は、逐次であるという原因に対処していません。","w":["直列に待つ構造は、変わりません。","出力が切れるおそれがあり、直列であることも変わりません。","直列の処理のままで、速くなりません。",null],"g":"試験ガイド v1.0 は、サブエージェントを起動するツールを、`Task` と呼んでいます。現在の Claude Code では、このツールの名前は、`Agent` に変更されています（`Task` は、別名として、引き続き使えます）。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":1,"s":"1.3","lv":1,"q":"コーディネーターが、サブエージェントに委任せず、すべての調査を自分で行おうとします。設定を確認すると、コーディネーターの `allowedTools` は `[\"WebSearch\", \"Read\"]` でした。最も適切な修正はどれですか。","o":["コーディネーターのシステムプロンプトに、「必ずサブエージェントに委任すること」と記載する","サブエージェントの定義に、コーディネーターの名前を登録する","コーディネーターの `allowedTools` に、`Task` を追加する","サブエージェントの側の `allowedTools` に、`Task` を追加する"],"a":[2],"e":"サブエージェントは、Task ツールによって起動されます。コーディネーターがサブエージェントを呼び出すには、`allowedTools` に `Task` が含まれている必要があります。ツールが許可されていなければ、プロンプトで指示しても、委任はできません。`Task` が必要なのは、委任する側であるコーディネーターです。","w":["ツールが許可されていなければ、指示があっても呼び出せません。","委任に必要なのは、コーディネーターの側のツールの許可です。",null,"委任を行うのは、コーディネーターです。"],"g":"試験ガイド v1.0 は、サブエージェントを起動するツールを、`Task` と呼んでいます。現在の Claude Code では、このツールの名前は、`Agent` に変更されています（`Task` は、別名として、引き続き使えます）。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":1,"s":"1.2","lv":1,"q":"「ある企業の設立年」のような単純な事実の質問に対しても、検索、分析、統合、レポート作成の4つのサブエージェントが、すべて実行されています。最も適切な設計はどれですか。","o":["すべてのサブエージェントを常に並列に実行して、所要時間を短縮する","すべての問い合わせで、4つのサブエージェントを必ず実行する現在の設計を維持する","コーディネーターが問い合わせを分析し、必要なサブエージェントだけを選んで呼び出す","単純な問い合わせを検出したら、エラーを返して、入力のやり直しを求める"],"a":[2],"e":"コーディネーターは、問い合わせの複雑さを分析し、必要なサブエージェントを動的に選びます。すべての問い合わせを、常に完全なパイプラインに通す必要はありません。単純な質問であれば、検索だけで十分な場合があります。常に全体を実行する設計は、コストと時間の無駄になります。","w":["不要な処理のコストは、減りません。","単純な質問にも、過大な時間とコストがかかります。",null,"正当な質問を、拒否することになります。"]},{"sc":3,"d":1,"s":"1.2","lv":1,"q":"完成したレポートに、テーマの一部が抜けていることがよくあります。コーディネーターは、検索、分析、統合を、1回ずつ実行するだけです。最も適切な改善はどれですか。","o":["不足がある場合は、レポートの末尾に「一部の範囲は未調査」とだけ記載して、そのまま利用者に提出する","統合のサブエージェントに、不足している内容を推測で補わせる","コーディネーターが統合の出力の不足を評価し、その点を検索と分析に再委任して、再度統合する","最初から検索の件数を10倍にして、不足が起きないようにする"],"a":[2],"e":"コーディネーターは、統合の出力を評価して不足を見つけ、対象を絞った問いを検索と分析のサブエージェントに再委任し、十分な網羅性が得られるまで統合を繰り返します。推測による補完は、根拠のない内容を生みます。検索の量を増やすだけでは、不足している範囲に焦点が当たりません。","w":["不足を埋めずに、提出することになります。","根拠のない内容が、レポートに入ります。",null,"コストが増えるうえ、不足が解消する保証もありません。"]},{"sc":3,"d":1,"s":"1.2","lv":1,"q":"ある開発者が、処理を速くするために、検索のサブエージェントと分析のサブエージェントが、コーディネーターを介さずに直接やり取りする構成を提案しました。評価として最も適切なものはどれですか。","o":["すべてのやり取りをコーディネーター経由とし、可観測性、一貫したエラー処理、情報の流れの制御を保つ","検索と分析のサブエージェントの間だけ、直接のやり取りを認める","サブエージェントが、共有のメモリに自由に書き込み、互いの途中の結果を、必要に応じて直接参照し合う構成にする","速度を優先し、サブエージェント同士が直接やり取りする構成に変更する"],"a":[0],"e":"ハブ・アンド・スポークの構成では、コーディネーターが、サブエージェント間のすべてのやり取り、エラー処理、情報の経路を管理します。これにより、何が起きたかを追跡でき、エラーへの対応も一貫します。直接のやり取りや共有のメモリは、情報の流れを追いにくくし、障害の原因の特定を難しくします。","w":[null,"一部であっても、可観測性と制御が失われます。","情報の流れを制御できず、不整合が生じやすくなります。","やり取りを追跡できず、エラー処理も一貫しなくなります。"]},{"sc":3,"d":1,"s":"1.3","lv":1,"q":"コーディネーターは、サブエージェントに、「このキーワードで検索する」「上位3件を開く」といった、手順を細かく指定したプロンプトを渡しています。検索の結果が乏しい場合に、サブエージェントが柔軟に対応できません。最も適切な改善はどれですか。","o":["サブエージェントに渡す指示を、キーワードの一覧だけにする","調査の目的と、満たすべき品質の基準を伝え、進め方はサブエージェントに委ねる","手順をさらに細かくし、想定される例外ごとの分岐を書き加える","手順を守れなかった場合は、エラーを返して終了させる"],"a":[1],"e":"コーディネーターのプロンプトは、手順を逐一指定するのではなく、調査の目的と品質の基準を示します。これにより、サブエージェントは、状況に応じて進め方を調整できます。手順を細かくするほど、想定外の状況に対応できなくなります。キーワードだけでは、何を達成すべきかが伝わりません。","w":["目的と品質の基準が、伝わりません。",null,"硬直性が増し、状況への適応ができなくなります。","柔軟な対応を、さらに妨げます。"]},{"sc":3,"d":1,"s":"1.2","lv":1,"q":"2つの検索のサブエージェントが、ほぼ同じ情報源を返しており、作業が重複しています。最も適切な改善はどれですか。","o":["重複した結果を、統合のサブエージェントに削除させる","担当するサブトピックや情報源の種類を分けて割り当て、範囲の重複をなくす","検索のサブエージェントを1つに減らす","2つのサブエージェントに同じ指示を与え、結果の一致を、信頼性の指標として使う"],"a":[1],"e":"コーディネーターは、サブエージェントに、異なるサブトピックや情報源の種類を割り当てて、調査の範囲を分割します。これにより、重複を最小限にしながら、網羅性を高められます。下流での重複の削除は、無駄な作業の後始末にすぎません。サブエージェントを減らすと、並列の利点が失われます。","w":["重複して調べるコストは、すでに発生しています。",null,"並列化の利点と、調査の幅を失います。","重複がそのまま残り、コストが無駄になります。"]},{"sc":3,"d":2,"s":"2.3","lv":1,"q":"統合のサブエージェントは、作業の途中で、日付や数値などの単純な事実の確認を頻繁に必要とします。現在は、すべての確認をコーディネーター経由で検索のサブエージェントに依頼しており、1回の確認に2〜3ターンかかります。確認の85%は、単純なものです。最も適切な改善はどれですか。","o":["確認が必要な点をまとめて、統合の最後に、一括でコーディネーターに送る","統合のサブエージェントに、範囲を絞った `verify_fact` ツールを与え、複雑な確認は従来どおりとする","統合のサブエージェントに、Web 検索のツールをすべて与える","検索のサブエージェントが、統合の段階で必要になりそうな情報をあらかじめ予測し、追加の出典を多めに集めて渡しておく"],"a":[1],"e":"頻度の高い単純なニーズには、範囲を絞った役割横断のツールを与え、複雑なケースは、コーディネーター経由のままにします。これにより、大半の確認の往復をなくしつつ、役割の分離を保てます。検索のツールをすべて与えると、統合のエージェントが、専門外の作業を始めてしまいます。一括の確認は、後の作業が前の確認の結果に依存する場合に、支障が出ます。","w":["途中の判断に必要な確認が、間に合いません。",null,"役割を超えたツールを与えることになり、誤用を招きます。","必要になる確認を、事前にすべて予測することはできません。"]},{"sc":3,"d":2,"s":"2.1","lv":1,"q":"`analyze_content` と `analyze_document` の2つのツールは、説明がほとんど同じで、エージェントが使い分けを誤ります。前者は Web の検索結果の処理、後者は文書の分析を意図しています。最も適切な改善はどれですか。","o":["`analyze_content` を `extract_web_results` に改名し、Web の検索結果に特化した説明にする","2つのツールの説明を同じ文面に揃えて、どちらを選んでも動くようにする","どちらか一方のツールを呼び出した後に、必ずもう一方のツールも同じ入力で呼び出して、両方の結果を比較してから、良いほうを採用するよう指示する","システムプロンプトに、「ツールを慎重に選ぶこと」と追記する"],"a":[0],"e":"名前と説明が重複していると、モデルは使い分けの手がかりを得られません。ツールの名前を目的が分かるものに変え、説明を、入力、出力、使う場面が区別できるように書き換えます。「慎重に選ぶこと」という指示は、判断の根拠を与えません。両方を呼び出す方法は、無駄な処理を増やします。","w":[null,"区別が、さらにつかなくなります。","呼び出しが2倍になり、選択の問題も解決しません。","区別の手がかりが、与えられていません。"]},{"sc":3,"d":2,"s":"2.3","lv":1,"q":"文書分析のサブエージェントが、汎用の `fetch_url` ツールを使って、文書の読み込み以外の目的で、任意の Web ページを取得することがあります。最も適切な改善はどれですか。","o":["`fetch_url` の説明に、「文書以外には使用しないこと」と記載する","`fetch_url` を呼び出せる回数を、1回に制限する","`fetch_url` が取得した結果を、すべてコーディネーターが再確認し、文書以外の内容であれば、その場で破棄する","`fetch_url` を、文書の URL であることを検証する `load_document` に置き換える"],"a":[3],"e":"汎用のツールは、意図しない用途に使われやすくなります。役割に必要な操作だけを行える、制約のあるツールに置き換えることで、誤用を構造的に防げます。説明への記載は、確率的な抑止にとどまります。回数の制限は、正当な利用も妨げます。","w":["指示であり、強制力がありません。","正当な文書の読み込みまで、妨げます。","取得は実行された後であり、負荷も増えます。",null]},{"sc":3,"d":2,"s":"2.1","lv":1,"q":"システムプロンプトに、「最新の情報は、必ず検索して確認すること」と記載しています。その結果、渡された文書を分析するだけの依頼でも、エージェントが Web 検索を優先して呼び出します。ツールの説明は、適切に書かれています。最も適切な対応はどれですか。","o":["Web 検索のツールを、エージェントから取り除く","システムプロンプトの記述が意図しないツールの関連付けを生んでいないかを見直す","`tool_choice` で、依頼の内容にかかわらず、常に文書分析のツールの呼び出しを強制する","文書分析のツールの説明を、さらに長くする"],"a":[1],"e":"システムプロンプトの表現は、キーワードを通じて、意図しないツールの関連付けを生むことがあります。適切に書かれたツールの説明よりも、優先されてしまう場合があります。システムプロンプトを見直し、指示がいつ適用されるのかを明確にします。ツールの削除や強制は、正当な利用まで妨げます。","w":["検索が必要な場面でも、使えなくなります。",null,"検索が必要な依頼にも、対応できなくなります。","原因は、システムプロンプトの記述にあります。"]},{"sc":3,"d":5,"s":"5.3","lv":1,"q":"Web 検索のサブエージェントが、ある複雑なテーマの調査中に、タイムアウトしました。コーディネーターに返す情報の設計として、最も適切なものはどれですか。","o":["失敗の種類、試したクエリ、部分的な結果、代替の手段を含む、構造化されたエラーの情報を返す","例外を握りつぶし、空の結果を、成功として返す","例外をそのまま最上位まで伝播させて、ほかのサブエージェントも含めて、ワークフローの全体を終了する","「検索できませんでした」という、汎用のステータスだけを返す"],"a":[0],"e":"構造化されたエラーの情報があれば、コーディネーターは、クエリを変えて再試行する、別の手段を試す、部分的な結果で進めるといった、適切な回復を選べます。汎用のステータスでは、判断の材料がありません。エラーを成功として隠すことも、1つの失敗で全体を終了することも、避けるべきアンチパターンです。","w":[null,"失敗が隠され、情報がないものと誤解されます。","ほかのサブエージェントの成果まで、失われます。","コーディネーターが、回復の方法を判断できません。"]},{"sc":3,"d":5,"s":"5.6","lv":1,"q":"2つの信頼できる情報源が、同じ指標について、異なる統計値を示しています。統合のサブエージェントの扱いとして、最も適切なものはどれですか。","o":["相違のある統計は、レポートから除外する","両方の値を、出典と時点を明記して併記し、相違があることを注記する","新しいほうの情報源の値だけを採用し、古いほうには触れない","2つの値の平均を計算して、記載する"],"a":[1],"e":"信頼できる情報源の間で値が異なる場合は、どちらかを任意に選ぶのではなく、両方を、出典と時点を明記して併記し、相違を注記します。調査の時期や定義の違いが、相違の原因であることもあります。平均は、どの情報源にも基づかない値です。除外すると、読み手が判断の材料を失います。","w":["重要な情報が、失われます。",null,"相違があることが、読み手に伝わりません。","根拠のない値を、作ることになります。"]},{"sc":4,"d":1,"s":"1.6","lv":1,"q":"テストがほとんどないレガシーなコードベースに、包括的なテストを追加するよう依頼されました。タスクの分解として、最も適切なものはどれですか。","o":["最初に見つかったファイルからテストを書き始め、時間が尽きるまで続ける","すべてのファイルに対して、同じテスト生成のプロンプトを順番に適用する、固定のパイプラインにする","すべてのファイルを最初に読み込んでから、一度にテストを生成する","まず構造を把握して影響の大きい領域を特定し、依存関係が分かるにつれて見直す、優先順位付きの計画を立てる"],"a":[3],"e":"何が必要かが調査するまで分からない、開放的なタスクには、動的な分解が適しています。まず構造を把握し、影響の大きい領域を特定して、計画を立てます。依存関係などの発見に応じて、計画を見直します。固定のパイプラインは、手順が予測できるタスクのためのものです。","w":["影響の大きい領域が、後回しになるおそれがあります。","重要度や依存関係を考慮できず、発見に応じた見直しもできません。","コンテキストを使い切り、テストの質も下がります。",null]},{"sc":4,"d":1,"s":"1.6","lv":1,"q":"あるモジュールについて、毎回同じ観点（命名、エラー処理、ファイル間の整合性）でコードレビューを行います。手順は、あらかじめ決まっています。最も適切な構成はどれですか。","o":["ファイルごとに分析し、その後でファイル間の整合性を確認する、プロンプトチェーンにする","何をどの順で調べるかを、レビューのたびに、エージェントにその都度決めさせる、動的な分解にする","すべてのファイルを1回のプロンプトに入れ、すべての観点を同時に確認する","観点ごとに別のモデルを使い、結果を多数決で決める"],"a":[0],"e":"手順が予測できる、複数の観点のレビューには、プロンプトチェーン（固定の順序のパイプライン）が適しています。ファイルごとの分析の後に、ファイル間の統合のパスを実行します。動的な分解は、開放的な調査のためのものです。すべてを1回のプロンプトに入れると、注意が分散し、見落としが増えます。","w":[null,"手順が決まっている作業では、ばらつきが増えるだけです。","注意が分散し、ファイルによって深さがばらつきます。","コストが増えるだけで、観点ごとの確認の質は上がりません。"]},{"sc":4,"d":1,"s":"1.3","lv":1,"q":"テストの作成を専門とするサブエージェントに、ファイルの読み取りとテストファイルの書き込みだけを許可し、役割に特化した指示を与えたいと考えています。最も適切な方法はどれですか。","o":["コーディネーターのシステムプロンプトの中に、「テストを書くときは、ほかのファイルを変更せず、慎重に行うこと」と記載する","サブエージェントの種類ごとに、説明、システムプロンプト、ツールの制限を、AgentDefinition で定義する","すべてのサブエージェントに同じツールを与え、使い方をプロンプトで説明する","テストの作成のたびに、コーディネーターが自分でファイルを書き込む"],"a":[1],"e":"AgentDefinition では、サブエージェントの種類ごとに、説明、システムプロンプト、ツールの制限を設定できます。これにより、役割に特化した指示と、必要最小限のツールを与えられます。すべてのサブエージェントに同じツールを与えると、専門外の操作が行われるおそれがあります。","w":["指示であり、ツールの制限にはなりません。",null,"役割を超えた操作が、可能なままです。","役割の分離と、コンテキストの分離の利点を失います。"]},{"sc":4,"d":1,"s":"1.5","lv":1,"q":"このエージェントは、`migrations/` ディレクトリと本番の設定ファイルを変更してはなりません。プロンプトで指示していますが、まれに変更してしまいます。最も適切な対策はどれですか。","o":["保護対象のファイルとディレクトリの一覧を、毎回のプロンプトの末尾に、注意書きとして追加する","システムプロンプトの指示を、より強い表現に書き換える","ツール呼び出しを実行前に横取りするフックで、保護対象のパスへの書き込みをブロックする","変更された場合に検知できるよう、実行の後にログを確認する"],"a":[2],"e":"確実に守らなければならないルールは、プロンプトではなく、フックで強制します。フックは決定的に動作するため、保護対象への書き込みを、確実にブロックできます。プロンプトの指示は、表現を強めても、確率的な遵守にとどまります。実行の後の検知では、変更はすでに行われています。","w":["指示であることは変わらず、確実には守られません。","指示は、確実には守られません。",null,"変更された後であり、防止になりません。"]},{"sc":4,"d":1,"s":"1.7","lv":1,"q":"昨日、あるレガシーなモジュールの調査を、名前を付けたセッションで行いました。コードは、その後変更されていません。今日、調査の続きを行う方法として、最も適切なものはどれですか。","o":["`fork_session` で、新しい分岐を作ってから調査を始める","昨日のターミナルの出力を、すべてコピーして貼り付ける","新しいセッションを開始し、昨日の調査を最初からやり直す","`--resume` にセッションの名前を指定して、昨日のセッションを再開する"],"a":[3],"e":"`--resume` にセッションの名前を指定すると、以前の会話のコンテキストを引き継いで、作業を続けられます。コードが変更されておらず、以前のコンテキストが有効である場合は、再開が適しています。調査のやり直しは、作業の重複です。`fork_session` は、同じ基準点から複数の方針を比較するための機能です。","w":["分岐は、別の方針を並行して試すための機能です。","手間がかかり、コンテキストも無駄に消費します。","コードは変わっておらず、昨日の調査をそのまま使えます。",null]},{"sc":4,"d":2,"s":"2.5","lv":1,"q":"エージェントが、(1) ある関数を呼び出している箇所をすべて見つける作業と、(2) 名前が `.test.tsx` で終わるファイルをすべて見つける作業を行います。組み込みツールの選択として、正しい組み合わせはどれですか。","o":["(1) Grep、(2) Glob","(1) Grep、(2) Grep","(1) Glob、(2) Grep","(1) Read、(2) Read"],"a":[0],"e":"Grep は、ファイルの内容を検索するツールで、関数名、エラーメッセージ、インポート文などを探すのに使います。Glob は、ファイルのパスを、名前や拡張子のパターンで検索するツールです。関数の呼び出し箇所は内容の検索なので Grep、名前のパターンに一致するファイルは Glob が適しています。","w":[null,"ファイル名のパターンによる検索には、Glob を使います。","役割が逆です。Glob はファイル名、Grep はファイルの内容を調べます。","Read は、場所が分かっているファイルを読むためのツールです。"]},{"sc":4,"d":2,"s":"2.5","lv":1,"q":"ある関数が、ラッパーのモジュールを通じて、別の名前で再エクスポートされています。元の関数名で Grep を実行しても、利用箇所の一部しか見つかりません。最も適切な進め方はどれですか。","o":["元の関数名での検索を、大文字と小文字を区別せずにやり直す","Glob で、元の関数名を含むファイル名を検索する","すべてのファイルを Read で順番に読み込み、関数の利用箇所を、目視で1つずつ確認する","ラッパーがエクスポートしている名前を洗い出し、それぞれの名前でコードベースを検索する"],"a":[3],"e":"ラッパーのモジュールを経由した利用を追跡するには、まず、エクスポートされている名前をすべて特定し、それぞれの名前で、コードベースを検索します。元の名前だけの検索では、別名での利用を見落とします。すべてのファイルを読み込む方法は、コンテキストを浪費します。","w":["別の名前で使われている箇所は、見つかりません。","Glob はファイル名を調べるもので、内容は調べません。","非効率で、コンテキストも使い切ります。",null]},{"sc":4,"d":2,"s":"2.5","lv":1,"q":"Edit ツールによる変更が、対象の文字列がファイルの中に複数あり、一意に特定できないために失敗しました。確実な代替の手段として、最も適切なものはどれですか。","o":["同じ Edit を、成功するまで繰り返す","Read でファイルの全体を読み込み、Write で書き直す","該当のファイルの編集をあきらめ、開発者に手作業を依頼する","Bash で `sed` を使い、一致するすべての箇所を一括で置換する"],"a":[1],"e":"Edit は、一意の文字列の一致によって、対象を絞った変更を行います。一致が一意でない場合は、Read でファイルの全体を読み込み、Write で書き直す方法が、確実な代替の手段です。同じ Edit の繰り返しは、同じ理由で失敗します。一括の置換は、意図しない箇所まで変更します。","w":["対象が一意でない限り、同じ理由で失敗します。",null,"別の手段で、確実に編集できます。","意図しない箇所まで、置換されます。"]},{"sc":4,"d":2,"s":"2.5","lv":1,"q":"エージェントが、不慣れなコードベースで、ある機能の処理の流れを理解しようとしています。進め方として、最も適切なものはどれですか。","o":["最初にすべてのファイルを Read で読み込み、コードベースの全体を把握してから、質問に答える","ディレクトリごとにサブエージェントを起動し、すべてのファイルを要約させる","ファイル名の一覧だけを見て、処理の流れを推測する","Grep で入口を見つけ、Read でインポートをたどりながら、必要な範囲を段階的に理解する"],"a":[3],"e":"コードベースの理解は、段階的に進めます。Grep で入口となる箇所を見つけ、Read でインポートをたどって、処理の流れを追います。すべてのファイルを最初に読み込むと、コンテキストを使い切ります。ファイル名だけからの推測は、不正確です。全ファイルの要約は、目的に対して過剰です。","w":["コンテキストを使い切り、必要な情報も埋もれます。","1つの機能の理解には、過剰なコストです。","内容を確認しておらず、推測になります。",null]},{"sc":4,"d":2,"s":"2.4","lv":1,"q":"MCP サーバーの設定の置き場所について、正しい使い分けを2つ選んでください。","o":["個人的に試しているサーバーは、ユーザーレベルの `~/.claude.json` に定義する","チームで共有するサーバーは、プロジェクトの `.mcp.json` に定義する","認証用のトークンは、`.mcp.json` に直接書き込んで、コミットする","個人的に試しているサーバーは、プロジェクトの `.mcp.json` に定義する","チームで共有するサーバーは、各自の `~/.claude.json` に、手作業で定義してもらう"],"a":[0,1],"e":"チームで共有するツールは、プロジェクトレベルの `.mcp.json` に定義し、バージョン管理で共有します。個人的な、または実験的なサーバーは、ユーザーレベルの `~/.claude.json` に定義します。トークンは、`${GITHUB_TOKEN}` のような環境変数の展開を使い、バージョン管理に含めません。","w":[null,null,"秘密の情報が、リポジトリに残ります。","チームの全員に、影響が及びます。","設定が共有されず、内容がばらつきます。"]},{"sc":4,"d":2,"s":"2.4","lv":1,"q":"コードの意味的な検索ができる MCP ツールを導入しましたが、エージェントは、組み込みの Grep ばかりを使います。MCP ツールの説明は、「コードを検索する」という1文です。最も適切な改善はどれですか。","o":["MCP ツールの名前を、`grep2` に変更する","システムプロンプトに、「MCP ツールを優先すること」とだけ記載する","組み込みの Grep を、利用できないように無効化する","MCP ツールの説明に、できることと、返す結果の内容を、具体的に記述する"],"a":[3],"e":"モデルは、説明からツールの能力を判断します。説明が不十分だと、より高機能な MCP ツールがあっても、なじみのある組み込みのツールを選びます。MCP ツールの能力と出力を、具体的に説明します。Grep の無効化は、Grep が適している場面まで妨げます。","w":["名前を変えても、機能は伝わりません。","いつ、何のために使うのかが、伝わりません。","Grep が適している場面でも、使えなくなります。",null]},{"sc":4,"d":2,"s":"2.4","lv":1,"q":"エージェントが、どのようなドキュメントや、データベースのテーブルがあるのかを知るために、探索のためのツール呼び出しを、何度も繰り返しています。最も適切な改善はどれですか。","o":["すべてのドキュメントの本文とスキーマの定義を、システムプロンプトに含めておく","探索用のツールを、さらに細かい単位に分割する","探索のための呼び出しの回数に、上限を設ける","ドキュメントの階層やスキーマの一覧を、MCP のリソースとして公開する"],"a":[3],"e":"MCP のリソースは、課題の要約、ドキュメントの階層、データベースのスキーマなどの、コンテンツの一覧を公開する仕組みです。エージェントは、探索のための呼び出しを重ねなくても、利用できるデータを把握できます。すべての本文をシステムプロンプトに含めると、コンテキストを圧迫します。","w":["すべての本文を含めると、コンテキストを大量に消費します。","探索のための呼び出しが、さらに増えます。","必要な情報に、たどり着けなくなります。",null]},{"sc":4,"d":3,"s":"3.2","lv":1,"q":"チームで共有しているスキル `/review` を、自分だけ、少し違う手順で使いたいと考えています。他のメンバーには、影響を与えたくありません。最も適切な方法はどれですか。","o":["プロジェクトの CLAUDE.md に、自分用の手順を追記する","`~/.claude/skills/` に、別の名前で、個人用のスキルを作成する","プロジェクトの `.claude/skills/review/SKILL.md` を、自分用に書き換えてコミットする","プロジェクトの `.mcp.json` に、自分用の設定を追加する"],"a":[1],"e":"個人用に変えたスキルは、`~/.claude/skills/` に、別の名前で作成します。これにより、チームで共有しているスキルに影響を与えません。プロジェクトのファイルを書き換えると、チームの全員に影響します。`.mcp.json` は、MCP サーバーの設定のためのファイルです。","w":["チームの全員に、影響が及びます。",null,"チームの全員に、影響が及びます。","MCP サーバーの設定であり、スキルとは関係がありません。"]},{"sc":4,"d":3,"s":"3.1","lv":1,"q":"セッションによって、規約が適用されたり、されなかったりします。どのメモリファイルが読み込まれているのかを確認する方法として、最も適切なものはどれですか。","o":["`/memory` コマンドで、読み込まれているメモリファイルを確認する","`--resume` で、以前のセッションを再開する","`/compact` コマンドで、コンテキストを圧縮する","`/init` コマンドで、CLAUDE.md を作り直す"],"a":[0],"e":"`/memory` コマンドを使うと、読み込まれているメモリファイルを確認でき、セッション間で挙動が一貫しない原因の診断に役立ちます。`/compact` はコンテキストの圧縮、`/init` は CLAUDE.md の生成、`--resume` はセッションの再開のための機能です。","w":[null,"セッションを再開するためのオプションです。","コンテキストを圧縮するためのコマンドです。","CLAUDE.md を作成するためのコマンドです。"]},{"sc":4,"d":3,"s":"3.2","lv":1,"q":"スキル `/gen-endpoint` は、引数としてリソース名を必要とします。引数なしで呼び出されると、的外れな出力になります。最も適切な改善はどれですか。","o":["プロジェクトの CLAUDE.md に、スキルの使い方を記載する","スキルの名前を、引数の意味が分かる長い名前に変える","スキルのフロントマターに `argument-hint` を指定して、必要な引数を示す","フロントマターの `allowed-tools` に、必要な引数の名前を追加して、指定を必須にする"],"a":[2],"e":"フロントマターの `argument-hint` を使うと、スキルが引数なしで呼び出されたときに、必要な引数を開発者に示せます。`allowed-tools` は、スキルの実行中に使えるツールを制限するための項目で、引数とは関係がありません。CLAUDE.md への記載は、呼び出しの時点での案内になりません。","w":["常に読み込まれるうえ、呼び出しのときの案内になりません。","引数が必要であることは、伝わりません。",null,"使えるツールを指定する項目であり、引数とは関係がありません。"],"g":"試験ガイド v1.0 は、`allowed-tools` を、スキルの実行中に使えるツールを制限する設定として、扱っています。現在の公式ドキュメントでは、`allowed-tools` は、確認なしで使ってよいツールを指定するもので、使えるツールを取り除くには、`disallowed-tools` を使う、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"CI のジョブで Claude Code を実行すると、対話的な入力を待ち続けて、ジョブが止まってしまいます。正しい対処はどれですか。","o":["`-p` フラグを付けて、非対話のモードで実行する","標準入力を `/dev/null` にリダイレクトして、実行する","環境変数 `CLAUDE_HEADLESS=true` を設定してから、実行する","`--batch` フラグを付けて、実行する"],"a":[0],"e":"`-p`（または `--print`）フラグは、Claude Code を非対話のモードで実行するためのものです。プロンプトを処理して結果を出力し、入力を待たずに終了します。自動化されたパイプラインでの実行に使います。他の選択肢は、存在しない機能か、Claude Code の指定の方法として適切でない回避策です。","w":[null,"非対話のモードを指定する、正しい方法ではありません。","そのような環境変数は、存在しません。","そのようなフラグは、存在しません。"]},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"レビューの指摘を、プルリクエストの該当する行に、インラインのコメントとして自動で投稿したいと考えています。CI の後続のステップで、結果を機械的に処理する必要があります。最も適切な方法はどれですか。","o":["`--output-format json` と `--json-schema` を使い、スキーマに沿った出力を得る","出力のテキストを正規表現で解析して、ファイル名と行番号を取り出す","レビューの結果を1つのコメントにまとめ、インラインのコメントは使わない","プロンプトで「JSON に近い形式で書くこと」と依頼し、解析に失敗した場合は、成功するまで、ジョブを何度でも再実行する"],"a":[0],"e":"`--output-format json` と `--json-schema` を使うと、CI の中で、スキーマに沿った構造化された出力を得られます。機械的に解析できるため、インラインのコメントの自動投稿に使えます。テキストの正規表現による解析や、プロンプトでの依頼は、形式が保証されず、不安定です。","w":[null,"出力の形式が安定せず、解析が壊れやすくなります。","インラインで投稿するという要件を、満たしません。","形式が保証されず、コストも読めません。"]},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"プルリクエストに新しいコミットが追加されるたびにレビューを再実行すると、すでに投稿した指摘と同じコメントが、重複して投稿されます。最も適切な対策はどれですか。","o":["新しいコミットのたびに、以前のコメントをすべて削除してから、全体を投稿し直す","再実行の際は、変更されたファイルのうち、最初の1つだけをレビューする","重複を避けるため、レビューは、最初のコミットに対してだけ実行する","以前の指摘をコンテキストに含め、新しい問題と、未対応の問題だけを報告するよう指示する"],"a":[3],"e":"再実行の際に、以前のレビューの指摘をコンテキストに含め、新しい問題と、まだ対応されていない問題だけを報告するよう指示します。これにより、重複したコメントを防げます。すべてを削除して投稿し直すと、開発者のやり取りの履歴が失われます。レビューの範囲を狭めると、新しい問題を見落とします。","w":["議論の履歴が失われ、通知も大量に発生します。","ほかのファイルの問題を、見逃します。","後から追加された変更が、レビューされません。",null]},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"CI で生成されるテストの多くが、既存のテストと同じシナリオを繰り返しています。最も適切な対策はどれですか。","o":["テストの生成を、新しく追加されたファイルだけに限定する","生成するテストの件数に、上限を設ける","生成されたテストを、既存のテストとのテスト名の一致によって、機械的に間引いてから追加する","既存のテストファイルをコンテキストに含め、すでに網羅されているシナリオを避けさせる"],"a":[3],"e":"既存のテストファイルをコンテキストに含めると、Claude は、すでに網羅されているシナリオを把握し、重複を避けられます。件数の上限や、名前による間引きは、重複の原因に対処していません。対象を新規のファイルに限定すると、既存のコードの網羅性の不足が残ります。","w":["既存のファイルの、網羅されていない部分が対象外になります。","重複は減らず、有用なテストまで削られます。","名前が違っても、同じシナリオのテストは残ります。",null]},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"CI で生成されるテストが、プロジェクトのフィクスチャを使わず、getter の確認のような、価値の低いテストばかりになっています。最も適切な改善はどれですか。","o":["生成されたテストのうち、行数の少ないものを、価値が低いテストと見なして、ジョブの中で自動的に削除する","テストの基準、価値のあるテストの条件、利用できるフィクスチャを、CLAUDE.md に記述する","テストの生成に使うモデルを、ジョブのたびに切り替える","テスト生成のプロンプトを、「良いテストを書くこと」の1文にする"],"a":[1],"e":"CLAUDE.md は、CI から実行される Claude Code に、プロジェクトのコンテキストを提供する仕組みです。テストの基準、価値のあるテストの条件、利用できるフィクスチャを記述しておくと、生成されるテストの質が向上します。行数による削除は、価値の判断になりません。","w":["行数は、テストの価値を示しません。",null,"基準が伝わっていないという原因は、解消しません。","何が良いテストなのかが、伝わりません。"]},{"sc":5,"d":3,"s":"3.6","lv":1,"q":"CI のパイプラインで、コードを生成したセッションが、そのまま続けて、自分の変更をレビューしています。レビューで、問題がほとんど見つかりません。最も適切な改善はどれですか。","o":["同じセッションで、「自分のコードを批判的に見直すこと」と指示する","同じセッションで拡張思考を有効にして、もう一度確認させる","生成のときの推論を引き継がない、独立したインスタンスにレビューさせる","レビューを省略し、テストの通過だけを基準にする"],"a":[2],"e":"コードを生成したセッションは、生成のときの推論のコンテキストを保持しているため、自分の判断を疑いにくくなります。独立したレビューのインスタンスは、その推論を持たないため、見落とされた問題を見つけやすくなります。自己レビューの指示や拡張思考は、同じコンテキストの中での確認にとどまります。","w":["生成のときの推論を引き継いでおり、同じ思い込みを疑いにくいままです。","同じコンテキストである限り、同じ前提に引きずられます。",null,"テストが扱っていない問題を、見逃します。"]},{"sc":5,"d":4,"s":"4.1","lv":1,"q":"自動レビューの誤検知が多く、開発者の不満が高まっています。現在のプロンプトは、「コードの問題を見つけて報告すること」です。最も効果的な改善はどれですか。","o":["「慎重に判断すること」「確信度の高い指摘だけを報告すること」という指示を、プロンプトの冒頭に加える","確信度を数値で自己申告させ、0.8 未満の指摘を除外する","指摘の件数に上限を設け、上位の5件だけを報告させる","報告すべき問題と、報告しない問題（軽微なスタイルなど）を、明確な基準として示す"],"a":[3],"e":"誤検知を減らすには、曖昧な指示ではなく、明確な基準を示します。何を報告し、何を報告しないかを、カテゴリとして具体的に定めます。「慎重に」や「確信度の高いものだけ」という一般的な指示は、精度を十分に改善しません。件数の上限は、重要な指摘を落とすおそれがあります。","w":["何を報告すべきかの基準が、伝わりません。","自己申告の確信度は、較正されておらず、信頼できません。","誤検知が残り、重要な指摘が削られることもあります。",null]},{"sc":5,"d":4,"s":"4.1","lv":1,"q":"「コメントの正確さ」のカテゴリだけ誤検知が非常に多く、開発者が、他のカテゴリの正確な指摘まで、無視するようになっています。最も適切な対応はどれですか。","o":["開発者に、指摘を無視しないよう周知する","すべてのカテゴリの指摘を、当面のあいだ停止する","誤検知の多いカテゴリを一時的に無効にし、そのカテゴリのプロンプトを改善してから、再開する","誤検知の多いカテゴリの指摘に、「参考」というラベルを付けたうえで、これまでどおり投稿を続ける"],"a":[2],"e":"一部のカテゴリの誤検知が多いと、正確なカテゴリに対する信頼まで損なわれます。誤検知の多いカテゴリを一時的に無効にして、信頼を回復し、その間にプロンプトを改善します。すべてを停止すると、正確な指摘の価値まで失われます。ラベルを付けて残しても、雑音は減りません。","w":["誤検知が続く限り、信頼は戻りません。","正確なカテゴリの価値まで、失われます。",null,"誤検知が投稿され続け、信頼の低下は止まりません。"]},{"sc":5,"d":4,"s":"4.1","lv":1,"q":"同じ種類の問題に対する重大度の判定が、レビューの
