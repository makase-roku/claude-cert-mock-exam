たびに、「高」になったり「低」になったりします。最も適切な改善はどれですか。","o":["重大度の判断を、レビューのたびに、モデルの裁量に任せる","重大度の各レベルを明確に定義し、レベルごとに、具体的なコードの例を示す","重大度を廃止し、すべての指摘を同じ扱いにする","重大度を、1 から 100 までの数値で表すよう変更する"],"a":[1],"e":"一貫した分類のためには、重大度の各レベルを明確に定義し、レベルごとに具体的なコードの例を示します。例があることで、判断の基準が揃います。数値にしても、基準がなければ揺れは残ります。重大度を廃止すると、開発者が対応の優先順位を付けられなくなります。","w":["現在の不一致が、そのまま続きます。",null,"優先順位が、付けられなくなります。","基準がないままでは、数値にしても一貫しません。"]},{"sc":5,"d":4,"s":"4.2","lv":1,"q":"指摘の出力形式を、詳しい指示で定めていますが、形式が一貫しません。場所が欠けていたり、修正案がなかったりします。最も効果的な改善はどれですか。","o":["望む出力形式（場所、問題、重大度、修正案）の例を、few-shot として示す","出力を後処理のスクリプトで整形し、欠けている項目は空欄のままにして、形式だけを揃えて投稿する","指示をさらに詳しくし、形式の説明を長くする","出力の最大トークン数を減らして、形式を単純にする"],"a":[0],"e":"詳しい指示だけでは出力が一貫しない場合は、few-shot の例が、最も効果的な手法です。望む形式を例として示すことで、一貫して実行可能な出力が得られます。指示を長くしても、解釈のばらつきは残ります。後処理では、欠けている情報は補えません。","w":[null,"欠けている情報は、補われません。","説明を長くしても、形式は安定しにくいものです。","出力が途中で切れるおそれがあり、形式は定まりません。"]},{"sc":5,"d":4,"s":"4.2","lv":1,"q":"プロジェクトで意図的に採用しているパターン（たとえば、理由をコメントに書いた、空の catch ブロック）が、問題として指摘され続けています。許容されるパターンは多様で、すべてを列挙できません。最も適切な改善はどれですか。","o":["許容されるパターンと本当の問題を対比する例を、判断の理由とともに示し、類似のケースに一般化させる","指摘のたびに、許容されるかどうかを、開発者に質問させる","該当するカテゴリの指摘を、恒久的に無効にする","許容されるパターンを、開発者から報告を受けるたびに、プロンプトの除外のリストへ1件ずつ追加していく"],"a":[0],"e":"few-shot の例は、あらかじめ指定したケースに一致させるだけでなく、判断を、新しいパターンに一般化させる効果があります。許容されるパターンと本当の問題を、理由とともに対比して示します。除外のリストは、列挙されていないパターンに対応できません。カテゴリを無効にすると、本当の問題も見逃します。","w":[null,"自動レビューの意味が、薄れます。","本当の問題まで、見逃します。","類似のケースに一般化されず、追加が際限なく続きます。"]},{"sc":5,"d":4,"s":"4.5","lv":1,"q":"現在、(1) 開発者がマージの前に結果を待つチェックと、(2) 毎晩実行する技術的負債のレポートの、2つのワークフローがあります。コストを削減するため、両方を Message Batches API に切り替える提案がありました。評価として最も適切なものはどれですか。","o":["マージ前のチェックは同期の API のままとし、夜間のレポートだけをバッチにする","コストの削減を優先し、両方ともバッチに切り替える","どちらも遅延の保証が必要なので、両方とも同期の API のままとする","マージ前のチェックをバッチにし、タイムアウトした場合は、同期の API に切り替える"],"a":[0],"e":"Message Batches API は、コストを50%削減できますが、処理に最大24時間かかり、遅延の保証がありません。開発者が結果を待つ、マージ前のチェックには適しません。夜間のレポートのように、遅延を許容できる処理には適しています。タイムアウト時の切り替えは、不要な複雑さを加えます。","w":[null,"マージ前のチェックは、開発者が結果を待っています。","夜間のレポートで、コストを削減する機会を逃します。","バッチには遅延の保証がなく、待ち時間が読めません。"]},{"sc":5,"d":4,"s":"4.6","lv":1,"q":"14個のファイルを変更するプルリクエストを、1回のパスでレビューしています。あるファイルには詳しい指摘があるのに、別のファイルでは表面的になり、同じパターンに対して、矛盾した指摘も出ています。最も適切な構成はどれですか。","o":["同じレビューを3回実行し、2回以上指摘された問題だけを採用する","コンテキストウィンドウのより大きいモデルに切り替えて、14個のファイルを、これまでどおり1回のパスで確認する","プルリクエストを小さく分割するよう、開発者に義務づける","ファイルごとの個別のパスでローカルな問題を調べ、別の統合のパスで、ファイル間のデータの流れを確認する"],"a":[3],"e":"多数のファイルを1回のパスで処理すると、注意が分散します。ファイルごとの焦点を絞ったパスで一貫した深さを確保し、別の統合のパスで、ファイル間の問題を確認します。大きなコンテキストウィンドウは、注意の質の問題を解決しません。多数決は、断続的にしか検出されない本当の問題を、落としてしまいます。","w":["コストが3倍になり、見逃しは解消しません。","注意の分散が原因であり、容量の問題ではありません。","開発の進め方を制約するもので、レビューの側の改善になりません。",null]},{"sc":5,"d":4,"s":"4.4","lv":1,"q":"開発者が却下した指摘の傾向を分析して、プロンプトを改善したいと考えています。出力の設計として、最も適切なものはどれですか。","o":["却下された指摘を、ログから削除する","指摘の文面を、より長く、詳しくする","指摘の原因になったコードの構造を記録する `detected_pattern` フィールドを、出力に加える","却下された件数だけをカテゴリ別に集計し、件数の多いカテゴリから順に、プロンプトの文面を少しずつ書き直していく"],"a":[2],"e":"`detected_pattern` フィールドに、指摘の原因になったコードの構造を記録しておくと、開発者が指摘を却下したときに、どのパターンが誤検知を生んでいるのかを、体系的に分析できます。件数の集計だけでは、原因となるパターンが分かりません。","w":["分析の材料が、失われます。","却下の傾向を分析する材料には、なりません。",null,"どのようなコードで誤検知が起きたのかが、分かりません。"]},{"sc":5,"d":4,"s":"4.5","lv":1,"q":"夜間のテスト生成に、Message Batches API を使います。この API について、正しい説明を2つ選んでください。","o":["コストを50%削減できるが、処理に最大24時間かかり、遅延の保証はない","1つのリクエストの中で、ツールを実行して結果を返す、マルチターンのやり取りができる","`custom_id` で要求と結果を対応付けられ、失敗した項目だけを特定して、再投入できる","開発者が結果を待つ、マージ前のチェックに適している","結果は、必ず投入した順序で返される"],"a":[0,2],"e":"Message Batches API は、コストを50%削減できる一方、処理に最大24時間かかり、遅延の保証がありません。`custom_id` によって、要求と結果を対応付けます。失敗した項目は、`custom_id` で特定し、文書の分割などの修正を加えて、その項目だけを再投入します。1つのリクエストの中でのマルチターンのツール実行には、対応していません。","w":[null,"1つのリクエストの中での、ツールの実行と結果の返送には対応していません。",null,"遅延の保証がなく、結果を待つ用途には向きません。","結果の順序は、保証されません。"]},{"sc":6,"d":4,"s":"4.3","lv":1,"q":"ツール利用と JSON スキーマによる構造化出力を導入しました。それでも発生し得る問題を2つ選んでください。","o":["必須のフィールドが、出力に含まれていない","JSON の閉じ括弧が欠けている","数値のフィールドに、文字列が入っている","値が、誤ったフィールドに入っている","明細の金額の合計が、総額と一致しない"],"a":[3,4],"e":"ツール利用と JSON スキーマは、構文の誤りや、スキーマに反する出力をなくす、最も信頼性の高い方法です。しかし、意味的な誤りは防げません。明細の合計が総額と合わない、値が誤ったフィールドに入っているといった問題は、スキーマに準拠していても発生するため、別途の検証が必要です。","w":["必須のフィールドの有無は、スキーマで保証されます。","構文の誤りは、構造化出力で防げます。","型の不一致は、スキーマで防げます。",null,null]},{"sc":6,"d":4,"s":"4.3","lv":1,"q":"請求書、領収書、契約書のそれぞれに、抽出用のツールを定義しています。文書の種類は、事前には分かりません。モデルが、ツールを呼び出さずに、文章で回答することがあります。最も適切な設定はどれですか。","o":["`tool_choice` を `auto` に設定する","`tool_choice` で、請求書用のツールを、常に強制する","`tool_choice` を `any` に設定して、いずれかの抽出ツールの呼び出しを保証する","ツールは使わず、まず文書の種類を文章で答えさせ、その回答を解析してから、別のリクエストで種類に合った抽出を行う"],"a":[2],"e":"`tool_choice` を `any` にすると、モデルは必ずいずれかのツールを呼び出しますが、どのツールを使うかは、モデルが選べます。文書の種類が不明で、複数の抽出スキーマがある場合に適しています。`auto` では、文章で回答する可能性があります。特定のツールの強制は、文書の種類が違う場合に、誤った抽出になります。","w":["ツールを呼ばずに、テキストで応答することがあります。","ほかの種類の文書に、対応できません。",null,"リクエストが2回になり、解析も不安定です。"],"g":"試験ガイド v1.0 は、`tool_choice` による強制（`any` や、ツールの指定）を、ツールを確実に呼び出させる手段として、扱っています。現在の公式ドキュメントでは、この強制は、拡張思考とは併用できず、一部の最新のモデルでは、エラーになる、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":6,"d":4,"s":"4.3","lv":1,"q":"スキーマで必須としているフィールドの情報が、元の文書に存在しない場合に、モデルが、もっともらしい値を作り出して埋めています。最も適切な改善はどれですか。","o":["情報が存在しない可能性のあるフィールドを、任意、または null を許容する定義にする","抽出の後に、値が妥当に見えるかどうかを、モデルに確認させる","必須のフィールドの定義は維持し、「情報がない場合は推測しないこと」と、プロンプトに記載する","情報が存在しない場合は、最も一般的な値を、既定値として入れさせる"],"a":[0],"e":"フィールドを必須にすると、モデルは、スキーマを満たすために、値を作り出すことがあります。元の文書に情報がない可能性のあるフィールドは、任意、または null を許容する定義にします。プロンプトで推測を禁じても、スキーマが値を要求している限り、作り出される余地が残ります。","w":[null,"もっともらしい値は、確認を通過してしまいます。","必須である限り、何らかの値を出力せざるを得ません。","捏造を、仕組みとして組み込むことになります。"]},{"sc":6,"d":4,"s":"4.3","lv":1,"q":"文書の分類を、enum のフィールドで抽出しています。想定していなかった種類の文書が届くと、モデルは、最も近い既存の値に、無理に当てはめます。最も適切な改善はどれですか。","o":["enum に `other` を加え、詳細を記述する文字列のフィールドを、併せて設ける","enum の値を、思いつく限り、数百個に増やす","enum のどの値にも該当しない種類の文書は、エラーとして扱い、抽出の対象から恒久的に除外する","enum をやめ、自由記述の文字列にする"],"a":[0],"e":"拡張の可能性があるカテゴリには、enum に `other` を加え、詳細を記述するフィールドを併せて設けます。曖昧なケースには、`unclear` のような値も有効です。これにより、無理な当てはめを防ぎつつ、新しい種類を把握できます。自由記述にすると、値の一貫性が失われます。","w":[null,"想定外の種類は尽きず、選択の精度も下がります。","正当な文書が、処理されなくなります。","表記が揺れて、集計できなくなります。"]},{"sc":6,"d":4,"s":"4.4","lv":1,"q":"抽出の結果はスキーマに準拠していますが、明細の金額の合計が、総額と一致しないことがあります。最も適切な設計はどれですか。","o":["スキーマを厳密にしているので、意味的な誤りも起こらないと判断する","総額のフィールドを、スキーマから削除する","合計が一致しない場合は、明細の最後の行の金額を自動的に調整して、総額と一致するようにしてから出力する","明細から計算した合計と、文書に記載された総額の両方を抽出させ、不一致を検出して、確認に回す"],"a":[3],"e":"意味的な検証のために、`calculated_total`（明細から計算した合計）と `stated_total`（文書に記載された総額）の両方を抽出させ、不一致を検出します。不一致は、抽出の誤りか、元の文書の不整合を示します。値を調整して合わせると、誤りが隠れてしまいます。","w":["スキーマが保証するのは、形式だけです。","不一致を、検出できなくなります。","誤りを隠して、データを改変することになります。",null]},{"sc":6,"d":4,"s":"4.4","lv":1,"q":"抽出の結果が、検証に失敗しました。リトライの方法として、最も適切なものはどれですか。","o":["プロンプトの末尾に、「今度は誤りのないよう、正確に抽出すること」と追記して、再送する","同じプロンプトを、そのまま再送する","元の文書、失敗した抽出の結果、具体的な検証エラーを含めて、再度依頼する","検証エラーの件数だけを伝えて、再度依頼する"],"a":[2],"e":"エラーのフィードバックを伴うリトライでは、元の文書、失敗した抽出の結果、具体的な検証エラーを含めます。モデルは、どこが誤っていたのかを把握して、自己修正できます。同じプロンプトの再送や、曖昧な追記では、同じ誤りを繰り返す可能性があります。","w":["具体的な誤りが、伝わりません。","誤りの内容が伝わらず、同じ結果になりがちです。",null,"何を直すべきかが、分かりません。"]},{"sc":6,"d":4,"s":"4.4","lv":1,"q":"抽出が繰り返し失敗している、2つのケースがあります。(A) 日付の形式が、スキーマの定める形式と合っていない。(B) 必要な値が、提供されていない別紙にだけ記載されている。リトライの有効性について、正しいものはどれですか。","o":["A はエラーを伝えたリトライで解決が見込めるが、B は情報が入力にないため、解決しない","A はリトライでは解決しないが、B はリトライで解決が見込める","A も B も、リトライでは解決しない","A も B も、検証エラーの内容を具体的に伝えてリトライを重ねれば、いずれは解決が見込める"],"a":[0],"e":"リトライは、形式や構造の誤りには有効です。しかし、必要な情報が、入力された文書に存在しない場合は、何度リトライしても解決しません。その場合は、不足している文書を入手するか、該当のフィールドを空として扱い、人の確認に回します。リトライが有効な場合と無効な場合を、見分けることが重要です。","w":[null,"A と B が、逆になっています。","形式の誤りは、エラーを伝えれば修正できます。","入力にない情報は、リトライでは得られません。"]},{"sc":6,"d":4,"s":"4.2","lv":1,"q":"論文から、研究手法の情報を抽出しています。手法が独立した節にまとめられている文書では成功しますが、本文の中に埋め込まれている文書では、フィールドが空になります。最も適切な改善はどれですか。","o":["文書を、先頭の1ページだけに切り詰める","手法の節がない文書を、抽出の対象から除外する","「必ず値を入れること」と指示して、空の値を禁止する","構造の異なる文書からの正しい抽出を示す、few-shot の例を追加する"],"a":[3],"e":"few-shot の例は、多様な文書の構造への対応を示すのに有効です。独立した節がある場合と、本文に埋め込まれている場合の両方について、正しい抽出の例を示します。空の値を禁止すると、値を作り出す原因になります。対象からの除外は、問題の解決になりません。","w":["必要な情報が、失われます。","必要な文書が、処理されなくなります。","値の捏造を、誘発します。",null]},{"sc":6,"d":4,"s":"4.5","lv":1,"q":"文書は、受領してから30時間以内に、抽出の結果を返す必要があります。Message Batches API の処理には、最大で24時間かかります。この SLA を保証できる、バッチの投入の間隔はどれですか。","o":["12時間ごと","4時間ごと","8時間ごと","24時間ごと"],"a":[1],"e":"文書は、最悪の場合、投入の直後に届き、次の投入まで待つことになります。その待ち時間に、最大24時間の処理時間が加わります。4時間ごとの投入であれば、最大で 4 + 24 = 28時間となり、30時間以内に収まります。8時間ごとでは、最大で32時間となり、SLA を超えます。","w":["待ち時間と処理時間の合計が、最大で36時間になります。",null,"待ち時間の最大が8時間となり、合計が30時間を超えます。","待ち時間と処理時間の合計が、最大で48時間になります。"]},{"sc":6,"d":5,"s":"5.5","lv":1,"q":"抽出の全体の精度が 97% に達したため、人による確認を廃止する提案がありました。内訳を確認すると、手書きの申請書に限っては、精度が 70% でした。最も適切な判断はどれですか。","o":["全体の精度が 99% に達するまでは、文書の種類にかかわらず、すべての文書について、人による確認を続ける","全体の精度が高いので、すべての文書について、人による確認を廃止する","精度の低い種類の文書を、抽出の対象から外す","文書の種類とフィールドごとに精度を検証し、精度の低い区分については、人による確認を続ける"],"a":[3],"e":"全体の精度は、特定の文書の種類やフィールドでの低い性能を、隠してしまうことがあります。自動化の前に、文書の種類とフィールドごとに、精度を検証します。精度の高い区分は確認を減らし、低い区分は確認を続けます。一律の廃止も、一律の継続も、区分ごとの実態に合いません。","w":["精度の高い区分まで、確認を続けることになります。","精度の低い区分の誤りが、そのまま通過します。","必要な文書が、処理されなくなります。",null]},{"sc":6,"d":5,"s":"5.5","lv":1,"q":"確信度の高い抽出については、人による確認を省略することにしました。その後も、誤りの割合を継続的に把握する方法として、最も適切なものはどれですか。","o":["下流のシステムからの苦情の件数で、誤りの割合を推定する","確信度の高い抽出からも、層別の無作為抽出でサンプルを取り、誤りの割合を測定する","月に1度、最新の10件だけを確認する","確信度の低い抽出だけを引き続き確認の対象とし、確信度の高い抽出は、今後は一切確認しない"],"a":[1],"e":"確信度の高い抽出も、層別の無作為抽出で継続的に確認します。これにより、誤りの割合を測定でき、新しい誤りのパターンにも気づけます。確信度の低いものだけを確認すると、確信度が高いのに誤っているケースを見逃します。苦情の件数は、遅く、不完全な指標です。","w":["検知が遅れ、報告されない誤りも把握できません。",null,"件数が少なく偏っており、割合を推定できません。","確信度が高くても誤っている抽出を、検出できません。"]},{"sc":6,"d":5,"s":"5.5","lv":1,"q":"抽出の結果を人の確認に回すかどうかを、確信度で判断したいと考えています。最も適切な設計はどれですか。","o":["抽出の結果を確信度の高い順に並べ、下位の1割に当たるものを、内容にかかわらず一律に確認する","フィールド単位の確信度をラベル付きの検証セットで較正し、確認に回す基準を決める","モデルが出力した確信度を、そのまま、しきい値として使う","確信度は使わず、すべての抽出を、人が確認する"],"a":[1],"e":"モデルが出力する確信度は、そのままでは、実際の正確さと対応しているとは限りません。ラベル付きの検証セットを使って、フィールド単位で較正し、その結果に基づいて、確認に回すしきい値を決めます。限られた確認者の時間は、確信度が低い、または元の情報が矛盾している抽出に、優先的に充てます。","w":["実際の誤りの割合に基づかない、恣意的な基準です。",null,"モデルの出力する確信度は、較正されていません。","自動化の利点が、失われます。"]},{"sc":6,"d":5,"s":"5.1","lv":1,"q":"数十件の文書の抽出結果をまとめて、1回の入力として渡し、要約を作成しています。入力の中ほどに置かれた重要な知見が、要約から抜けることがあります。最も適切な改善はどれですか。","o":["入力の全体を、見出しや区切りを付けずに、1つの長い段落としてまとめ直してから渡す","入力の順序を、毎回ランダムに並べ替える","重要な知見を、入力の中央に集める","主要な知見の要約を入力の先頭に置き、詳細は、見出しを付けて整理する"],"a":[3],"e":"モデルは、長い入力の先頭と末尾は確実に処理しますが、中ほどの内容を見落とすことがあります（lost in the middle）。主要な知見の要約を先頭に置き、詳細を明確な見出しで整理することで、位置による影響を和らげます。重要な内容を中央に集めると、見落としが増えます。","w":["構造が失われ、見落としが増えます。","重要な知見が、中ほどに置かれる可能性が残ります。","中ほどは、最も見落とされやすい位置です。",null]},{"sc":6,"d":5,"s":"5.6","lv":1,"q":"下流のシステムの担当者から、「抽出された値が、元の文書のどこに基づいているのかを確認したい」という要望がありました。最も適切な設計はどれですか。","o":["抽出した値だけを保存し、出典は、必要になったときに探し直す","出典の情報は、文書の単位で、1つだけ記録する","出典の情報は、要約の段階で、まとめて1行にする","値ごとに、出典の文書名、ページ、該当箇所の抜粋を対応付けて、保持する"],"a":[3],"e":"情報の出所を保つには、主張や値ごとに、出典（文書名、ページ、該当箇所の抜粋）との対応を、構造化して保持します。要約の段階で対応を落とすと、帰属が失われ、後から検証できなくなります。文書の単位の記録では、どの箇所に基づいているのかを特定できません。","w":["手間がかかり、同じ箇所を特定できる保証もありません。","値ごとの根拠を、確認できません。","値と出典の対応が、失われます。",null]},{"sc":6,"d":5,"s":"5.6","lv":1,"q":"2つの報告書から抽出した、同じ指標の値が異なっており、下流のシステムが、矛盾として警告を出しました。調べると、2つの報告書は、調査の時期が異なっていました。最も適切な改善はどれですか。","o":["値が異なる場合は、新しい文書の値で上書きする","値が異なる場合は、両方とも破棄する","指標の値を丸めて、差異を小さくする","抽出の出力に、公開日や調査の時点を、必ず含める"],"a":[3],"e":"時点によって変わるデータは、公開日や収集日を、構造化された出力に含める必要があります。日付があれば、値の違いを、矛盾ではなく、時期の違いとして正しく解釈できます。上書きや破棄は、情報を失わせます。値を丸めても、解釈の問題は解決しません。","w":["時点の異なる値の履歴が、失われます。","正しい情報まで、失われます。","時点の違いという原因を、隠すことになります。",null]},{"sc":1,"d":1,"s":"1.1","q":"本番のログを調べると、エージェントが、`lookup_order` を、同じ注文番号で、4回から6回、連続して呼び出しているセッションが、全体の約8%ありました。該当のセッションでは、ツールは、毎回、正常な結果を返しています。実装を確認すると、アプリケーションは、ツールを実行した後、次のリクエストに、直前の assistant のメッセージだけを含めており、ツールの実行結果は、ログには記録していますが、会話の履歴には追加していませんでした。最も適切な修正はどれですか。","o":["ツールの実行結果を、`tool_result` として会話の履歴に追加して、次のリクエストに含める。モデルが、結果を踏まえて、次の行動を判断できるようにする","システムプロンプトに、「同じツールを、同じ引数で、2回以上呼び出さないこと」という指示を追加して、連続した呼び出しの例を、してはならない例として示す","反復の回数の上限を、3回に引き下げる。同じツールの呼び出しが繰り返されても、3回目で、ループが打ち切られるようになる","`lookup_order` の結果を、ツールの側でキャッシュして、同じ注文番号での2回目以降の呼び出しには、すぐに結果を返すようにして、バックエンドへの負荷を下げる"],"a":[0],"e":"エージェントのループでは、ツールの実行結果を、会話の履歴に追加して、次のリクエストでモデルに渡す必要があります。結果が渡されなければ、モデルは、ツールがまだ実行されていないと判断して、同じ呼び出しを繰り返します。プロンプトでの禁止や、反復の上限は、症状を抑えるだけで、モデルが結果を見られないという原因を、解消しません。キャッシュは、負荷を下げますが、モデルには、依然として結果が届きません。","w":[null,"モデルが結果を見られないという原因は、解消しません。","症状を打ち切るだけで、必要な処理も、途中で終わります。","負荷は下がりますが、結果は、依然としてモデルに届きません。"],"lv":2},{"sc":1,"d":1,"s":"1.4","q":"このエージェントには、2種類の業務上の決まりがあります。(A)「回答は、丁寧で、簡潔な表現にすること」。(B)「`get_customer` による本人確認が完了していない顧客には、`process_refund` を実行しないこと」。現在は、どちらも、システムプロンプトに記載しています。ログでは、(A) は、ほぼ守られていますが、(B) は、約3%のセッションで、守られていません。(B) の違反は、他人の注文への返金という、重大な事故につながります。対応として、最も適切なものはどれですか。","o":["(B) は、本人確認が完了するまで、`process_refund` の実行を、コードで阻止する。(A) は、これまでどおり、プロンプトで指示する","(A) は、出力の文面を検査するコードで強制して、(B) は、プロンプトでの指示を、より強い表現に書き換える","(A) も (B) も、プロンプトでの指示を維持する。(B) については、違反した場合の影響を、より詳しく説明して、few-shot の例も追加する","(A) も (B) も、アプリケーションのコードで強制する。業務上の決まりは、すべて、決定的な仕組みで保証することが、最も確実である"],"a":[0],"e":"決め手は、違反した場合の影響の大きさです。(B) は、3%の違反でも、重大な事故になるため、確率的にしか守られないプロンプトの指示ではなく、コードによる決定的な強制が必要です。一方、(A) のような、表現に関する指針は、プロンプトでの指示が適しており、コードで強制する必要性は、小さいと言えます。すべてをコードで強制しようとすると、柔軟さが失われ、実装も複雑になります。","w":[null,"強制すべき対象が、逆になっています。","指示と例は、遵守の割合を上げても、保証にはなりません。","表現の指針まで、コードで強制する必要性は小さく、実装が複雑になります。"],"lv":2},{"sc":1,"d":1,"s":"1.5","q":"返金の上限額は、顧客の区分によって異なります。通常の顧客は500ドル、プレミアムの顧客は2,000ドルで、これを超える返金は、人の承認が必要です。顧客の区分は、`get_customer` の結果に含まれています。現在は、システムプロンプトに、区分ごとの上限額の表を記載していますが、プレミアムではない顧客に、1,200ドルの返金が実行された事例が、今月、2件ありました。最も適切な対応はどれですか。","o":["システムプロンプトの上限額の表を、冒頭に移動して、「上限を超える返金は、絶対に実行しないこと」という強調を加える","`process_refund` を、通常の顧客用と、プレミアムの顧客用の、2つのツールに分ける。それぞれの説明文に、上限額を明記して、モデルに、正しいほうを選ばせる","`process_refund` の実行を、事前に横取りするフックで、顧客の区分と返金額を照合する。上限を超える場合は、実行を阻止して、人の承認に回す","`process_refund` の実行の後に呼び出されるフックで、返金額を確認する。上限を超えていた場合は、担当者に通知して、取り消しの手続きを始める"],"a":[2],"e":"金額の上限のように、必ず守る必要がある業務上の決まりは、ツールの実行の前に呼び出されるフックで、決定的に強制します。フックは、モデルの判断に依存せずに、実行を阻止して、人の承認という、別の経路に回せます。ツールを2つに分けても、どちらを選ぶかは、モデルの判断に依存します。実行の後のフックでは、返金は、すでに行われています。","w":["指示である限り、確実には守られません。","どちらのツールを選ぶかが、モデルの判断に依存します。",null,"返金は、すでに実行されており、防止になりません。"],"lv":2},{"sc":1,"d":1,"s":"1.4","q":"ある顧客が、2件の注文の返金を求めました。エージェントは、1件目の返金を完了した後、2件目が、返金の上限を超えていたため、`escalate_to_human` を呼び出しました。引き継ぎを受けた担当者は、エージェントと顧客の会話を、見ることができません。担当者は、状況が分からずに、2件とも、最初から調査をやり直して、1件目について、二重の返金を、実行しかけました。引き継ぎの内容として、最も適切なものはどれですか。","o":["顧客 ID、完了した操作（1件目の返金と金額）、未完了の要望と、その理由、推奨する対応を、構造化した要約として渡す","引き継ぎの前に、1件目の返金を、いったん取り消す。2件とも、未処理の状態に戻してから引き継ぐことで、担当者の混乱を防ぐ","会話の全文と、すべてのツールの呼び出しの記録を、そのまま添付する。情報の欠落がなくなるため、担当者が、状況を、最も正確に把握できる","顧客 ID と、「返金の上限を超えたため、引き継ぎます」という理由だけを渡す。詳細は、担当者が、システムで確認できる"],"a":[0],"e":"処理の途中で、人に引き継ぐ場合は、何が完了していて、何が未完了なのかを、明確に伝えることが、とくに重要です。担当者は、会話を見られないため、引き継ぎの内容が、唯一の情報源になります。構造化した要約であれば、担当者は、すぐに状況を把握して、二重の処理を避けられます。会話の全文は、情報は揃いますが、要点が埋もれて、把握に時間がかかります。","w":[null,"正当に完了した返金を、取り消すことになります。","要点が埋もれて、何が完了しているのかを、すぐに把握できません。","1件目が完了していることが、伝わりません。"],"lv":2},{"sc":1,"d":1,"s":"1.1","q":"複数の請求の内訳を説明する、長い回答の途中で、顧客への回答が、文の途中で切れている事例が、見つかりました。該当のレスポンスの `stop_reason` は、`max_tokens` でした。アプリケーションのループは、「`stop_reason` が `tool_use` でなければ、最終回答として、顧客に送信して終了する」という実装になっています。最も適切な修正はどれですか。","o":["`stop_reason` ごとに、処理を分ける。`end_turn` は完了として扱い、`max_tokens` は未完了として、続きを生成させるか、上限を見直す","システムプロンプトに、「回答は、必ず、文の終わりまで書き切ること」という指示を追加する","`max_tokens` を、非常に大きな値に設定して、この `stop_reason` が、発生しないようにする。ループの実装は、変更しないため、既存の処理への影響もない","回答が長くなる問い合わせでは、ストリーミングを有効にして、生成された部分から、順に、顧客に表示する"],"a":[0],"e":"`stop_reason` は、ターンが、なぜ終わったのかを示します。`end_turn` は、モデルが、応答を完了したことを意味しますが、`max_tokens` は、出力の上限に達して、途中で打ち切られたことを意味します。「`tool_use` でなければ、完了」という実装は、この違いを無視しています。`stop_reason` ごとに、処理を分けて、打ち切られた場合は、続きを生成させるなどの対応を行います。","w":[null,"出力の上限による打ち切りは、指示では防げません。","発生の頻度は下がっても、打ち切りを、完了として扱う誤りは残ります。","表示の方法が変わるだけで、上限による打ち切りを、完了として扱う誤りは、残ります。"],"lv":2},{"sc":1,"d":1,"s":"1.2","q":"ある開発者が、このエージェントを、「請求」「配送」「アカウント」の3つの専門のサブエージェントと、振り分けを行うコーディネーターに、分割することを提案しています。現在のエージェントのツールは、4つです。ログの分析では、問い合わせの約7割が、「配送が遅れたので、送料を返金してほしい」のように、複数の領域にまたがっています。現在の構成での、ツールの選択の誤りは、1%未満です。この提案の評価として、最も適切なものはどれですか。","o":["採用する。専門ごとに分割することで、それぞれのサブエージェントのプロンプトが短くなり、各領域での回答の品質が、向上する","採用しない。問い合わせの多くが、領域をまたいでおり、分割すると、文脈の受け渡しが増える。ツールも少なく、現在の構成で、問題は起きていない","採用する。3つのサブエージェントを、並列に実行できるようになるため、すべての問い合わせで、応答の時間が、短縮される","採用しない。代わりに、4つのツールを、1つの汎用のツールに統合して、エージェントの判断を、さらに単純にする"],"a":[1],"e":"サブエージェントへの分割は、コンテキストの分離や、多数のツールの整理が必要な場合に、効果があります。この例では、ツールは4つだけで、選択の誤りも、ほとんどありません。さらに、問い合わせの約7割が、領域をまたいでいるため、分割すると、サブエージェントの間で、文脈を受け渡す必要が生じて、かえって、複雑さと誤りが増えます。解決すべき問題がない場所に、複雑な構成を持ち込むべきではありません。","w":["領域をまたぐ問い合わせで、文脈の受け渡しによる誤りが増えます。",null,"領域をまたぐ問い合わせは、互いに依存しており、並列には処理できません。","ツールの使い分けの手がかりが、失われます。"],"lv":2},{"sc":1,"d":1,"s":"1.5","q":"`lookup_order` は、注文の情報とともに、社内の担当者向けのメモ（不正の疑いに関する所見や、仕入れ値など）を、1回あたり、約4,000トークン返します。このメモは、顧客に開示してはならない情報です。先週、エージェントが、メモの一部を、顧客への回答の中で、引用する事故がありました。また、長い対応では、このメモが、コンテキストを圧迫しています。バックエンドの API は、ほかのシステムも利用しており、変更できません。最も適切な対応はどれですか。","o":["ツールの結果を受け取った後に呼び出されるフックで、社内向けのメモを取り除いてから、モデルに渡す","`lookup_order` の結果を、別のモデルの呼び出しで要約させて、その要約を、エージェントに渡す。要約の指示に、メモを含めないよう、記載する","システムプロンプトに、「社内向けのメモの内容は、顧客に開示しないこと」という指示を追加する。メモ自体は、エージェントの判断の材料として、引き続き渡す","より上位のモデルに切り替えて、開示してはならない情報の扱いを、より確実に判断できるようにする"],"a":[0],"e":"開示してはならない情報は、モデルのコンテキストに、入れないことが、最も確実です。ツールの結果を受け取った後のフックで、不要なフィールドを取り除けば、モデルは、その情報を、そもそも見ることがありません。同時に、コンテキストの圧迫も、解消します。プロンプトでの指示や、出力の検査は、開示を、確実には防げず、コンテキストの圧迫も、残ります。","w":[null,"要約のモデルへの指示に依存しており、メモの内容が、要約に含まれることを、確実には防げません。","指示では、開示を確実には防げず、コンテキストの圧迫も残ります。","コンテキストにある限り、開示のリスクも、圧迫も残ります。"],"lv":2},{"sc":1,"d":1,"s":"1.4","q":"返品の処理では、`process_refund` で返金を実行した後に、返送用のラベルを発行する必要があります。ある日、返金は成功したものの、ラベルの発行のシステムが、一時的に停止していたために、発行に失敗しました。エージェントは、処理の全体を、最初からやり直して、同じ注文に、2回目の返金を実行しました。再発を防ぐ設計として、最も適切なものはどれですか。","o":["システムプロンプトに、「同じ注文に、2回、返金を実行しないこと」という指示を追加する","各ステップの完了を、状態として記録して、`process_refund` には、注文ごとの冪等キーを持たせる。再試行のときは、未完了のステップだけを実行する","ラベルの発行に失敗した場合は、エージェントに、返金を取り消させてから、処理の全体を、最初からやり直させる","返金とラベルの発行を、1つのツールにまとめる。どちらかが失敗した場合は、ツールが、「処理に失敗しました」という結果だけを返す"],"a":[1],"e":"複数のステップからなる処理では、途中で失敗する場合を、前提に設計します。各ステップの完了を、状態として記録しておけば、再試行のときに、未完了のステップだけを、実行できます。さらに、返金のように、副作用のある操作には、冪等キーを持たせて、同じ操作が、2回実行されても、結果が1回分になるようにします。失敗の内容を示さないツールでは、何が完了しているのかが、分かりません。","w":["指示は、二重の実行を、確実には防げません。",null,"正当に完了した返金を取り消すことになり、顧客への影響も生じます。","何が完了して、何が失敗したのかが、分からなくなります。"],"lv":2},{"sc":1,"d":2,"s":"2.1","q":"アカウントに関する問い合わせに対応するために、`update_account` というツールを追加しました。このツールは、`action` の引数によって、住所の変更、メールアドレスの変更、定期購入の停止、アカウントの削除を、行うことができます。運用を始めると、「定期購入を、一時的に止めたい」という依頼に対して、エージェントが、アカウントの削除を実行した事例が、発生しました。ツールの設計の見直しとして、最も適切なものはどれですか。","o":["`update_account` の説明文に、各 `action` の意味を、より詳しく記載して、「アカウントの削除は、慎重に行うこと」という注意を加える","`action` の引数を、自由な文字列から、enum に変更する。指定できる値が限定されるため、誤った操作が、選ばれなくなる","操作ごとに、目的の明確なツールに分ける。アカウントの削除のような、元に戻せない操作は、別のツールにして、実行の前に、確認を必須とする","`update_account` の実行の前に呼び出されるフックで、`action` が、アカウントの削除の場合に、実行を阻止して、人の承認に回す。ツールの構成は、変更しない"],"a":[2],"e":"1つのツールに、影響の大きさが異なる、多数の操作を詰め込むと、モデルが、誤った操作を選ぶ余地が、大きくなります。操作ごとに、目的の明確なツールに分ければ、名前と説明が、選択の手がかりになります。さらに、元に戻せない操作は、別のツールとして切り出して、確認の仕組みを設けます。enum にしても、値の中から、誤ったものを選ぶ可能性は、残ります。","w":["説明を詳しくしても、1つのツールに、危険な操作が混在したままです。","形式は制約されますが、誤った値を選ぶ可能性は、残ります。",null,"削除は防げますが、影響の異なる操作が、1つのツールに混在したままであり、ほかの操作の取り違えは、残ります。"],"lv":2},{"sc":1,"d":2,"s":"2.2","q":"ある顧客には、過去1年に、23件の注文があります。`lookup_order` で、顧客のすべての注文を取得しようとしたところ、バックエンドが、途中でタイムアウトして、14件だけが取得できました。現在のツールは、この場合、取得できた14件を、通常の成功の結果として返します。エージェントは、「該当の注文は、見つかりません」と顧客に回答しましたが、実際には、取得できなかった9件の中に、該当の注文がありました。ツールの改善として、最も適切なものはどれですか。","o":["タイムアウトの時間を、現在の3倍に延ばして、23件のすべてが、取得できるようにする","タイムアウトした場合は、取得できた分を破棄して、エラーだけを返す。不完全な結果に基づく判断を、防ぐことができる","システムプロンプトに、「注文が見つからない場合は、必ず、もう一度検索すること」という指示を追加する","取得できた14件を返すとともに、結果が不完全であること、取得できなかった範囲、再試行が可能であることを、構造化して示す"],"a":[3],"e":"部分的に成功した結果を、完全な成功として返すと、エージェントは、取得できなかった範囲があることを、知ることができません。取得できた分を返しつつ、結果が不完全であること、欠けている範囲、再試行の可否を、構造化して示します。こうすれば、エージェントは、残りを再取得するか、顧客に、確認中であることを伝えるかを、判断できます。取得できた分を破棄すると、有用な情報まで、失われます。","w":["注文の件数が増えれば、同じ問題が再発します。","取得できた有用な情報まで、失われます。","本当に該当がない場合にも、無駄な再検索を行うことになります。",null],"lv":2},{"sc":1,"d":2,"s":"2.3","q":"セキュリティ上の要件として、どのセッションでも、最初のツールの呼び出しは、必ず `get_customer` による本人確認でなければなりません。現在の実装では、`tool_choice` は `auto` で、システムプロンプトに、「最初に、必ず本人確認を行うこと」と記載しています。ログでは、約2%のセッションで、最初に `lookup_order` が呼び出されていました。最初の呼び出しを、確実に `get_customer` にする方法として、最も適切なものはどれですか。","o":["ツールの定義の順序を変更して、`get_customer` を、一覧の先頭に置く。モデルは、先頭のツールを、優先して選ぶようになる","すべてのリクエストで、`tool_choice` で `get_customer` を指定して、呼び出しを強制する。本人確認が、すべてのターンで、繰り返し保証されるため、最も安全である","すべてのリクエストで、`tool_choice` を `any` に設定する。いずれかのツールが、必ず呼び出されるようになる","最初のリクエストでは、`tool_choice` で `get_customer` を指定して、呼び出しを強制する。その後のリクエストでは、`auto` に戻す"],"a":[3],"e":"特定のツールを、確実に呼び出させるには、`tool_choice` で、そのツールを指定します。最初のリクエストだけで強制して、その後は `auto` に戻せば、本人確認の後は、モデルが、状況に応じて、ツールを選べます。`any` は、いずれかのツールの呼び出しを保証しますが、どのツールかは、保証しません。すべてのリクエストで強制すると、ほかのツールを呼び出すことも、回答を返すことも、できなくなります。","w":["定義の順序は、呼び出しを保証しません。","ほかのツールの呼び出しも、最終の回答も、できなくなります。","どのツールが呼び出されるかは、保証されません。",null],"lv":2,"g":"試験ガイド v1.0 は、`tool_choice` による強制（`any` や、ツールの指定）を、ツールを確実に呼び出させる手段として、扱っています。現在の公式ドキュメントでは、この強制は、拡張思考とは併用できず、一部の最新のモデルでは、エラーになる、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":1,"d":2,"s":"2.1","q":"`lookup_order` は、1件の注文について、倉庫の棚の番号、梱包の担当者、内部の処理のタイムスタンプなどを含む、42のフィールドを返します。顧客への対応に必要なのは、商品名、金額、配送の状況、返品の期限、支払いの方法の、5つ程度です。複数の注文を調べる対応では、応答の品質が下がり、関係のないフィールドの値を、顧客に伝えてしまう事例も、発生しています。最も適切な改善はどれですか。","o":["サポートの用途に必要なフィールドだけを、分かりやすい名前で返すように、ツールの出力を設計し直す","コンテキストウィンドウが、より大きいモデルに切り替えて、42のフィールドを、複数の注文について、余裕を持って保持できるようにする","複数の注文を調べる必要がある場合は、1回の対応で調べられる注文を、2件までに制限する","システムプロンプトに、42のフィールドのそれぞれの意味と、顧客に伝えてよいかどうかを、一覧として記載する"],"a":[0],"e":"ツールの出力は、モデルが読むコンテキストです。バックエンドの生のデータを、そのまま返すのではなく、その役割に必要な情報だけを、分かりやすい形で返すように、設計します。不要なフィールドは、コンテキストを消費するだけでなく、誤った情報を、回答に持ち込む原因にもなります。フィールドの一覧をプロンプトに記載すると、コンテキストの消費が、さらに増えます。","w":[null,"不要な情報が、回答に紛れ込む問題は、残ります。","正当な対応を制限することになり、原因も残ります。","コンテキストの消費が、さらに増えます。"],"lv":2},{"sc":1,"d":5,"s":"5.2","q":"ある顧客が、最初のメッセージで、「配送状況を知りたいのではありません。人の担当者と、直接話をさせてください」と、明確に述べました。問い合わせの内容は、注文の配送の遅れで、エージェントは、`lookup_order` を使えば、すぐに状況を回答できます。チームは、初回の問い合わせでの解決率を、80%以上にすることを、目標にしています。エージェントの対応として、最も適切なものはどれですか。","o":["まず、`lookup_order` で配送の状況を調べて、回答する。そのうえで、まだ担当者との会話を希望するかどうかを、顧客に確認する","担当者と話したい理由を、顧客に、詳しく質問する。理由が妥当であると判断できた場合に限って、引き継ぐ","「この件は、私が、すぐに解決できます」と伝えて、担当者への引き継ぎは行わずに、対応を続ける。解決率の目標を、優先する","顧客の明確な要望に従って、調査を先に行うことなく、`escalate_to_human` で、担当者に引き継ぐ"],"a":[3],"e":"顧客が、人の担当者との会話を、明確に求めている場合は、その要望を、すぐに尊重します。エージェントが、解決できる内容であっても、先に調査を行ったり、理由を問いただしたりすることは、顧客の明確な意思に、反します。解決率の目標は、顧客の意思よりも、優先されるものではありません。なお、顧客が、不満を示しているだけで、担当者を求めていない場合は、解決策を示すことが、適切です。","w":["顧客の明確な要望よりも、エージェントによる対応を、優先しています。","顧客の要望に、条件を付けることになります。","顧客の明確な意思に、反しています。",null],"lv":2},{"sc":1,"d":5,"s":"5.1","q":"ある顧客が、1回のセッションで、3つの別々の問題（注文 A の返金、注文 B の配送の遅れ、注文 C の請求の重複）について、順に相談しました。会話が長くなるにつれて、エージェントは、注文 C の請求について回答する際に、注文 A の金額を引用するなど、問題の間で、事実を取り違えるようになりました。それぞれの問題のツールの結果は、会話の履歴の中に、時系列で混在しています。最も適切な改善はどれですか。","o":["コンテキストウィンドウが、より大きいモデルに切り替えて、会話の履歴を、すべてそのまま保持する","問題ごとに、別々のサブエージェントに委任して、それぞれの結果だけを、メインのエージェントが受け取る","会話の履歴が長くなった時点で、全体を、1つの文章に要約して、それ以降は、その要約だけを使う","問題ごとに、注文番号、金額、状況、対応の内容をまとめた、構造化された記録を保持して、各リクエストに含める"],"a":[3],"e":"複数の問題を、1つの会話で扱うと、時系列で混在した履歴の中で、事実の対応が、失われやすくなります。問題ごとに、主要な事実を、構造化された記録として保持して、各リクエストに含めることで、どの事実が、どの問題に属するのかを、明確に保てます。全体を、1つの文章に要約すると、数値や、対応関係が、さらに失われやすくなります。","w":["履歴の中での事実の混在は、解消しません。","3つの問題は、同じ顧客との、1つの対話の中にあり、分離すると、顧客とのやり取りの文脈が、途切れます。","数値や、問題との対応関係が、さらに失われやすくなります。",null],"lv":2},{"sc":1,"d":5,"s":"5.2","q":"ある顧客が、「先週購入した商品が、競合の他社のサイトで、30ドル安く販売されている。差額を返金してほしい」と求めました。この会社の価格保証のポリシーには、「購入から14日以内に、当社のサイトで値下げがあった場合は、差額を返金する」と記載されていますが、他社の価格についての記載は、ありません。エージェントの対応として、最も適切なものはどれですか。","o":["価格保証のポリシーの趣旨は、顧客に、最も安い価格を保証することであると解釈して、30ドルの差額を返金する","差額の返金の代わりに、次回の購入で使える、30ドル分のクーポンを発行することを、エージェントの判断で、提案する","ポリシーに、この場合の規定がないことを踏まえて、`escalate_to_human` で、判断を、担当者に引き継ぐ","ポリシーに記載がないため、この要望には、対応できないと回答して、対応を終了する"],"a":[2],"e":"ポリシーに、規定がない要望は、エージェントが、独自の解釈で、承認することも、拒否することも、適切ではありません。規定を類推して承認すると、会社が意図していない、前例を作ることになります。一方的に拒否すると、会社が、本来は認める可能性のある要望を、失います。規定の空白は、エスカレーションすべき場面の、典型です。クーポンの発行も、ポリシーにない対応を、エージェントが、独自に行うことになります。","w":["ポリシーにない対応を、独自の解釈で、承認することになります。","ポリシーにない対応を、エージェントが、独自に行うことになります。",null,"会社が認める可能性のある要望を、エージェントの判断で、退けることになります。"],"lv":2},{"sc":1,"d":1,"s":"1.1","q":"ある問い合わせで、モデルが、1つの応答の中で、`get_customer` と `lookup_order` の、2つのツールの呼び出しを、同時に要求しました。アプリケーションは、最初の `get_customer` だけを実行して、その結果を、`tool_result` として返しました。次のリクエストは、API のエラー（400）になり、対応が、中断しました。エラーの内容は、「`tool_use` に対応する `tool_result` が、不足している」というものでした。最も適切な修正はどれですか。","o":["400 のエラーが返った場合に、同じリクエストを、3回まで、自動的に再試行する処理を追加する。一時的なエラーであれば、再試行によって、解消する","モデルが、複数のツールを、同時に要求しないように、システムプロンプトに、「ツールは、必ず1つずつ呼び出すこと」という指示を追加して、実装は、変更しない","2つのツールを、両方とも実行して、それぞれに対応する `tool_result` を、次の1つの user メッセージで返す","`tool_choice` で、`disable_parallel_tool_use` を有効にして、モデルが、1回の応答で、1つのツールだけを、要求するようにする。ループの実装は、変更しない"],"a":[2],"e":"モデルは、1つの応答の中で、複数のツールを、同時に要求することがあります。その場合、アプリケーションは、要求されたすべてのツールを実行して、それぞれの `tool_use` の ID に対応する `tool_result` を、次の1つの user メッセージに、まとめて返す必要があります。一部だけを返すと、不正なリクエストになります。400 のエラーは、リクエストの内容の誤りであり、再試行しても、解消しません。","w":["リクエストの内容の誤りであり、再試行しても、同じエラーになります。","指示では、同時の要求を、確実には防げず、実装の誤りも残ります。",null,"エラーは起こらなくなりますが、複数の要求を処理できない、実装の誤りが残り、並列の呼び出しによる効率も、失われます。"],"lv":2},{"sc":1,"d":1,"s":"1.4","q":"返金の処理では、`process_refund` が成功した後に、必ず、(1) 顧客への確認のメールの送信と、(2) ケースの状態の「解決済み」への更新を、行う必要があります。現在は、これらを、エージェントが呼び出すツールとして提供しており、システムプロンプトに、手順を記載しています。ログを調べると、返金の後に、メールの送信が行われていないケースが、約4%、状態が更新されていないケースが、約7%ありました。最も適切な見直しはどれですか。","o":["システムプロンプトの手順の記載を、番号付きの一覧に書き直して、「いずれの手順も、省略してはならない」という注意を、各手順に付ける","返金の後に、エージェントが、メールの送信と、状態の更新のツールを、呼び出していない場合に、次のターンで、不足している手順を、エージェントに通知する","返金の処理の最後に、エージェントに、「すべての手順を、完了しましたか」と自己確認させるターンを、追加する。漏れがあれば、その時点で、実行させる","メールの送信と、状態の更新を、モデルに判断させるのではなく、`process_refund` が成功した後に、アプリケーションのコードが、必ず実行するようにする"],"a":[3],"e":"返金の後に、必ず行うべき、判断を必要としない後処理は、モデルに任せる理由が、ありません。アプリケーションのコードで、`process_refund` の成功を契機として、決定的に実行すれば、漏れは、起こりません。モデルへの指示や、自己確認は、漏れの割合を下げても、なくすことは、できません。事後の検出と、手作業での補完は、顧客への連絡の遅れを、生みます。","w":["指示である限り、漏れを、なくすことはできません。","漏れを検出して、促す仕組みであり、実行そのものは、依然として、モデルに依存します。コードで実行するほうが、単純で、確実です。","自己確認も、確実ではなく、漏れが残ります。",null],"lv":2},{"sc":1,"d":1,"s":"1.5","q":"顧客は、チャットの中で、クレジットカードの番号を、そのまま入力することがあります。エージェントが、`escalate_to_human` で、担当者に引き継ぐ際に、要約の中に、カードの番号を、そのまま含めてしまう事例が、発生しました。引き継ぎの内容は、チケットのシステムに保存されて、多くの従業員が、閲覧できます。システムプロンプトには、「カードの番号を、引き継ぎの内容に含めないこと」と記載されています。最も確実な対策はどれですか。","o":["顧客に、チャットの冒頭で、「カードの番号は、入力しないでください」という注意を、毎回表示する。入力されなければ、引き継ぎの内容に含まれることも、ない","システムプロンプトの記載を、「カードの番号を含めることは、重大な規程の違反である」という、より強い表現に書き換えて、違反の例を、してはならない例として、追加する","`escalate_to_human` の実行の前に呼び出されるフックで、引数の中の、カードの番号に当たる文字列を検出して、マスキングしてから、実行させる","チケットのシステムに保存された後に、夜間の処理で、カードの番号を検出して、該当のチケットを、担当者に通知する"],"a":[2],"e":"機微な情報が、特定のツールの引数に含まれないようにするには、ツールの実行の前に呼び出されるフックで、引数を検査して、決定的に処理するのが、確実です。カードの番号は、形式が決まっているため、パターンによって、検出できます。プロンプトの指示は、確実には守られません。顧客への注意の表示は、入力を、完全には防げません。保存された後の検出では、すでに、多くの従業員が、閲覧できる状態になっています。","w":["入力を、完全には防げず、入力された場合の対策になりません。","指示である限り、確実には守られません。",null,"すでに保存されて、閲覧できる状態になった後の対応です。"],"lv":2},{"sc":1,"d":1,"s":"1.3","q":"ある顧客が、「過去2年間に、何度も同じ不具合で返品している。まとめて、補償してほしい」と求めました。この顧客には、過去2年間に、86件の注文があります。エージェントが、すべての注文を、`lookup_order` で調べたところ、コンテキストの大半が、注文のデータで占められて、その後の、補償の方針の説明と、顧客とのやり取りで、初期に確認した内容を、取り違えるようになりました。最も適切な設計はどれですか。","o":["調べる注文を、直近の10件に限定する。コンテキストの消費が抑えられるため、その後のやり取りで、内容を取り違えることが、なくなる","注文の履歴の調査を、サブエージェントに委任して、返品の件数や金額の要約だけを、メインのエージェントに返させる","メインのエージェントを、コンテキストウィンドウが、より大きいモデルに切り替えて、86件の注文のデータを、すべて保持したまま、対応を続ける","86件の注文を調べた後に、会話の全体を、1つの段落に要約して、それ以降は、その要約だけを使って、対応を続ける"],"a":[1],"e":"大量のデータを調べる作業を、メインのエージェントが、自分で行うと、その途中経過で、コンテキストが埋まります。調査をサブエージェントに委任すれば、86件の注文のデータは、サブエージェントのコンテキストにとどまり、メインには、要約された結論だけが、返ります。直近の10件に限定すると、顧客が求めている、2年間の全体の状況を、把握できません。会話の全体を、1つの段落に要約すると、金額などの細部が、失われます。","w":["顧客が求めている、2年間の全体の状況を、把握できません。",null,"大量のデータで埋まることは変わらず、取り違えのおそれが残ります。","金額や、件数などの細部が、失われやすくなります。"],"lv":2},{"sc":1,"d":1,"s":"1.7","q":"ある顧客が、昨日、配送の遅れについて問い合わせて、エージェントは、`lookup_order` で、「配送中、到着の予定は3日後」という状況を確認して、案内しました。今日、同じ顧客が、「まだ届かない」と、再び問い合わせてきました。現在の実装は、昨日のセッションを、そのまま再開しており、エージェントは、昨日のツールの結果に基づいて、「到着の予定は3日後です」と、同じ案内を、繰り返しました。実際には、配送の業者で、紛失の扱いに変わっていました。最も適切な設計はどれですか。","o":["昨日のセッションを再開したうえで、システムプロンプトに、「過去のツールの結果は、古い可能性があることを、常に意識すること」という注意を、追加する","昨日のやり取りは、一切引き継がずに、まったく新しいセッションとして、対応を始める。古い情報が、使われることは、なくなる","昨日の経緯の要約を引き継いで、新しいセッションを開始する。注文の状況のような、変化し得る情報は、あらためて、ツールで取得する","昨日のセッションを再開して、昨日のツールの結果を、そのまま使う。同じ注文について、1日で、状況が変わることは、まれである"],"a":[2],"e":"再開したセッションの履歴には、過去の時点の、ツールの結果が残っています。注文の状況のように、時間とともに変化する情報は、その結果が、すでに古くなっている可能性があります。経緯の要約（何が問題で、何を案内したか）は引き継いで、変化し得る情報は、あらためて取得するのが、適切です。何も引き継がないと、顧客は、経緯を、最初から説明し直すことになります。","w":["注意を加えても、履歴の中の古い結果が、そのまま使われるおそれが残ります。","顧客が、経緯を、最初から説明し直すことになります。",null,"配送の状況は、変化し得る情報であり、古い結果に基づく誤った案内になります。"],"lv":2},{"sc":1,"d":1,"s":"1.1","q":"アプリケーションは、エージェントのループが、`end_turn` で終了した時点で、そのケースを、「初回の問い合わせで解決」として、記録しています。この指標は、85%で、目標の80%を、上回っています。しかし、顧客への調査では、問題が解決したと答えた割合は、62%でした。ログを確認すると、ツールがエラーを返した後に、エージェントが、「申し訳ございません。現在、処理ができません」と回答して、`end_turn` で終了したケースも、「解決」に含まれていました。最も適切な見直しはどれですか。","o":["`end_turn` は、ターンの終了を示すだけである。解決の判定は、返金の完了などの、結果の状態に基づいて行う","目標を、80%から、90%に引き上げる。指標と、顧客の実感の差を、目標の水準によって、埋める","ツールがエラーを返した場合は、`end_turn` にならないよう、エージェントに、成功するまで、再試行を続けさせる","`end_turn` で終了したケースのうち、回答の文面に、「申し訳」という語が含まれるものを、「解決」から除外する"],"a":[0],"e":"`end_turn` は、モデルが、応答を終えたことを、示すだけです。問題が、解決したかどうかは、示しません。解決の判定は、返金の完了や、ケースの状態といった、実際の結果に基づいて、行う必要があります。回答の文面に、特定の語が含まれるかどうかで判定する方法は、言い回しによって、容易に外れます。指標が、実態を反映していなければ、目標を引き上げても、意味がありません。","w":[null,"指標が、実態を反映していないという問題は、変わりません。","解決しないエラーでは、再試行が、際限なく続きます。","言い回しによって、容易に外れる、不安定な判定です。"],"lv":2},{"sc":1,"d":1,"s":"1.6","q":"ある顧客が、1通のメッセージで、「届いた商品のサイズが合わないので、交換してほしい。あわせて、先月、引っ越したので、登録の住所を、新しい住所に変更してほしい」と依頼しました。エージェントは、2つの要望を、別々に処理して、先に、交換品の発送の手配を行い、その後で、住所を変更しました。交換品は、古い住所に発送されました。分解の仕方として、最も適切な見直しはどれですか。","o":["複数の要望を含む問い合わせは、エージェントでは処理せずに、すべて、人の担当者にエスカレーションする","複数の要望を含む問い合わせは、常に、メッセージに書かれた順序のとおりに、1つずつ処理する。順序についての判断の誤りが、なくなる","複数の要望を含む問い合わせは、すべての要望を、同時に、並列に処理する。処理の時間が短くなり、順序の問題も、起こらない","要望を、個別の項目に分けたうえで、項目の間の依存関係（住所の変更が、発送の前提になること）を確認して、処理の順序を決める"],"a":[3],"e":"複数の要望を、個別の項目に分けるだけでは、十分ではありません。項目の間に、依存関係がある場合は、それを踏まえて、順序を決める必要があります。この例では、交換品の発送は、住所の変更に依存しています。書かれた順序のとおりに処理すると、この例では、発送が先になり、同じ誤りが、起こります。並列に処理すると、発送の時点で、住所が、変更されている保証が、ありません。","w":["エージェントで対応できる問い合わせまで、人に回すことになります。","この例では、交換の依頼が先に書かれており、同じ誤りが起こります。","発送の時点で、住所が変更されている保証が、ありません。",null],"lv":2},{"sc":1,"d":1,"s":"1.5","q":"コンプライアンス部門から、「エージェントが実行した、すべての `process_refund` について、顧客の ID、金額、実行の時刻を、監査のためのログに、例外なく記録すること」を、求められました。現在は、システムプロンプトで、エージェントに、「返金を実行した後は、`write_audit_log` ツールを呼び出して、記録すること」と指示しています。監査で、記録のない返金が、複数、見つかりました。最も適切な実装はどれですか。","o":["`write_audit_log` を先に呼び出さなければ、`process_refund` を実行できないように、ツールの呼び出しの順序を、プロンプトで指定する","システムプロンプトの指示を、「記録を省略した場合は、監査で、重大な指摘を受ける」という説明を加えて、より詳しく書き直す","エージェントに、セッションの最後に、実行した返金の一覧を、まとめて報告させて、その報告を、監査のためのログとして、保存する","`process_refund` の実行の後に呼び出されるフックで、引数と結果を、監査のためのログに、自動的に記録する"],"a":[3],"e":"「例外なく、記録する」という要件は、モデルの判断に依存する方法では、満たせません。ツールの実行の後に呼び出されるフックを使えば、`process_refund` が実行されるたびに、引数と結果を、決定的に記録できます。モデルは、記録の作業に、関与する必要が、なくなります。セッションの最後の報告は、モデルが生成した文章であり、実際に実行された内容と、一致する保証が、ありません。","w":["プロンプトでの順序の指定は、確実には守られません。","指示である限り、記録の漏れを、なくすことはできません。","モデルが生成した報告であり、実際の実行の内容と、一致する保証がありません。",null],"lv":2},{"sc":1,"d":2,"s":"2.1","q":"`lookup_order` の引数 `order_id` は、「ORD-」に続く、8桁の数字という形式です。顧客は、「注文番号は、12345678 です」「#12345678」「ord12345678」など、さまざまな書き方をします。ツールの説明文は、「注文を検索する」、引数の説明は、「注文の ID」だけです。ログでは、約9%の呼び出しが、形式の誤りによって失敗して、エージェントが、「注文が見つかりません」と、顧客に回答しています。最も適切な改善はどれですか。","o":["顧客の発言から、注文番号を抽出して、正しい形式に整えるための、専用のモデルの呼び出しを、エージェントの前段に追加する","引数の説明と、スキーマに、形式と、具体的な例を明記する。あわせて、ツールの側で、接頭辞の有無などの、表記の揺れを、吸収する","システムプロンプトに、顧客が使いそうな書き方を、できるだけ多く列挙して、それぞれについて、正しい形式への変換の方法を、記載する","形式の誤りで失敗した場合に、エージェントが、同じ引数で、3回まで、自動的に再試行するようにする"],"a":[1],"e":"モデルは、引数の説明と、スキーマを手がかりにして、引数の値を組み立てます。「注文の ID」という説明だけでは、形式が、伝わりません。形式と、具体的な例を、引数の説明と、スキーマに明記します。さらに、ツールの側で、明らかな表記の揺れを吸収すれば、より堅牢になります。同じ引数での再試行は、形式が誤っている以上、同じ結果になります。顧客に、形式を強いることは、対応の質を、下げます。","w":["説明とスキーマの改善で足りる問題に、追加の呼び出しによる、遅延とコストを、持ち込みます。",null,"書き方を、網羅することはできず、コンテキストも消費します。","形式が誤っている以上、同じ引数では、同じ結果になります。"],"lv":2},{"sc":1,"d":2,"s":"2.2","q":"深夜に、エージェントが、`escalate_to_human` を呼び出したところ、担当者の窓口が、営業時間外であったために、ツールは、「エスカレーションに失敗しました」という文字列だけを返しました。エージェントは、同じ呼び出しを、5回繰り返した後、顧客に、「現在、対応できません」とだけ伝えて、終了しました。顧客は、翌朝、もう一度、最初から、問い合わせをやり直しました。ツールの改善として、最も適切なものはどれですか。","o":["失敗の理由（営業時間外）、再試行しても解決しないこと、代わりの手段（折り返しの予約など）を、構造化して返す","営業時間外の場合に、エージェントが、再試行の回数を、5回から20回に増やして、窓口が開くのを待つ","営業時間外の場合は、ツールが、成功の結果を返す。エージェントは、引き継ぎが完了したものとして、顧客に案内できる","営業時間外の場合は、ツールが、応答を返さずに、営業の開始の時刻まで、待機する。営業が始まった時点で、引き継ぎを実行する"],"a":[0],"e":"エージェントが、適切に行動できるかどうかは、ツールが返す情報で、決まります。「失敗しました」だけでは、再試行すべきか、別の手段を取るべきかを、判断できません。失敗の理由、再試行しても解決しないこと、代わりの手段を返せば、エージェントは、顧客に、折り返しの予約などを、提案できます。成功の結果を返すと、顧客は、引き継がれたと誤解して、待ち続けることになります。","w":[null,"窓口が開くまで、再試行しても、解決しません。","顧客は、引き継がれたと誤解して、待ち続けることになります。","顧客との対話が、何時間も、応答のないままになります。"],"lv":2},{"sc":1,"d":2,"s":"2.3","q":"「エージェントが、ツールを使わずに、推測で回答することがある」という問題に対処するために、開発者が、すべてのリクエストで、`tool_choice` を `any` に設定しました。その結果、推測による回答は、なくなりましたが、新たな問題が、発生しました。顧客の「ありがとう、解決しました」という発言に対しても、エージェントが、ツールを呼び出し続けて、対応が、終了しなくなりました。最も適切な見直しはどれですか。","o":["`tool_choice` を `none` に変更して、ツールを、一切使わせないようにする。対応が、終了しなくなる問題は、解消する","`tool_choice` を `auto` に戻す。事実の確認が必要な場面での、ツールの利用は、ツールの説明と、プロンプトの基準で促して、必須の手順だけを、個別に強制する","`tool_choice` を `any` のままにして、反復の回数の上限を、3回に設定する。上限に達した時点で、対応を、強制的に終了する","`tool_choice` を `any` のままにして、何もしない `noop` というツールを追加する。回答だけを返したい場合は、モデルに、そのツールを呼び出させる"],"a":[1],"e":"`any` は、すべてのターンで、いずれかのツールの呼び出しを、強制します。そのため、モデルは、ツールを使わずに、回答を返して、ターンを終えることが、できなくなります。通常は、`auto` にして、ツールを使うかどうかを、モデルに判断させます。推測による回答への対策は、ツールの説明と、プロンプトの基準の改善、そして、本当に必須の手順だけを、個別に強制することで、行います。","w":["事実の確認に必要なツールまで、使えなくなります。",null,"必要な処理が、途中で打ち切られることがあり、原因も残ります。","不要なツールと、呼び出しを増やす回避策であり、設定の誤りを残します。"],"lv":2},{"sc":1,"d":2,"s":"2.4","q":"返品のポリシーの文書（約6,000字）は、月に1回程度、改訂されます。現在は、エージェントが、ポリシーに関する質問を受けるたびに、`search_policy` というツールを、平均で3回呼び出して、関連する箇所を探しています。ポリシーは、ほとんどの問い合わせで、参照されます。ツールの呼び出しの往復によって、応答が遅くなっており、検索の語句によっては、関連する箇所が、見つからないこともあります。最も適切な見直しはどれですか。","o":["ポリシーの内容を、エージェントが、学習済みの知識に基づいて、回答するようにして、ツールの呼び出しを、なくす","`search_policy` の検索の件数を、3件から20件に増やして、1回の呼び出しで、関連する箇所が、漏れなく返るようにする","ポリシーの文書を、MCP のリソースとして公開して、エージェントのコンテキストに、あらかじめ含められるようにする。ツールによる検索は、不要になる","ポリシーに関する質問は、すべて、人の担当者にエスカレーションして、エージェントは、回答しないようにする"],"a":[2],"e":"ほとんどの問い合わせで参照される、比較的短い文書を、そのたびに、ツールで検索することは、往復の遅延と、検索の漏れを、生みます。MCP のリソースは、エージェントが、コンテキストに取り込める、参照用のデータを公開するための仕組みです。ポリシーの文書を、リソースとして公開すれば、探索のためのツールの呼び出しが、不要になります。モデルの学習済みの知識には、この会社のポリシーは、含まれていません。","w":["モデルの知識には、この会社のポリシーは、含まれていません。","往復の遅延は残り、検索の語句による漏れも、解消しません。",null,"エージェントで回答できる質問まで、人に回すことになります。"],"lv":2},{"sc":1,"d":5,"s":"5.1","q":"長い対応の中で、エージェントは、顧客に、「送料は、当社が負担します」「返金は、5営業日以内に行います」と、約束しました。その後、会話が長くなり、途中で、履歴の要約が行われました。要約の後、エージェントは、「返送の送料は、お客様のご負担となります」と、以前の約束と、矛盾する案内を行いました。要約には、「返品の手続きについて、案内した」とだけ、記載されていました。最も適切な改善はどれですか。","o":["顧客に対して約束した内容を、要約の対象とは別の、構造化された記録として保持して、要約の後も、各リクエストに含める","要約に使うモデルを、より上位のものに変更して、要約の文字数の上限も、2倍に引き上げる。約束の内容が、要約に残りやすくなる","矛盾した案内を防ぐために、エージェントには、送料や、返金の期日について、具体的な約束を、一切させないようにする","要約のプロンプトに、「顧客に対して約束した内容は、必ず、要約に含めること」という指示を追加する"],"a":[0],"e":"履歴を、文章として要約すると、金額や、条件、約束といった、具体的な事実が、曖昧な表現に、置き換わりやすくなります。顧客に対して約束した内容は、対応の一貫性のために、必ず保持すべき事実です。これらを、要約の対象とは別の、構造化された記録として保持して、各リクエストに含めます。要約のモデルや、文字数を変えても、要約である以上、細部が失われる可能性は、残ります。","w":[null,"要約である以上、細部が失われる可能性は、残ります。","顧客が必要とする具体的な案内が、できなくなります。","要約の質は上がりますが、モデルによる要約に依存しており、約束が、曖昧な表現に置き換わる可能性が、残ります。"],"lv":2},{"sc":1,"d":5,"s":"5.2","q":"エスカレーションの判断のために、チームは、エージェントに、対応のたびに、確信度を、0から1の数値で出力させて、0.7未満の場合に、`escalate_to_human` を呼び出す仕組みを、導入しました。1か月の運用の結果、配送の状況の確認のような、単純な問い合わせが、多数エスカレーションされる一方で、ポリシーに規定のない、例外的な補償の要求を、エージェントが、高い確信度で、独自に承認していたことが、分かりました。最も適切な見直しはどれですか。","o":["確信度を、0から1の数値ではなく、「高」「中」「低」の3段階で出力させて、「低」の場合にだけ、エスカレーションする","エスカレーションすべき条件（顧客の明示的な要求、ポリシーに規定がない場合、進展がない場合など）を、明確な基準として定めて、境界の事例を、例として示す","エスカレーションの判断を、エージェントとは別のモデルに行わせる。別のモデルに、対応の全体を読ませて、確信度を、もう一度、推定させる","確信度の基準を、0.7から0.9に引き上げる。より多くの問い合わせが、エスカレーションされるようになり、例外的な要求の、独自の承認も、減る"],"a":[1],"e":"モデルが、自己申告する確信度は、問い合わせの実際の難しさや、エスカレーションの必要性を、反映しません。モデルは、誤った判断にも、高い確信度を、付けることがあります。エスカレーションは、確信度ではなく、どのような状況が該当するのかを定めた、明確な基準に基づいて、行います。基準を引き上げても、段階を変えても、別のモデルに推定させても、確信度に頼るという問題は、変わりません。","w":["段階を変えても、確信度が、必要性を反映しないことは、変わりません。",null,"別のモデルによる確信度も、エスカレーションの必要性を、反映しません。","単純な問い合わせのエスカレーションが、さらに増えます。"],"lv":2},{"sc":1,"d":5,"s":"5.2","q":"ある顧客が、「もう3回も、同じことを説明している。いい加減にしてほしい」と、強い不満を示しました。問題は、請求の重複で、`lookup_order` で確認すれば、エージェントが、ポリシーの範囲で、すぐに返金できる内容です。顧客は、人の担当者との会話を、求めては、いません。エージェントの対応として、最も適切なものはどれですか。","o":["不満を受け止めたうえで、すぐに確認して、解決策（重複した請求の返金）を示す。顧客が、あらためて、担当者を求めた場合は、引き継ぐ","不満への言及は避けて、事務的に、本人確認の手順から、順番に、手続きを進める。感情に触れると、対応が長くなる","顧客が、強い不満を示しているため、ただちに、`escalate_to_human` で、担当者に引き継ぐ。不満のある顧客への対応は、人が行うべきである","顧客に、人の担当者との会話を希望するかどうかを、まず質問する。回答を待ってから、対応の方針を決める"],"a":[0],"e":"顧客が、不満を示していることは、それだけでは、エスカレーションの理由に、なりません。エージェントが、解決できる問題であれば、不満を受け止めたうえで、速やかに、解決策を示すことが、顧客にとって、最も早い解決になります。担当者に引き継ぐと、顧客は、もう一度、待つことになります。ただし、顧客が、人の担当者を、明確に求めた場合は、その要望に従います。","w":[null,"不満を受け止めない対応は、顧客の不満を、さらに強めます。","顧客は、さらに待つことになり、解決が遅れます。","解決できる問題であり、質問は、解決を遅らせます。"],"lv":2},{"sc":2,"d":3,"s":"3.1","q":"モノレポには、React で書かれた `packages/web/` と、Go で書かれた `services/api/` があります。規約は、まったく異なります。現在は、両方の規約を、ルートの CLAUDE.md に、合計で約700行、記述しています。開発者の大半は、どちらか一方だけで作業しており、「Go のファイルを編集しているのに、React の規約に沿った提案が混ざる」という声が出ています。規約は、それぞれのチームが、自分たちで保守したいと考えています。最も適切な構成はどれですか。","o":["両方の規約を、各開発者の `~/.claude/CLAUDE.md` に移して、自分が作業する側の規約だけを、各自で残してもらう","`.claude/rules/` に、React 用と、Go 用の、ルールのファイルを置く。どちらのファイルにも、`paths` は、指定しない","ルートの CLAUDE.md の中で、見出しを使って、React の規約と Go の規約を分ける。それぞれの冒頭に、「このディレクトリのファイルを扱う場合にだけ、適用すること」と記載する","それぞれのディレクトリに CLAUDE.md を置いて、固有の規約を記述する。ルートの CLAUDE.md には、リポジトリの全体に共通する事項だけを残す"],"a":[3],"e":"CLAUDE.md は、階層的に配置できます。サブディレクトリの CLAUDE.md は、そのディレクトリのファイルを扱うときに、読み込まれます。規約を、それぞれのディレクトリに置けば、関係のない規約が混ざることを防げ、各チームが、自分たちの規約を、保守できます。ルートの CLAUDE.md は、常に読み込まれるため、見出しで分けても、両方の規約が、常にコンテキストに入ります。","w":["チームで共有されず、ほかのプロジェクトにも適用されます。","`paths` のないルールは、常に読み込まれるため、関係のない規約が、混ざり続けます。","ルートの CLAUDE.md は常に読み込まれ、両方の規約がコンテキストに入ります。",null],"lv":2},{"sc":2,"d":3,"s":"3.1","q":"ある開発者は、Claude Code に、「変更の理由を、毎回、詳しく説明してほしい」「コミットメッセージの案は、英語で出してほしい」と考えています。これは、個人の好みであり、チームのほかのメンバーは、簡潔な応答を好んでいます。この開発者は、3つの異なるリポジトリで、作業しています。指示の置き場所として、最も適切なものはどれですか。","o":["各リポジトリの、ルートの CLAUDE.md に追記して、コミットする。3つのリポジトリのすべてで、同じ指示が、確実に適用される","各リポジトリの `.claude/rules/` に、ルールのファイルとして追加して、コミットする。ほかの規約と分けて、管理できる","ユーザーレベルの `~/.claude/CLAUDE.md` に記述する。自分のすべてのプロジェクトに適用され、ほかのメンバーには、影響しない","セッションを開始するたびに、最初のメッセージで、同じ指示を入力する"],"a":[2],"e":"個人の好みは、ユーザーレベルの `~/.claude/CLAUDE.md` に記述します。このファイルは、その開発者の、すべてのプロジェクトに適用されますが、バージョン管理では共有されないため、ほかのメンバーには、影響しません。リポジトリの CLAUDE.md や、`.claude/rules/` にコミットすると、チームの全員に、適用されてしまいます。","w":["コミットすると、チームの全員に適用されます。","コミットすると、チームの全員に適用されます。",null,"手間がかかり、入力を忘れることもあります。"],"lv":2},{"sc":2,"d":3,"s":"3.2","q":"チームは、依存関係の脆弱性を調べて報告する、`/audit-deps` というスキルを使っています。このスキルは、調査と報告だけを行うことを、意図しています。ところが、ある開発者が実行した際に、Claude が、調査の途中で、`package.json` のバージョンを書き換えて、依存関係を更新してしまいました。スキルの本文には、「ファイルを変更しないこと」と記載されています。最も確実な対策はどれですか。","o":["スキルの本文の、「ファイルを変更しないこと」という記述を、冒頭に移して、太字で強調する。冒頭の指示は、最も優先して守られるため、変更が行われなくなる","スキルを実行する前に、開発者が、毎回、「今回は、ファイルを変更しないでください」と入力する","スキルのフロントマターの `allowed-tools` で、使えるツールを、読み取りと検索に必要なものに、限定する","スキルの名前を、`/audit-deps-readonly` に変更して、読み取り専用であることを、名前で示す"],"a":[2],"e":"スキルのフロントマターの `allowed-tools` を使うと、そのスキルの実行中に使えるツールを、制限できます。読み取りと検索のツールだけを許可すれば、本文の指示が守られるかどうかに関係なく、ファイルの変更は、行われません。本文での指示や、名前による表示は、モデルの挙動を、確実には制約しません。","w":["指示である限り、確実には守られません。","手間がかかり、指示であることも変わりません。",null,"名前は、ツールの利用を制約しません。"],"lv":2,"g":"試験ガイド v1.0 は、`allowed-tools` を、スキルの実行中に使えるツールを制限する設定として、扱っています。現在の公式ドキュメントでは、`allowed-tools` は、確認なしで使ってよいツールを指定するもので、使えるツールを取り除くには、`disallowed-tools` を使う、と説明されています。試験では、ガイドの記載に沿って、解答してください。"},{"sc":2,"d":3,"s":"3.2","q":"API のエンドポイントを追加するためのスキルの `SKILL.md` が、約2,000行に膨らんでいます。内容は、基本の手順のほかに、認証の方式ごとの実装例、エラーコードの一覧、データベースの種類ごとのマイグレーションの雛形などです。1回の作業で必要になるのは、通常、そのうちの一部です。スキルを呼び出すたびに、全文が読み込まれて、コンテキストを大きく消費しています。最も適切な見直しはどれですか。","o":["`SKILL.md` には、基本の手順と、参照先の案内だけを残す。実装例や雛形は、スキルのディレクトリの別のファイルに分けて、必要なときに読み込ませる","`SKILL.md` のフロントマターに、`context: fork` を指定して、スキルを、独立したサブエージェントのコンテキストで、実行する","スキルを、認証の方式と、データベースの種類の組み合わせごとに、12個の別々のスキルに分割する","`SKILL.md` の全文を、プロジェクトの CLAUDE.md に移す。スキルを呼び出す必要がなくなり、手順が、常に参照できるようになるため、読み込みの漏れも起こらない"],"a":[0],"e":"スキルは、`SKILL.md` のほかに、補助のファイルを、同じディレクトリに持つことができます。`SKILL.md` には、基本の手順と、どのファイルに何があるのかの案内だけを置いて、詳細は、必要になったときに、Claude が読み込みます。これにより、毎回のコンテキストの消費を、抑えられます。CLAUDE.md に移すと、スキルを使わない作業でも、常に読み込まれます。","w":[null,"メインの会話は、圧迫されなくなりますが、スキルを実行する側では、約2,000行の全文が、毎回読み込まれます。","内容が重複して、保守の負担が増えます。","スキルを使わない作業でも、常に読み込まれるようになります。"],"lv":2},{"sc":2,"d":3,"s":"3.3","q":"リポジトリには、データベースのマイグレーションの規約（約150行）と、公開 API の設計の規約（約200行）があります。現在は、どちらも、ルートの CLAUDE.md に記述されており、フロントエンドのスタイルを直すだけの作業でも、常に読み込まれています。マイグレーションのファイルは `db/migrations/` に、API のハンドラーは、`services/` の下の、複数のディレクトリに、分散しています。該当するファイルを編集するときにだけ、規約が読み込まれるようにする方法として、最も適切なものはどれですか。","o":["`.claude/rules/` に、規約ごとのファイルを置いて、フロントマターの `paths` に、対象のファイルの glob パターンを指定する","ルートの CLAUDE.md の各規約の冒頭に、「該当するファイルを編集する場合にだけ、参照すること」と記載する","2つの規約を、`~/.claude/CLAUDE.md` に移して、プロジェクトの CLAUDE.md からは、削除する","2つの規約を、それぞれスキルにして、該当するファイルを編集するたびに、開発者が呼び出す"],"a":[0],"e":"`.claude/rules/` のルールのファイルには、フロントマターの `paths` で、対象のファイルの glob パターンを、指定できます。パターンに一致するファイルを扱うときにだけ、そのルールが読み込まれます。対象が、複数のディレクトリに分散していても、glob で指定できます。CLAUDE.md に記述した内容は、注記を付けても、常に読み込まれて、コンテキストを消費します。","w":[null,"注記を付けても、常に読み込まれて、コンテキストを消費します。","すべてのプロジェクトで読み込まれ、チームで共有もされません。","呼び出しを忘れると、規約が適用されません。"],"lv":2},{"sc":2,"d":3,"s":"3.4","q":"過去に、大きなリファクタリングで、手戻りが発生したことを受けて、チームのリーダーが、「今後は、すべての変更について、必ずプランモードから始めること」という決まりを作りました。その結果、ログのメッセージの誤字の修正や、1つの関数への引数のチェックの追加といった、小さな変更でも、計画の作成と承認の手順を踏むことになり、開発者から、不満が出ています。決まりの見直しとして、最も適切なものはどれですか。","o":["決まりを廃止して、すべての変更を、直接実行で行う。計画の作成は、時間がかかるため、大きな変更でも、省略する","決まりを維持する。計画を立てることは、どのような変更であっても、品質を高めるため、手間に見合う価値がある。例外を認めると、決まりそのものが、守られなくなる","変更する行数が、50行を超える場合にだけ、プランモードを使う、という基準に変更する","範囲が明確な小さな変更は、直接実行で行う。複数のファイルに影響する変更や、設計上の判断を伴う変更では、プランモードを使う"],"a":[3],"e":"プランモードは、影響の範囲が広い変更や、複数の進め方があり得る変更、不慣れなコードの調査で、効果を発揮します。一方、範囲が明確で、小さな変更では、計画の手順は、手間を増やすだけです。変更の性質によって、使い分けます。行数は、目安の1つにはなりますが、少ない行数でも、設計上の判断を伴う変更はあり、基準としては、不十分です。","w":["大きな変更での手戻りが、再発します。","範囲が明確な小さな変更では、手間を増やすだけです。","行数が少なくても、設計上の判断を伴う変更があります。",null],"lv":2},{"sc":2,"d":3,"s":"3.5","q":"日付の範囲を計算する関数のバグについて、開発者が、「月末の処理がおかしいので、直して」と依頼しました。Claude の修正で、月末の問題は解消しましたが、うるう年の2月で、別の誤りが発生しました。それを指摘して修正させると、今度は、年をまたぐ範囲で、誤りが発生しました。同じやり取りが、5回続いています。進め方の見直しとして、最も効果的なものはどれですか。","o":["新しいセッションを開始して、最初の依頼を、同じ文面で、もう一度行う","関数の全体を、Claude に、最初から書き直させる。既存のコードを修正するよりも、新しく書くほうが、誤りが少なくなるため、5回の修正で積み重なった問題も、一度に解消する","期待する振る舞いを、境界の条件を網羅したテストとして先に用意する。テストを実行して、失敗の内容を共有しながら、すべてが成功するまで、修正を繰り返す","プランモードに切り替えて、関数の修正の計画を、もう一度立てさせて、承認してから、修正させる"],"a":[2],"e":"修正のたびに、別の場所が壊れる場合は、期待する振る舞いの全体が、明確になっていません。境界の条件を網羅したテストを、先に用意すれば、何が正しい振る舞いなのかが、具体的に定まります。Claude は、テストを実行して、失敗の内容を見ながら、修正を繰り返せます。これにより、ある修正が、別の条件を壊していないことも、毎回確認できます。","w":["同じ結果を、繰り返すことになります。","期待する振る舞いが明確でなければ、書き直しても同じ問題が起こります。",null,"計画を立て直しても、期待する振る舞いが、具体的に定義されていないことは、変わりません。"],"lv":2},{"sc":2,"d":3,"s":"3.5","q":"Claude が生成した、決済の処理のコードをレビューしたところ、3つの問題が見つかりました。(1) 金額を、浮動小数点数で扱っている。(2) その金額を受け取る関数の、引数の型が、適切ではない。(3) 金額の丸めの処理が、2か所に重複している。3つの問題は、いずれも、金額の表現の方法に関わっており、1つの修正が、ほかの修正の内容に、影響します。フィードバックの伝え方として、最も適切なものはどれですか。","o":["3つの問題を、互いの関係とともに、1つのメッセージで伝える。全体として整合する修正を、依頼する","(1) だけを伝えて、修正させる。完了を確認してから、(2) を伝えて、最後に、(3) を伝える。1つずつ進めることで、それぞれの修正を、確実に確認できる","「金額の扱いに、問題があるようなので、全体を見直してください」とだけ伝えて、具体的な問題は、Claude に見つけさせる","3つの問題を、3つのサブエージェントに、並列に委任して、それぞれの修正を、メインのセッションで、統合する"],"a":[0],"e":"複数の問題が、互いに関係しており、1つの修正が、ほかの修正に影響する場合は、まとめて伝えるほうが、適切です。1つずつ伝えると、最初の修正が、後の問題を考慮しない形で行われて、やり直しが発生します。逆に、問題が、互いに独立している場合は、1つずつ進めるほうが、確認しやすくなります。この例では、3つとも、金額の表現に関わっているため、まとめて伝えます。","w":[null,"最初の修正が、後の問題を考慮しない形で行われ、やり直しになります。","すでに特定できている問題を伝えず、見落としの余地を残します。","互いに関係する修正を、分離したコンテキストで行うことになり、整合しなくなります。"],"lv":2},{"sc":2,"d":3,"s":"3.4","q":"通知の機能を、新しいメッセージキューに移行するために、プランモードで、計画を作成させました。提示された計画は、全体としては妥当ですが、来月に廃止が決まっている、社内の古い認証のライブラリを、使う前提になっています。Claude は、この廃止の予定を、知りません。この時点での対応として、最も適切なものはどれですか。","o":["計画を承認したうえで、実装の途中で、該当の箇所に差しかかった時点で、ライブラリの変更を伝える","計画を承認して、実装を進めさせる。古いライブラリを使っている箇所は、実装が完了した後に、まとめて置き換えを依頼する","実装に進む前に、廃止の予定と、代わりに使うライブラリを伝えて、計画を修正させる","計画を承認したうえで、廃止の予定を、CLAUDE.md に追記する。実装の途中で、Claude が、CLAUDE.md を参照して、気づくことを期待する"],"a":[2],"e":"プランモードの利点は、コードを変更する前に、方針を確認して、修正できることです。計画に、誤った前提があることが分かったのであれば、実装に進む前に、必要な情報を伝えて、計画を修正させます。実装の後や、途中で伝えると、古い前提に基づいて書かれたコードの、手戻りが発生します。妥当な部分まで含めて、計画の全体を破棄する必要は、ありません。","w":["それまでのコードが、古い前提で書かれており、手戻りになります。","誤った前提のコードが書かれた後の、手戻りになります。",null,"承認された計画は、古いライブラリを前提にしており、計画そのものを、修正する必要があります。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"ある機能の実装に入る前に、Claude Code で、関連するコードを、1時間ほど調査しました。多数のファイルの読み込みと、検索の結果によって、コンテキストの使用量が、上限に近づいています。調査で分かった重要な点は、変更すべき3つのファイルと、守るべき2つの制約です。これから、同じセッションで、実装を始めます。この時点での対応として、最も適切なものはどれですか。","o":["変更すべきファイルと、守るべき制約を残すように指示して、`/compact` で、コンテキストを圧縮してから、実装を始める","調査で読み込んだファイルを、すべて、もう一度読み込ませて、内容を、確実に把握させてから、実装を始める","`/clear` で、コンテキストを消去してから、実装を依頼する。調査の結果は、Claude が、記憶している","そのまま、実装を始める。上限に達した時点で、自動的に圧縮が行われるため、事前の対応は、必要ない。自動の圧縮は、重要な内容を優先して残すように、設計されている"],"a":[0],"e":"調査から、実装に移る区切りは、コンテキストを整理する、良い機会です。`/compact` は、会話を要約して、コンテキストを圧縮します。その際に、何を残すべきかを指示すれば、重要な発見を、保持したまま、探索の途中経過を、取り除けます。`/clear` は、会話を、すべて消去するため、調査の結果も、失われます。上限まで待つと、圧縮が、実装の途中で行われて、何が残るのかを、制御できません。","w":[null,"コンテキストの使用量が、さらに増えます。","調査の結果も、すべて失われます。","圧縮が、実装の途中で行われて、残る内容を制御できません。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"開発者が、午前中に、同じセッションで、認証のバグの修正を行いました。午後から、まったく関係のない、帳票の PDF の出力のレイアウトの調整を、始めようとしています。セッションには、午前の作業で読み込んだ、認証に関する多数のファイルと、試行錯誤の履歴が、残っています。午後の作業の始め方として、最も適切なものはどれですか。","o":["`/clear` で、コンテキストを消去するか、新しいセッションを開始してから、午後の作業を始める","同じセッションで、そのまま、午後の作業を始める。Claude が、プロジェクトの全体に、慣れているため、効率がよい","同じセッションで、「午前の認証の話は、忘れてください」と入力してから、午後の作業を始める","`/compact` で、午前の作業を要約してから、午後の作業を始める"],"a":[0],"e":"関係のない作業に移るときは、コンテキストを、消去します。前の作業の履歴は、新しい作業には、役に立たず、コンテキストを消費して、無関係な内容が、判断に影響することもあります。`/compact` は、関連する作業を続ける場合に、要点を残して圧縮するための機能です。関係のない作業では、要約を残す意味が、ありません。「忘れてください」と入力しても、履歴は、コンテキストに残ります。","w":[null,"無関係な履歴が、コンテキストを消費して、判断に影響します。","入力しても、履歴は、コンテキストに残ります。","無関係な作業の要約を残す意味が、ありません。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"自動生成された、約18,000行の API クライアントのファイルがあります。開発者は、その中の、`createInvoice` という関数の、引数の型だけを、確認したいと考えています。Claude に、「このファイルを読んで、`createInvoice` の引数を教えて」と依頼したところ、ファイルの全体が読み込まれて、コンテキストの大半が、消費されました。より適切な進め方はどれですか。","o":["ファイルの読み込みを、Explore サブエージェントに委任して、`createInvoice` の引数の型だけを、報告させる","ファイルの全体を読み込ませた後に、`/compact` で、コンテキストを圧縮する","コンテキストウィンドウが、より大きいモデルに切り替えて、同じ依頼を行う","Grep で、関数の定義の位置を特定して、その前後の範囲だけを、Read で読み込ませる"],"a":[3],"e":"大きなファイルの、一部だけが必要な場合は、全体を読み込む必要は、ありません。Grep で、目的の箇所の位置を特定して、Read で、その範囲だけを読み込みます。これにより、コンテキストの消費を、必要な分だけに抑えられます。全体を読み込んでから圧縮する方法は、一時的に、大量のコンテキストを消費して、上限に達するおそれもあります。","w":["メインのコンテキストは守られますが、サブエージェントの側では、ファイルの全体が読み込まれます。1つの関数の確認には、過剰です。","一時的に大量のコンテキストを消費して、上限に達するおそれがあります。","不要な内容で、コンテキストを消費する点は、変わりません。",null],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"決済のモジュールのリファクタリングを、長いセッションで進めています。セッションの最初に、開発者は、「外部に公開している関数のシグネチャは、変更しないこと。ほかの5つのサービスが、依存している」と伝えました。2時間後、Claude は、内部の整理の一環として、公開している関数の、引数の順序を、変更しました。この制約は、今後の、このモジュールのすべての作業にも、当てはまります。再発を防ぐ方法として、最も適切なものはどれですか。","o":["リファクタリングを、30分以内の、短いセッションに分けて、セッションごとに、制約を、口頭で伝え直す","セッションの最初に伝える制約を、すべて大文字で入力して、強調する","制約を、該当のモジュールの CLAUDE.md、または、対象のパスを指定したルールに、記述する","セッションの途中で、30分ごとに、同じ制約を、もう一度入力する"],"a":[2],"e":"長いセッションでは、会話の初期に伝えた制約が、薄れることがあります。今後の作業にも当てはまる、恒久的な制約は、会話の中ではなく、CLAUDE.md や、ルールのファイルに記述します。これらは、セッションの長さに関係なく、読み込まれます。該当のモジュールに置けば、ほかの開発者や、将来のセッションにも、適用されます。会話の中での繰り返しは、手間がかかり、ほかの開発者には、伝わりません。","w":["手間がかかり、伝え忘れも起こります。","強調しても、長いセッションで薄れることは、変わりません。",null,"手間がかかり、ほかの開発者や、将来のセッションには、伝わりません。"],"lv":2},{"sc":2,"d":1,"s":"1.6","q":"開発者が、「ユーザーの招待の機能を、データベースのスキーマ、API、メールの送信、管理画面まで、すべて実装して」と、1つのプロンプトで依頼しました。Claude は、40分かけて、多数のファイルを生成しましたが、テストを実行すると、スキーマと API の間で、フィールドの名前が食い違っており、多くのテストが失敗しました。どこから直すべきかの判断も、難しい状態です。進め方の見直しとして、最も適切なものはどれですか。","o":["同じ依頼を、プランモードで行って、全体の計画を承認してから、すべての部分を、一度に実装させる","失敗したテストの一覧を、すべて貼り付けて、「全部直して」と依頼する","機能を、スキーマ、API、メール、管理画面のような、検証できる段階に分ける。各段階で、テストが成功することを確認してから、次に進む","同じプロンプトに、「各部分の整合性を、必ず確認すること」と追記して、もう一度、全体を生成させる。1回で生成するほうが、全体の設計が一貫するため、整合性が高くなる"],"a":[2],"e":"大きな機能を、1回で実装させると、誤りが、互いに絡み合って、原因の特定が、難しくなります。機能を、それぞれ検証できる段階に分けて、1つの段階が、正しく動作することを確認してから、次に進みます。こうすれば、誤りは、小さな範囲にとどまり、後の段階は、検証済みの土台の上に、構築できます。整合性の確認を指示しても、1回で全体を生成する構造は、変わりません。","w":["計画は整いますが、実装を一度に行うかぎり、誤りが絡み合って、原因の特定が難しいことは、変わりません。","誤りが絡み合っており、修正が、別の失敗を生みやすくなります。",null,"1回で全体を生成する構造は、変わりません。"],"lv":2},{"sc":2,"d":1,"s":"1.3","q":"互いに依存していない、3つのモジュール（`billing`、`inventory`、`shipping`）について、不足している単体テストを、追加します。メインのセッションでは、すでに、共通のテストの規約と、モックの作り方を、確認済みです。作業を速く進めるために、3つのサブエージェントに、並列に委任しようとしています。委任の方法として、最も適切なものはどれですか。","o":["3つのサブエージェントのすべてに、3つのモジュールの全体を担当させて、最も良い結果を、採用する","並列の委任はやめて、メインのセッションで、3つのモジュールを、1つずつ、順番に処理する","各サブエージェントに、「担当のモジュールのテストを書いて」とだけ伝える。規約とモックの作り方は、メインのセッションの履歴から、自動的に引き継がれる","各サブエージェントへのプロンプトに、担当のモジュール、テストの規約、モックの作り方、完了の条件を含める"],"a":[3],"e":"サブエージェントは、独立したコンテキストで動作して、メインのセッションの履歴を、引き継ぎません。そのため、作業に必要な情報は、委任のプロンプトに、明示的に含める必要があります。担当の範囲、規約、モックの作り方、完了の条件を伝えれば、互いに独立した作業を、並列に進められます。メインのセッションで、順番に処理することも可能ですが、並列化の利点と、コンテキストの分離の利点を、得られません。","w":["同じ作業を3倍行うことになり、コストが無駄になります。","並列化と、コンテキストの分離の利点を、得られません。","サブエージェントは、メインのセッションの履歴を、引き継ぎません。",null],"lv":2},{"sc":2,"d":3,"s":"3.1","q":"リポジトリには、設計の方針をまとめた `docs/architecture.md`（約300行）があり、設計の担当者が、随時、更新しています。Claude Code にも、この方針を守らせるために、開発者が、その内容を、CLAUDE.md に、そのまま複製しました。3か月後、`docs/architecture.md` は、4回改訂されましたが、CLAUDE.md の中の複製は、古いままで、Claude Code は、廃止された方針に沿ったコードを、生成しています。最も適切な見直しはどれですか。","o":["CLAUDE.md の中の複製を削除して、`@docs/architecture.md` のように、元のファイルを参照する。内容の管理は、元のファイルの1か所で行う","CLAUDE.md の中の複製を削除して、開発者が、設計に関わる作業のたびに、`docs/architecture.md` を読むよう、Claude Code に、その都度、依頼する","`docs/architecture.md` を改訂するたびに、同じ変更を、CLAUDE.md の中の複製にも反映する、という手順を、チームの決まりとして定める","CLAUDE.md の中の複製を、`.claude/rules/architecture.md` に移す。ルールのファイルは、もとの文書が更新されると、自動的に同期される"],"a":[0],"e":"同じ内容を、2か所に複製すると、一方だけが更新されて、内容が食い違います。CLAUDE.md では、`@` に続けてパスを記述することで、ほかのファイルを、参照として取り込めます。元のファイルを参照すれば、内容の管理は、1か所で済み、Claude Code は、常に、最新の内容を読み込みます。手作業で、両方を更新する決まりは、いずれ、守られなくなります。","w":[null,"依頼を忘れると、方針が参照されません。","手作業での二重の管理であり、いずれ、更新が漏れます。","ルールのファイルに、自動の同期の仕組みは、ありません。複製による二重の管理が、残ります。"],"lv":2},{"sc":2,"d":3,"s":"3.1","q":"ある開発者が、Claude Code が、検証の環境へのデプロイを、自動で行えるようにするために、リポジトリの CLAUDE.md に、デプロイの手順とともに、クラウドのアクセスキーと、データベースの管理者のパスワードを、そのまま記載して、コミットしました。リポジトリは、社内の約200人が、閲覧できます。最も適切な対応はどれですか。","o":["アクセスキーとパスワードを、CLAUDE.md から、`.claude/settings.json` に移して、コミットする。設定のファイルであれば、認証の情報を記載しても、問題はない","CLAUDE.md には、手順と、認証の情報の取得の方法だけを記載する。認証の情報そのものは、シークレットの管理の仕組みや、環境変数で渡して、漏えいしたものは、無効にする","CLAUDE.md の該当の行を削除する。履歴には残るが、最新の版には含まれなくなるため、アクセスキーとパスワードは、そのまま使い続ける","アクセスキーとパスワードを、Base64 でエンコードしてから、CLAUDE.md に記載する。そのままの文字列では、なくなるため、閲覧されても、問題はない"],"a":[1],"e":"CLAUDE.md は、リポジトリにコミットされて、閲覧できる全員に共有されます。また、内容は、モデルのコンテキストにも、読み込まれます。認証の情報を、記載する場所では、ありません。CLAUDE.md には、手順や、規約を記載して、認証の情報は、シークレットの管理の仕組みや、環境変数で渡します。すでに、コミットされた認証の情報は、履歴に残るため、無効にして、再発行します。","w":["設定のファイルも、コミットされれば、同じように共有されます。",null,"履歴に残った認証の情報は、有効なままです。","エンコードは、容易に元に戻せます。"],"lv":2},{"sc":2,"d":3,"s":"3.2","q":"チームは、データベースのマイグレーションを、安全に作成するための手順を、スキルとして用意しました。スキルの説明（description）は、「データベース関連」です。開発者が、「ユーザーのテーブルに、列を追加するマイグレーションを書いて」と依頼しても、Claude は、このスキルを使わずに、一般的な方法で、マイグレーションを作成することが、多くあります。開発者が、スキルを、名前で明示的に呼び出した場合は、正しく動作します。最も適切な改善はどれですか。","o":["スキルの説明を、何をするためのものか、どのような依頼のときに使うのかが分かるように、具体的に書き直す","スキルの内容を、すべて CLAUDE.md に移して、常に読み込まれるようにする。スキルを選ぶかどうかの判断が、不要になる","スキルの本文の手順を、より詳しく、より長く書き直す。手順が充実していれば、Claude が、スキルを選ぶようになる","スキルのフロントマターに、`disable-model-invocation: true` を指定して、マイグレーションの依頼のときに、スキルが、確実に読み込まれるようにする"],"a":[0],"e":"Claude は、スキルの説明を手がかりにして、依頼に対して、そのスキルを使うかどうかを、判断します。「データベース関連」という説明では、どのような依頼のときに使うのかが、伝わりません。何をするためのスキルか、どのような依頼で使うのかを、具体的に記述します。本文は、スキルが選ばれた後に、読み込まれるため、本文を充実させても、選ばれるかどうかには、影響しません。","w":[null,"マイグレーション以外の作業でも、常に読み込まれて、コンテキストを消費します。","本文は、スキルが選ばれた後に読み込まれるため、選択には影響しません。","この指定は、Claude による自動の読み込みを、止めるものであり、逆の効果になります。"],"lv":2},{"sc":2,"d":3,"s":"3.2","q":"ある開発者が、プルリクエストの説明文を、チームの書式に沿って作成する、便利なコマンドを、自分の環境の `~/.claude/commands/` に作りました。チームのほかのメンバーも、同じコマンドを使いたいと考えています。新しく参加するメンバーも、リポジトリを取得するだけで、追加の作業なしに、使えるようにしたいと考えています。最も適切な方法はどれですか。","o":["コマンドのファイルを、リポジトリの README に、コードとして掲載して、必要なメンバーが、複製して使えるようにする","コマンドの定義を、リポジトリの `.claude/config.json` の、`commands` の配列に登録して、コミットする","コマンドの内容を、リポジトリの CLAUDE.md に、文章として記載する。すべてのセッションで、常に読み込まれるため、いつでも、同じ書式で作成できる","コマンドのファイルを、リポジトリの `.claude/commands/` に置いて、コミットする。リポジトリを取得した全員が、同じコマンドを使える"],"a":[3],"e":"コマンドには、適用の範囲があります。`~/.claude/commands/` に置いたコマンドは、その開発者だけが、使えます。リポジトリの `.claude/commands/` に置いて、コミットすれば、リポジトリを取得した全員が、追加の作業なしに、同じコマンドを使えて、更新も、バージョン管理で共有されます。CLAUDE.md に記載すると、プルリクエストとは関係のない作業でも、常に読み込まれます。","w":["手作業の複製であり、更新が反映されません。","そのような設定の仕組みは、存在しません。","関係のない作業でも、常に読み込まれて、コンテキストを消費します。",null],"lv":2},{"sc":2,"d":3,"s":"3.3","q":"TypeScript のコードに適用する規約を、`.claude/rules/typescript.md` に記述して、フロントマターの `paths` に、`src/*.ts` と指定しました。`src/index.ts` を編集するときは、規約が適用されますが、`src/services/billing/invoice.ts` のような、下の階層のファイルを編集するときは、適用されません。原因と対処として、最も適切なものはどれですか。","o":["ルールのファイルは、リポジトリの直下のディレクトリにしか、適用されない仕様である。下の階層のディレクトリには、それぞれ、CLAUDE.md を配置する","ルールの内容が、長すぎることが、原因である。規約を、半分の長さに削って、下の階層でも、読み込まれるようにする","ルールのファイルの名前が、原因である。ファイルの名前を、`typescript.md` から、`rules.md` に変更する","パターンが、`src/` の直下のファイルにしか、一致していない。下の階層も対象にするよう、`src/**/*.ts` のようなパターンに修正する"],"a":[3],"e":"`paths` に指定するのは、glob のパターンです。`src/*.ts` は、`src/` の直下の `.ts` のファイルにだけ、一致します。下の階層のディレクトリにあるファイルも、対象にするには、`**` を使って、`src/**/*.ts` のように指定します。ルールが、適用されない場合は、まず、パターンが、対象のファイルに一致しているかを、確認します。","w":["そのような仕様はなく、パターンを修正すれば、適用されます。","内容の長さは、適用の範囲と、関係がありません。","ファイルの名前は、適用の範囲と、関係がありません。",null],"lv":2},{"sc":2,"d":3,"s":"3.5","q":"開発者が、「ビルドが動かないので、直して」と、Claude Code に依頼しました。Claude は、設定ファイルを調べて、もっともらしい修正を、いくつか行いましたが、問題は、解消しませんでした。同じやり取りが、3回続いています。開発者の端末には、ビルドを実行したときの、具体的なエラーのメッセージ（依存するライブラリの、バージョンの不一致を示すもの）が、表示されていますが、Claude には、伝えていません。最も効果的な進め方はどれですか。","o":["モデルを、より上位のものに切り替えて、同じ依頼を、もう一度行う。上位のモデルは、原因を、より正確に推測できる","プランモードに切り替えて、ビルドの設定の全体について、修正の計画を、立てさせる","設定ファイルを、すべて、プロジェクトを作成した時点の状態に戻して、Claude に、最初から設定を作り直させる","ビルドのコマンドと、実際のエラーのメッセージの全文を渡す。あるいは、Claude に、ビルドを実行させて、エラーを、直接確認させる"],"a":[3],"e":"「動かない」という情報だけでは、原因は、分かりません。Claude は、可能性のある原因を、推測するしかなく、的外れな修正を、繰り返すことになります。実際のエラーのメッセージは、原因を特定するための、最も直接的な手がかりです。エラーの全文を渡すか、Claude 自身に、コマンドを実行させて、エラーを確認させます。依頼の表現を強めても、モデルを変えても、手がかりがないことは、変わりません。","w":["手がかりがなければ、どのモデルも、推測するしかありません。","エラーの内容という、手がかりがないまま、計画を立てても、原因には、たどり着けません。","原因が分からないまま、動作していた設定まで、失うことになります。",null],"lv":2},{"sc":2,"d":3,"s":"3.5","q":"開発者が、CSV の取り込みの処理の実装を依頼すると、Claude Code は、コードを書いて、「実装が完了しました」と報告します。しかし、実際に動かすと、文字コードの扱いや、空行の処理で、誤りが見つかることが、たびたびあります。開発者は、そのたびに、手作業で動作を確認して、誤りを指摘しています。リポジトリには、サンプルの CSV と、テストを実行するコマンドがあります。最も効果的な改善はどれですか。","o":["実装を、2回、別々に依頼して、2つのコードを、開発者が見比べる。食い違っている箇所に、誤りがあると、判断できる","サンプルの CSV と、テストのコマンドを伝えて、実装の後に、Claude 自身に、実行して確認させる","依頼に、「誤りのないコードを、書くこと。完了を報告する前に、よく見直すこと」という一文を、加える","実装の後に、独立したサブエージェントに、コードをレビューさせて、指摘がなければ、完了とする"],"a":[1],"e":"Claude Code は、自分の作業を、検証する手段が与えられると、品質が、大きく向上します。テストのコマンドや、サンプルのデータ、期待する結果を伝えれば、Claude は、実装の後に、実際に実行して、失敗を見つけて、修正できます。「よく見直すこと」という指示は、コードを読み返すだけであり、実際の動作の確認には、なりません。","w":["手間が2倍になり、2つとも、同じ誤りを含むことがあります。",null,"読み返すだけであり、実際の動作の確認には、なりません。","レビューは、コードを読むだけであり、実際に動かしたときの、文字コードや、空行の誤りを、見逃すことがあります。"],"lv":2},{"sc":2,"d":3,"s":"3.1","q":"プロジェクトの CLAUDE.md は、2年間、追記が重ねられて、約900行になりました。内容には、すでに使われていないライブラリの注意点、「読みやすいコードを書くこと」のような一般的な心得、同じ規約の重複した記述が、多く含まれています。最近、Claude Code が、CLAUDE.md に記載された重要な規約（「金額は、必ず整数で扱う」）を、守らないことが、増えてきました。最も適切な対応はどれですか。","o":["CLAUDE.md の全文を、1つのスキルに移して、開発者が、作業の最初に、そのスキルを呼び出す","古い内容、一般的な心得、重複を取り除いて、このプロジェクトに固有の、実際に必要な事項に絞る。場面が限られる内容は、ルールや、スキルに分ける","重要な規約の前に、「最重要」という見出しを付けて、同じ規約を、CLAUDE.md の冒頭と、末尾にも、繰り返して記載する","CLAUDE.md を、そのまま維持して、Claude Code に、作業のたびに、「CLAUDE.md を、最初から最後まで、注意深く読むこと」と依頼する"],"a":[1],"e":"CLAUDE.md が、長くなりすぎると、重要な規約が、不要な内容の中に埋もれて、守られにくくなります。CLAUDE.md は、簡潔に保って、このプロジェクトに固有の、実際に必要な事項に、絞ります。一般的な心得は、記載しなくても、Claude は、すでに従います。特定の場面でだけ必要な内容は、パスを指定したルールや、スキルに分けます。強調や、繰り返しを足すと、さらに長くなります。","w":["呼び出しを忘れると、規約が適用されず、不要な内容が多いという原因も、残ります。",null,"さらに長くなり、強調が増えるほど、効果が薄れます。","毎回の依頼が必要になり、埋もれているという原因も、残ります。"],"lv":2},{"sc":2,"d":3,"s":"3.5","q":"認証の処理の整理を、Claude Code に依頼しました。作業の途中で、開発者は、Claude が、意図していた「トークンの検証の関数を、1つにまとめる」ことではなく、「セッションの管理の方式を、全面的に変更する」方向に進んでおり、すでに、6つのファイルを、書き換えていることに、気づきました。最初の依頼は、「認証まわりを、きれいにして」でした。この時点での対応として、最も適切なものはどれですか。","o":["作業は中断せずに、「それは違います。トークンの検証の関数だけを、まとめてください」と伝えて、現在の変更の上から、修正させる","作業を中断して、変更を、作業の前の状態に戻す。目的と範囲を、具体的に伝え直してから、やり直す","作業を、最後まで続けさせる。完了した後に、意図と異なる部分を、まとめて指摘して、元に戻させる","作業は、最後まで続けさせる。完了した後に、`/compact` で、会話を圧縮してから、意図していた作業を、あらためて依頼する"],"a":[1],"e":"誤った方向に進んでいることに気づいた場合は、早い段階で中断するほうが、手戻りが、小さくなります。すでに行われた、意図と異なる変更は、作業の前の状態に戻します。そのうえで、曖昧だった依頼を、目的と範囲が明確なものに改めて、やり直します。意図と異なる変更の上から、修正を重ねると、不要な変更が、コードに残ります。","w":["意図と異なる変更が、コードに残ったまま、修正が重なります。",null,"不要な変更が、さらに積み重なって、手戻りが大きくなります。","圧縮は、コードを元に戻しません。意図と異なる変更が、コードに残ったままになります。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"約40万行の、大規模なリポジトリで、開発者が、新しいセッションを始めるたびに、Claude Code は、ディレクトリの構成や、主要なモジュールの役割を把握するために、多数の検索と、ファイルの読み込みを行っています。本題の作業に入る前に、コンテキストの約3割を、消費しており、同じ探索が、セッションのたびに、繰り返されています。リポジトリの構成は、安定しています。最も適切な改善はどれですか。","o":["セッションの最初に、リポジトリの全ファイルを、順番に読み込ませる。全体を、一度把握させておけば、その後の探索が、不要になる","主要なディレクトリと、モジュールの役割、入口となるファイルをまとめた、簡潔な構成の案内を、CLAUDE.md に記載する","セッションのたびに、最初に、Explore サブエージェントに、リポジトリの全体の構成を、調査させて、要約を受け取る","コンテキストウィンドウが、より大きいモデルに切り替える。探索に、コンテキストの約3割を使っても、本題の作業に、十分な余裕が残る"],"a":[1],"e":"安定した構成の情報を、セッションのたびに、探索によって、把握し直すことは、無駄です。主要なディレクトリと、モジュールの役割をまとめた、簡潔な案内を、CLAUDE.md に記載しておけば、セッションの開始のときに、読み込まれて、Claude は、必要な場所に、直接向かえます。全ファイルを読み込ませると、コンテキストを、使い切ります。","w":["コンテキストを、使い切ります。",null,"メインのコンテキストは守られますが、同じ探索を、セッションのたびに繰り返すコストは、残ります。","同じ探索を、毎回繰り返す無駄は、残ります。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"数時間にわたる、移行の作業のセッションで、コンテキストが、上限に近づいたために、自動の圧縮が、2回行われました。2回目の圧縮の後、Claude Code は、すでに移行を終えた、3つのモジュールを、もう一度、移行しようとして、途中で決めた、エラーの処理の方針とも、異なるコードを、生成し始めました。圧縮の後の要約には、「いくつかのモジュールを、移行した」とだけ、記載されていました。最も適切な対策はどれですか。","o":["圧縮が行われるたびに、開発者が、それまでの作業の内容を、記憶を頼りに、会話の中で、説明し直す","圧縮の後の要約を、より長くするよう、設定を変更する。要約が長ければ、モジュールの一覧も、方針も、残る","自動の圧縮を、無効にして、コンテキストが、上限に達した時点で、作業を終了する。残りの作業は、新しいセッションで、最初から計画し直す","移行を終えたモジュールの一覧と、決定した方針を、作業の進行に合わせて、ファイルに記録させる。圧縮の後や、再開のときは、まず、そのファイルを読ませる"],"a":[3],"e":"長い作業では、圧縮を越えて、保持すべき情報があります。進捗（どのモジュールを、移行したか）と、決定した方針は、会話の中にだけ置くのではなく、ファイルに記録しておきます。圧縮の後に、そのファイルを読ませれば、状態を、確実に引き継げます。要約を長くしても、要約である以上、細部が失われる可能性は、残ります。開発者の記憶に頼る方法は、手間がかかり、漏れも生じます。","w":["手間がかかり、説明の漏れも生じます。","要約である以上、細部が失われる可能性は、残ります。","それまでの進捗と方針が、引き継がれません。",null],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"キャッシュの層の設計について、開発者は、セッションの前半で、「Redis を使う」という方針で、Claude Code と、詳しく議論しました。その後、要件の変更によって、「アプリケーションの中の、メモリ上のキャッシュを使う」という方針に、変更しました。セッションの後半で、Claude は、Redis への接続を前提としたコードを、ふたたび生成しました。会話の履歴には、Redis についての議論が、新しい方針よりも、はるかに多く、残っています。最も適切な対応はどれですか。","o":["`/compact` を実行して、会話を圧縮する。圧縮によって、Redis についての議論が、取り除かれる","「Redis のことは、すべて忘れてください」と入力して、同じセッションで、作業を続ける","現在の方針と、決定の理由を、簡潔にまとめる。古い議論を引き継がない、新しいセッションで、その要約から、作業を続ける","Redis を前提としたコードが生成されるたびに、「Redis は使いません」と指摘して、その都度、修正させる"],"a":[2],"e":"会話の履歴に、廃止された方針についての議論が、大量に残っていると、その内容が、後の生成に、影響し続けます。指摘のたびに、修正させることはできますが、同じ問題が、繰り返されます。現在の方針と、理由を、簡潔にまとめて、古い議論を含まない、新しいセッションで続けるほうが、確実です。「忘れてください」と入力しても、履歴は、コンテキストに残ります。","w":["要約には、分量の多い Redis の議論が、反映されやすく、古い方針が、残るおそれがあります。","入力しても、履歴は、コンテキストに残ります。",null,"古い議論が、履歴に残っており、同じ問題が、繰り返されます。"],"lv":2},{"sc":2,"d":5,"s":"5.4","q":"Claude Code に、ある設定の値の利用箇所を、調べさせると、検索の結果の大半が、`node_modules/`、`dist/`、`coverage/` といった、依存関係や、ビルドの成果物のディレクトリのもので、占められます。Claude は、それらのファイルを、いくつも読み込んで、コンテキストを消費した後に、ようやく、ソースコードの中の、該当の箇所に、たどり着きます。最も適切な改善はどれですか。","o":["依存関係と、ビルドの成果物のディレクトリを、検索と読み込みの対象から外すように、設定する","検索のたびに、開発者が、「`node_modules/` などは、無視してください」と、会話の中で伝える","検索を、Explore サブエージェントに委任して、ソースコードの中の、該当の箇所だけを、報告させる","検索の結果を、すべて読み込めるように、コンテキストウィンドウが、より大きいモデルに、切り替える"],"a":[0],"e":"依存関係や、ビルドの成果物は、通常、調査の対象では、ありません。これらが、検索の結果に含まれると、無関係な情報で、コンテキストを消費します。検索と読み込みの対象から外すように設定して、ソースコードの場所を、CLAUDE.md に記載すれば、Claude は、関係のある場所だけを、調べられます。会話の中で、毎回伝える方法は、手間がかかり、伝え忘れも起こります。","w":[null,"手間がかかり、伝え忘れも起こります。","メインのコンテキストは守られますが、無関係なディレクトリを検索する無駄は、サブエージェントの側に残ります。","無関係な情報で、コンテキストを消費する点は、変わりません。"],"lv":2},{"sc":2,"d":1,"s":"1.6","q":"注文の処理のモジュールを、3つの小さなモジュールに分割する、リファクタリングを、計画に沿って進めています。計画は、「在庫、決済、通知の順に、切り出す」というものでした。在庫のモジュールを切り出している途中で、Claude Code は、在庫と決済の間に、互いを呼び出し合う、循環した依存があり、計画のとおりには、切り出せないことを、発見しました。この時点での進め方として、最も適切なものはどれですか。","o":["発見した依存関係を踏まえて、計画を見直す。たとえば、先に、共通の部分を切り出して、循環を解消してから、分割を進める","計画は、開始の前に合意したものであるため、変更しない。循環した依存は、一時的な回避のコードを追加して、計画のとおりの順序で、切り出しを続ける","循環した依存の解消は、別の課題として記録する。今回は、在庫の切り出しを省略して、決済と通知だけを、計画のとおりに切り出す","循環した依存は、気にせずに、3つのモジュールを、同時に切り出す。同時に行えば、順序の問題は、発生しない"],"a":[0],"e":"作業の途中で、計画の前提と異なる事実が見つかった場合は、計画を、見直します。計画は、その時点の理解に基づいたものであり、新しい発見に応じて、適応させるものです。この例では、循環した依存を、先に解消する手順を、計画に加えます。一時的な回避のコードで、計画を押し通すと、不要な複雑さが、コードに残ります。","w":[null,"回避のコードによる複雑さが、コードに残ります。","決済も、在庫との循環した依存に含まれており、同じ問題に、突き当たります。","循環した依存は、同時に切り出しても、解消されません。"],"lv":2},{"sc":2,"d":1,"s":"1.3","q":"作業を速く進めるために、3つのサブエージェントに、それぞれ、「ユーザー」「注文」「商品」の API のハンドラーへの、ログの追加を、並列に委任しました。3つとも、作業の中で、共通のログの設定のファイル（`logging.ts`）にも、変更を加えました。結果を統合すると、`logging.ts` への変更が、互いに上書きされて、2つのサブエージェントの変更が、失われていました。委任の方法として、最も適切な見直しはどれですか。","o":["各サブエージェントに、「ほかのサブエージェントの変更を、上書きしないこと」という指示を、委任のプロンプトに追加する","各サブエージェントの担当を、重ならないファイルに限定して、共通のファイルの変更は、1か所にまとめる","並列の委任は、信頼できないため、今後は、すべての作業を、メインのセッションで、1つずつ、順番に行う","3つのサブエージェントに、同じ作業を、もう一度、並列に実行させる。変更が失われなくなるまで、繰り返す"],"a":[1],"e":"並列に実行するサブエージェントは、互いの作業を、知りません。同じファイルを、同時に変更すると、変更が衝突します。並列に委任する作業は、対象のファイルが、互いに重ならないように、分けます。共通のファイルへの変更は、並列の作業の前に、メインのセッションで済ませるか、1か所にまとめて、行います。互いの変更を、上書きしないよう指示しても、サブエージェントは、互いの変更を、見ることができません。","w":["サブエージェントは、互いの変更を、見ることができません。",null,"重ならないように分ければ、並列の利点を、得られます。","同じ衝突が、繰り返されます。"],"lv":2},{"sc":3,"d":1,"s":"1.2","q":"「電気自動車の電池のリサイクルの現状」の調査で、コーディネーターは、3つの検索のサブエージェントの結果を、そのまま連結して、レポート作成のサブエージェントに渡しました。完成したレポートには、「リサイクル率は5%」という記述と、「リサイクル率は50%を超える」という記述が、別の節に、どちらも断定の形で、記載されていました。前者は、世界全体の数値、後者は、特定の国の、回収された電池に限った数値でした。設計の見直しとして、最も適切なものはどれですか。","o":["検索のサブエージェントを、3つから1つに減らす。情報源が1つになるため、数値の食い違いが、発生しなくなるうえ、検索にかかるコストも、3分の1に下げられる","検索の結果を、統合のサブエージェントに渡して、対象の範囲や条件の違いを整理させる。コーディネーターが、その出力を確認してから、レポートの作成に進む","レポート作成のサブエージェントのプロンプトに、「矛盾する記述を、含めないこと」という指示を追加する","レポートの作成の後に、独立したサブエージェントに、矛盾する記述を検出させて、レポート作成のサブエージェントに、修正させる"],"a":[1],"e":"複数のサブエージェントの結果を、そのまま連結しただけでは、見かけ上の矛盾や、重複が、整理されません。検索の結果は、統合の段階で、対象の範囲や、条件の違いを整理して、一貫した理解にまとめる必要があります。コーディネーターは、結果を集約して、品質を確認する役割を持ちます。レポート作成の段階で、矛盾を含めないよう指示しても、どちらが正しいのかを判断する材料が、整理されていません。","w":["調査の幅が失われ、数値の条件の違いも、整理されません。",null,"食い違いの原因が整理されておらず、どちらかが、根拠なく削られるおそれがあります。","矛盾は検出できても、その時点では、数値の対象の範囲の情報が失われており、正しく書き分けられません。"],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"検索のサブエージェントは、見つけた情報を、自然な文章の要約として、コーディネーターに返しています。統合のサブエージェントは、その要約をもとに、知見をまとめますが、最終のレポートでは、主張の約3割について、出典の URL が、欠けているか、別の主張の出典と、入れ替わっていました。調べると、要約の文章の中で、複数の情報源の内容が、1つの段落に、混ぜて書かれていました。最も適切な改善はどれですか。","o":["レポートの作成の後に、別のサブエージェントに、各主張の出典を、Web で検索し直させる","検索のサブエージェントが、要約ではなく、取得したページの全文を、そのまま返すようにする","サブエージェントの間の受け渡しを、主張ごとに、出典の URL、文書名、発行日を対応付けた、構造化された形式にする","統合のサブエージェントのプロンプトに、「すべての主張に、正しい出典を付けること」という指示を追加する。出典の欠落は、統合の段階で起きているためである"],"a":[2],"e":"出典との対応は、エージェントの間で情報を受け渡すたびに、失われやすい情報です。自然な文章の要約では、どの主張が、どの情報源に基づくのかが、曖昧になります。主張と、出典の情報（URL、文書名、発行日）を、構造化された形式で、対応付けて受け渡せば、最終のレポートまで、対応を保てます。統合の段階で指示しても、入力に対応が残っていなければ、正しい出典は、付けられません。","w":["コストがかかるうえに、元の出典と、同じものが見つかるとは限りません。","コンテキストを圧迫して、統合の質が下がります。",null,"入力に対応が残っていなければ、正しい出典は、付けられません。"],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"利用者は、「2023年以降に発表された、査読のある論文に基づいて、睡眠と記憶の関係を調べてほしい」と依頼しました。コーディネーターは、この条件を理解したうえで、検索のサブエージェントに、「睡眠と記憶の関係について、調査すること」というプロンプトで、作業を委任しました。サブエージェントが返した情報源の大半は、2018年以前の記事や、個人のブログでした。原因と対策として、最も適切なものはどれですか。","o":["検索のツールの性能が、不足している。検索のツールを、別の製品に置き換える","サブエージェントの数が、不足している。同じプロンプトで、5つのサブエージェントを、並列に実行することで、条件に合う情報源が、見つかる可能性を高める","サブエージェントは、コーディネーターの会話を引き継がない。期間と、情報源の種類の条件を、委任のプロンプトに明記する","検索のサブエージェントの能力が、不足している。サブエージェントに、より上位のモデルを割り当てる"],"a":[2],"e":"サブエージェントは、コーディネーターの会話の履歴を、自動的には引き継ぎません。サブエージェントが知っているのは、委任のプロンプトに書かれた内容だけです。利用者が指定した、期間や、情報源の種類の条件は、コーディネーターが、委任のプロンプトに、明示的に含める必要があります。モデルや、ツールを変えても、条件が伝わっていなければ、結果は変わりません。","w":["条件が伝わっていなければ、ツールを変えても、結果は変わりません。","同じプロンプトでは、条件を満たさない結果が、5倍に増えるだけです。",null,"条件が伝わっていなければ、モデルを変えても、結果は変わりません。"],"lv":2},{"sc":3,"d":1,"s":"1.2","q":"「Mercury 社の、直近の決算の動向」の調査で、検索のサブエージェントは、同じ名前の、別の業種の企業に関する情報を、大量に収集して返しました。コーディネーターは、その結果を、確認せずに、分析のサブエージェントに渡して、最終のレポートは、2つの企業の情報が、混在したものになりました。コーディネーターの役割として、最も適切な見直しはどれですか。","o":["分析のサブエージェントに、検索のツールを与えて、誤った情報が含まれている場合は、自分で調べ直させる","サブエージェントの結果を、利用者の元の依頼に照らして評価する。対象が誤っている場合は、対象を明確にして、再度委任してから、次の段階に進む","コーディネーターの処理を速くするために、サブエージェントの結果は、内容を読み込まずに、次のサブエージェントに、そのまま転送する。内容の確認は、分析のサブエージェントの役割である","同じ名前の企業が存在する場合は、常に、すべての企業について調査して、レポートに、すべてを記載する"],"a":[1],"e":"コーディネーターは、作業を割り振るだけでなく、サブエージェントの結果を、元の依頼に照らして評価する役割を持ちます。結果が、依頼の対象と合っていない場合は、対象を明確にして、再度委任します。結果を、評価せずに、次の段階に渡すと、誤りが、後の段階に伝播して、修正が難しくなります。対象の企業が、どれなのかが不明な場合は、利用者に確認することも、選択肢です。","w":["役割を超えたツールを与えることになり、誤りの検知も、分析の段階に依存します。",null,"誤りが、後の段階に伝播します。","利用者が求めていない情報が大量に含まれ、コストも増えます。"],"lv":2},{"sc":3,"d":1,"s":"1.6","q":"利用者から、「量子誤り訂正の、実用化に向けた課題」という、コーディネーターが、どのような論点があるのかを、事前には把握しにくいテーマの調査を、依頼されました。現在のコーディネーターは、依頼を受けると、すぐに、5つのサブトピックを決めて、サブエージェントに、並列に委任します。このテーマでは、決めたサブトピックの2つが、的外れで、重要な論点が、3つ抜けていました。分解の方法として、最も適切な見直しはどれですか。","o":["サブトピックの数を、5つから15に増やす。数を増やすことで、重要な論点が、抜ける可能性が低くなる","まず、テーマの全体を俯瞰する、短い予備の調査を行う。その結果に基づいて、サブトピックを決めて、調査の途中でも、必要に応じて、見直す","どのテーマにも使える、固定の5つのサブトピック（背景、現状、課題、事例、展望）を、あらかじめ定義しておく。分解の結果が、毎回安定して、抜けも起こりにくくなる","サブトピックへの分解をやめて、1つのサブエージェントに、テーマの全体を、調査させる"],"a":[1],"e":"不慣れなテーマでは、事前に決めた分解が、的外れになることがあります。まず、全体を俯瞰する、予備の調査を行って、どのような論点があるのかを把握してから、分解します。さらに、調査の途中で、新しい論点が見つかれば、計画を見直します。数を増やすだけでは、的外れなサブトピックも増えて、コストが無駄になります。固定の分類は、テーマに固有の論点を、捉えられません。","w":["的外れなサブトピックも増えて、コストが無駄になります。",null,"テーマに固有の重要な論点を、捉えられません。","コンテキストが、途中経過で埋まり、並列化の利点も失われます。"],"lv":2},{"sc":3,"d":1,"s":"1.2","q":"コーディネーターには、サブエージェントを起動するための `Task` に加えて、Web 検索と、文書の取得のツールも、与えられています。ログを確認すると、コーディネーターは、委任の前に、自分で、20回以上の検索と、文書の取得を行っており、サブエージェントに委任する時点で、すでに、コンテキストの大半を、消費していました。その結果、サブエージェントの結果の統合と、評価の質が、下がっています。最も適切な見直しはどれですか。","o":["コーディネーターのツールを、委任と調整に必要なものに限定する。検索と、文書の取得は、サブエージェントだけに与える","コーディネーターの検索の回数に、5回という上限を、フックで設ける。上限に達した後は、サブエージェントに委任させる","コーディネーターのシステムプロンプトに、「検索は、できるだけ、サブエージェントに任せること」という指示を追加する","コーディネーターを、コンテキストウィンドウが、より大きいモデルに変更する"],"a":[0],"e":"コーディネーターの役割は、作業の分解、委任、結果の統合と評価です。詳細な検索を、自分で行うと、その途中経過で、コンテキストが埋まり、本来の役割の質が、下がります。エージェントに与えるツールは、その役割に必要なものに、限定します。検索のツールを与えなければ、コーディネーターは、委任せざるを得ません。プロンプトでの指示は、傾向を変えるだけで、確実ではありません。","w":[null,"消費は抑えられますが、コーディネーターが、役割の外の検索を行う構造は、残ります。","傾向は変わりますが、確実ではありません。","途中経過で埋まるという問題は、残ります。"],"lv":2,"g":"試験ガイド v1.0 は、サブエージェントを起動するツールを、`Task` と呼んでいます。現在の Claude Code では、このツールの名前は、`Agent` に変更されています（`Task` は、別名として、引き続き使えます）。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":1,"s":"1.3","q":"処理の時間を短縮するために、コーディネーターが、1回の応答で、2つの検索のサブエージェントと、統合のサブエージェントを、同時に起動するように、変更しました。その結果、統合のサブエージェントは、検索の結果を受け取らないまま、実行されて、一般的な知識だけに基づく、出典のない統合の結果を、返すようになりました。最も適切な修正はどれですか。","o":["すべてのサブエージェントを、1つずつ、順番に起動する構成に、戻す","統合のサブエージェントのプロンプトに、「検索の結果が届くまで、待機すること」という指示を追加する。並列の起動は維持できるため、処理の時間は、短いままである","互いに独立した2つの検索は、並列に起動する。統合は、検索の結果を受け取ってから、その結果を、プロンプトに含めて、起動する","統合のサブエージェントに、検索のツールを与えて、必要な情報を、自分で検索させる"],"a":[2],"e":"並列に実行できるのは、互いに独立した作業だけです。統合は、検索の結果に依存しているため、検索が完了して、その結果を受け取ってから、起動する必要があります。サブエージェントは、ほかのサブエージェントの結果を、自動的には受け取れません。互いに独立した検索どうしは、並列のままにして、依存する段階だけを、後に実行すれば、速度と正しさを、両立できます。","w":["独立した検索を並列に実行する利点まで、失います。","サブエージェントは、ほかのサブエージェントの結果を、待って受け取ることができません。",null,"検索の作業が重複して、役割の分離も失われます。"],"lv":2},{"sc":3,"d":1,"s":"1.4","q":"コーディネーターは、統合の結果に、不足があると判断した場合に、不足している点を、検索のサブエージェントに再度委任して、もう一度、統合を行います。ある調査で、この再委任が、14回繰り返されて、コストが、通常の10倍になりました。ログを確認すると、6回目以降は、新しい情報が、ほとんど得られておらず、コーディネーターは、毎回、ほぼ同じ不足を、指摘していました。最も適切な見直しはどれですか。","o":["不足の有無の判断を、コーディネーターではなく、検索のサブエージェントに、任せる。情報源を直接見ているサブエージェントのほうが、情報の有無を、正確に判断できる","再委任のたびに、検索のサブエージェントの数を、2倍に増やす。より広く検索することで、不足が、早く解消される","再委任の回数に上限を設けて、新しい情報が得られなくなった場合は、打ち切る。埋まらなかった不足は、レポートに明記する","コーディネーターのプロンプトに、「不足は、必ず、すべて解消すること」という指示を追加する"],"a":[2],"e":"評価と再委任の繰り返しは、レポートの網羅性を高めますが、終了の条件がなければ、際限なく続くおそれがあります。回数の上限と、進展がないことの検知を、組み合わせます。公開されている情報源に、存在しない情報は、何度検索しても、得られません。その場合は、不足を埋められなかったことを、レポートに明記します。再委任を廃止すると、解消できる不足まで、残ることになります。","w":["全体の網羅性を評価する役割は、コーディネーターにあります。","公開されている情報源に、存在しない情報は、検索を広げても得られず、コストが、さらに増えます。",null,"存在しない情報を、際限なく探し続けることになります。"],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"4つの検索のサブエージェントが、それぞれ、異なる形式で、結果を返しています。あるものは、箇条書き、あるものは、長い文章、あるものは、表の形式です。統合のサブエージェントは、形式の違いに対応しきれず、表の形式の結果に含まれていた数値を、読み飛ばすことがあります。委任のプロンプトは、「担当のサブトピックについて調査して、結果を報告すること」となっています。最も適切な改善はどれですか。","o":["統合のサブエージェントのプロンプトに、想定される形式のすべてについて、読み取りの方法を、詳しく記載する","委任のプロンプトで、結果の形式（主張、根拠、出典、確からしさなど）を指定して、すべてのサブエージェントに、同じ構造で返させる","コーディネーターが、各サブエージェントの結果を受け取った後に、自分で、共通の形式に書き直してから、統合のサブエージェントに渡す","統合のサブエージェントの前に、形式を変換するための、専用のサブエージェントを追加する。役割を分けることで、統合のサブエージェントは、内容の統合に集中できる"],"a":[1],"e":"委任のプロンプトには、調査の対象だけでなく、結果を、どのような形式で返すのかも、含めます。すべてのサブエージェントが、同じ構造で結果を返せば、統合の段階は、形式の違いに、対応する必要がなくなります。下流で、形式の違いを吸収しようとすると、複雑さが増して、読み落としの原因になります。変換のためのサブエージェントは、上流で形式を指定すれば、不要な段階です。","w":["形式の違いを下流で吸収することになり、複雑さと読み落としが残ります。",null,"コーディネーターのコンテキストを消費して、書き直しの際に、数値が失われることもあります。上流で、形式を指定するほうが、単純です。","上流で形式を指定すれば、不要になる段階です。"],"lv":2},{"sc":3,"d":2,"s":"2.3","q":"開発を簡単にするために、4種類のサブエージェント（検索、文書分析、統合、レポート作成）のすべてに、同じ12個のツールを与えています。ログを確認すると、検索のサブエージェントが、調査の途中で、`write_report` を呼び出して、レポートの下書きを書き始めたり、レポート作成のサブエージェントが、執筆の途中で、新たな Web 検索を、何度も行ったりしています。最も適切な見直しはどれですか。","o":["役割以外のツールの呼び出しを、実行の前に呼び出されるフックで検出して、阻止する。ツールの一覧は、全サブエージェントで、共通のままにする","各サブエージェントのシステムプロンプトに、「自分の役割以外のツールは、使用しないこと」という指示を追加する","12個のツールの説明文を、それぞれ、より詳しく書き直して、使うべき場面を明確にする","サブエージェントの種類ごとに、役割に必要なツールだけを与える"],"a":[3],"e":"エージェントは、与えられたツールを、状況に応じて、使おうとします。役割に関係のないツールが与えられていれば、役割を超えた行動を、取ることがあります。サブエージェントの種類ごとに、役割に必要なツールだけを与えれば、役割の範囲は、仕組みとして保たれます。プロンプトでの指示や、説明文の改善は、傾向を変えるだけです。","w":["阻止はできますが、不要なツールが、選択肢として残り、阻止のたびに、無駄なやり取りが生じます。必要なツールだけを与えるほうが、単純です。","指示である限り、確実には守られません。","説明を詳しくしても、役割を超えた利用は、可能なままです。",null],"lv":2},{"sc":3,"d":2,"s":"2.1","q":"検索のサブエージェントには、`search_web`（一般の Web 検索）と、`search_academic`（学術論文のデータベースの検索）の、2つのツールがあります。説明文は、それぞれ、「Web を検索する」「論文を検索する」です。査読のある研究に基づく根拠が必要な質問でも、サブエージェントは、ほとんどの場合、`search_web` だけを使っています。`search_academic` は、査読の有無、発行年、引用数を、結果に含めて返します。最も適切な改善はどれですか。","o":["それぞれの説明文に、対象とする情報、返される内容、適している質問の種類と、使い分けの境界を、具体的に記述する","`search_web` を、ツールの一覧から取り除いて、常に、`search_academic` だけを使わせる","`tool_choice` で、`search_academic` を、常に強制する","システムプロンプトに、「まず、`search_academic` を使い、その後で、`search_web` を使うこと」という、固定の順序を記載する"],"a":[0],"e":"モデルは、ツールの説明文を、主な手がかりとして、どのツールを使うかを判断します。「論文を検索する」という説明だけでは、いつ、こちらを選ぶべきなのかが、伝わりません。対象とする情報、返される内容（査読の有無や発行年）、適している質問の種類、もう一方との使い分けを、具体的に記述します。ツールを取り除いたり、順序を固定したりすると、一般の情報が適している質問に、対応できなくなります。","w":[null,"一般の情報が適している質問に、対応できなくなります。","ほかのツールを使うことも、回答を返すことも、できなくなります。","質問の種類にかかわらず、両方を使うことになり、無駄が生じます。"],"lv":2},{"sc":3,"d":2,"s":"2.2","q":"学術論文のデータベースの API キーが、期限切れになりました。`search_academic` は、この場合、空の配列を、通常の結果として返します。検索のサブエージェントは、「該当する論文は、見つかりませんでした」と報告して、コーディネーターは、「この分野には、査読のある研究が、存在しない」という内容を、レポートに記載しました。ツールの設計として、最も適切な見直しはどれですか。","o":["空の結果が返った場合は、サブエージェントが、検索の語句を変えて、5回まで、検索を繰り返す","API キーの期限が切れた場合は、ツールが、例外を送出して、調査の全体を、ただちに終了させる。誤った結論がレポートに記載されることを、確実に防げる","認証の失敗を、該当なしとは区別して、エラーとして返す。エラーの種類と、再試行しても解決しないことを、構造化して示す","認証に失敗した場合は、ツールが、一般の Web 検索の結果を、代わりに返す"],"a":[2],"e":"「検索したが、該当がなかった」ことと、「検索そのものが、実行できなかった」ことは、まったく異なる状況です。同じ空の結果として返すと、エージェントは、区別できず、誤った結論を、導きます。認証の失敗は、エラーとして返して、エラーの種類と、再試行しても解決しないことを、構造化して示します。これにより、コーディネーターは、その情報源が、使えなかったことを、レポートに明記できます。","w":["認証が失敗している限り、何度検索しても、結果は得られません。","ほかの情報源による調査の成果まで、失われます。",null,"学術の情報源が使えなかったことが、隠されます。"],"lv":2},{"sc":3,"d":2,"s":"2.4","q":"調査のチームの全員が、学術論文のデータベースに接続する、同じ MCP サーバーを、使えるようにします。接続には、チームごとに発行された API キーが、必要です。ある開発者が、プロジェクトの `.mcp.json` に、サーバーの定義と、API キーの文字列を、そのまま記述して、コミットしようとしています。最も適切な構成はどれですか。","o":["API キーを、プロジェクトの CLAUDE.md に記載して、Claude に、接続のたびに、読み取らせる","サーバーの定義は、プロジェクトの `.mcp.json` に記述して、共有する。API キーは、環境変数の展開の記法で参照して、値そのものは、コミットしない","サーバーの定義と、API キーの両方を、各自の `~/.claude.json` に、手作業で記述してもらう","API キーを、そのまま `.mcp.json` に記述して、コミットする。リポジトリが非公開であれば、問題はないうえ、全員が、追加の設定なしに、すぐに利用できる"],"a":[1],"e":"チームで共有する MCP サーバーは、プロジェクトの `.mcp.json` に定義して、バージョン管理で共有します。`.mcp.json` は、環境変数の展開に対応しているため、API キーのような認証の情報は、`${VAR}` の形式で参照して、値そのものは、コミットしません。各自の設定に、手作業で記述する方法は、定義が共有されず、内容がばらつきます。非公開のリポジトリであっても、認証の情報を、コミットすべきではありません。","w":["認証の情報が、リポジトリと、モデルのコンテキストに、さらされます。",null,"定義が共有されず、内容がばらつきます。","非公開であっても、認証の情報を、リポジトリに残すべきではありません。"],"lv":2},{"sc":3,"d":5,"s":"5.6","q":"ある栄養素の健康への効果についての調査で、検索のサブエージェントは、「小規模な予備的な研究で、関連が示唆された」という情報を、返しました。統合を経た、最終のレポートでは、これが、「研究によって、効果が証明されている」という記述に、変わっていました。途中の受け渡しでは、主張の本文だけが、渡されており、研究の規模や、種類の情報は、含まれていませんでした。最も適切な改善はどれですか。","o":["予備的な研究に基づく情報は、検索の段階で、すべて除外する","主張ごとに、根拠の種類や、確からしさの水準を、構造化して保持する。レポートでは、確立された知見と、予備的な知見を、区別して記述する","レポートの冒頭に、「本レポートの内容には、不確実性が含まれます」という注意書きを、一律に記載する","レポート作成のサブエージェントのプロンプトに、「すべての主張を、控えめな表現で記述すること」という指示を追加する。表現を弱めておけば、誇張された記述が、読み手に誤解を与えることはない"],"a":[1],"e":"情報の確からしさは、エージェントの間の受け渡しで、失われやすい情報です。主張の本文だけを渡すと、「示唆された」が、「証明された」に、強まることがあります。主張ごとに、根拠の種類（研究の規模や設計など）と、確からしさの水準を、構造化して保持して、レポートでは、確立された知見と、予備的な知見を、区別して記述します。一律に、控えめな表現にすると、確立された知見まで、弱めてしまいます。","w":["有用な情報まで、失われます。",null,"どの主張が不確かなのかが、読み手に伝わりません。","確立された知見まで、弱めて記述することになります。"],"lv":2},{"sc":3,"d":5,"s":"5.3","q":"5つのサブトピックの調査のうち、「規制の動向」を担当するサブエージェントが、情報源のサイトの障害によって、結果を得られませんでした。現在のコーディネーターは、1つでも、サブエージェントが失敗すると、調査の全体を中止して、利用者に、エラーを返します。ほかの4つのサブトピックの調査は、正常に完了していました。最も適切な見直しはどれですか。","o":["失敗したサブトピックを、レポートの構成から取り除いて、4つのサブトピックだけのレポートを、何も注記せずに、作成する","失敗したサブトピックの内容を、コーディネーターが、一般的な知識から、推測して補う。レポートは、5つのサブトピックが、すべて揃った形で、作成する","得られた4つの結果で、レポートを作成する。「規制の動向」は、情報源の障害によって、調査できなかったことを、レポートに明記する","現在の設計を維持する。不完全なレポートを提供するよりも、エラーを返すほうが、利用者にとって、誠実である"],"a":[2],"e":"一部のサブエージェントが失敗しても、ほかの結果には、価値があります。全体を中止すると、その価値が、失われます。得られた結果で、レポートを作成して、どの範囲が、どのような理由で、調査できなかったのかを、明記します。こうすれば、利用者は、レポートの限界を理解したうえで、活用できます。推測で補うことや、注記なしに取り除くことは、利用者に、誤った理解を与えます。","w":["調査されていない範囲があることが、利用者に伝わりません。","根拠のない内容が、調査の結果として、記載されます。",null,"正常に完了した4つの結果の価値が、失われます。"],"lv":2},{"sc":3,"d":1,"s":"1.2","q":"コーディネーターは、どのような依頼に対しても、8つの検索のサブエージェントを起動して、それぞれに、15回以上の検索を行わせています。「国際宇宙ステーションの、現在の軌道の高度は」という単純な質問でも、同じ規模で調査が行われて、回答までに6分かかり、コストは、複雑な調査の場合と、ほとんど変わりません。一方、多数の企業を比較する、複雑な調査では、8つでは、不足することがあります。最も適切な見直しはどれですか。","o":["サブエージェントの数は、変更せずに、各サブエージェントのモデルを、最も小さいものに切り替える。1つあたりのコストが下がるため、全体のコストも、下がる","単純な質問を検出した場合は、調査を行わずに、コーディネーターが、学習済みの知識だけで、回答する。調査のコストが、発生しなくなる","サブエージェントの数を、常に、8つから3つに減らす。単純な質問でのコストと時間が、大きく下がり、複雑な調査でも、3つあれば、主要な論点は、調べられる","依頼の複雑さに応じて、サブエージェントの数と、調査の量の目安を、コーディネーターのプロンプトに示す。単純な事実の確認は、少数で済ませる"],"a":[3],"e":"調査の規模は、依頼の複雑さに、合わせる必要があります。コーディネーターに、複雑さに応じた、サブエージェントの数と、調査の量の目安を示せば、単純な事実の確認には、少数のサブエージェントと、数回の検索で対応して、複雑な比較には、多数を割り当てられます。数を、一律に減らすと、複雑な調査で、不足します。学習済みの知識だけでは、現在の値のような、変化する情報に、答えられません。","w":["単純な質問に、過剰な規模で調査する構造は、変わりません。","現在の値のような、変化する情報には、答えられません。","複雑な調査で、調査の幅が不足します。",null],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"コーディネーターは、サブエージェントに、文脈が確実に伝わるように、利用者との会話の全体と、それまでのすべてのサブエージェントの結果（合計で、約5万トークン）を、毎回の委任のプロンプトに、そのまま含めています。サブエージェントの応答は遅くなり、担当のサブトピックとは関係のない内容について、調査を始めることも、あります。最も適切な見直しはどれですか。","o":["そのサブエージェントの作業に必要な情報（目的、担当の範囲、関連する既知の事実、出力の形式）だけを選んで、委任のプロンプトに含める","約5万トークンの文脈を、そのまま含めたうえで、「担当のサブトピック以外の内容は、無視すること」という指示を、冒頭に追加する","現在の構成を維持して、サブエージェントのモデルを、コンテキストウィンドウが、より大きいものに変更する","委任のプロンプトには、何も文脈を含めずに、担当のサブトピックの名前だけを伝える。サブエージェントが、関係のない内容に、引きずられなくなる"],"a":[0],"e":"サブエージェントには、明示的に、文脈を渡す必要がありますが、すべてを渡せばよい、というわけでは、ありません。無関係な情報は、コンテキストを消費して、サブエージェントの注意を、担当の範囲の外に、向けさせます。その作業に必要な情報だけを、選んで渡します。何も渡さないと、利用者の条件や、すでに分かっている事実が、伝わりません。無視するよう指示しても、大量の無関係な情報は、判断に影響します。","w":[null,"大量の無関係な情報は、指示があっても、判断に影響します。","無関係な情報に引きずられる問題は、残ります。","利用者の条件や、すでに分かっている事実が、伝わりません。"],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"コーディネーターは、6つのサブトピックについて、1回の応答で、6つの `Task` の呼び出しを出力して、検索のサブエージェントを、並列に実行しています。結果は、完了した順に、返ります。コーディネーターは、返ってきた結果を、起動した順序のサブトピックに、対応させており、ある調査では、「市場の規模」の結果が、「規制の動向」の節に、記載されました。最も適切な改善はどれですか。","o":["委任のプロンプトで、サブトピックの識別子を渡して、結果にも、その識別子と、サブトピックの名前を、含めさせる","並列の実行をやめて、サブエージェントを、1つずつ、順番に実行する。結果が、起動した順序のとおりに返るため、取り違えが、起こらない","結果の内容を、コーディネーターに読ませて、どのサブトピックの結果であるかを、推測させる","各サブエージェントの結果の冒頭に、担当した内容の要約を、文章で書かせて、コーディネーターが、その要約から、対応を判断する"],"a":[0],"e":"並列に実行した作業の結果は、起動した順序で返るとは、限りません。結果を、順序によって対応させると、取り違えが、起こります。委任のときに、識別子を渡して、結果にも、その識別子を含めさせれば、どの結果が、どのサブトピックのものかを、確実に対応付けられます。並列の実行をやめると、処理の時間が、大きく延びます。内容からの推測は、似たサブトピックで、誤ることがあります。","w":[null,"処理の時間が、大きく延びます。","似た内容のサブトピックで、誤ることがあります。","文章からの判断であり、内容の似たサブトピックでは、取り違えが残ります。識別子による対応付けが、確実です。"],"lv":2,"g":"試験ガイド v1.0 は、サブエージェントを起動するツールを、`Task` と呼んでいます。現在の Claude Code では、このツールの名前は、`Agent` に変更されています（`Task` は、別名として、引き続き使えます）。試験では、ガイドの記載に沿って、解答してください。"},{"sc":3,"d":1,"s":"1.4","q":"ある健康の話題の調査で、検索のサブエージェントが返した情報源の中に、商品の販売を目的とした、根拠の示されていないサイトが、多数含まれていました。これらは、そのまま、分析と統合の段階に渡されて、最終のレポートに、根拠として引用されました。利用者は、信頼できる情報源に基づくレポートを、求めています。ワークフローの見直しとして、最も適切なものはどれですか。","o":["レポート作成のサブエージェントのプロンプトに、「信頼できない情報源は、引用しないこと」という指示を追加する。最終の段階で、取り除くことができる","レポートの末尾に、「一部の情報源は、信頼性が確認されていません」という注意書きを、一律に記載する","検索の結果を、分析に渡す前に、情報源の種類や、根拠の有無などの基準で評価する段階を設ける。基準を満たした情報源だけを、次の段階に渡す","検索の件数を、3倍に増やす。情報源が多くなれば、信頼できない情報源の割合が、相対的に下がる"],"a":[2],"e":"信頼できない情報が、後の段階に流れると、分析と統合の中で、ほかの情報と混ざり、取り除くことが、難しくなります。段階の間に、品質を評価する関門を設けて、基準を満たした情報源だけを、次の段階に渡します。最終の段階で、取り除くよう指示しても、その時点では、どの記述が、どの情報源に基づくのかが、すでに曖昧になっていることがあります。","w":["統合を経た後では、どの記述が、どの情報源に基づくのかが、曖昧になっています。","どの記述が信頼できないのかが、利用者に伝わりません。",null,"信頼できない情報源の件数も、同じように増えます。"],"lv":2},{"sc":3,"d":1,"s":"1.6","q":"このシステムを使って、毎週月曜日に、「競合5社の、先週の動向」という定型のレポートを、作成しています。調べる観点は、毎回、「新製品」「価格の改定」「提携」「採用」「報道」の5つで、変わりません。コーディネーターが、毎回、依頼の内容から、サブトピックを、動的に決めているために、週によって、レポートの構成や、取り上げる観点が変わり、前の週との比較が、難しくなっています。最も適切な見直しはどれですか。","o":["コーディネーターのプロンプトに、「毎週、できるだけ、同じ構成になるように、努めること」という指示を追加して、動的な分解は、維持する","この定型のレポートについては、5社と5つの観点を、あらかじめ決めた、固定の手順として定義する。動的な分解は、内容が毎回変わる、自由な調査に使う","コーディネーターに、毎回、前の週のレポートを読み込ませて、同じ構成を、推測させる","動的な分解は維持して、コーディネーターに、5つの観点の一覧を、few-shot の例として示す"],"a":[1],"e":"調べる対象と、観点が、毎回同じである作業は、手順を、あらかじめ決められます。このような作業には、固定の手順が適しており、結果の構成が、安定します。動的な分解は、何を調べるべきかが、事前には分からない、自由な調査のためのものです。作業の性質に応じて、使い分けます。動的な分解を維持したまま、同じ構成を求めても、毎回の判断に、揺れが残ります。","w":["毎回の判断に、揺れが残ります。",null,"推測に頼ることになり、構成の揺れが残ります。","構成は近づきますが、毎回の分解が、モデルの判断に依存することは、変わりません。"],"lv":2},{"sc":3,"d":1,"s":"1.5","q":"文書分析のサブエージェントは、第三者が提供している、Web ページの取得のツールを、使っています。このツールは、ページの本文に加えて、ナビゲーションのメニュー、広告、関連記事の一覧、スクリプトなどを、そのまま返します。1ページあたり、平均で、約3万トークンのうち、本文は、約4千トークンです。数ページを取得すると、コンテキストが、圧迫されます。ツールの実装は、変更できません。最も適切な対応はどれですか。","o":["サブエージェントのプロンプトに、「メニューや、広告の部分は、読み飛ばすこと」という指示を追加する。フックを実装する必要がなく、すぐに対応できる","ツールの結果を受け取った後に呼び出されるフックで、本文以外の部分を取り除いて、長さを制限してから、モデルに渡す","取得したページを、別のモデルの呼び出しで要約させて、その要約を、文書分析のサブエージェントに渡す","1回の調査で取得できるページの数を、2ページまでに制限する。コンテキストの圧迫を、避けられる"],"a":[1],"e":"ツールの実装を、変更できない場合でも、ツールの結果は、モデルに渡す前に、フックで加工できます。本文以外の部分を、決定的に取り除いて、長さを制限すれば、コンテキストの消費を、大きく減らせます。読み飛ばすよう指示しても、結果の全体は、コンテキストに入って、消費されます。取得するページの数を制限すると、調査の深さが、失われます。","w":["指示をしても、結果の全体は、コンテキストに入って、消費されます。",null,"コンテキストは減りますが、分析に必要な細部が、要約で失われるおそれがあり、呼び出しのコストも増えます。","調査に必要な情報源を、読めなくなります。"],"lv":2},{"sc":3,"d":1,"s":"1.1","q":"検索のサブエージェントが、1つのサブトピックについて、検索の語句を、少しずつ変えながら、40回以上の検索を行って、5分以上、動き続けることがあります。ログを確認すると、15回目以降は、すでに見つけた情報源が、繰り返し返されているだけでした。委任のプロンプトは、「このサブトピックについて、徹底的に調査すること」です。最も適切な見直しはどれですか。","o":["どこまで調べれば十分かの目安を、委任のプロンプトに示して、検索の回数にも、安全のための上限を設ける","委任のプロンプトの「徹底的に」を、「ほどほどに」に書き換える","サブエージェントのモデルを、より上位のものに変更する。上位のモデルは、調査が十分かどうかを、より正確に判断できる","サブエージェントの検索のツールを、1回のセッションにつき、5回までしか、呼び出せないようにする"],"a":[0],"e":"「徹底的に」という指示は、いつ、調査を終えてよいのかを、示していません。そのため、サブエージェントは、新しい情報が得られなくなっても、調査を続けます。完了の目安を、具体的に示せば、サブエージェントは、目安を満たした時点で、調査を終えられます。そのうえで、暴走を防ぐための、回数の上限を、安全策として設けます。上限だけを、厳しく設定すると、本当に必要な調査まで、打ち切られます。","w":[null,"どこまで調べれば十分なのかが、依然として、示されていません。","完了の目安が示されていなければ、判断は、安定しません。","本当に必要な調査まで、打ち切られます。"],"lv":2},{"sc":3,"d":1,"s":"1.3","q":"調査の対象に、約320ページの、政府の報告書が含まれています。コーディネーターは、報告書の全体を、1つの文書分析のサブエージェントに渡して、分析を依頼しました。サブエージェントの出力は、前半の章については詳しいものの、後半の章の、重要な統計が、いくつも抜けていました。報告書の各章は、内容として、ほぼ独立しています。最も適切な進め方はどれですか。","o":["報告書の全体を、コーディネーターが、自分で読み込んで、分析する","同じサブエージェントに、同じ報告書を、もう一度渡して、「後半の章も、詳しく分析すること」と依頼する","報告書を、章の単位に分けて、複数の文書分析のサブエージェントに、並列に渡して、要点を返させる","報告書を、検索用の索引に登録して、文書分析のサブエージェントが、関連する箇所だけを、検索して読むようにする"],"a":[2],"e":"長い文書の全体を、1つのコンテキストで処理すると、一部の内容が、おろそかになります。章が、互いに独立しているのであれば、章の単位に分けて、複数のサブエージェントに、並列に処理させます。各サブエージェントは、狭い範囲に集中でき、コーディネーターには、要約された結果だけが、返ります。コーディネーターが、自分で読み込むと、コーディネーターのコンテキストが、文書で埋まります。","w":["コーディネーターのコンテキストが、文書で埋まります。","長い文書の一部が、おろそかになる問題は、残ります。",null,"特定の質問には有効ですが、報告書の全体の分析では、検索されなかった章の統計が、抜けます。"],"lv":2},{"sc":3,"d":1,"s":"1.2","q":"利用者が、「AI について、調べてほしい」とだけ、依頼しました。コーディネーターは、そのまま、「歴史」「技術」「企業」「規制」「倫理」「雇用への影響」「医療での応用」「教育での応用」の8つのサブトピックに分解して、調査を実行しました。40分後に、約60ページの、広く浅いレポートが完成しましたが、利用者が知りたかったのは、「自社の製造の現場に、画像検査の AI を導入する際の、費用の相場」でした。最も適切な見直しはどれですか。","o":["依頼が、範囲を特定できないほど、曖昧な場合は、調査を始める前に、目的や、知りたいことを、利用者に確認する","曖昧な依頼は、コーディネーターが、最も一般的な解釈を選んで、その解釈に基づいて、調査を実行する","レポートの冒頭に、目次と、各節の要約を付けて、利用者が、必要な箇所を、探しやすくする","サブトピックの数を、8つから20に増やして、利用者が知りたい内容が、どれかに含まれる可能性を、高める"],"a":[0],"e":"依頼が、あまりに曖昧な場合、コーディネーターが、どのように分解しても、利用者の意図に合う保証は、ありません。大きなコストをかけて、調査を実行する前に、目的や、知りたいことを、利用者に確認するほうが、結果として、早く、的確な回答に、たどり着けます。サブトピックを増やすと、コストが増えるだけで、求められている深さには、届きません。","w":[null,"最も一般的な解釈が、利用者の意図と一致する保証は、ありません。","利用者が知りたい内容が、そもそも、レポートに含まれていません。","コストが増えるだけで、求められている深さには、届きません。"],"lv":2},{"sc":3,"d":2,"s":"2.1","q":"Web 検索のツールは、`search(query)` という、検索の語句だけを受け取る、単純なインターフェースです。「2024年以降の、査読のある研究」のような条件のある調査で、検索のサブエージェントは、検索の語句の中に、「2024」「査読」といった語を、加えて検索していますが、古い記事や、ブログが、結果の大半を占めます。背後の検索の API は、発行の時期と、情報源の種類による絞り込みに、対応しています。ツールの設計の見直しとして、最も適切なものはどれですか。","o":["ツールの引数に、発行の時期の範囲と、情報源の種類を追加して、説明に、それぞれの使い方を記述する","検索の結果を、サブエージェントに、1件ずつ読ませて、条件に合わないものを、取り除かせる","サブエージェントのプロンプトに、「検索の語句に、年と、『査読』という語を、必ず含めること」という指示を追加する","検索の件数を、10件から100件に増やして、条件に合う情報源が、結果に含まれる可能性を、高める"],"a":[0],"e":"ツールのインターフェースが、必要な絞り込みを、表現できなければ、モデルは、検索の語句を工夫するしかなく、結果は、不安定になります。背後の API が、絞り込みに対応しているのであれば、それを、ツールの引数として公開して、説明に、使い方を記述します。モデルは、条件を、構造化された引数として、指定できるようになります。結果を、1件ずつ読んで取り除く方法は、コンテキストとコストを、大きく消費します。","w":[null,"コンテキストとコストを、大きく消費します。","語句に含めても、時期や種類による絞り込みには、なりません。","条件に合わない結果も増えて、コンテキストを消費します。"],"lv":2},{"sc":3,"d":2,"s":"2.3","q":"統合のサブエージェントは、知見を、後段のレポート作成のサブエージェントが、機械的に処理できる構造（主張、根拠、出典、確からしさの水準）で、返す必要が
